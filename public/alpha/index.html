"neutral"},"text":"@pkcapital_ The AI semi theme is down if you look at $AVGO to $TSM. Higher beta names seem to have been hit the hardest.\n\nFrom trends I've seen with  optical names, $LITE / $COHR recovered fastest, then larger still high beta names like $AAOI / $AXTI (halfway).\n\nThen your $SIVE / $POET type names have taken the longest. But I do see a sharper recovery when markets are more risk-on or when earnings forces re-ratings.","likes":140},{"id":"2089717828916289860","author":"aleabitoreddit","date":"2026-08-18","zh":"希望AAOI回到80美元以加碼，雷射需求能見度極高，NBIS與SNDK亦然。","risk":"","s":{"AAOI":"bull","NBIS":"bull","SNDK":"bull"},"text":"@abbysuyuyan $AAOI is actually the one stock I'm hoping goes back to $80 so I can acquire more.\n\nThe demand visibility is pretty insane for laser names throughout 2027...\n\nSame can be said with neoclouds like $NBIS or memory names like $SNDK.","likes":167},{"id":"2089748568852799580","author":"aleabitoreddit","date":"2026-08-18","zh":"CCXI以商業化優先，已進駐AMZN、MELI倉庫；認為TSLA尚無法實現通用機器人。","risk":"特斯拉通用機器人短期難實現","s":{"AMZN":"neutral","CCXI":"bull","MELI":"neutral","TSLA":"bear"},"text":"@HowlStWoofer $CCXI is targeting commercialization first, since they're in places like $AMZN and $MELI warehouses for human automation.\n\nI don't think Agility's Robots need to do backflips to do deliveries or packaging. Same with Amazon warehouse workers.\n\nTwo different use cases, think Boston Dynamics is the closest peer in terms of breaking limits on what robotics can do.\n\n$TSLA is also targeting general purpose, but I don't quite think they can pull that off yet.\n\nRegardless, seeing if the US can catch up and leapfrog China will be very interesting.","likes":61},{"id":"2089749225768915037","author":"aleabitoreddit","date":"2026-08-18","zh":"減速器供應商遍布人形機器人，VPG為利基零組件商但規模不同。","risk":"","s":{"VPG":"neutral"},"text":"@kevs_World02 Harmonic/LeaderDrive/Schaeffler seem to be in pretty much everywhere.\n\nThere's some more niche component suppliers like $VPG for maybe Optimus/Figure. But I think the scale is vastly different since Schaeffler claimed they were wokring with ~45 humanoid players.\n\nChinese suppliers to Agibot/Unitree probably hit revenue first though, I can do more research into that area soon.","likes":46},{"id":"2089753753625018830","author":"aleabitoreddit","date":"2026-08-18","zh":"仍持有兩家公司；變壓器瓶頸拖慢AI建設，HPS積壓訂單年增96.9%，比利時公司受惠CPO。","risk":"","s":{"HPS":"bull","NVDA":"neutral"},"text":"@I_Am_Bloateds I still have positions in both companies? What I hold shouldn't affect your own decisions.\n\nTransformer bottlenecks are stalling the US AI buildout now and lead times are very long for both dry and liquid (which is more extreme). Backlog is +96.9% Y/Y for $HPS.A and given their market share...\n\nI don't they're going anywhere.\n\nPretty sure I shared this idea at ~170, it did 2x, but corrected back to 240 now, but cost average is different per person I guess.\n\nThe Belgian company is primarily H1 2028 as a CPO/photonics volume ramp beneficary. And the work they're doing with MTP with IMEC for $NVDA as an end user in evaluation stage should be very interesting.\n\nTheir CHIP act facility for MEMS/photonics also comes online H2 2028 too, and 800V transitions should bring them material revenue growth for anything SiC adjacent next year.\n\nI'm down -31%, since my cost average is a lot higher. But they're approaching levels where replacement book value is a lot higher than MC.","likes":38},{"id":"2089766053274661143","author":"aleabitoreddit","date":"2026-08-18","zh":"AAOI在Rosenblatt會議：美國生產享溢價、售罄至明年下半年、CPO後毛利率40%+，看不出看空理由。","risk":"","s":{"AAOI":"bull","LITE":"neutral","NVDA":"neutral"},"text":"My $AAOI TLDR notes at Rosenblatt summit:\n\n- Expected to get paid premiums for US production of 800g/1.6T (very positive for ASP/margins).\n\n- Several LTAs on the table, but doesn't want to sign to get capacity blocked by other customers (cough cough $NVDA).\n\n- Sold out at least through second half of next year and beyond. (High demand visibility like $LITE)\n\n- Has 300-400 mW lasers already.\n\n- Expects margins to be above 40%+ once CPO comes about (probably most material for rerating).\n\nI can't see how anyone can be bearish on this company...","likes":1141},{"id":"2089908198694351064","author":"aleabitoreddit","date":"2026-08-19","zh":"宇樹上市後估值約533億美元，成為人形機器人標竿；CCXI預計以25億美元估值第四季上市，顯示純人形機器人需求大。","risk":"","s":{"AMZN":"neutral","CCXI":"bull","NVDA":"neutral","TSLA":"neutral"},"text":"Unitree (688836) is now public.\n\nAnd is valued at ~$53.3B, after rising +492.18%\n\nWe finally have a major public company benchmark for humanoids.\n\nFor reference, Agility (backed by $NVDA, $AMZN) via $CCXI is expected to go public at $2.5B premoney valuation Q4.\n\n$TSLA is $1T+, but Optimus is wrapped inside a much larger company.\n\nBut I think Unitree showed that the demand for pure play humanoid players is much larger… than people expected in public markets.","likes":1806},{"id":"2089973586425766134","author":"aleabitoreddit","date":"2026-08-19","zh":"LITE、MTSI、AAOI財報與Elazr皆指出光通訊供需嚴重失衡，將重演記憶體超級週期。","risk":"","s":{"AAOI":"bull","LITE":"bull","MTSI":"bull"},"text":"We got $LITE, $MTSI, $AAOI all pointing to extreme demand imbalances with lasers/TIA/DSP/etc from earnings...\n\nAnd now Elazr GM at their investor conference stated:\n\nOptical supply is still far behind the market demand, the expected AI optical supply chain are likely to continue for years.\n\n- \"the entire supply chain is out of stock\"\n\n- \"the supply is still far behind the market demand\"\n\n- \"the shortage will continue to the next few years\"\n\n\"Whether it is PCB, carrier board, laser chip, or even related packaging  capacity, as long as the AI supply chain link, almost all are in short supply.\"\n\nWhen demand visibility extends for years with the supply chain bottlenecked:\n\nIt's getting difficult not to see photonics echoing the memory supercycle entering 2027.","likes":1317},{"id":"2089978707830280655","author":"aleabitoreddit","date":"2026-08-19","zh":"SIVE是他最愛的高Beta光通訊多單：客戶廣、獨立CW產能、CEO能幹，唯在瑞典小交易所上市壓抑估值。","risk":"僅在瑞典小交易所上市","s":{"AAOI":"neutral","GFS":"neutral","JBL":"neutral","MTSI":"neutral","POET":"neutral","SIVE":"bull"},"text":"@Blazedsin Yeah, $SIVE is my favorite high-beta optical long.\n\nYou have a small company supplying lasers for:\n- Hyperscaler suppliers like $JBL with pluggables.\n- ELS + optical engines with $POET / O-Net.\n- Scale up with optical I/O with Ayar and others.\n- Photonic Foundries like $GFS across all architectures like NPO/pluggables/CPO.\n\nwith independent CW capacity coming online with Win Semi during a structural bottleneck... NASDAQ listing likely in the next few quarters.\n\nAnd the CEO actually knows what he's doing + aligned with shareholders (in terms of buying stock on the open market), with low dilution to get all of this done.\n\nAnd they hinted at M&A, which is ideal for TAM expansion (look at what happened with Lumentum after Cloud Light H2 2023 M&A).\n\nThen you have $MTSI, $AAOI likely no meaningful participating in first-gen CPO deployments (smaller pool of players)... Industry CW shortages currently before volume ramp. Regulation tailwinds targeting Chinese competition.\n\nI'm not sure if it's just me but they have the ideal setup, main downside is that it's just listed on some small Swedish exchange and that harms valuations.","likes":485},{"id":"2090103899302826302","author":"aleabitoreddit","date":"2026-08-19","zh":"MRVL給予Google購買122億美元股權選擇權，TPU合作或帶來千億營收，另與AMZN有認股權證。","risk":"","s":{"AMZN":"neutral","GOOGL":"neutral","MRVL":"bull"},"text":"$MRVL gives $GOOGL options to buy $12.2B of the company.\n\n\"The Marvell-Google deal covers a broad range of technologies used ​with TPUs, including processors that run AI models, manage data storage ​and  move information ⁠across networks.\"\n\nWhich could translate into ~$120 billion ​in revenue through 2033.\n\nMarvell also has separate warrants with $AMZN after their Celestial acquisition (for purchases of photonic fabric).\n\nRemember the good times when Jensen said Marvell would be the next $1T+ company?\n\nSeems Nvidia knew Marvell was \"networking\" its way into all the hyperscalers with warrants.","likes":1167},{"id":"2090120128805691484","author":"aleabitoreddit","date":"2026-08-19","zh":"反問GOOGL和MRVL有什麼問題嗎？","risk":"","s":{"GOOGL":"neutral","MRVL":"neutral"},"text":"@200pipss Is there something wrong with $GOOGL and $MRVL?","likes":46},{"id":"2090374603264929981","author":"aleabitoreddit","date":"2026-08-20","zh":"重點：EWY因SK海力士回購上漲、海力士公布CPO路線圖、長江存儲擬IPO、DDR4漲價等。","risk":"","s":{"EWY":"bull","MRNA":"neutral","SKHY":"bull","YMTC":"neutral"},"text":"I'm glad the leverage bros moved from AI stocks back to Hyerliquid and biotech like $MRNA, so maybe we'll see a faster recovery.\n\nAside from that just some TLDR stuff:\n\n- $EWY up, primarily from SK Hynix buybacks (they're just too profitable), and Samsung Foundry roughly ~10-15% price hikes.\n\n- $SKHY unveils CPO roadmap?? Apparently they're doing something with photonic interposer that links to memory, so I gotta look a bit deeper into this\n\nProbably going to be more TAM expansion, more supply chain beneficiaries (eg. lasers, PICs, packaging) off this.\n\n- $YMTC pursuing IPO next quarter following CMXT's successful IPO.\n\nThe Chinese IPO market is just going brrr from Unitree to memory makers.\n\nUS needs to do something similar rather than IPOing companies at trillion dollar valuations already.\n\n- Tyntek limit up there's now order visibility through 2028, given photodiode demand imbalance for photonics.\n\nElazr GM did say the entire optical supply chain was facing major shortages... I'll probably look more at high-end PD bottlenecks next.\n\n- MS forecasts a 50% Q/Q price increase for DDR4 for Q3, and 10%+ increase for Q4 2026. (Nanya/2408, Windbond/2344, should be happy).\n\n- China repor","likes":997},{"id":"2090377797441323097","author":"aleabitoreddit","date":"2026-08-20","zh":"主題籃子年初已選定，如記憶體EWY、CPO的SIVE，近期只加了CCXI，等待發酵。","risk":"","s":{"CCXI":"bull","EWY":"bull","SIVE":"bull"},"text":"@EnamelEquity Nope, all my thematic baskets were picked earlier this year with memory like $EWY and CPO like $SIVE.\n\nOnly recent was kinda humanoids with $CCXI, but that's one-off.\n\nI'm just waiting for everything to play out, not a fan of jumping ship to ship.","likes":217},{"id":"2090490101260591481","author":"aleabitoreddit","date":"2026-08-20","zh":"非常看好；光通訊股近期表現落後很荒謬，需求能見度極高，產業已嚴重瓶頸。","risk":"","s":{"AAOI":"bull","LITE":"bull","MTSI":"bull","SIVE":"bull"},"text":"Very positive. My opinion is that the optical sector underperformance recently from $AAOI to $SIVE has been absurd.\n\nThe demand visibility... is just way too stupidly high.\n\nAOI: “Even combined AOI, Coherent program altogether, is still very tough to meet the customer demand in the next 3 years” (2029)\n\nElazr GM: \"entire optical supply chain was facing major shortages.\" \"The shortage will continue to the next few years\"\n\nSivers CEO said the same thing about InP laser demand imbalances expected for the next 3-5 years.\n\nCan go on and on about $LITE, $MTSI and other comments.\n\nWe haven't even hit the inflection point with 1.6T, NPO, CPO scale out/up, and optics with memory (as seen with SK Hynix).\n\nYet the industry is already bottlenecked by EML/CW and all your other upstream components from PDs/TIA/DSPs, transceivers, and soon FAU + others when CPO scales…\n\nI'm personally extremely comfortable watching this all play out, but just a little confused that markets don't know how to math a year or two ahead.","likes":1252},{"id":"2090510568474231045","author":"aleabitoreddit","date":"2026-08-20","zh":"看到機器人與太空板塊對宇樹及SPCX上市的反應，不太希望Anthropic上市。","risk":"","s":{"SPCX":"neutral"},"text":"After seeing how the robotics and space sectors reacted to Unitree and $SPCX IPOs\n\nI’m not quite sure I want Anthropic to go public… https://t.co/hY6tM1r4Qb","likes":728},{"id":"2090735668532224224","author":"aleabitoreddit","date":"2026-08-21","zh":"推測SK海力士CPO路線圖評估Celestial/Ayar，SIVE為最直接受惠者，POET可能已被排除。","risk":"POET可能被Marvell垂直整合排除","s":{"POET":"bear","SIVE":"bull","SKHY":"neutral"},"text":"Since people are having fun speculating on $SKHY CPO roadmap supply chains.\n\nI'm gonna do my own guess and say SK Hynix is evaluating Celestial/Ayar. Then doing heavy evaluation into microLEDs past first-gen deployments.\n\nBoth have been kinda working on it for awhile.\n\n- Ayar shown up in SK hynix's own website in the context of optical <-> memory links.\n- Marvell is actively working with SK Hynix in custom memory solutions (and guess who owns Celestial now).\n\nCelestial/Ayar are both also cited in SK Hynix's linked Nature Paper, which helps a bit with technical relevance:\n\n(121): Stojanovic, V. A UCIe optical I/O retimer chiplet for AI scale-up. In 2025 IEEE Hot Chips 37 Symposium (HCS) 1–22 (IEEE, 2025)\n\n- This is Ayar reference (Ayar’s teraphy optical I/O chiplet), Stojanovic is Ayar Lab's co-founder btw.\n\n(123): Winterbottom, P. Photonic interconnect for accelerated computing celestial AI photonic fabric module (cough cough Celestial)\n\nThere's more breadcrumbs out there, but wanted to keep this relatively short-form.\n\nFor more upstream beneficaries:\n\n-> I still think $SIVE is the cleanest read through since they're likely supplying to both Celestial/Ayar.\n\nThe interposer/packagin","likes":661},{"id":"2090782670838231129","author":"aleabitoreddit","date":"2026-08-21","zh":"POET供應Lumilens，但可能已被MRVL Celestial設計排除。","risk":"POET可能被Marvell排除","s":{"MRVL":"neutral","POET":"bear"},"text":"@tozzi21 $POET is supplying Lumilens, which is another top-2 hyperscaler supplier (with billions in customer agreements).\n\nLite-On is another major player.\n\nI'm just saying they got likely designed out $MRVL Celestial since Marvell has their own packagig/intergration IP in the same layer that Poet is offering.","likes":46},{"id":"2090783871776551052","author":"aleabitoreddit","date":"2026-08-21","zh":"記憶體/光學連結擴大雷射TAM，CW雷射已短缺，AAOI產能轉內用，2027-28恐現短缺。","risk":"","s":{"AAOI":"neutral"},"text":"@OnurKocerr No, EML, CW, microLEDs are all parallel tracks, with silicon phonetics + CW being the main commercial focus for 2027-2028, especially for CPO.\n\nIf anything, having memory/optical links adds another material TAM increase across laser suppliers including CW DFBs.\n\nWhich are already in short supply. So we'll likely see another memory style shortage when 2027-2028 comes about...\n\nGiven your top 3 are already sold out for next 2 years, and independent laser capacity coming online like $AAOI are now being used internally for transceivers rather than being sold.","likes":51},{"id":"2090903631793127644","author":"aleabitoreddit","date":"2026-08-21","zh":"AAOI頻繁推出5-6億美元ATM增資，股權結構對股東不友善，越來越難支持。","risk":"頻繁ATM增資稀釋","s":{"AAOI":"bear"},"text":"It's getting much harder to support $AAOI when they keep dropping $500m or $600M ATMs left and right.\n\nAt a certain point, the operating outlook could be positive.\n\nBut the share structure/financing becomes increasingly shareholder unfriendly.\n\nReally, really, dislike ATMs and incessant capital raises, even if they're building up capacity.","likes":1536},{"id":"2091177173789069797","author":"aleabitoreddit","date":"2026-08-22","zh":"美國政府太空運輸政策中SPCX主導發射產業，RKLB等火箭公司受惠。","risk":"","s":{"RKLB":"bull","SPCX":"bull"},"text":"It's been fun to read these US Gov fact sheets (few a week) recently.\n\nEarlier this week was \"Golden Age of Space Transportation\", with $SPCX hard carrying the launch sector like Faker.\n\nAnd $RKLB + other rocket companies as beneficiaries of the 1K launch/reentry goal by 2030.\n\nThis month we also had:\n- Drone component tariffs\n-  American Mining / Critical Mineral deals\n- Polysilicon supply chains tariffs\n\nand a lot more... So helpful to see what sectors US policy is focusing on.","likes":678},{"id":"2091179096013525189","author":"aleabitoreddit","date":"2026-08-22","zh":"仍持有AAOI，但可以不喜歡其融資方式、時機與金額。","risk":"融資方式稀釋股東","s":{"AAOI":"neutral"},"text":"@OscarCantInvest I still have $AAOI positions but I can dislike financing methods/timing/amounts.","likes":183},{"id":"2091264273007960320","author":"aleabitoreddit","date":"2026-08-22","zh":"調侃Reddit認為MRVL兩大催化劑是Google TPU協議與蜘蛛人新片。","risk":"","s":{"MRVL":"bull","RDDT":"neutral"},"text":"Apparently, $RDDT thinks $MRVL had two major catalysts recently:\n\nThe $12.2B Google TPU ecosystem agreement.\n\nAnd…\n\nSpider-Man: “Brand New Day” https://t.co/qmUvJqjcpo","likes":1157},{"id":"2091488091110531106","author":"aleabitoreddit","date":"2026-08-23","zh":"2025年從AXTI到NBIS的想法已實現，粉絲達百萬，思考下一個目標。","risk":"","s":{"AMD":"neutral","AXTI":"bull","NBIS":"bull"},"text":"Having a mid-X identity crisis rn:\n\n✓ saw 2025 ideas from $AXTI to $NBIS play out with everyone\n✓ we got $AMD bandanas\n✓ #1 most subscribed person on X by accident\n✓ Chinese “White Hair” nicknames\n✓ 1M followers\n\nStill here to track ideas, but what’s the next side quest?","likes":1439},{"id":"2091612406900564407","author":"aleabitoreddit","date":"2026-08-23","zh":"看完中國人形機器人運動會感嘆美國落後，不敢相信GOOGL賣掉波士頓動力。","risk":"","s":{"GOOGL":"neutral"},"text":"After watching clips of China's humanoid Olympics...\n\nI think we're cooked chat.\n\nStill can't believe $GOOGL sold Boston Dynamics, don't think we have another humanoid that can backflip. https://t.co/uERCqW85F5","likes":871},{"id":"2091843192639672553","author":"aleabitoreddit","date":"2026-08-24","zh":"仍看多並大量持有AAOI，但不滿6億美元ATM時機；AAOI有產能瓶頸與需求能見度，優於POET。","risk":"ATM造成短期賣壓","s":{"AAOI":"bull","IREN":"neutral","POET":"bear"},"text":"Lot of misinterpretations flying left and right around the $600m ATM. I'm still bullish on $AAOI and I have large positions (which is why I care more).\n\nWhat I've been consistent with is not being a fan of overusing ATMs/dilution for financing. I've said this before with $IREN + $POET.\n\nAnd I'll be consistent with my own positions like AOI.\n\nHowever, the reason I'm still overweight on AOI vs. the rest (looking at you Poet):\n\nIs that AOI is actually capacity constrained with high demand visibility.\n\nIn terms of timing:\n\n- AOI should have waited until completion of 1.6T qualifications (expected in the next few weeks)\n\n- Could have used other structures like convertible notes above market prices.\n\nBut they did it on the drop from $220 -> $130, and it's likely there will be short term structural overhang whenever they want to tap into it.\n\nI don't have to support every single business decision to  remain long.","likes":1388},{"id":"2091851831718879660","author":"aleabitoreddit","date":"2026-08-24","zh":"小鵬分拆機器人部門融資逾9億美元，人形機器人與實體AI募資熱絡。","risk":"","s":{"AMZN":"neutral","NVDA":"neutral","XPEV":"neutral"},"text":"$XPEV carves out its robotics unit and raises >$900M at $6.3B+ valuations.\n\nThis is following’s Unitree IPO, which now has a ~$35-$36B MC.\n\nThen there’s $NVDA / $AMZN backed Agility… at a $2.5B premoney valuation. Which I’d argue is actually further ahead in commercialization than Xpeng.\n\nRegardless, humanoids + physical AI sector funding is really taking off.","likes":634},{"id":"2091909391238979970","author":"aleabitoreddit","date":"2026-08-24","zh":"NVDA宣布Groq3 LPX全面量產，NBIS率先採用，顯示輝達投資後的特殊待遇。","risk":"","s":{"NBIS":"bull","NVDA":"bull"},"text":"$NVDA, following their $20B deal... Announces Groq3 LPX now in full production.\n\nWith $NBIS the first to adopt through Nebius token factory.\n\n- 3,400 tok/s in Artificial Analysis benchmarking running Gemma 4 31B, with 100k token context\n- 4x faster responsiveness than the nearest alternative\n\nThing that caught my attention.. was a former press release after Nvidia's $2B investment into Nebius.\n\nThat it would support their \"early adoption of Nvidia's latest generation\" architectures.\n\nGuess we're seeing that special treatment here.","likes":858},{"id":"2091935022005776661","author":"aleabitoreddit","date":"2026-08-24","zh":"AAOI避免簽長約以免產能被單一客戶綁定，因此需大額ATM，但預期其議價能力提升。","risk":"未簽預付長約需大額增資","s":{"AAOI":"neutral","COHR":"neutral","LITE":"neutral","NVDA":"neutral"},"text":"@siflower Not exactly, I think $AAOI stated they avoided LTAs so they wouldn't have too much capacity committed to one customer and have to turn away others.\n\nIf they signed LTAs with prepayments, then that in scenario there probably wouldn't need to be such sizeable ATMs.\n\nDecision was a bit surprising though considering how well $NVDA LTAs turned out well for $LITE / $COHR.\n\nI would assume though AOI gets more pricing leverage as time goes on due to current laser/transceiver shortages.","likes":44},{"id":"2091955482613486028","author":"aleabitoreddit","date":"2026-08-24","zh":"CPO的FAU可能成為瓶頸，輝達FAU供應鏈2027年需求數百萬顆但產能不足。","risk":"","s":{"BE":"neutral","NVDA":"neutral","TSM":"neutral"},"text":"I know everyone's focused on Nancy Pelosi copytraders sending $BE up 11.83%. Or Trump...\n\nBut you know what else is cool?\n\nFAU bottlenecks for CPO.\n\nI remember saying earlier this year FAU/Foci might be a future bottleneck around $TSM / $NVDA CPO roadmaps...\n\nThis was some media commentary supporting that:\n\n\"It is understood that Largan Precision (3008), FOCI (3363), and China’s TFC have entered $NVDA FAU supply chain\"\n\n\"Based on an estimated 20,000 Spectrum-X systems shipped this year, the optical engines installed in those systems would require approximately 600k-700k FAUs\"\n\nIn 2027, demand is expected to reach several million units, and existing supply chain capacity is currently unable to meet demand.\" (UDN, mandarin -> english translation is kinda off)\n\nCough cough, \"existing supply chain capacity is currently unable to meet demand\"\n\nTad early right now since mass production is expected H2 2027, but cool to read updates around this.","likes":612},{"id":"2091958117026402532","author":"aleabitoreddit","date":"2026-08-24","zh":"反問對方為何沒提到SIVE卻念念不忘。","risk":"","s":{"SIVE":"neutral"},"text":"@areandatard Why is $SIVE living rent free in your head when it's not even mentioned","likes":94},{"id":"2091961431461957968","author":"aleabitoreddit","date":"2026-08-24","zh":"發梗圖回應AXTI酸民。","risk":"","s":{"AXTI":"neutral"},"text":"@Partfortynineg1 I got you covered with the $AXTI cope boobworld morty. https://t.co/dxToRnjPee","likes":52},{"id":"2091965000390963409","author":"aleabitoreddit","date":"2026-08-24","zh":"市場應讓SIVE發展，業者紛紛找MTSI、AAOI簽約，Sivers獲新認證機率高。","risk":"","s":{"AAOI":"neutral","MTSI":"neutral","SIVE":"bull"},"text":"@adiradir734145 I think markets just need to let the masterchef $SIVE cook.\n\nFrom other earnings, everyone seems to be going out and approaching players like $MTSI or $AAOI for agreements.\n\nSo, seems like there's a decently high chance Sivers gets some new qualifications or co-developments.","likes":114},{"id":"2091967826764632087","author":"aleabitoreddit","date":"2026-08-24","zh":"看好SIVE因第三方訊號：Ayar只列Sivers為雷射供應商，JBL、GFS也選用Sivers。","risk":"","s":{"GFS":"neutral","JBL":"neutral","LITE":"neutral","MTSI":"neutral","SIVE":"bull"},"text":"@Meatusmax @adiradir734145 Good question, it's mainly third party commentary + actions around $SIVE.\n\nAyar probably speaks volumes to me most removing $LITE / $MTSI from their supply chain section of their site. Then just featuring Sivers by itself for the laser suppliers.\n\nVP at Ayar also said Sivers was ... \"essential to powering our optical I/O solution\", which is pretty high signal commentary.\n\nThen you have $JBL that built a 1.6T LRO after selecting Sivers, which is very rare. And bragged about their technological moat at one of the fireside chats.\n\nThen $GFS choosing Sivers as the reference laser too and featuring them in their presentations...\n\nFeels like all your leading players are moving forward with Sivers for some reason? And I'd assume these leading companies did their DD","likes":129},{"id":"2092186856792506435","author":"aleabitoreddit","date":"2026-08-25","zh":"SIVE財報觀察重點：客戶合作與認證、JBL量產、那斯達克上市、財務與產能分配。","risk":"","s":{"AAOI":"neutral","AEVA":"neutral","GFS":"neutral","JBL":"neutral","MTSI":"neutral","SIVE":"bull"},"text":"Lot of people were wondering about $SIVE earnings in 2 days.\n\nWhat I'm watching out for:\n\n1. I'm hoping for more visibility on photonics co-development/qualifications/contracts.\n\n-> $AAOI stated multiple customers approaching them for CPO lasers (but had to turn them away)\n-> $MTSI stated many customers approaching them for CW capacity (but doesn't come online until H2 2027)\n\nSo read through for a company serving as $GFS reference laser, $JBL for pluggables (ex. intel siph), to Ayar for CPO.\n\nAnd in a merchant position:\n-> with independent CW DFB supply (with Win semi)\n-> CPO-grade lasers.\n\nIs incredibly positive for more customers approaching Sivers.\n\n2. Ongoing developments turning into volume\n\n-> I'm most excited about $JBL, which would probably be the main revenue ramp in H1 2027.\n-> $AEVA is likely much smaller in comparison, but should be a contributor H2 2026.\n-> Ayar and optical I/O players already stated 2028 for HVM, so not really expecting much there.\n-> Co-developments from their other pluggable players (from last ER) turning into qualifications -> volume).\n\nAside from that:\n\n3. NASDAQ listing\n\n-> We already got timelines for that \"next few quarters\", so it's not really","likes":672},{"id":"2092226228942241975","author":"aleabitoreddit","date":"2026-08-25","zh":"SIVE股價下跌因Bootstrap轉換並賣出7%股份等因素，賣壓已消化，預期催化劑後回歸正常。","risk":"股份轉換賣壓","s":{"SIVE":"bull"},"text":"@HealytheGOATT Price took a hit largely due to Boostrap Europe converting 7% of shares outstanding and selling that into the Swedish market from ~July 3rd to maybe ~August 18th completion.\n\nThat happened alongside the overall AI sector drop + incorrect reports of CPO delays + short sellers with timing.\n\nThere was the final 1.659M in warrants from 2 weeks ago, and looks like it got sold into market strength.\n\nThat overhang is largely exhausted, so I think $SIVE will go back to normal after a catalyst (like earnings).","likes":209},{"id":"2092282362289926612","author":"aleabitoreddit","date":"2026-08-25","zh":"GFS是2027-2028光通訊重估題材，2028預估本益比11.5倍，不宜押注短期。","risk":"","s":{"GFS":"bull"},"text":"@jusmentrades uhh, pretty sure $GFS is a 2027-2028 type optical rerating story...\n\nfyi they're like 11.5 fwd p/e ending 2028 and 7.5x longer term, so idk about betting on a 1 1/2 month timeframe in 2026. https://t.co/V9i8BNhlyR","likes":137},{"id":"2092354322432684098","author":"aleabitoreddit","date":"2026-08-25","zh":"因發現有趣的記憶體標的，對SMTC等今日財報失去興趣。","risk":"","s":{"SMTC":"neutral"},"text":"Lost interest in $SMTC and every other earnings report today after finding a memory name way too interesting not to research...","likes":511},{"id":"2092408620277457255","author":"aleabitoreddit","date":"2026-08-26","zh":"SMTC財報大超預期，光通訊供不應求、CW雷射進展、1.6T市占目標過半，利多AAOI。","risk":"","s":{"AAOI":"bull","SMTC":"bull"},"text":"All right back to $SMTC movie: \"The bottleneck go Brrr\":\n\nMy favorite quote was: \"availability currently matters more than pricing\".\n\nIn the current market for optical products.\n\n- No near-term erosion is expected on booked optical orders, which signals they're passing cost increases through fine.\n\n- I was actually curious most about Semtec's CW laser products after the HieFo takeover:\n\nSemtech expects CW-laser revenue for transceivers to begin H1 FY28. Explicitly said capacity is limited.\n\nThey still seem materially further behind compared to the laser leaders, but they're making progress for 2027 ramp.\n\n- TIA and driver solutions remain in exceptionally strong demand (confirmed from $AAOI earnings).\n\nContinues to deepen engagement across all the leading hyperscalers.\n\n\"We are now designing to every module provider\", expected 50%+ market share for 1.6T FiberEdge (TIA + driver) by years end.\n\nVery strong statement to make about being majority market share.\n\n- 1.6T FiberEdge qualifications finishing earlier than expected (good read through for your pluggable makers eg. AOI)\n\nq: \"quick thoughts on how long into 2028 does that backlog extend?\"\n\na: The backlog for the remaining of this","likes":145},{"id":"2092517102339162263","author":"aleabitoreddit","date":"2026-08-26","zh":"Saxo日本因需求大而上架SIVE，期待財報與那斯達克上市。","risk":"","s":{"SIVE":"bull"},"text":"I love how so many people requested  $SIVE that Saxo Japan went out of their way to list it!\n\nJust goes to show how much demand there is for this laser company.\n\nSpecial shoutout to Saxo. And of course, excited for Sivers earnings + planned Nasdaq listing coming up.","likes":1056},{"id":"2092705618448748697","author":"aleabitoreddit","date":"2026-08-26","zh":"太興奮於DDR3/DDR2影響而沒看NVDA財報。","risk":"","s":{"NVDA":"neutral"},"text":"@4intheflames I’ve been too excited about DDR3/DDR2 implications to look at $NVDA earnings or sleep.","likes":34},{"id":"2092710854290764161","author":"aleabitoreddit","date":"2026-08-26","zh":"Landmark簽4年CW長約，主要CW產能已被鎖定，SIVE作為少數有產能的商用供應商意義重大。","risk":"","s":{"AAOI":"neutral","COHR":"neutral","LITE":"neutral","MTSI":"neutral","NVDA":"neutral","SIVE":"bull","SMTC":"neutral"},"text":"I know everyone’s watching $NVDA earnings right now…\n\nBut did you know Landmark signed a 4 year CW agreement with US customer to ensure “sufficient supply”?\n\nSo now you have:\n\n- $LITE (capacity gone)\n- $COHR (capacity gone)\n- Landmark (capacity committed)\n- $AAOI (capacity for transceivers)\n- $MTSI (not online)\n- $SMTC (limited)\n\nI remember saying earlier this year CW lasers would be the next optical shift and heavily bottlenecked by Nvidia?\n\nSo fun watching this play out, with players signing LTAs already to 2030 (signaling less availability for other players).\n\nImplications for $SIVE / Win Semi are very material as one of the few remaining CW merchant suppliers with capacity (+ CPO-grade lasers).\n\nLet’s see how they execute.","likes":800},{"id":"2092718416683819292","author":"aleabitoreddit","date":"2026-08-26","zh":"NVDA財報全面超預期，下季指引1080億美元，毛利率指引略低；AI需求未見放緩。","risk":"毛利率指引略低","s":{"NVDA":"bull"},"text":"$NVDA earnings TLDR:\n\nRevenue: $96.22B vs. ~$92.17B (beat)\nAdj. EPS: $2.22 vs. $2.09-$2.10 (beat)\nDC: $89.0B vs. ~$86.3B (beat)\nAdj. gross margin: 75% vs. 75%\n\nHyperscaler Revenue: $48.71B from $43.05B last quarter (custom ASIC growth hasn't really prevented this revenue from accelerating)\n\nFor guidance:\nRevenue: $108B vs. ~$104.2B\nAdj. gross margin: 74% vs. 75% (kinda the only soft spot)\n\nRevenue ramp has been genuinely absurd over last 4 quarters.\n-> $68.1B\n-> $81.6B\n-> $96.2B (we are here)\n-> next quarter guidance: $108B, despite assuming zero China DC compute revenue.\n\nFun thing to note is Nvidia says its commitments jumped from $119B last quarter to $279B, primarily related to procurement of memory (for next few years).. So memory goes brrr.\n\nTLDR: AI keeps on going brrr. Nvidia is clearly leading the charge and no obvious signs of demand slowing.\n\nGiven Nvidia is already a $5T+ company, I think most of the alpha comes from how Nvidia's architecture/capacity decisions impact elsewhere in the supply chain (eg. CPO, memory, 800V) nowadays.\n\nRather than simply finding mispricing in Nvidia itself.\n\nRegardless, all the fun stuff happens in the earnings call in a few min.","likes":992},{"id":"2092723047107355133","author":"aleabitoreddit","date":"2026-08-26","zh":"NVDA預期2028財年營收成長約70%且受供給限制，超大型雲端資本支出2027年達1.3兆美元。","risk":"","s":{"NVDA":"bull"},"text":"$NVDA: \"We expect to grow revenue by approximately 70% in fiscal 2028. This is a supply constrained outlook\"\n\nThat statement alone is probably more important than the entire earnings beat just now?\n\nInsane upward revision beat from +43.9% expected to 70%.\n\n\"With cloud industry backlog now greater than 2 trillion, CapEx by the top five hyperscalers is expected to reach nearly $800 Billion in 2026 and 1.3 Trillion in 2027\"\n\n$1.3 Trillion in 2027. (MS was around $1.2T June, so this is upward projection revisions)\n\nYeah the high-beta parts of the supply chain growth is going to like this.","likes":1305},{"id":"2092723737263235378","author":"aleabitoreddit","date":"2026-08-26","zh":"對NVDA財測震驚，營收高於共識約1030億美元，輝達大賺。","risk":"","s":{"NVDA":"bull"},"text":"@Yolo365247isme Yeah I'm genuinely shocked at those projections, it's like ~$103B revenue beat above consensus lol.\n\n$NVDA is just printing, holy.","likes":81},{"id":"2092727372361638025","author":"aleabitoreddit","date":"2026-08-26","zh":"NVDA表示需求遠超70%，只是產能讓營收成長70%。","risk":"","s":{"NVDA":"bull"},"text":"@JonahLupton $NVDA stated demand is much greater than 70%.\n\nIt's just that their capacity allows them to deliver 70% revenue growth, which is absurd. https://t.co/NtZqCXdaRU","likes":116},{"id":"2092789800428622128","author":"aleabitoreddit","date":"2026-08-27","zh":"找到DDR2/DDR3受惠股晶豪科（ESMT），月淨利快速成長，年化本益比僅1.9倍，已持有。","risk":"","s":{"SNDK":"neutral"},"text":"I wanted exposure to DDR2/DDR3 bottleneck ongoing and found ESMT (3006).\n\nA $2.5B MC fabless company with PSMC wafer allocation (esp. focused on DDR2).\n\nLast month's net income was: $109.5M (July month), which annualized is $1.31B net profit (1.9x runrate P/E).\n\nIf we look at net profit throughout the months tracking legacy DRAM price hikes:\n\nJan 2026: ~$16M (est)\nFeb 2026: ~$17M\nMar 2026: ~$31M (est)\nApril 2026: ~$58M\nMay 2026: ~$60M (est)\nJune 2026: ~$67M (est)\nJul 2026: ~$110M\n(Estimated months are inferred from reported quarterly totals. July is company reported)\n\nThis earnings progression reminds me of $SNDK style price hikes + earnings inflection (esp. the report released this month).\n\nAnd I do expect DDR2/DDR3 capacity to remain constrained throughout 2027 (with legacy players like Winbond withdrawing from certain lines too like DDR2).\n\nIt's not quite all inventory liquidation like the other peers. Sure lower cost inventory helped, but the primary driver seems to be the widening spread between wafer costs/supply and legacy dram ASPs?\n\nTheir balance sheet is extremely solid as well:\n\n- Cash on hand: ~$395.9M net cash\n- $249.6M inventory, $146.3M receivables\n\nAnd the net incom","likes":777},{"id":"2092851118233764178","author":"aleabitoreddit","date":"2026-08-27","zh":"一直看多記憶體，NVDA財報再證需求；已減碼多數記憶體股但保留三星/海力士，轉向光通訊與DDR2/3。","risk":"","s":{"EWY":"bull","MU":"bull","NVDA":"neutral","SIMO":"neutral","SNDK":"neutral"},"text":"I've always been bullish on memory with $MU / Samsung / solana:SKHYhSjuRWHgikq8eRKbtBbpABgJSkd7ytQV14i9EQ3 for the 2026-2027 period.\n\nSame opinion, even after $NVDA call.\n\nAnd I've been fervently defending how high end memory demand is structural + OP for operating income (especially during Iran tensions around LNG/Helium).\n\nNvidia earnings just reaffirms what we know about extreme demand since commitments went from $119B -> $279B largely driven by memory procurement.\n\nNvidia's CFO also said: \"We are experiencing extreme pricing conditions in memory.\"\n\nAs for what I've done, H1 2026 I was extremely overweight in memory:\n\nWith $MU, $SNDK, Phison, $SIMO, Nanya, Macronix, Winbond, and $EWY / SK Hynix (HBM/DRAM + NAND + legacy DRAM/NAND + controllers + NOR Flash).\n\nI trimmed down those positions aside from Samsung/SK Hynix longs, since I do believe many have been rerated (eg. Micron $300 -> $1000+ already).\n\nI think the largest price discovery period has played out, but just a waiting game for the operating income to catch up (esp u samsung)\n\nAnd I used that period to go overweight on photonics.\n\nBut I do believe we're seeing a relatively newer cascade down into the \"legacy legacy\" mem","likes":1169},{"id":"2093014569279189295","author":"aleabitoreddit","date":"2026-08-27","zh":"SIVE財報：營收機會管道達12億美元年增268%，營收564萬美元，Q4起放量，非常期待。","risk":"","s":{"SIVE":"bull"},"text":"$SIVE earnings just got released:\n\n$1.2 billion revenue opportunity pipeline growth up 268% from December (incredible growth).\n\nLast ER: $799M (this was a surprise, likely linked to Jabil)\n\nJuly 2026: ~$1.2B (hinting more either more customer engagements than what's announced or larger volume ramps within programs).\n\n\"Sivers continued to reallocate resources from NRE projects toward product ramp preparation.\n\nSivers expects the impact of this transition to become visible in Q4 2026 and accelerate through 2027 as multiple programs progress toward volume production.\"\n\nMakes sense on timelines.\n\nCurrent financials reflect a qualification-stage player before volume ramp:\n\n- $5.64M in revenue (reducing NRE activity, shifting to volume ramps soon)\n-$3.72M in adjusted EBITDA (what to look at given one-off charges, eg. social security accounting expense)\n\nKey thing to look at is earnings call in 30 minutes, very excited so far.","likes":1389},{"id":"2093031636678090891","author":"aleabitoreddit","date":"2026-08-27","zh":"因處於認證階段，如同AAOI、AEHR放量前，需理解半導體放量週期。","risk":"","s":{"AAOI":"neutral","AEHR":"neutral"},"text":"@Finishurbkfst23 Because they're qualification stage.\n\nSame thing with $AAOI or $AEHR before their volume inflections.\n\nIt's just understanding semi ramp cycles from development -&gt; qualification -&gt; volume ramp.","likes":117},{"id":"2093034809069379783","author":"aleabitoreddit","date":"2026-08-27","zh":"SIVE營收管道一年內從4億增至12億美元，InP雷射長期毛利55-60%，品質較高。","risk":"","s":{"SIVE":"bull"},"text":"@Robertff8n Pipeline grew to $1.2B from $799m from $400m in less than a year, not quite sure how someone expects more.\n\nThe revenue quality is different than others, since $SIVE was 55-60% long term gross margins est. off InP lasers.\n\nIt's not the same as 30% transceiver margins (with more revenue).\n\nAlso you can't suddenly escape qualification cycles and sell out to 2030, especially when they're targeting newer architectures for scale up in H2 2027","likes":179},{"id":"2093036861963075719","author":"aleabitoreddit","date":"2026-08-27","zh":"LPK營收因玻璃基板延後而遞延；SIVE的1.6T/CPO無可信延後，僅待認證。","risk":"LPK營收因玻璃基板延後","s":{"JBL":"neutral","LPK":"bear","SIVE":"bull"},"text":"@whatdahellson It's slightly different since $LPK revenue has likely been delayed given industry GCS delays with Samsung Electro-mechanics/SKC Absolics\n\n$SIVE is the laser supplier to $JBL 1.6T LRO, Ayar for CPO, and others.\n\nThere's been no credible delays to 1.6T/CPO, it's just waiting for their qualifications to finish before volume contracts flow. Those architectures are 2027-2028.","likes":115},{"id":"2093038129393627218","author":"aleabitoreddit","date":"2026-08-27","zh":"SIVE主要交易所已收盤，OTC市場極薄，小賣單即可造成大幅波動。","risk":"OTC流動性薄","s":{"SIVE":"neutral"},"text":"@CryptoVandelay $SIVE primary exchange is closed. An OTC market is extremely thin and a small sell order can trigger a large % move.","likes":152},{"id":"2093042867916968058","author":"aleabitoreddit","date":"2026-08-27","zh":"分析師主要看GFS、JBL等客戶計畫擴展，SIVE位於上游。","risk":"","s":{"GFS":"neutral","JBL":"neutral","POET":"neutral","SIVE":"neutral"},"text":"@nimishx KPI has always been the consistent. It's just an indicator of how things would ramp.\n\nMain thing analysts look at are their hyperscaler suppliers like $GFS, $JBL, Ayar, $POET, and other pluggable/CPO partners.\n\nAnd how their programs scale, with $SIVE sitting upstream.\n\nRather than trying to argue with what opportunity pipelines mean.","likes":83},{"id":"2093043338882805767","author":"aleabitoreddit","date":"2026-08-27","zh":"NVDA是5兆美元公司，不能與認證期的10億美元光通訊公司比較。","risk":"","s":{"NVDA":"neutral"},"text":"@Ingeltun Maybe because $NVDA is a $5+ trillion dollar company.\n\nAnd then you're comparing that to a qualification stage $1B photonics company where all their ramps happen 2027/2028.","likes":64},{"id":"2093045300600672389","author":"aleabitoreddit","date":"2026-08-27","zh":"GFS以SIVE為參考雷射，Ayar列其為主要供應商，新架構2027/28才放量。","risk":"","s":{"GFS":"neutral","JBL":"neutral","SIVE":"bull"},"text":"@degenlurker_ @nimishx $GFS has $SIVE as their reference laser design and showcased them as a laser supplier for CPO/NPO/pluggables for GFS scale.\n\nAyar (leading CPO player) has $SIVE listed as their primary laser supplier.\n\nAgain all these newer 1.6T and CPO (scale up) architectures ramp in 2027/2028, it's hard to provide concrete volume contracts/projections if players like $JBL haven't qualification with their hyperscaler customers.","likes":116},{"id":"2093054882282651723","author":"aleabitoreddit","date":"2026-08-27","zh":"SIVE財報重點：6家新模組商、新代工產能、JBL 2027量產時程；唯自建產能需增資本支出。","risk":"自建產能增加資本支出","s":{"AAOI":"neutral","JBL":"bull","LITE":"neutral","SIVE":"bull"},"text":"$SIVE ER transcript just dropped, TLDR:\n\n- 6 NEW pluggable players working with Sivers now.\n\nProbably the biggest news of the entire ER next to new foundry allocations.\n\n\"3 are in alpha sample evaluation stage\" and another 3 in technical engagement / supply assessment stage.\"\n\nAnd now it makes more sense why their $1.2B revenue pipeline ballooned (since this was a bigger leap than Jabil).\n\n- Initial production orders with $JBL expected in the first half of 2027, with the production ramp planned second half of 2027\n\nLFG, Jabil is a massive hyperscaler supplier and finally got clear timelines on revenue from volume ramp.\n\n- \"new foundry partner who has brought on tremendous capacity that is available now\"\n\nThis is what I wanted to hear. Apparently they've been in the works for this for awhile since it's \"available now\", and THIS IS VERY MATERIAL.\n\nCW lasers are in a massive shortage and $SIVE brought on new supply outside of Win Semi (also de-risks).\n\nAs you hear with other qualified CW players (anything they make gets sold), so as Sivers partners finishes their qualifications, I'm expecting the same.\n\n- \"long-term capacity model where one-third of manufacturing capacity will be inte","likes":939},{"id":"2093059740406583545","author":"aleabitoreddit","date":"2026-08-27","zh":"CW雷射嚴重瓶頸下，SIVE獲兩家代工產能、JBL量產時程明確、6家新客戶，基本面非常正面。","risk":"","s":{"GFS":"neutral","JBL":"bull","POET":"neutral","SIVE":"bull"},"text":"Massive CW laser bottleneck ongoing.\n\n-> 2 foundries (Win + another major player) with substantial capacity for $SIVE\n-> $JBL clear ramp timing\n- 6 new pluggable players in eval/later stage disc for near term opportunities\n-> $GFS, Ayar, $POET, (potentially Celestial + other CPO players).\n-> not even including the other work they do with TFLN and others.\n\nI'm very positive fundamentally after this.","likes":146},{"id":"2093062500862644454","author":"aleabitoreddit","date":"2026-08-27","zh":"Sivers獲大量產能分配並與JBL外另6家模組商合作，批評者誤解認證期公司。","risk":"","s":{"JBL":"neutral"},"text":"@Kr_Soze I've never seen someone say new \"tremendous capacity allocation for Sivers\" for laser supply... \"available now\" during a bottleneck.\n\nAnd a disclosure working with 6 new pluggable manufacturers beyond $JBL (so 7).\n\n\"was awful\". Think majority of people like yourself just misunderstand evaluating qualification cycle players.","likes":131},{"id":"2093087267594314182","author":"aleabitoreddit","date":"2026-08-27","zh":"SIVE是最特別的10億美元光通訊公司，擁多條認證路徑與CW產能，市值相對認證路徑排第一。","risk":"","s":{"AEVA":"neutral","GFS":"neutral","JBL":"neutral","NVDA":"neutral","POET":"neutral","SIVE":"bull"},"text":"Nah, $SIVE is the most unusual $1B photonics company I've ever seen.\n\nJust for AI DCs alone:\n\n- Reference laser for $GFS SCALE (CPO/NPO/pluggable)\n- 7 pluggable engagements disclosed, with $JBL as primary ramp (with H1 2027 timeline)\n- ELS path with O-Net\n- ELS path with $POET\n- Lasers to Ayar for CPO I/O (now in $NVDA nvlink ecosystem)\n- Lasers for $AEVA (which now has NPO agreements with optical engine providers for hyperscalers)\n- Celestial/Lightmatter/Lightelligence (likely customers in 2023/2024)\n- InP lasers on TFLN with Lightium\n\nThen it has 2 substantial allocations for CW DFB laser capacity during an industry shortage.\n\nAs well as one of the few CPO-grade laser suppliers out in the industry.\n\nLet me know what other player around this range has so many ongoing qualifications, a large TAM, and in photonics.\n\n$SIVE is the #1 for me in terms of MC relative to qualifications paths across the industry.","likes":667},{"id":"2093207461314597108","author":"aleabitoreddit","date":"2026-08-28","zh":"許多批評者不懂如何評估認證週期型半導體公司，當年AAOI與AEHR在30美元時也遭同樣質疑。","risk":"","s":{"AAOI":"bull","AEHR":"bull"},"text":"@SoundResponse Lot of critiques are from people who don’t understand how to evaluate qualification cycle semi players.\n\nGot the same thing with $AAOI back at $30 or $AEHR at $30.\n\nGoes to show when people look hard into development contract revenues, one-off accounting charges, rather than how hyperscaler supplier qualification timelines are going","likes":183},{"id":"2093230562261823905","author":"aleabitoreddit","date":"2026-08-28","zh":"CW雷射產能短缺下COHR、AAOI、LITE將雷射轉內用，Sivers握有大量產能與6個可插拔合作，作者認為Sivers將大爆發。","risk":"","s":{"AAOI":"neutral","COHR":"neutral","GFS":"neutral","JBL":"neutral","LITE":"neutral","MRVL":"neutral","POET":"neutral","SIVE":"bull"},"text":"Here's the angle I'm looking at $SIVE at:\n\nCompanies/CSPs have been going out of their way way to lock up any qualified CW laser capacity for optical transceivers.\n\nSo now, Sivers is coming into the industry with:\n\n- Large capacity from Win Semi\n- \"tremendous capacity that is available now\" from a new foundry (likely qualifications since 2024) since it's engaged \"for a while\"\n\nAnd what excited me from this earnings was the \"6 pluggable/module\" engagements (which is an enormous amount).\n\nThe nuance I'm reading is:\n\n- $COHR said it sees no near term ability to sell InP lasers externally because internal transceiver demand consumes all available\n- $AAOI said the same about consuming laser capacity internally (wasn't a major merchant supplier before though).\n- $LITE has been bottlenecked and been buying lasers off the open market\n\nYour previous merchant players rerouted laser capacity internally.\n\nSo a lot of the bigger names (eg. Eoptolink/Innolight as just a random example) are probably looking to source more lasers.\n\nAnd that kinda matches the quote \"capable of very rapid qualification and ramp\" (which would not match Series B startup)...\n\nLot of people are asking why aren't there L","likes":896},{"id":"2093245069575012529","author":"aleabitoreddit","date":"2026-08-28","zh":"認為演算法、空頭與殭屍帳號在散播SIVE負面消息，基本面終將追上；唯一實質利空是轉混合製造增加資本支出。","risk":"轉混合製造模式增加資本支出","s":{"SIVE":"bull"},"text":"@sokarsokk Mix of algorithms, short sellers, dozens of repurposed/dormant accounts dedicated toward spreading negative news about $SIVE\n\nHard to believe accounts used for marketing during 2016 Asian ICOs or new X accounts would just start posting 50 negative comments only about Sivers.\n\nRegardless of near term volatility these things cause, fundamentals will catch up.\n\nThe materially bearish thing I see is implications of increased capex spend from going to a hybrid manufacturing model from fablite (but it’s inevitable in the long run)\n\nI haven’t really seen much people comment on that","likes":165},{"id":"2093245981685092439","author":"aleabitoreddit","date":"2026-08-28","zh":"不喜歡Sivers此時轉向混合製造，但同意需要像AAOI或LITE那樣垂直整合。","risk":"","s":{"AAOI":"neutral","LITE":"neutral"},"text":"@shawnyang1128 This was disclosed wafer capacity from their foundry partners back in 2024. Maybe one of the US players got added.\n\nI’m not a fan of Sivers switching to hybrid manufacturing at this stage though (think it targeted 1/3rd of capacity).\n\nBut I do agree it’s needed to be vertically integrated like $AAOI or $LITE.","likes":85},{"id":"2093247980010917902","author":"aleabitoreddit","date":"2026-08-28","zh":"回應質疑：市場當初在AXTI僅13美元時也強烈不認同。","risk":"","s":{"AXTI":"bull"},"text":"@Ice_Tradingg The market also strongly disagreed when $AXTI was $13.","likes":177},{"id":"2093252439973777674","author":"aleabitoreddit","date":"2026-08-28","zh":"SK海力士、SanDisk、輝達皆指存儲需求結構性延續至2030年，作者認為整個存儲板塊遠期本益比有上升空間。","risk":"","s":{"NVDA":"bull","SKHY":"bull","SNDK":"bull"},"text":"所以… 回到存储这边我们现在有：\n\n$SKHY CEO 表示: “我们预计[存储]短缺将持续到 2030 年底”\n\n$SNDK 表示: “我们看到直到 2030 年，NAND 都存在结构性的巨大需求”非 GAAP 毛利率将维持在约 80%.\n\n$NVDA 表示 供应承诺从 1,190 亿美元增加到 2,790 亿美元，主要由存储采购推动…与此同时, 存储定价处于“极端”水平 而且还在继续上涨.\n\nWinbond 正在与多家客户就延伸至 2029-2030 年的配额展开讨论.\n\n我之前就说过, 存储需求看起来是结构性的, 而现在从传统 DRAM 到 HBM，需求可见度已经延伸到了未来数年..\n\n所以我确实认为, 整个板块的远期 p/e 倍数都有进一步上升的机会.","likes":1202},{"id":"2093327851957461082","author":"aleabitoreddit","date":"2026-08-28","zh":"以營收管道衡量客戶品質，建議追蹤JBL認證放量與晶圓產能。","risk":"","s":{"GFS":"neutral","JBL":"neutral"},"text":"@dBooray @SoundResponse I use pipeline revenue as a measure est. quality of their customers relative to previous pipeline revenue estimates.\n\nEg. Q1 $JBL / $GFS $700M+, vs. Q2. 6 pluggable partners added.\n\nNot really a good figure to go off for revenue projections, since I’d expect addressable market + ramp to be much better once they expand product lines (eg. More downstream into optical engines or complete pluggables).\n\nIn the meantime I think it’s better to track $JBL / qualification ramps and wafer capacity modeled into revenue, and assume it gets sold given shortages.","likes":66},{"id":"2093652781928448279","author":"aleabitoreddit","date":"2026-08-29","zh":"批評SIVE財報：管理層輕描關鍵揭露、CFO答覆含糊、資金應用於併購與雙重上市；仍期望其成為下一個LITE。","risk":"CFO含糊、上市時程不明","s":{"AAOI":"neutral","AVGO":"neutral","COHR":"neutral","LITE":"neutral","SIVE":"bull"},"text":"If I had to be critical of $SIVE earnings:\n\n1. Management underweighted the two disclosures that matter most.\n\n-> 6 pluggable engagements\n-> Foundry capacity (during an industry bottleneck)\n\nThat's the most important part of the call and should have been the focus to provide economic scale of them. But we got 2-3 sentences about it.\n\nAnd it shouldn't take an Anime avatar on X to talk most about the implications of those.\n\n2. CFO needs retraining or bring on a new one.\n\nThe lawyer like answers were infuriating to listen to as a shareholder. Even I got pissed off with this om 2 foundry allocations during a bottleneck + ASP hike/operating leverage\n- Around much capacity revenue would those allocations lead to (half of AOI calls are around those from US analysts)\n- $GFS NPO/CPO/pluggable scale implications and downstream end customers opportunities\n- Ayar / CPO player 2028 ramp (that happened to raise $500m+) or other products like ELS production with O-net and TAM opportunities there.\n- How big those 6 new pluggable players were, rather than asking \"why can't you disclosure them\"\n- Clarifying CFO legalposts around listing timeline and M&A TAM expansion opportunities\n\nSo investors can ge","likes":722},{"id":"2093680360920105154","author":"aleabitoreddit","date":"2026-08-29","zh":"營運面仍非常看好SIVE，新增晶圓代工產能與6個可插拔合作更添信心，只是法說會提問品質差。","risk":"","s":{"SIVE":"bull"},"text":"@dBooray No I'm still very bullish operationally on $SIVE, and much more so with the additional foundry allocation + 6 pluggable disclosure.\n\nI just couldn't get the answers I wanted to from these calls, because the leading questions asked were crap or focused on the wrong things.","likes":125},{"id":"2093682719612145928","author":"aleabitoreddit","date":"2026-08-29","zh":"SIVE的CEO很強，但需以高成長光學公司自居並對外溝通，擺脫本地市場拖累。","risk":"","s":{"SIVE":"bull"},"text":"@maroonjacket1 Nah $SIVE CEO is goated, but if you go to a fishermen's market, don't expect many questions outside of fish.\n\nSivers needs to both start treating and communicating themselves as a hypergrowth optical company.\n\nRather than being weighed down by local markets.","likes":147},{"id":"2093712497949950242","author":"aleabitoreddit","date":"2026-08-29","zh":"封測業者警告2027年傳統封裝產能缺口恐超20%，打線設備成主要瓶頸，AMKR、KLIC等可能受惠。","risk":"","s":{"AMKR":"bull","KLIC":"bull"},"text":"Missed this mention earlier but IC design insiders reveal that OSAT providers have already warned clients:\n\n\"traditional packaging capacity could face a deficit exceeding 20% by 2027\" (eg. $AMKR, ethereum:0x041ff0e49f6f774e7dc7bd10ee4a14c00b1d80b2, Powertech as potential beneficaries)\n\nWith: \"wire bonding equipment\" emerging as the primary bottleneck (ASMPT, $KLIC)\n\n-> influx of AI server shipments has triggered a spike in demand for mature chips\n-> existing mature packaging capacity at OSATs is being rapidly absorbed\n-> securing early access to traditional packaging capacity is now becoming a challenge\n\nCascading bottleneck patterns are occurring across memory (eg. DDR2, DDR3) and now packaging capacity I guess.","likes":374},{"id":"2093721035673923743","author":"aleabitoreddit","date":"2026-08-29","zh":"AMKR有閒置傳統封裝產能，若缺口屬實可高價填滿帶動近期營收；主要成長在2028年亞利桑那廠。","risk":"","s":{"AMKR":"bull","NVDA":"neutral","TSM":"neutral"},"text":"@piyush1337 $AMKR has existing traditional packaging capacity underutilized (like in Philippines), so if that 20%+ deficit is true\n\nProbably fills that up at higher prices so that's brrr to nearer term revenue.\n\nI still think the main ramp is early 2028 with Arizona once their $TSM + $NVDA stuff takes off.","likes":24},{"id":"2093744291139272901","author":"aleabitoreddit","date":"2026-08-29","zh":"讚賞網友聯繫SIVE投資人關係並獲CEO回覆，認為CEO很棒，只需擺脫本地市場。","risk":"","s":{"SIVE":"bull"},"text":"@dxleolibra1003 Cool to see you reaching out to $SIVE IR and it's even better you got a response back from the CEO himself!\n\nI do think Sivers' CEO is amazing, just gotta escape local markets.","likes":210},{"id":"2093760498072485919","author":"aleabitoreddit","date":"2026-08-29","zh":"諷刺：MU一年內市值從1330億升至逾1兆美元，RDDT修正兩個月就被稱為垃圾股。","risk":"","s":{"MU":"bull","RDDT":"bull"},"text":"$MU: goes from $133B -&gt; $1T+ in a year.\n\n$RDDT after a 2-month correction: \"Garbage stock\" https://t.co/HlIXwJ7ZdB","likes":878},{"id":"2093763407308812702","author":"aleabitoreddit","date":"2026-08-29","zh":"AXTI需大幅調漲InP基板售價才能進一步重估；瓶頸已獲驗證，但與LITE、COHR的長約內容未知（持有AXT）。","risk":"與客戶長約內容不明","s":{"AXTI":"bull","COHR":"neutral","LITE":"neutral"},"text":"@he8496 $AXTI would need to hike ASPs of InP substrates to extreme levels you see in memory to see further rerating eg. $20-30B valuations.\n\nI think the bottleneck is proven, their chokepoint is proven.\n\nHowever, I don't know what the contracts or LTAs with $LITE and $COHR entail. We'll find out over time (disclosure* own AXT shares).","likes":42},{"id":"2093764276150579202","author":"aleabitoreddit","date":"2026-08-29","zh":"喜歡RDDT，獲利佳、年增61%，是軟體類最愛之一；認為「AI搜尋引用減少」的空頭論點很蠢。","risk":"","s":{"RDDT":"bull"},"text":"@Minnelli1286325 I like $RDDT, very profitable company, grew 61% Y/Y, I expect them to find more ways to increase monetization of audiences.\n\nOne of my favorite software bucket names.\n\nI find the bear cases of \"less AI search citations\" to be dumb, since if you ask 100 of people on the street how they found or visit Reddit.\n\nI'm pretty confident not a single person would say OpenAI citations.\n\nIt's already on the destination level as Youtube/Instagram.","likes":138},{"id":"2093811019823132903","author":"aleabitoreddit","date":"2026-08-29","zh":"以馬鈴薯與紅蘿蔔比喻：輝達吸走HBM產能，大廠轉產後舊型記憶體短缺，ESMT受惠漲價，本益比僅1.9倍。","risk":"","s":{"MU":"neutral","NVDA":"neutral"},"text":"Okay just to simplify this:\n\nThere is a guy who eats a lot called $NVDA. Nvidia only wants to buy high-priced potatos off the farmers.\n\nA potato farmer $MU, that was selling carrots... now shifted farmland to potatos.\n\nNvidia caused a great potato famine cause they can eat a lot. So everyone else who farmed carrots like SK Hynix and Samsung moved their farmland capacity to grow potato.\n\nBut... people still need to eat. And carrots are a healthy part of their everyday diet..\n\nNow there's no more carrots aside from a player like \"ESMT\", the legacy carrot farmer.\n\nSo now, because everyone buys carrots off ESMT, there's a shortage and the price goes up.\n\nSo ESMT needs more carrot seeds (from PSMC). But PSMC is running low on carrot seeds to grow the carrots.\n\nSo PSMC charges ESMT more for the seeds.\n\nBut the price ESMT sells the carrots at are much higher than what PSMC hikes the carrod seed price.\n\nnow... ESMT is making enough from selling carrots that it traded 1.9x P/E off July's earnings.\n\nCan ESMT keep selling these carrots through 2027?\n\nAll the other farmers thinks so since it's both hard + low incentive to migrate their valuable potato farms back to carrot farms.","likes":544},{"id":"2093947848580858123","author":"aleabitoreddit","date":"2026-08-30","zh":"作者堅持免費公開研究，列舉成功標的（AXTI、MU等）、遇延遲的LPKF，以及仍在發展的SIVE等。","risk":"LPKF玻璃基板延遲","s":{"AEHR":"bull","ARM":"bull","AXTI":"bull","CCXI":"bull","COHR":"bull","EWY":"bull","INTC":"bull","IQE":"bull","JBL":"neutral","LITE":"bull","LPKF":"neutral","MRVL":"bull","MU":"bull","MXL":"neutral","NBIS":"bull","RPI":"bull","SIVE":"bull","SOI":"bull","TSEM":"bull","XFAB":"bull"},"text":"It’s been a little disappointing to see a pattern with some people I've interacted with on X:\n\n- try to engage with the same audience, then quickly move toward aggressively monetizing it\n\n- get upset when I choose not to participate in or amplify paid groups\n\n- throw out personal or illogical attacks and try to reframe that as simply disagreeing over fundamentals\n\nWhen I first joined X, a lot of finance content revolved around watches/private jets + options, paywalled communities promising the \"secrets of Wall Street,\" and squiggly-line charts.\n\nOne of the things I've wanted to do differently is publish my research and reasoning openly, for everyone.\n\nI think this definitely resonated with folks given my follower growth.\n\nBut of course, this growth can also create friction with people whose business models rely on using X to funnel audiences into paid services or expensive paywalls.\n\nMy subscription has been $1 for months and will stay at the minimum, despite claims at the beginning I would raise it to $100.\n\nAll of my core theses are published on the main timeline for free. I could put substantially more behind a paywall. I just don't want to.\n\nI just prefer sharing the ideas open","likes":2067},{"id":"2093988125144207710","author":"aleabitoreddit","date":"2026-08-30","zh":"整理SIVE財報：JBL、GFS、POET、Ayar等客戶與雙代工產能，批評溝通不足，作者是快樂的SIVE股東。","risk":"溝通與上市時程不明","s":{"AAPL":"neutral","AEVA":"neutral","AMD":"neutral","COHR":"neutral","GFS":"neutral","JBL":"neutral","LITE":"neutral","MRVL":"neutral","NVDA":"neutral","POET":"neutral","SIVE":"bull"},"text":"Just my final recap on thoughts + fundamentals of $SIVE from ER:\n\nPluggables (1.6T Ramp) for 2027:\n\n- $JBL (1.6T LRO, confirmed) Orders H1 2027, Ramp H2 2027\n-> -> Likely multiple hyperscaler customers\n\n- 3 pluggable makers (evaluation)\n- 3 pluggable makers (supply assessment)\n\nReference Design for likely H2 2027–28+:\n\n- $GFS (Globalfoundries) SCALE (confirmed))\n-> -> Likely $AMD and other hyperscalers as CPO customers\n\nExternal Light Sources / Optical Engines for 2027:\n\n- $POET (confirmed)\n-> -> Lumilens / hyperscaler end users\n\n- O-Net (confirmed)\n-> -> Massive ODM/OEM for Hyperscalers + Asia\n\n- Likely $AEVA (mapping)\n-> -> supplying to OE -> hyperscalers / lidar\n\n- SemiNex (confirmed)\n\nOptical I/O for 2028:\n\n- Ayar Labs (confirmed)\n-> -> Likely $AMD, ALchip, and hyperscaler ASIC program end users + $NVDA NVLink\n\n- $MRVL Celestial (potential customer from 2023-2024 disclosures)\n- Lightmatter (potential customer from 2023-2024 disclosures)\n- Lightelligence (potential customer from 2023-2024 disclosures)\n\nThen potentially $AAPL for 2028 for next-generation wearable updates and other programs from TFLN with Lightium.\n\nIn terms of capacity allocations:\n- Win Semi\n- 1 other foundry (w","likes":905},{"id":"2093990659866923407","author":"aleabitoreddit","date":"2026-08-30","zh":"SIVE波動源於溝通與雜訊；論點破壞點為代工產能或認證失敗，基本面在CW雷射瓶頸下處於絕佳位置。","risk":"代工產能或認證失敗","s":{"JBL":"neutral","SIVE":"bull"},"text":"@wannabepanacea So far, what I've seen is market volatility stemming from communication failures and noise. Thesis break would be\n\n1. issues with their foundry allocations, since that would affect supply. (But they have 2 now).\n\n2. Or failing qualifications. (they signaled $JBL orders for H1, but we'll see).\n\nFundamentally I think $SIVE is in an amazing spot during a CW laser bottleneck.\n\nI also see more potential for Sivers to become a larger optical giant rather than remain just a chokepoint supplier... which is why I focus on company direction a lot more.","likes":110},{"id":"2094019167527776711","author":"aleabitoreddit","date":"2026-08-30","zh":"NVDA預估2027年超大規模業者支出達1.3兆美元、營收成長約70%，作者認為真正的派對才要開始。","risk":"","s":{"NVDA":"bull"},"text":"FYI to the AI bears: $NVDA projects $1.3T of hyperscaler spend for 2027.\n\nUp from ~$800B in 2026, alongside ~70% revenue growth despite remaining capacity constrained… far above prior Street expectations of ~45%.\n\nThat capex flows across the AI supply chain… from memory and networking to foundries. Especially through the new bottlenecks/chokepoints that didn’t benefit from older generations.\n\nWe’re like 2 hours into the party where people started off drinking Sapporo draft beer.\n\nSomeone spiked Situational’s drinks and we had to pause the party for 30 min.\n\nBut now it’s back on with tequila shots on the table.\n\nI think the real party is about to begin.","likes":1177},{"id":"2094021377900839021","author":"aleabitoreddit","date":"2026-08-30","zh":"AI超級週期中部分領域有泡沫，但以NVDA與TSM為核心的主題是結構性的並將持續擴張。","risk":"","s":{"NVDA":"bull","TSM":"bull"},"text":"@Omardrisss There’s bubbles within the broader AI supercycle (eg. frontier lab valuations, some Neoclouds).\n\nAnd some pop here and there.\n\nBut the overall theme with $NVDA and $TSM in the center of it all looks structural and would keep ramping up.","likes":92},{"id":"2094027369648681284","author":"aleabitoreddit","date":"2026-08-30","zh":"依馬斯克所提AI建設瓶頸（變壓器、佈線、液冷、冰水機、網路），列出相關受惠股構想（持有HPS.A）。","risk":"","s":{"AAOI":"bull","AAON":"bull","COHR":"bull","CRDO":"bull","HPS":"bull","IESC":"bull","JCI":"bull","LITE":"bull","MOD":"bull","MTRS":"bull","NVT":"bull","PRY":"bull"},"text":"Just some random ideas from Elon’s post:\n\n$AAON - Chillers / liquid cooling\n$NVT - Cooling\n$MOD - Chillers / Cooling\n$IESC - Wiring\n$MTRS - chillers\n$JCI - chillers\n$HPS.A - Transformers (disclosure I own positions in this)\n$PRY.MI - networking/wiring(fiber)\n$CRDO / $AAOI (same) / $LITE / $COHR - networking\n\nSince Elon Musk cited:\n\n- transformers\n- wiring\n- liquid cooling\n- massive chillers + complex networking\n\nAs the point of failure for AI compute buildout.\n\nWhich is “harder than finding power”","likes":2212},{"id":"2094098755415114118","author":"aleabitoreddit","date":"2026-08-30","zh":"說明在IBKR搜尋3006並啟用台灣證交所即可找到，非投資建議。","risk":"","s":{"IBKR":"neutral"},"text":"@Myv3rz 如果你在 $IBKR 搜尋 &lt;3006&gt;並啟用台灣證券交易所，就可以找到。\n\n不過這不是投資建議。","likes":23},{"id":"2094129989071536351","author":"aleabitoreddit","date":"2026-08-30","zh":"韓國監管要求散戶上課才能交易槓桿晶片ETF，相關交易額跌至6月高峰的4%，笑稱Windows擊退韓國散戶。","risk":"","s":{"EWY":"neutral","MSFT":"neutral","SKHY":"neutral"},"text":"I'm going to miss the days of Korean retail reacting heavily to $EWY / Samsung / $SKHY daily volatility.\n\nNew piece: \"Korean day traders flee leveraged chip ETFs as regulatory curbs bite\"\n\n- Trading value in ETFs designed to deliver 2x daily returns of Samsung / SK Hynix has fallen to just 4% of its June peak\n\n- The requirement follows earlier measures, including a higher minimum deposit, aimed at cooling speculative activity\n\n- And then came the final boss... A 5 day trading course where:\n\n\"Investors must download a Windows-only program  and spend at least one hour each day trading with virtual funds\"\n\n$MSFT Windows wiped out the Korean retail.","likes":380},{"id":"2094298008955535500","author":"aleabitoreddit","date":"2026-08-31","zh":"TSM副總稱光引擎瓶頸在雷射、光纖、連接器與測試，作者列出LITE、SIVE、GLW、FORM等受惠構想（有相關曝險）。","risk":"","s":{"COHR":"bull","FORM":"bull","GLW":"bull","KEYS":"bull","LITE":"bull","SIVE":"bull","TSM":"neutral"},"text":"$TSM Vice President of Advanced Packaging:\n\n\"Foundries can scale up the optical engine, but the real bottlenecks to large scale deployment lie elsewhere...\n\nIncluding lasers, optical fiber, fiber-optic connectors, and test\" (UDN)\n\nJust some bucket ideas:\n\nLasers: $LITE, $SIVE, $COHR, LandMark (3081), LuxNet, Sumitomo, Furukawa\nOptical fiber / FAU: Foci, Browave, $GLW, Sumitomo\nFiber Optic / CPO Connectors: BizLink, $GLW , Fujikura, Nextronics, COXOC\nCPO testing: MPI (6223), Advantest, $FORM, Msscorps, $KEYS, Chroma\n\n(disclosure: exposure to theme above, individual names not named by TSMC)\n\nThere are others I like as well, such as ShunSin, which now has explicit TSMC COUPE exposure but probably belongs under a different category like packaging/integration.\n\neg. \"Foxconn unit ShunSin confirms TSMC COUPE partnership\"\n\nI don't think there's anything too new vs. H1, aside from ongoing news (eg. FAU looks like there will have a demand imbalance in 2027, from a report last week).\n\nBut it's helpful to reiterate overall beneficiaries from time to time...","likes":559},{"id":"2094300339478683801","author":"aleabitoreddit","date":"2026-08-31","zh":"AAOI沒問題，2027年需求能見度極佳，但6億美元ATM增發帶來短期壓力。","risk":"6億美元ATM增發","s":{"AAOI":"bull"},"text":"@nosignal62478 I think $AAOI is fine. I didn't list them here because they're not known to be a merchant cw laser supplier (given they use them internally for transceivers).\n\nDemand visibility into 2027 is incredible, there's just a $600m ATM, which presents a lot of short term overhang.","likes":69},{"id":"2094306322812666156","author":"aleabitoreddit","date":"2026-08-31","zh":"OpenAI囤積Mac mini做強化學習、Anthropic向AMZN租用，AAPL不做事也大贏；聯想到心愛的RPI與Anthropic合作。","risk":"","s":{"AAPL":"bull","AMZN":"neutral","RPI":"bull"},"text":"$AAPL is now an important AI company apparently?\n\n-> \"OpenAI Hoarding Tens Of Thousands Of Apple Mac mini and Mac Studio\" for reinforcement learning\n\n-> Anthropic is renting Apple Mac mini units from $AMZN to complete similar AI tasks\n\nI've never seen a company win so hard by doing nothing.\n\nBut whenever I see Apple + AI, I think of my beloved $RPI. Apparently Anthropic is working with Raspberry Pi now for their new model Hardware Standard, as of the 27th.\n\nThere's nothing yet about Anthropic/OpenAI buying Raspberry Pi devices for similar tasks, but maybe some OSINT researcher can do some digging.","likes":479},{"id":"2094307667225579739","author":"aleabitoreddit","date":"2026-08-31","zh":"同意對方關於持續時間的觀點，只是覺得AAPL的AI意外收益很有趣。","risk":"","s":{"AAPL":"neutral"},"text":"@jukan05 Yep, reasonable point on the duration. I just found $AAPL AI windfall to be pretty amusing. https://t.co/ki0Wp3X6YD","likes":61},{"id":"2094315118020759778","author":"aleabitoreddit","date":"2026-08-31","zh":"推測RPI最終會承接Mac mini短缺的外溢需求，目前尚無證據。","risk":"","s":{"RPI":"bull"},"text":"@bob80924 Yes, I added that as a side note. But my theory is $RPI eventually gets the overflow from mac Mini shortages.\n\nSame idea with Openclaw now applied to frontier lab agent RL training.\n\nAnd those sales would be economically meaningful given Raspberry Pi’s size relative to Apple\n\nNo proof of that yet, just a guess.","likes":31},{"id":"2094353950040592854","author":"aleabitoreddit","date":"2026-08-31","zh":"以MRVL收購的Celestial為例，若上市估值可達60-100億美元，說明評估認證週期公司應看未來CPO機會。","risk":"","s":{"MRVL":"bull"},"text":"Imagine Celestial ($MRVL acquisition) was public.\n\nThe valuation would probably be astronomical in US markets (if I had to guess, $6-10B)\n\nBecause 2028 revenue projections were $500m (q4 annualized runrate), 2029 revenue projections were $1B.\n\nAnd because Celestial is a core part of hyperscaler CPO programs.\n\nCelestial's 2026 Q2 earnings would have been:\n\n- Close to $0 revenue (Marvell said \"revenue and earnings since the acquisition were not material\")\n-  Losing -$12.5M/quarter ($50M/year)\n\nWould people who knew what they were talking about looking at qualification cycle players say...\n\n1. based on Celestial's Q2 P/S numbers and because it was losing -$12.5M a quarter... That it's a worthless meme stock?\n\nOr\n\n2. with CPO hyperscaler opportunities for 2028, it should be valued at $6-10B?\n\nAnd I think that's a core cultural disagreement between US / EU cultures + markets.\n\nIf you knew how to evaluate qualification cycle players, which number actually matters? I'd argue overwhelmingly the latter.","likes":596},{"id":"2094365307876040857","author":"aleabitoreddit","date":"2026-08-31","zh":"反駁記憶體泡沫論：三星據報已與NVDA、MSFT、GOOGL簽長約鎖定約70%產能至2031年。","risk":"","s":{"GOOGL":"neutral","MSFT":"neutral","NVDA":"neutral"},"text":"“Memory is a bubble.”Explain this then, KOSPI bears:\n\nSamsung has reportedly reserved ~70% of its memory production capacity through 2031 via LTAs with $NVDA, $MSFT, and $GOOGL as main counterparties.\n\nFive years of demand visibility… https://t.co/GUGWTkXkMc","likes":1452},{"id":"2094378666927239596","author":"aleabitoreddit","date":"2026-08-31","zh":"Soitec稱產能預留協議將簽訂、2億美元光子SOI營收是底線，TSM看好矽光子2027年主流化，壟斷瓶頸者受惠。","risk":"","s":{"SOI":"bull","TSM":"bull"},"text":"Remember my $SOI thesis anon? Soitec interview commentary today:\n\n- 80% of capacity reservation agreements expected within 1-2 weeks, with more than 10 in total.\n\n-  $200M Photonics-SOI revenue now described as \"absolutely a floor\"\n\n$TSM also sees SiPH going mainstream in 2027 with market share topping 50%+ of the optical transceiver market\n\nIf you hold a monopoly-like position over a chokepoint:\n(UBS estimates Soitec has 95% share of the market for substrates underpinning silicon photonics chips)\n\nRevenue usually flows through you.","likes":408},{"id":"2094405648293482965","author":"aleabitoreddit","date":"2026-08-31","zh":"NVDA宣布投資聯發科35億美元，似在將ASIC生態系（從MRVL到聯發科）向輝達標準靠攏，或為抗衡AVGO。","risk":"","s":{"AVGO":"neutral","MRVL":"bull","NVDA":"bull"},"text":"Today, $NVDA has announced a $3.5B investment into Mediatek.\n\nIt appears Nvidia is \"networking\" itself into the broader ASIC ecosystem, from $MRVL to MediaTek.\n\nAnd have future ecosystems aligned with Nvidia standards. (maybe to fend off $AVGO as well) https://t.co/okdGKS51U3","likes":579},{"id":"2094407457913401454","author":"aleabitoreddit","date":"2026-08-31","zh":"發現聯發科是Ayar的CPO合作夥伴，而SIVE是Ayar主要雷射供應商，但Sivers目前可能太上游。","risk":"","s":{"SIVE":"neutral"},"text":"@Matrix_B0SS I actually learned today that Mediatek is partners with Ayar for CPO (not just investors) from public filings.\n\nAnd of course it's known that $SIVE is the primary laser supplier to Ayar. But Sivers is probably too far upstream for now. https://t.co/gs8e1z2rf1","likes":98},{"id":"2094408196769423727","author":"aleabitoreddit","date":"2026-08-31","zh":"依MRVL與聯發科趨勢，猜測世芯或QCOM可能是下一個，ASIC大餅對所有人都會變大。","risk":"","s":{"MRVL":"bull","QCOM":"bull"},"text":"@balllvest With how the trends are going with $MRVL and Mediatek. My guess is Alchip (disclosure, I own this) or $QCOM might be next.\n\nI think the ASIC pie gets bigger for all of them though.","likes":45},{"id":"2094416430032896428","author":"aleabitoreddit","date":"2026-08-31","zh":"NVDA投資聯發科35億美元，像在扶植MRVL等ASIC新贏家、削弱AVGO，鞏固輝達在推論的地位。","risk":"AVGO地位遭侵蝕","s":{"AMD":"neutral","AVGO":"bear","CRWV":"neutral","MRVL":"bull","NBIS":"neutral","NVDA":"bull"},"text":"Yep, with $NVDA investing $3.5B into Mediatek.\n\nIt does feel like Nvidia is playing kingmaker with the next generation of ASIC winners like $MRVL / Mediatek, with a second order effect of eroding $AVGO position.\n\nPlaybook feels similar to what they did with Neoclouds like $NBIS and $CRWV (vs. hyperscaler cloud programs)\n\nHelp create the next leaders, then make them both financially and strategically aligned with Nvidia.\n\nI do think it’s brilliant, but moves like this might push $AMD, $AVGO, and certain hyperscalers closer together.\n\nRegardless this move cements Nvidia’s strategic position in inference (where hyperscaler ASICs were a former long-term bear case).","likes":508},{"id":"2094492628758999451","author":"aleabitoreddit","date":"2 →1,159.6 -1.9% · AVGO 375.37→357.16 -4.9% · MU 945.82→958.16 +1.3%\n\n balder-algo-logs · 龙气 · 09-03 · algo log · not advice","likes":4},{"id":"2095622238187700501","author":"KawzInvests","date":"2026-09-03","zh":"KawzInvests擔心市場對$AEHR的放量速度定價過快，好消息也可能令人失望，但超跌時才有機會。","risk":"市場預期過高","s":{"AEHR":"neutral"},"text":"This has been one of my concerns lately.\n\nThe market is pricing in a ramp faster than the ramp can actually happen. So even good news disappoints, because it's not good enough vs what's already in the price.\n\nBut that's usually where the opportunity comes from. \nMarkets tend to overshoot in both directions. They price in too much on the way up, then give back more than the fundamentals justify on the way down.\n\nI think \n$AEHR\n could easily end up being one of those.","likes":97},{"id":"2095625666951880764","author":"Balder13946731","date":"2026-09-03","zh":"Balder美股復盤：三大指數上漲，加密與軟體股領漲，市寬改善。","risk":"","s":{"SPY":"neutral"},"text":"【美股复盘 · 9月3日】\n\n美股三大指数全线造好，科技股与传统蓝筹同步发力，带动大市走势凌厉。标普500指数( \n$SPY\n )全日高开高走，收报773.59，升1.10%；以科技股为主的纳指(QQQ)在科网股走强的带动下，表现一枝独秀，收报717.96，急升1.23%；道指(DIA)亦重拾升轨，收报536.80，升1.16%。反映中小型股表现的罗素小盘股(IWM)则相对靠稳，收报294.87，微升0.29%。大市交投气氛热烈，本观察名单内100只股份中，多达67只录得升幅，仅33只下跌，市宽明显改善，反映资金入市意欲高涨。\n\n板块轮动方面，加密货币概念股及软件服务板块表现最为抢眼。受惠于华尔街大型金融机构推进现货交付等消息提振，加密资产相关股份涌现庞大买盘，Coinbase(COIN)及Robinhood(HOOD)分别急升10.21%及15.24%。与此同时，军工数据及太空题材发酵，相关概念股亦获资金追捧，Palantir(PLTR)及SPCX分别急涨8.36%及7.98%。另一边厢，半导体及光通讯板块则面临显著沽压，西部数据(WDC)、阿斯麦(ASML)及希捷(STX)跌幅介乎2.21%至2.48%，而Ciena(CIEN)更急泻10.94%，领跌科技类成分股。\n\n焦点股方面，个别重磅股受业绩主导而呈现大幅异动。Snowflake(SNOW)于上交易日盘后公布财报，受惠于业绩表现带来的极端预期差博弈，该股全日获资金大举吸纳，收市暴涨18.01%，高居升幅榜首。相反，博通(AVGO)虽同样受季绩因素影响，惟盘中遭遇庞大获利沽压，全日逆市挫2.64%。此外，特斯拉(TSLA)在即将发布Cybercab的憧憬下，获资金偷步吸纳，股价强势拉升6.80%。能源基建类股份Bloom Energy(BE)则在AI大模型引发算力能耗焦虑的宏观背景下造好，全日急升8.53%。反观做空指数工具如SQQQ及SPXU，则分别受压下挫3.58%及3.21%。\n\n小结而言，美股现阶段呈多头排列，资金呈现多点开花的格局。分析指，当前科技巨头围绕AI算力与闭源模型的角力正持续深化，惟市场炒作逻辑已从单一的硬件算力，逐步扩散至软件服务、能源基建以至新一代军工等衍生领域。后市方面，在宏观流动性充裕及机构大户持续布局的支撑下，大市整体基调料维持反复偏好，惟投资者仍需警惕部分高估值芯片股在高位获利回吐的风险，短期内板块分化走势或将加剧。","likes":9},{"id":"2095633416041689569","author":"jukan05","date":"2026-09-03","zh":"Jukan轉述：美光計畫將HBM產能翻倍，強化12層HBM4供應、追趕三星與SK海力士。","risk":"","s":{"MU":"bull"},"text":"MICRON TO DOUBLE HBM PRODUCTION CAPACITY, NARROWING GAP WITH SAMSUNG AND SK HYNIX\n\nU.S. memory maker Micron plans to double its high-bandwidth memory (HBM) production capacity from last year. Through aggressive capital spending by year-end, the company aims to strengthen its supply capabilities for 12-high HBM4, the latest generation of HBM. The move is intended to increase its market share by expanding its HBM capacity, which currently trails that of Samsung Electronics and SK hynix.\n\nAccording to industry sources on September 3, Micron plans to add up to 60,000 wafers per month of HBM production capacity by the end of this year. The net addition would exceed the company’s HBM production level of roughly 40,000–50,000 wafers per month last year.\n\n“Micron is making substantial investments in equipment to rapidly ramp up its HBM4 production capacity,” said an industry source familiar with the matter. “By the end of this year, it will have secured HBM production capacity of approximately 100,000 wafers per month.”\n\nTo achieve this expansion, Micron is increasing purchase orders (POs) with multiple HBM equipment suppliers. Equipment deliveries are understood to be ongoing at its HBM m","likes":1270},{"id":"2095643458354700593","author":"michaelsikand","date":"2026-09-03","zh":"Michael Sikand預測Anthropic上市可能引發資金從半導體輪動出去，如同SPCX被太空股資金抽走。","risk":"資金輪動出半導體","s":{"SPCX":"neutral"},"text":"My prediction.\n\n- Fed holds\n\n- Anthropic S-1 leads to a violent AI infra rally\n\n- Anthropic IPO then triggers rotation out of semis into Anthropic (like space got rugged for \n$SPCX\n) \n\n- Choppy for midterms\n\n- We all go play GTA 6 until next leg up","likes":1084},{"id":"2095696213966528569","author":"Balder13946731","date":"2026-09-04","zh":"Balder後悔今天沒抄底$AVGO，反彈強勁，持續觀察。","risk":"","s":{"AVGO":"bull"},"text":"🫪 我发现 ","risk":"","s":{"SPY":"neutral"},"text":"【美股复盘 · 9月4日】\n\n受非农就业数据及美国10年期国债收益率攀升至4.8%等宏观因素拖累，美股大市整体受压。标普( \n$SPY\n )全日反复偏软，收报769.65，跌0.46%；道指(DIA)收报533.86，挫0.57%。惟科技股重镇纳指(QQQ)表现抗跌，全日靠稳，收报717.68，平收（+0.00%）；罗素小型股(IWM)亦逆市造好，收报295.51，升0.11%。大市整体交投分化，观察名单内100只股份中，共51只上升、49只下跌，市宽表现平稳。\n\n板块方面，半导体及存储芯片股无视息魔阴霾，表现一枝独秀。在人工智能算力需求及高带宽内存产能紧缺的逻辑支撑下，闪迪(SNDK)全日急升10.03%领涨大市；SK海力士(SKHY)及美光(MU)亦分别抽升6.79%及4.59%。此外，迈威尔科技(MRVL)与相干(COHR)分别造好，录得5.89%及5.33%升幅；相关强势拖累半导体看跌ETF(SOXS)急泻8.07%。相反，科网及软件股遭遇沽压，Snowflake(SNOW)、Palantir(PLTR)及MongoDB(MDB)跌幅介乎3.24%至4.71%。\n\n个股焦点方面，特斯拉(TSLA)全日重挫5.90%，沦为表现最差的权重蓝筹之一。消息面上，其即将推出的Cybercab因移除方向盘设计而面临监管部门严格审查，市场忧虑其自动驾驶(Robotaxi)愿景落地受阻，引发资金抛售。另一方面，市场传出重磅内部人士大手吸纳消息，据SEC披露文件显示，另类资产机构Sixth Street掌门人Alan Waxman按28.78美元作价，自掏腰包买入逾4780万美元自家信贷基金股份，巨额真金白银入市，引发市场高度关注。\n\n小结而言，当前美股盘面呈现出强烈的结构性割裂。宏观层面受制于高债息压制，传统避险与估值修复逻辑持续角力；惟另一边厢，具备实质业务支撑的硬件及存储板块则持续吸纳资金。分析指，在息率前景明朗化之前，大市料维持反复上落格局，资金或进一步向确定性较高的科技硬件龙头集中，后市宜密切留意国债收益率走势及重磅科技股之承接力。","likes":6},{"id":"2096001636556824836","author":"Balder13946731","date":"2026-09-04","zh":"Balder提醒訂閱要在網頁上，否則多付的錢流向蘋果和Google。","risk":"","s":{"AAPL":"neutral","GOOGL":"neutral"},"text":"大家订阅一定要在网页上订阅，否则多交的钱全进 \n$AAPL\n 和 \n$GOOG\n 口袋里。","likes":15},{"id":"2096011862727168423","author":"michaelsikand","date":"2026-09-04","zh":"Michael Sikand提到裴洛西在納入標普前抄底$BE，猜測下一個是$VST。","risk":"","s":{"BE":"neutral","VST":"bull"},"text":"I genuinley thought she lost it.\n\nPelosi's picks have been so weak all year as the \"full port big tech\" trade stalled.\n\nFeels like she missed the bottlenecks we all found before her. But of course she had grapevine on Leopold, and bottom sniped \n$BE\n before S&P.\n\n\n$VST\n next?","likes":148},{"id":"2096014622453358707","author":"Balder13946731","date":"2026-09-04","zh":"Balder今天也買入$AVGO。","risk":"","s":{"AVGO":"bull"},"text":"今天也买入 \n$AVGO\n 希望不会太迟","likes":4},{"id":"2096027403185479834","author":"Balder13946731","date":"2026-09-05","zh":"Balder提到Burry重押Lululemon虧損，做空$BE也遭重擊。","risk":"","s":{"BE":"bull"},"text":"Michael Bur
