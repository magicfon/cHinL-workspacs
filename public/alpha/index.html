<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Consensus 交易員共識</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F0E8;--dot:#DCD6C8;--card:#FFFDF8;--ink:#1F1D1A;--mut:#6F6A60;--line:#E4DED1;--soft:#F7F3EA;
--bull:#1E8A4C;--bullbg:#EAF5EE;--bear:#C8372D;--bearbg:#FBEDEA;--mix:#7A4FB5;--mixbg:#F2ECFA;--neu:#8A8478;--neubg:#F0EDE6;--acc:#2B2A27;
--serif:"Noto Serif TC",Georgia,"Times New Roman",serif;--sans:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17160F;--dot:#2C2A22;--card:#211F19;--ink:#F1ECE0;--mut:#A39D90;--line:#36332A;--soft:#2A2820;
--bull:#4CC27E;--bullbg:#1B3325;--bear:#F0685C;--bearbg:#3A211D;--mix:#B48CEB;--mixbg:#2D2440;--neu:#A39D90;--neubg:#2C2A23;--acc:#F1ECE0}}
:root[data-theme="dark"]{--bg:#17160F;--dot:#2C2A22;--card:#211F19;--ink:#F1ECE0;--mut:#A39D90;--line:#36332A;--soft:#2A2820;
--bull:#4CC27E;--bullbg:#1B3325;--bear:#F0685C;--bearbg:#3A211D;--mix:#B48CEB;--mixbg:#2D2440;--neu:#A39D90;--neubg:#2C2A23;--acc:#F1ECE0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;color:var(--ink);font:15px/1.6 var(--sans)}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{padding-top:28px;padding-bottom:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
h1{font-family:var(--serif);font-size:34px;line-height:1.2;margin:4px 0 6px}
h2{font-family:var(--serif);font-size:24px;margin:0 0 4px}
h3{font-family:var(--serif);font-size:18px;margin:0 0 6px}
.muted{color:var(--mut)}
.small{font-size:13px}
.disc{font-size:12px;color:var(--mut);margin:6px 0 0}
nav.tabs{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:12px 14px;text-decoration:none;color:var(--mut);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs a.on{color:var(--ink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.sec{margin:22px 0}
.sechd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sechd p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.ai{display:flex;gap:8px;margin:16px 0 0}
.ai input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.btn{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--card);border-color:var(--acc)}
.aiout{margin-top:10px;white-space:pre-wrap;font-size:14px}
.sum{font-size:15px;line-height:1.75}
.sum .lbl{font-size:12px;color:var(--mut);margin-bottom:4px}
/* account cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ac{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s}
.ac:hover{border-color:var(--mut)}
.ac .hd{display:flex;align-items:center;gap:10px}
.ac .nm{font-weight:700}
.ac .hd .ch{margin-left:auto;color:var(--mut);font-size:20px}
.xl{font-size:12px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.type{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--mut)}
.av{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;flex:none;font-size:15px}
.av.s{width:24px;height:24px;font-size:12px}
.row2{display:flex;align-items:flex-start;gap:8px;font-size:13px}
.row2 .k{flex:none;width:44px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.tkc{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:1px 7px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none}
.tkc.bull{color:var(--bull);background:var(--bullbg);border-color:transparent}
.tkc.bear{color:var(--bear);background:var(--bearbg);border-color:transparent}
.tkc.mix{color:var(--mix);background:var(--mixbg);border-color:transparent}
.tkc.neutral{color:var(--mut);background:var(--neubg);border-color:transparent}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;line-height:18px;white-space:nowrap}
.pill.bull{color:var(--bull);background:var(--bullbg)}
.pill.bear{color:var(--bear);background:var(--bearbg)}
.pill.neutral{color:var(--mut);background:var(--neubg)}
.pill.mix{color:var(--mix);background:var(--mixbg)}
/* consensus cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:12px}
.cc{display:flex;padding:0;overflow:hidden}
.cc .lp{width:170px;flex:none;padding:16px;display:flex;flex-direction:column;gap:4px}
.cc.bull .lp{background:var(--bullbg)}.cc.bear .lp{background:var(--bearbg)}.cc.mix .lp{background:var(--mixbg)}
.big{font-family:var(--serif);font-weight:900;font-size:34px;line-height:1.1;letter-spacing:.01em;text-decoration:none}
.cc .co{font-size:12px;color:var(--mut)}
.cc .rl{margin-top:auto;font-size:11px;color:var(--mut)}
.cc .rv{font-size:20px;font-weight:700}
.cc .rp{flex:1;min-width:0;display:flex;flex-direction:column}
.cc .rh{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:700;font-size:14px;flex-wrap:wrap}
.cc .rows{max-height:250px;overflow-y:auto;padding:0 14px}
.pr{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.pr:first-child{border-top:0}
.pr .b{flex:1;min-width:0}
.pr .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700}
.pr .dt{font-weight:400;color:var(--mut);font-size:12px}
.pr .zh{margin-top:2px}
.ol{font-size:12px;color:var(--mut);text-decoration:none;white-space:nowrap}
.ol:hover{color:var(--ink)}
.cc .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);margin-top:auto}
.cc .ft a{color:var(--ink);font-weight:700;text-decoration:none}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--mut);font-size:14px;background:var(--card)}
.daynav{display:flex;align-items:center;gap:8px}
.daynav b{font-family:var(--serif);font-size:18px}
/* monthly */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tc{display:flex;flex-direction:column;gap:6px;cursor:pointer}
.tc .hd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.tc .big{font-size:28px;color:var(--bull)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--mut);text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th[data-sort]{cursor:pointer;user-select:none}
.tbl th[data-sort]:hover{color:var(--ink)}
.tbl th.on{color:var(--ink)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--soft)}
.tk{font-weight:700}
.split{display:flex;align-items:center;gap:6px;min-width:170px}
.split .bar{flex:1;height:8px;border-radius:4px;background:var(--neubg);display:flex;overflow:hidden}
.split .bar i{display:block;height:100%}
.split span{width:34px;font-size:12px}
.tscroll{overflow-x:auto}
/* stock view */
.back{border:0;background:none;color:var(--mut);cursor:pointer;padding:6px 0;font-size:14px}
.sh{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.sh .big{font-size:44px}
.qt{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--card)}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--neubg);margin:10px 0}
.sbar i{display:block;height:100%}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.grp .gl{font-size:12px;color:var(--mut);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.grp .gl i{width:9px;height:9px;border-radius:50%;display:inline-block}
.achip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px 1px 2px;font-size:12px;margin:0 4px 4px 0;background:var(--card);text-decoration:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--soft);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-family:var(--serif);font-size:26px;line-height:1.2}
.kpi span{font-size:12px;color:var(--mut)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.mixbar{display:flex;width:90px;height:8px;border-radius:4px;overflow:hidden;background:var(--neubg);margin-left:auto}
.mixbar i{display:block;height:100%}
.reason{white-space:normal;text-align:left!important;min-width:260px;max-width:440px}
.xrow td{background:var(--soft);text-align:left;white-space:normal}
.xrow .pr{border-color:var(--line)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px}
.cmp .bx{border-radius:10px;padding:10px 12px}
.cmp .bx.b{background:var(--bullbg)}.cmp .bx.r{background:var(--bearbg)}
.inst-row{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:4px 0}
.inst-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0}
.inst-bar i{display:block;height:100%}
.grades{list-style:none;padding:0;margin:4px 0 0;font-size:12px;color:var(--mut)}
.grades li{display:flex;gap:10px;flex-wrap:wrap;padding:3px 0;border-bottom:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
ul.plain{margin:0;padding-left:18px;font-size:14px}
.mx th,.mx td{text-align:center!important}
.mx th:first-child,.mx td:first-child{text-align:left!important;position:sticky;left:0;background:var(--card)}
.mx .dot{color:var(--line)}
.mxtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mxtools input{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;width:180px}
.more{width:100%;margin-top:8px}
footer{padding:30px 0 40px;font-size:12px;color:var(--mut)}
@media (max-width:640px){
 h1{font-size:26px}
 .cgrid{grid-template-columns:1fr}
 .cc{flex-direction:column}
 .cc .lp{width:auto;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
 .cc .rl{margin-top:0;margin-left:auto}
 .big{font-size:28px}
 .sh .big{font-size:36px}
 .grid{grid-template-columns:1fr}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .cmp,.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top wrap">
  <div class="eyebrow">Alpha Consensus</div>
  <h1>X 頂尖交易員共識</h1>
  <div class="muted small" id="stats"></div>
  <p class="disc">整理 X 上公開貼文，只呈現帳號觀點與共識，不是投資建議。綠色代表看多、紅色代表看空。</p>
  <form class="ai" id="aiForm"><input id="aiIn" placeholder="問 AI：例如「哪些人看多 MU？」「Ren 最近看好什麼？」" autocomplete="off"><button class="btn pri" type="submit">提問</button></form>
  <div class="aiout card" id="aiOut" hidden></div>
</header>
<nav class="tabs"><div class="wrap">
  <a href="#accounts" data-tab="accounts">追蹤帳號</a>
  <a href="#daily" data-tab="daily">每日</a>
  <a href="#weekly" data-tab="weekly">每週</a>
  <a href="#monthly" data-tab="monthly">每月</a>
  <a href="#matrix" data-tab="matrix">立場矩陣</a>
</div></nav>
<main class="wrap" id="main"></main>
<footer class="wrap">資料截至 <span id="footAsof"></span>。每天台北時間 09:17 更新。股價來自 Yahoo Finance，機構評等來自 Financial Modeling Prep。</footer>
<script>

quarter q3 2027 ($471m/month), which is $5.6B revenue annualized, (targeting 40%+ gaap gross margins).\n\nAnd they’re a $8B MC…\n\nOr if personal $SIVE CW Win capacity projections are around ~$400m midpoint array revenue off 60% gross margins.\n\nAnd that’s a $1B MC.\n\nJust applying a low 20 fwd p/e might rerate optical names considerably.\n\nEven with other names like $LITE, they’re completely sold out for the next 2 years, and having that sort of demand visibility… Is not a bubble.\n\nEuropeans tend to use TTM to value companies while optical names are 2027-2028 growth stories.","likes":112},{"id":"2078338950150959558","author":"aleabitoreddit","date":"2026-07-18","zh":"SKHY較韓股溢價25%以上，7/29起可轉換，套利可能壓縮ADR溢價。","risk":"ADR溢價可能收斂","s":{"SKHY":"neutral"},"text":"For anyone watching the 25%+ premium in $SKHY versus SK Hynix's Korean shares:\n\nThe ADRs and local shares become convertible on July 29.\n\nShould open the door for arbitrage and likely compress the ADR premium. Maybe lifting Korean shares or pressuring US shares.\n\n2.5% currently is the US ADR stock, so an additional 22.5% can be converted.","likes":714},{"id":"2078341955411738744","author":"aleabitoreddit","date":"2026-07-18","zh":"解釋SKHY美國ADR溢價20-50%，7/29開放轉換後套利可能使溢價收斂。","risk":"ADR溢價可能收斂","s":{"SKHY":"neutral"},"text":"@chengchushow - Sk Hynix mainly traded in Korea\n- $SKHY lists in the US with limited shares, ~2.5% of the float (this is called ADR)\n- Even though SK Hynix are the same company, the shares trade independently.\n- Sk Hynix US traded at a 20-50% premium to SK Hynix Korean listing due to limited supply, but lot of US demand.\n-> ADRs allow for conversion between Korea Shares to US Shares, and conversion will start on the 29th\n- If you convert 22.5% of the Korean supply to the US, that 20-50% premium is likely to go down\n\neg. If there's limited mangos, and someone pays $3 for mangos.\n\nYou buy the same mango for $1. You keep buying those $1 mangos and selling for $3 until the mangos pricing converge. That's called arbitrage and what likely traders would do.","likes":105},{"id":"2079089592385610023","author":"aleabitoreddit","date":"2026-07-20","zh":"整理ABF載板、HDI、CCL、MLCC等瓶頸交期（6個月至1年以上）及相關公司，含TTMI、VSH。","risk":"","s":{"TTMI":"neutral","VSH":"neutral"},"text":"Some updates on bottleneck timelines:\n\n- ABF substrates: 1 year\n/ eg. Ajinomoto (2802) for ABF film, Ibiden, Unimicron, Nan Ya PCB, etc make the substrates\n\n- HDI Boards: Over 6 months\n/ Victory Giant (300476), Zhen Ding (4958), Unimicron, Compeq (2313), Meiko (6787)\n\n- Multilayer boards: ~6 months\n/ Victory Giant, WUS (002463), $TTMI, Gold Circuit Electronics (2368),\n\n- CCL: Over 6 months (severe shortages of materials)\n/ Elite Material (2383), Shengyi (600183), TUC (6274), ITEQ (6213), Nan Ya Plastics (1303), Resonac (4004)\nMitsui Kinzoku (5706) / HVLP copper foil.  Nittobo / glass fiber/cloth\n\n- MLCCs, chip resistors, tantalum capacitors, aluminum electrolytic capacitors: 15-20 weeks to 1 year+\n\nMLCC: Murata (6981), Samsung Electro-Mechanics, TDK (6762), Taiyo Yuden (6976), Yageo (2327), Walsin (2492)\nChip Resistors: Yageo, Walsin, KOA (6999), Rohm (6963) and $VSH\nTantalum capacitors: Kyocera/AVX, Yageo/KEMET, $VSH again\n\nAluminum electrolytic capacitors: Nippon Chemi-Con (6997) Nichicon (6996) | Timelines sourced from Digitimes, did the honors of adding in related companies.\n\nBut it's slightly more nuanced since MLCCs and others mix. in commodity types vs. AI DCs.\n\nRegardless, ","likes":638},{"id":"2079254669793316962","author":"aleabitoreddit","date":"2026-07-20","zh":"IREN上修ARR目標大漲19.7%，HUT獲98億美元租約，Neocloud/託管族群因新催化劑強力反彈。","risk":"","s":{"CIFR":"neutral","CLSK":"neutral","CRWV":"neutral","HUT":"bull","IREN":"bull","NBIS":"neutral","WYFI":"neutral"},"text":"$IREN +19.69% after revising ARR target to $4B+ from new AI cloud contracts. Its customer base now includes Microsoft, Nvidia, Perplexity, and Figure.\n\n$HUT +10.45% off a 15Y $9.8B AI DC lease\n\n$CIFR +16.76%\n$CLSK +13.7%\n$WYFI +9.18%\n\n$NBIS and $CRWV are taking their time in the shower.\n\nBut does look like Neoclouds/Colo players are sharply recovering following new catalysts, such as Kimi compute shortage news and new contracts.","likes":1327},{"id":"2079319999915925938","author":"aleabitoreddit","date":"2026-07-20","zh":"NVDA揭露持有Nebius 9.3%，雖非新消息，但對NBIS情緒大有助益。","risk":"","s":{"NBIS":"bull","NVDA":"neutral"},"text":"If you’re curious why $NBIS is up after hours.\n\n$NVDA disclosed it owns 9.3% beneficial ownership of Nebius via SEC filings.\n\nNot exactly too new since it dates back to Nvidia’s existing share position of 1.19M shares + $2B prefunded warrant of ~21M shares.\n\nBut great for sentiment having Nvidia be a large shareholder of the Neocloud leader.","likes":1097},{"id":"2079479755481776221","author":"aleabitoreddit","date":"2026-07-21","zh":"記憶體、光網路、Neocloud與半導體普遍反彈4%以上。","risk":"","s":{"AAOI":"neutral","AMD":"neutral","INTC":"neutral","IREN":"neutral","LITE":"neutral","MRVL":"neutral","NBIS":"neutral","SIVE":"neutral"},"text":"Memory names from Kioxia finished up a whopping +17.18%. Samsung up +6.15%.\n\nOptical networking from $SIVE, $LITE, and $AAOI are showing signs of recovery, all up 4%+.\n\nNeoclouds from $NBIS to $IREN all up 4%+ premarket.\n\n$INTC to $AMD to $MRVL all up 4%+.\n\nDoes the Cramer effect work on the entire AI trade?","likes":2070},{"id":"2079495178793201678","author":"aleabitoreddit","date":"2026-07-21","zh":"AMD活動可能揭露CPO路線圖，若經Ayar或GF SCALE採用CPO，對上游雷射商SIVE極為正面。","risk":"","s":{"ALAB":"neutral","AMD":"neutral","AVGO":"neutral","GFS":"neutral","NVDA":"neutral","SIVE":"neutral"},"text":"It's slightly more nuanced. Basically, $AMD SF event is tomorrow, Wed/Thurs (July 22, 23).\n\nFrom Jefferies client note, AMD is expected to provide additional disclosures around their likely scale-up CPO roadmap + MI500.\n\nIf they confirm CPO route, would positive thematically since it's not just $NVDA forcing the transition.\n\nAs for $SIVE, we'll -22","zh":"AMD投資50億美元於Anthropic，後者將簽2GW晶片採購，仿效NVDA模式。","risk":"","s":{"AMD":"bull","NVDA":"neutral"},"text":"$AMD to invest $5B in Anthropic.\n\nAnthropic in turn will sign a 2 GW deal to buy AMD’s latest chips, worth tens of billions of dollars.\n\nLooks like they’re copying the $NVDA playbook with Anthropic last year. https://t.co/SXBUq65u6P","likes":1014},{"id":"2079953508904964575","author":"aleabitoreddit","date":"2026-07-22","zh":"將參加AMD活動，一定會詢問關於SIVE的事。","risk":"","s":{"AMD":"neutral","SIVE":"neutral"},"text":"@gaetan_po Yeah, I’m testing some things right now for bot prevention.\n\nAlso going to $AMD event tomorrow rather than full 2 days, will definitely be asking about $SIVE!","likes":318},{"id":"2080027058063958323","author":"aleabitoreddit","date":"2026-07-22","zh":"GOOGL財報雲端營收年增82%大幅超預期且利潤率擴張，對AI需求與LITE等光學族群是利多。","risk":"","s":{"GOOGL":"bull","LITE":"bull","SPCX":"neutral"},"text":"$GOOGL reported earnings today:\n\nEPS: $9.11 actual vs $2.91 expected - retail reactions to EPS blowout is kinda just accounting noise, since $SPCX, Anthropic, and others were likely large contributors.\n\nRevenue: $119.7B actual vs. $116.98B expected\n\nGoogle Cloud Revenue: $24.77B +82% Y/Y, vs. 63-65% expected ($22.2-$22.6B) - this is a very large beat and most material part so far.\n\nCloud Operating Income: ~$8.81B, implying 35.6% margin vs. 32.9% Q1.\n\nCapex: $44.92B vs ~$44.15B (basically in line).\n\nSo initial read through is Google Cloud accelerating growth with expanding margins is genuinely bullish for AI demand.\n\nTheir former $180-$190B capex guidance is already extremely large, and as long as we get around these numbers in the earnings call + forward projections...\n\nShould be good to go for $LITE and the other optics/networking trade. (eg. last earnings, they said DC and networking would be ~40% of capex spend).\n\nHyperscaler earnings transcripts are probably the most important thing to pay attention to with the AI capex trade.\n\nAnd that should be in 3 minutes.","likes":1447},{"id":"2080031508656746874","author":"aleabitoreddit","date":"2026-07-22","zh":"Gemini月活達9.5億，數月增2億，解釋為何算力不足並削減對Meta配額，AI資本支出難放緩。","risk":"","s":{"GOOGL":"bull","META":"neutral"},"text":"$GOOGL now has 950M monthly Gemini users and processes 22B API tokens/min.\n\nCompared to 750M back in February.\n\nAbsurd growth adding 200 million more users in a few months.  Kinda explains why they ran out of compute, then cut allocations to $META and others.\n\nVery unlikely AI capex will slow down given.","likes":1295},{"id":"2080032221638119603","author":"aleabitoreddit","date":"2026-07-22","zh":"調侃GOOGL股價僅下跌0.079%。","risk":"","s":{"GOOGL":"neutral"},"text":"@4intheflames $GOOGL stock down a solid -.079%. https://t.co/lN3g2KcJZy","likes":68},{"id":"2080035769062916479","author":"aleabitoreddit","date":"2026-07-22","zh":"GOOGL上調2026資本支出指引至1950-2050億美元，是對上游半導體最利多的訊號。","risk":"","s":{"GOOGL":"neutral"},"text":"$GOOGL updates FY 2026 capex guidance:\n\nTo $195B-$205B. Up from $180B-$190B.\n\nGoogle is also expected to significantly increase capex in 2027.\n\nThis is perhaps the most bullish read through on upstream semis from a hyperscaler. https://t.co/dXiI0Ien8X","likes":1652},{"id":"2080042335388500360","author":"aleabitoreddit","date":"2026-07-22","zh":"AI資本支出流向上游半導體是利多，GOOGL自身花錢市場未必喜歡。","risk":"","s":{"GOOGL":"neutral"},"text":"@haranguetan_ Having an iota of reading comphrension helps a bit before commenting.\n\nAI Capex -> goes to upstream semis from memory, photonics, foundries, and others. These players are happy.\n\n$GOOGL itself is spending the money, so markets might not like that for them in specific.\n\nBut it's positive to the players that receive that capital.","likes":185},{"id":"2080149813065396454","author":"aleabitoreddit","date":"2026-07-23","zh":"整理特斯拉財報：馬斯克稱Optimus將是史上最大產品，特斯拉為美國人形機器人領導者，並讚美光給予合理記憶體配額。","risk":"","s":{"MU":"bull","TSLA":"bull","TSM":"neutral"},"text":"Just some notes from $TSLA transcripts:\n\nElon Musk: \"I think Optimus will be the biggest product ever\" from Q2 earnings transcripts.\n\nEven from Q1, Elon Stated: \"I think Optimus will be our biggest product. Not just Tesla's biggest product ever, but probably the biggest product ever.\n\nAnd I remain convinced of that conclusion\".\n\nIt's very rare to see such high conviction reiterated from Elon regarding humanoids both directionally and TAM-wise.\n\nIn terms of upstream suppliers opportunities, Karn Budhiraj, VP of $TSLA supply chains stated:\n\n\"We’re seeing the same level of investment going to memory and also new specific items like metal injection molded parts, flexible printed circuits, and all sorts of nonlinear technologies...\"\n\nAnd that they had to build new supply chains from scratch. So would be interesting to look at for new supply chain supplier opportunities apart from the known ones.\n\nJust pulled older slides and it looks like capacity targets for Fremont are 1M and Giga Texas was 10M, so at scale, $TSLA seems to be the clear US leader. If you're looking at that S-Curve opportunity ramp.\n\nOn a side note, Elon also gave a shoutout to $MU with likely reasonably priced LTAs, gi","likes":1687},{"id":"2080153334888182065","author":"aleabitoreddit","date":"2026-07-23","zh":"INTC與AMD將與中國客戶簽CPU長約，記憶體與光通訊也陸續簽LTA，認為瓶頸投資者受惠、難以泡沫破裂。","risk":"","s":{"AMD":"bull","COHR":"bull","INTC":"bull","LITE":"bull","MU":"bull","SNDK":"bull"},"text":"$INTC and $AMD to sign CPU LTAs with Chinese customers for AI DCs (Reuters).\n\n- Prices of some CPU products have risen more than 40% in China since the start of the year from sources.\n\n- Month-on-month increases topping 10% for some products\n\nCPUs were already a bottleneck, following CPU ratios due to AI inference...\n\nBut the broader trend of LTAs seems to be appearing from:\n\n- Memory, with $MU, Samsung, $SNDK, and SK Hynix signing DRAM/NAND LTAs.\n\n- Photonics, with $LITE, $COHR signing EML LTAs. And recent Trendforce reports that $AMD and hyperscalers are now pursuing CW LTAs.\n\nAnd I'm sure there's many more from MLCCs to all the way to substrates.\n\n+1 for the bottleneck investors... hard to be a \"bubble that pops\" if you have take or pay demand spanning multiple years.","likes":1118},{"id":"2080334612807758136","author":"aleabitoreddit","date":"2026-07-23","zh":"對AMD執行長Lisa與AI開玩笑，並表示很高興在活動上見到粉絲。","risk":"","s":{"AMD":"neutral"},"text":"I have this feeling that Lisa from $AMD likes AI.\n\nIt’s cool getting to meet some of you at the event! https://t.co/AWdGS349xF","likes":1440},{"id":"2080379612736221325","author":"aleabitoreddit","date":"2026-07-23","zh":"AMD送來限量30條的特製頭巾，笑稱現在愛上AMD與Lisa Su。","risk":"","s":{"AMD":"neutral"},"text":"$AMD reached out directly to hand me some special swag!\n\nApparently they only made 30 of these bandanas?\n\nI love AMD and Lisa Su now. https://t.co/KgcYjBUcTv","likes":1543},{"id":"2080380170779898186","author":"aleabitoreddit","date":"2026-07-23","zh":"感謝AMD社群團隊，調侃Lisa的頭巾可能比晶片賣得更快。","risk":"","s":{"AMD":"neutral"},"text":"@beauty_oe Special shoutout to the super cool social media team at $AMD!\n\nLisa does make cool bandanas, probably would sell out faster than their CPUs/accelerators. https://t.co/tY7VRyOnC9","likes":137},{"id":"2080394259535221222","author":"aleabitoreddit","date":"2026-07-23","zh":"AMD活動通路調查：合作夥伴預期AMD未來Helios採CPO，業者未見CPO供應鏈延遲。","risk":"","s":{"AMD":"neutral"},"text":"From $AMD Advancing AI, channel checks:\n\nHelios networking partners told me they expect AMD to pursue CPO for future generations of Helios scale up networking.\n\nAnd expects other hyperscalers + industry to go down the CPO route.\n\nOne AI infra executive at a company involved in a hyperscaler CPO programs said they had seen no indication of CPO scale up supply chain delays.\n\nPushing back on recent 3rd party delay reports.\n\nThis was informal commentary, not official AMD or partner guidance.","likes":581},{"id":"2080411863448522994","author":"aleabitoreddit","date":"2026-07-23","zh":"活動通路調查對CPO族群非常正面，SI as \"readiness\" for EOY 2026.\n\nBut $POET upgraded that wording, by stating \"production\" with Sivers lasers projected EOY 2026.\n\nSo a volume orders from across $JBL to $POET, should hit in H1 2027. Which makes a bit of sense, since Sivers did raise an institutional oversubscribed round for future mass production.\n\nOn a side note, can't believe it's already August and 5 months left until 2027... Which was my inflection window for glass substrates, CPO, 800v, and new architectures to ramp.","likes":1003},{"id":"2083133191112843575","author":"aleabitoreddit","date":"2026-07-31","zh":"本週重點：四大雲端稱算力需求遠超供給，Warsh稱不升息，媒體泡沫論與實際相反。","risk":"","s":{"AMZN":"neutral","GOOGL":"neutral","META":"neutral","MSFT":"neutral"},"text":"Just a TLDR of this week:\n\nMedia: Hyperscalers overbuilt and are selling excess compute.\n-> $GOOGL, $MSFT, $META, and $AMZN: Demand for compute far exceeds capacity. Capex go brrr.\n\nInstitutions: Emergency rate hike or 3x rate hikes, it's all over.\n-> Kevin Warsh: No rate Hike.\n\nRetail/Media: AI is crashing because it's a bubble.\n-> Citadel looking to buy AI leveraged hedge funds positions: 👀\n\nJim Cramer: Sell all your leveraged DC stocks.\n-> Koreans: SK Hynix +30%, Samsung +26.81%","likes":1660},{"id":"2083225872207937687","author":"aleabitoreddit","date":"2026-07-31","zh":"RDDT財報營收、EPS及指引皆超預期，市場卻用DAU微降等新說法解釋下跌。","risk":"DAU小幅下滑","s":{"RDDT":"bull"},"text":"$RDDT ER in a nutshell:\n\nRevenue: $804.9M vs. $730.4M (expected).\nEPS: $1.25 vs. ~$0.95.\nNet income: $252.8M vs. $196.5M\n\nQ3 guidance:\nRevenue: $860–870M vs. 829.1M\nAdjusted EBITDA: $385-395M vs. $369M\n\nBlowout financials, market always like to explain the drop 22.6% off some new BS narrative.\n\nLast quarter: \"AI will disrupt Reddit causing revenue loss!\"\n\nThis quarter: \"See, DAU fell .6%!\" (proceeds to ignore any revenue/profitability growth)","likes":1193},{"id":"2083227149696458929","author":"aleabitoreddit","date":"2026-07-31","zh":"RDDT財務指標大幅超預期並上調指引，對其下跌22.6%感到意外。","risk":"","s":{"RDDT":"bull"},"text":"@tax_evader666 US DAU*, they beat heavily on financial metrics and raised forward guidance above street expectations.\n\nBut people like to make up some narrative every time something drops.\n\n-22.6% selloff on $RDDT is very surprising to me.","likes":92},{"id":"2083232591176753262","author":"aleabitoreddit","date":"2026-07-31","zh":"認同RDDT下跌22.61%反應過度，其變現策略奏效，AI授權也勢在必行。","risk":"","s":{"RDDT":"bull"},"text":"@amitisinvesting Agreed on $RDDT, the -22.61% reaction seems overblown to me off those earnings/projections. Their monetization strategy seem to be working wonders.\n\nAI licensing seems inevitable as well given your frontier labs always want more data. Was one of the more confusing selloffs.","likes":216},{"id":"2083266788788428889","author":"aleabitoreddit","date":"2026-07-31","zh":"開玩笑稱Citadel要施展魔法才能清算他那1股IREN。","risk":"","s":{"IREN":"neutral"},"text":"@SammyJ51 Kenneth will need to do some magic to liquidate me of my 1 $IREN share.","likes":44},{"id":"2083270545320386734","author":"aleabitoreddit","date":"2026-07-31","zh":"四大雲端業者2026年資本支出上調至約7200–7450億美元，認為中長期難以看空上游半導體與新雲端。","risk":"","s":{"AMZN":"neutral","GOOGL":"neutral","META":"neutral","MSFT":"neutral","NVDA":"neutral"},"text":"As a earnings recap: $AMZN, $META, $GOOGL, and $MSFT guided a 2026 combined capex forecast to ~$720-$745 Billion.\n\nUp from $695-$725B Billion previously.\n\nAmazon: $220B\nGoogle: $195B-$205B\nMeta: $130B-$145B\nMicrosoft: $175B\n\nWe've already seen significant deleveraging and retail/institutional margin liquidations (maybe it continues for more time, who knows).\n\nBut medium-long term, I'm not quite sure how anyone can be bearish the upstream semis or neoclouds.\n\nGiven each hyperscaler has flagged either compute shortages, rising cloud demand + pricing power, or increased spending for chips/networking.\n\nMy \"bottleneck\" thesis with many of these upstream semi supply chains is that when trillions in capital flows into things from InP substrates or memory (which were both treated as cheap commodities) or even energy.\n\nLot of these current AI names that were treated as useless before in telecom cycles or even toilet sellers.\n\nGets rerated when their inflection period hits and capex flows into their balance sheets.\n\nAs seen with $NVDA GPUs past few years, memory this year, CPUs/MLCCs next few years, CPO in 2027, Glass Substrates in 2027, 800V in 2027, and so on.","likes":688},{"id":"2083274448845906083","author":"aleabitoreddit","date":"2026-07-31","zh":"作者逢低加碼AMKR、LPK、XFAB等，最看好SIVE與AAOI，並關注CCXI機會；僅為資金調配。","risk":"LPK放量因Absolics延後一季","s":{"AAOI":"bull","AMKR":"bull","CCXI":"bull","FORM":"neutral","LPK":"bull","NVDA":"neutral","SIVE":"bull","SPCX":"neutral","TSM":"neutral","XFAB":"bull"},"text":"@RockyKh49376975 Hmm, I personally added $AMKR in the $40's since I thought it was surprising it dropped that much after ER, even after $NVDA $1.5B deal + $TSM 10Y agreement.\n\nIt's more of a 2028 name though, though they have separate ramps in 2027.\n\n- Did some cost averaging on names like Foci on drop to 400 (leading FAU supplier to $TSM COUPE + $NVDA, COUPE shows signs of ramp now from other ERs like $FORM).  Added some $XFAB too after earnings since they verified CPO + 800V exposure, might be a bit of waiting though.\n\nAdded $LPK on the 13 EU doomdrop, GCS isn't going anywhere, think volume ramp just got delayed a quarter because of Absolics delay and I'm fine waiting 3 months. CoPoS, Samsung, and others should drive demand more in 2027.\n\nAnd added OE Solutions on drop to ~14,000 KRW, thought it was strange Korea's leading EML company with independent InP fabs was only worth ~$110M MC.\n\n-  Names like Win Semi + others are really really compelling to me but just dont have enough capital to add sadly without going on heavy margin.\n\nProbably want to scale into $SIVE and $AAOI more since those are my two favorites.\n\nAnd looking at $CCXI opportunities given Unitree IPO is around 3 wee","likes":110},{"id":"2083275502517948801","author":"aleabitoreddit","date":"2026-07-31","zh":"認同Leopold推理論點，作者曾布局新雲端，後轉向上游瓶頸；預期BE、TE、SHAZ、IREN將跑贏大盤。","risk":"","s":{"BE":"bull","CIFR":"neutral","IREN":"bull","NBIS":"neutral","SHAZ":"bull","TE":"bull","WULF":"neutral"},"text":"@Schulz_Research Situational Awareness / Leopold was completely right in terms of US shifting more toward inference + large energy demand.\n\nI had a similar thesis with Neoclouds like $IREN, $NBIS, $CIFR, $WULF, and others last year in 2025.\n\nBut shifted more towards upstream bottlenecks + networking personally. It's just a little unfortunate the fund couldn't fully survive the drawdown.\n\nWe did overlap in memory concentration but energy/grid from $BE, $TE, or neoclouds like $SHAZ / $IREN but I'd expect them to outperform given compute/capacity shortages.","likes":79},{"id":"2083282302453571849","author":"aleabitoreddit","date":"2026-07-31","zh":"亞洲CPO股因延遲報導重挫，但作者渠道查核認為報導錯誤；看法不變，AAOI、SIVE等將較早放量。","risk":"市場對時程定價延後","s":{"AAOI":"bull","AMD":"neutral","FORM":"neutral","SIVE":"bull"},"text":"@Erick_P23 Thesis is more for CPO scale up expecting complexity making make MSSCorp a monopoly-type chokepoint over inspection yields (they were claiming 90% market share target). Although they can be used for other segments.\n\n$FORM ramped a lot earlier, so maybe will revenue would start to appear in next earnings?\n\nRegardless, Asian names sold off extremely hard on CPO timeline delay report that I found to be incorrect with my channel checks at the $AMD conference.\n\nDon't think my views have changed, it's moreso waiting for 2027.\n\nNames with more confirmed scale-out switch volumes like Shunsin + laser names like $AAOI / $SIVE ramp a lot earlier. It's just timelines in my view and when markets want to price that in.","likes":52},{"id":"2083324920214536208","author":"aleabitoreddit","date":"2026-07-31","zh":"批評媒體將Leopold形容為失敗，其年初至今仍+80%，認為是他人眼紅。","risk":"","s":{"BE":"neutral","SNDK":"neutral"},"text":"The media framing and X reactions around Leopold are egregious.\n\nFraming his successful multi-year thesis from $SNDK to $BE as a \"collapse\" or \"failure\".\n\nAfter July's surprising crash, then personally attacking him on top is just pathetic to witness.\n\nIt's almost like everyone is cheering for the downfall of others.\n\nYes, July's crash exposed problems with SA’s leverage, liquidity management, and hedging.\n\nBut his current YTD performance remains +80%, ranking among the best performing hedge funds. And he still has public equities after all this (just removed leverage).\n\nI think he's doing something unique while being successful at it. And this draws the envy of others.","likes":1176},{"id":"2083329679822671917","author":"aleabitoreddit","date":"2026-07-31","zh":"認為Leopold在SNDK、BE的想法即使沒有散戶跟單也會實現，貶低為散戶抄單並不公平。","risk":"","s":{"BE":"neutral","SNDK":"neutral"},"text":"@optionsreaper His ideas would have played out anyway with $SNDK or $BE even without anyone from retail knowing he existed.\n\nRetail wouldn't have changed a thing with NAND shortages or hyperscaler demand for Bloom.\n\nDownplaying that to just retail copying him is also terrible.","likes":40},{"id":"2083438823548293140","author":"aleabitoreddit","date":"2026-08-01","zh":"LITE執行長警告AI用InP雷射供應缺口比記憶體更嚴重，作者雷射瓶頸論點獲驗證。","risk":"","s":{"AAOI":"bull","COHR":"bull","LITE":"bull","SIVE":"bull"},"text":"$LITE CEO Michael Hurlston at the RAISE Summit warned that the supply gap for InP lasers for AI DCs:\n\nIs facing a more severe supply chain crisis than memory.\n\nAnd with Lumentum's 5 InP fabs, shipments would be more than 30%+ below customer demand.\n\nThis is especially visible with EMLs today but is already expanding to CW, especially as CPO ramps.\n\nI've always been a fan of the laser chokepoint + bottleneck from $AAOI, $SIVE, $LITE, and $COHR. And glad this thesis is starting to see validation.","likes":1481},{"id":"2084468063228060092","author":"aleabitoreddit","date":"2026-08-04","zh":"DRAM/HBM 2027年產能已售罄，NAND也售罄，客戶僅獲60–70%配額，質疑2027供過於求說法。","risk":"","s":{"MU":"bull","SNDK":"bull"},"text":"SK Hynix, $MU , and Samsung have sold out of 2027 capacity for DRAM/HBM.\n\n$SNDK, Samsung, Micron current annual NAND capacity has been sold out, with Kioxia and SK Hynix expected to finalize allocations by August 2026.\n\n- Customers are being allocated only 60–70% of the volumes they initially requested\n\n- industry insiders pointed out that 2027 will enter the most severe moment of memory shortage\n\n- Allocation amounts are mostly decided, but final shipment pricing will be determined closer to delivery\n\nSource: Digitimes, citing industry sources.\n\nHard to see those memory \"oversupply\" claims in early-mid 2027 when they're all sold out of capacity already.","likes":3161},{"id":"2084597612175618342","author":"aleabitoreddit","date":"2026-08-04","zh":"川普政府擬禁止中國新光收發器，將利好AAOI、SIVE、LITE等西方光通訊供應鏈。","risk":"","s":{"AAOI":"bull","LITE":"bull","SIVE":"bull"},"text":"A very material catalyst came about for Western supply chains from $AAOI, $SIVE / Jabil, to $LITE and Coherent:\n\nThe Trump administration is drafting a ban of new Chinese optical transceivers and DC devices.\n\nWhich would likely hit China’s Innolight, Eoptolink, and other Chinese optical interconnect supply chains.\n\n\"The agency would ban all imports of new transceiver models ​and then exempt many ⁠non-Chinese suppliers from the restrictions\"\n\nWe'll likely see a larger bifurcation of supply chains with even greater importance put on Western players.","likes":2363},{"id":"2084783049133482154","author":"aleabitoreddit","date":"2026-08-04","zh":"認為AXTI太上游不會被美國出口管制，但可能被用作報復工具。","risk":"可能遭用於報復性管制","s":{"AXTI":"neutral"},"text":"@R_o_LwSzr $AXTI is too far upstream. I definitely do not see them going to be export controlled by the US.\n\nBut they could be used in retaliation, we’ll see.","likes":29},{"id":"2084795597417263442","author":"aleabitoreddit","date":"2026-08-05","zh":"RKLB獲美國太空軍3.97億
