<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Consensus 交易員共識</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F0E8;--dot:#DCD6C8;--card:#FFFDF8;--ink:#1F1D1A;--mut:#6F6A60;--line:#E4DED1;--soft:#F7F3EA;
--bull:#1E8A4C;--bullbg:#EAF5EE;--bear:#C8372D;--bearbg:#FBEDEA;--mix:#7A4FB5;--mixbg:#F2ECFA;--neu:#8A8478;--neubg:#F0EDE6;--acc:#2B2A27;
--serif:"Noto Serif TC",Georgia,"Times New Roman",serif;--sans:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17160F;--dot:#2C2A22;--card:#211F19;--ink:#F1ECE0;--mut:#A39D90;--line:#36332A;--soft:#2A2820;
--bull:#4CC27E;--bullbg:#1B3325;--bear:#F0685C;--bearbg:#3A211D;--mix:#B48CEB;--mixbg:#2D2440;--neu:#A39D90;--neubg:#2C2A23;--acc:#F1ECE0}}
:root[data-theme="dark"]{--bg:#17160F;--dot:#2C2A22;--card:#211F19;--ink:#F1ECE0;--mut:#A39D90;--line:#36332A;--soft:#2A2820;
--bull:#4CC27E;--bullbg:#1B3325;--bear:#F0685C;--bearbg:#3A211D;--mix:#B48CEB;--mixbg:#2D2440;--neu:#A39D90;--neubg:#2C2A23;--acc:#F1ECE0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;color:var(--ink);font:15px/1.6 var(--sans)}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{padding-top:28px;padding-bottom:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
h1{font-family:var(--serif);font-size:34px;line-height:1.2;margin:4px 0 6px}
h2{font-family:var(--serif);font-size:24px;margin:0 0 4px}
h3{font-family:var(--serif);font-size:18px;margin:0 0 6px}
.muted{color:var(--mut)}
.small{font-size:13px}
.disc{font-size:12px;color:var(--mut);margin:6px 0 0}
nav.tabs{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:12px 14px;text-decoration:none;color:var(--mut);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs a.on{color:var(--ink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.sec{margin:22px 0}
.sechd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sechd p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.ai{display:flex;gap:8px;margin:16px 0 0}
.ai input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.btn{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--card);border-color:var(--acc)}
.aiout{margin-top:10px;white-space:pre-wrap;font-size:14px}
.sum{font-size:15px;line-height:1.75}
.sum .lbl{font-size:12px;color:var(--mut);margin-bottom:4px}
/* account cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ac{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s}
.ac:hover{border-color:var(--mut)}
.ac .hd{display:flex;align-items:center;gap:10px}
.ac .nm{font-weight:700}
.ac .hd .ch{margin-left:auto;color:var(--mut);font-size:20px}
.xl{font-size:12px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.type{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--mut)}
.av{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;flex:none;font-size:15px}
.av.s{width:24px;height:24px;font-size:12px}
.row2{display:flex;align-items:flex-start;gap:8px;font-size:13px}
.row2 .k{flex:none;width:44px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.tkc{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:1px 7px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none}
.tkc.bull{color:var(--bull);background:var(--bullbg);border-color:transparent}
.tkc.bear{color:var(--bear);background:var(--bearbg);border-color:transparent}
.tkc.mix{color:var(--mix);background:var(--mixbg);border-color:transparent}
.tkc.neutral{color:var(--mut);background:var(--neubg);border-color:transparent}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;line-height:18px;white-space:nowrap}
.pill.bull{color:var(--bull);background:var(--bullbg)}
.pill.bear{color:var(--bear);background:var(--bearbg)}
.pill.neutral{color:var(--mut);background:var(--neubg)}
.pill.mix{color:var(--mix);background:var(--mixbg)}
/* consensus cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:12px}
.cc{display:flex;padding:0;overflow:hidden}
.cc .lp{width:170px;flex:none;padding:16px;display:flex;flex-direction:column;gap:4px}
.cc.bull .lp{background:var(--bullbg)}.cc.bear .lp{background:var(--bearbg)}.cc.mix .lp{background:var(--mixbg)}
.big{font-family:var(--serif);font-weight:900;font-size:34px;line-height:1.1;letter-spacing:.01em;text-decoration:none}
.cc .co{font-size:12px;color:var(--mut)}
.cc .rl{margin-top:auto;font-size:11px;color:var(--mut)}
.cc .rv{font-size:20px;font-weight:700}
.cc .rp{flex:1;min-width:0;display:flex;flex-direction:column}
.cc .rh{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:700;font-size:14px;flex-wrap:wrap}
.cc .rows{max-height:250px;overflow-y:auto;padding:0 14px}
.pr{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.pr:first-child{border-top:0}
.pr .b{flex:1;min-width:0}
.pr .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700}
.pr .dt{font-weight:400;color:var(--mut);font-size:12px}
.pr .zh{margin-top:2px}
.ol{font-size:12px;color:var(--mut);text-decoration:none;white-space:nowrap}
.ol:hover{color:var(--ink)}
.cc .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);margin-top:auto}
.cc .ft a{color:var(--ink);font-weight:700;text-decoration:none}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--mut);font-size:14px;background:var(--card)}
.daynav{display:flex;align-items:center;gap:8px}
.daynav b{font-family:var(--serif);font-size:18px}
/* monthly */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tc{display:flex;flex-direction:column;gap:6px;cursor:pointer}
.tc .hd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.tc .big{font-size:28px;color:var(--bull)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--mut);text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th[data-sort]{cursor:pointer;user-select:none}
.tbl th[data-sort]:hover{color:var(--ink)}
.tbl th.on{color:var(--ink)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--soft)}
.tk{font-weight:700}
.split{display:flex;align-items:center;gap:6px;min-width:170px}
.split .bar{flex:1;height:8px;border-radius:4px;background:var(--neubg);display:flex;overflow:hidden}
.split .bar i{display:block;height:100%}
.split span{width:34px;font-size:12px}
.tscroll{overflow-x:auto}
/* stock view */
.back{border:0;background:none;color:var(--mut);cursor:pointer;padding:6px 0;font-size:14px}
.sh{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.sh .big{font-size:44px}
.qt{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--card)}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--neubg);margin:10px 0}
.sbar i{display:block;height:100%}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.grp .gl{font-size:12px;color:var(--mut);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.grp .gl i{width:9px;height:9px;border-radius:50%;display:inline-block}
.achip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px 1px 2px;font-size:12px;margin:0 4px 4px 0;background:var(--card);text-decoration:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--soft);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-family:var(--serif);font-size:26px;line-height:1.2}
.kpi span{font-size:12px;color:var(--mut)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.mixbar{display:flex;width:90px;height:8px;border-radius:4px;overflow:hidden;background:var(--neubg);margin-left:auto}
.mixbar i{display:block;height:100%}
.reason{white-space:normal;text-align:left!important;min-width:260px;max-width:440px}
.xrow td{background:var(--soft);text-align:left;white-space:normal}
.xrow .pr{border-color:var(--line)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px}
.cmp .bx{border-radius:10px;padding:10px 12px}
.cmp .bx.b{background:var(--bullbg)}.cmp .bx.r{background:var(--bearbg)}
.inst-row{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:4px 0}
.inst-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0}
.inst-bar i{display:block;height:100%}
.grades{list-style:none;padding:0;margin:4px 0 0;font-size:12px;color:var(--mut)}
.grades li{display:flex;gap:10px;flex-wrap:wrap;padding:3px 0;border-bottom:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
ul.plain{margin:0;padding-left:18px;font-size:14px}
.mx th,.mx td{text-align:center!important}
.mx th:first-child,.mx td:first-child{text-align:left!important;position:sticky;left:0;background:var(--card)}
.mx .dot{color:var(--line)}
.mxtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mxtools input{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;width:180px}
.more{width:100%;margin-top:8px}
.tvrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
footer{padding:30px 0 40px;font-size:12px;color:var(--mut)}
@media (max-width:640px){
 h1{font-size:26px}
 .cgrid{grid-template-columns:1fr}
 .cc{flex-direction:column}
 .cc .lp{width:auto;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
 .cc .rl{margin-top:0;margin-left:auto}
 .big{font-size:28px}
 .sh .big{font-size:36px}
 .grid{grid-template-columns:1fr}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .cmp,.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top wrap">
  <div class="eyebrow">Alpha Consensus</div>
  <h1>X 頂尖交易員共識</h1>
  <div class="muted small" id="stats"></div>
  <div class="tvrow"><button class="btn" type="button" id="tvBtn">匯出 TradingView 自選清單</button><span class="muted small" id="tvMsg">下載 .txt 後，在 TradingView 自選清單選單按「匯入清單」。</span></div>
  <p class="disc">整理 X 上公開貼文，只呈現帳號觀點與共識，不是投資建議。綠色代表看多、紅色代表看空。</p>
  <form class="ai" id="aiForm"><input id="aiIn" placeholder="問 AI：例如「哪些人看多 MU？」「Ren 最近看好什麼？」" autocomplete="off"><button class="btn pri" type="submit">提問</button></form>
  <div class="aiout card" id="aiOut" hidden></div>
</header>
<nav class="tabs"><div class="wrap">
  <a href="#accounts" data-tab="accounts">追蹤帳號</a>

  <a href="#weekly" data-tab="weekly">每週</a>
  <a href="#monthly" data-tab="monthly">每月</a>
  <a href="#matrix" data-tab="matrix">立場矩陣</a>
</div></nav>
<main class="wrap" id="main"></main>
<footer class="wrap">資料截至 <span id="footAsof"></span>。美股交易日開盤前和收盤後各更新一次。股價來自 Yahoo Finance，機構評等來自 Financial Modeling Prep。</footer>

var DATA={"asOf":"2026-10-19","analysis":{"summary":{"asOf":"2026-10-19","1":"10/16 收盤至 10/19 開盤前：$SOXX 連跌 9 天、創 2006 年來最長連跌，Balder 形容這波熊市「很陰」，$MU 市值跌回 1 兆以下。Ren 力挺記憶體，指三星、SK 海力士僅 2–3 倍本益比、低於歷次循環底部，並反駁 DeepSeek 省記憶體論；週一盤前 $NBIS、$CRWV、$IREN 強勁反轉，高盛升評 $CRWV 至買進。$AAPL iPhone Duo 預購秒殺。本週財報看 $TSLA、$META、$SPCX，Ren 稱自己 $META 持股不夠多。","7":"近 7 日 AI 硬體急跌但觀點帳號多數逢低加碼：$MU、$LITE、$COHR、$MRVL、$AVGO、$TSM、$ASML 仍獲多帳號看多，$META 新加入共識看多（KawzInvests、Ren）。分歧明顯增加：$CRWV（KawzInvests、Michael Sikand、Ren 最新看多，但 Ren 曾稱多數 neocloud 會被淘汰）、$IREN（Michael Sikand 看空、Ren 看多）、$QCOM（Michael Sikand 看多、Jukan 看空）、$TSLA（Michael Sikand 看多、大老师預期財報不及預期）。","28":"近 28 日主軸是 AI 基礎建設：$NVDA、$MU、$AMD 各有 8 個帳號看多，$GOOGL 7 個，$NBIS、$MRVL、$META、$ARM、$INTC 各 6 個，理由包括記憶體超級循環、代理式 AI 帶動 CPU 需求、算力吃緊。$INTC 是最明顯的分歧股，6 個帳號看多、Jukan 看空；$CRWV 則被 Balder、Ren、Evan 看空。$EXPE、$BKNG 被認為會被 AI 代理侵蝕，$NKE 持續被看空。"},"tickers":{"MU":{"take":"10 個帳號提到、8 個看多，沒有人看空，是目前最強共識。","bull":"營收與 EPS 雙超預期、下季指引 615 億美元（KawzInvests、Ren 9/30）；2027–28 年供給仍會更吃緊（Ren 9/30）；營收後年將超越輝達（Balder 9/30）；一年漲逾 480%、市值增加約 1 兆美元（Unusual Whales 10/04）；記憶體超級循環（Serenity）。","bear":"沒有帳號看空。大老师在財報前提醒指引可能下修；Balder 提醒華爾街反應難料；Michael Sikand 提到管理層稱漲價速度已見頂。"},"NVDA":{"take":"8 個帳號提到，看多為主，沒有人看空。","bull":"伺服器折舊年限延長駁斥 GPU 貶值論（Ren）；CPO 帶動雷射需求（Serenity）；市值 5.6 兆美元、大摩列為半導體首選（Unusual Whales 10/03）；鴻海 Q3 營收年增 47%（Evan 10/05）。","bear":"沒有帳號看空。"},"NBIS":{"take":"6 個帳號看多，是新雲端裡的共識首選。","bull":"升息時仍調漲 GPU 租價 20%（Michael Sikand）；類股下跌時相對強勢（Serenity）；Truist 給 355 美元目標價（Ren）；收購 Inferize 降低 GPU 閒置（Evan）；Evan 賣出 CRWV 改買 NBIS（10/03）；Ren 列為持股主力（10/02、10/04）。","bear":"沒有帳號看空；AskLivermore 提醒需守住 190 美元。"},"CRWV":{"take":"多空分歧，近期偏空：Serenity、KawzInvests 偏多，Balder、Ren、Evan 偏空。","bull":"Burry 回補空單（KawzInvests）；算力瓶頸普遍上漲（Serenity）。","bear":"增發 30 億美元後暴跌（Balder）；拖累同業 NBIS（Ren）；Evan 賣出 CRWV 改買 NBIS（10/03）；Nscale 的積壓訂單估值更便宜（Michael Sikand）。"},"INTC":{"take":"8 個帳號提到，6 個看多，只有 Jukan 偏空。","bull":"代理式 AI 讓 CPU 需求翻倍，Intel 只能滿足約五成需求（Serenity、Ren、KawzInvests、Michael Sikand）；亞馬遜採用 EMIB 封裝（Jukan 9/11）；川普持股獲利近 5 倍（DJT Radar）。","bear": 有帳號看空；AskLivermore 提到短線仍弱。"},"AAPL":{"take":"看法分歧且多為中性新聞。","bull":"摺疊機買家對價格不敏感（Michael Sikand）；與鎧俠簽 NAND 長約（Balder 9/08）。","bear":"Balder 預期發表會當天與隔天下跌；摺疊機良率問題（Jukan）。"},"CRDO":{"take":"看多，Michael Sikand 與 KawzInvests 都有深入研究。","bull":"AI 網通中預估本益比最低、光學產品被低估（Michael Sikand）；成長不只靠 AEC（KawzInvests）；一個月漲 37%。","bear":"沒有帳號看空；AskLivermore 9/16 認為 AI 股尚未落底，宜慢慢建倉。"},"QCOM":{"take":"看多為主。","bull":"AI 穿戴裝置將全面採用驍龍（Michael Sikand）；與亞馬遜合作 AI 資料中心與 1.6T 光通訊（KawzInvests）；Muse 吊飾裝置採用（Jukan）。","bear":"ARM 訴訟造成賣壓（Balder 9/19）。"},"NKE":{"take":"唯一的共識看空：Evan、Unusual Whales、Balder 看空，沒有人看多。","bull":"沒有帳號看多。","bear":"財報營收略低於預期並預告銷售續降，股價跌到 2013 年以來新低、一年跌逾 55%（Unusual Whales 10/02）；過去 33 年落後標普 500（Evan 10/03）。"},"STX":{"take":"HDD 分歧：AskLivermore 看突破，Balder、Zephyr 看空。","bull":"MU、STX、WDC、SNDK 若守住低點有望突破（AskLivermore 10/02）。","bear":"東芝擴產是重擊（Balder）；Rosenblatt 稱東芝擴產要到 2030 年，Zephyr 認為這是很弱的辯護（10/02）。"},"PENG":{"take":"10/06 財報大勝預期後，Michael Sikand 與 Ren 看多。","bull":"Q4 營收 5.67 億美元、EPS 1.00 美元雙超預期，FY27 營收指引上調至年增 40%（Ren 10/06）；記憶體營收年增 158%（Michael Sikand 10/06）；AI 基建轉向新雲端客戶，6 家新客戶中有 4 家是新雲端（Michael Sikand 10/07）。","bear":"沒有帳號看空。"}}},"accounts":[{"handle":"aleabitoreddit","name":"Serenity","type":"觀點帳號","style":"半導體、光通訊與 AI 供應鏈"},{"handle":"jukan05","name":"Jukan","type":"觀點帳號","style":"韓國半導體與全球供應鏈"},{"handle":"octopusycc","name":"大老师","type":"觀點帳號","style":"先進製程、設備與亞洲科技供應鏈"},{"handle":"KawzInvests","name":"KawzInvests","type":"觀點帳號","style":"AI、科技成長股與產業催化劑"},{"handle":"michaelsikand","name":"Michael Sikand","type":"觀點帳號","style":"科技平台、AI 產品與新創趨勢"},{"handle":"ren_stocks","name":"Ren","type":"觀點帳號","style":"成長股機會，重視估值風險"},{"handle":"StockMKTNewz","name":"Evan","type":"市場新聞","style":"即時追蹤美股公司新聞與市場催化劑"},{"handle":"DJTRadar","name":"DJT Radar","type":"交易揭露","style":"追蹤川普相關交易的公開揭露"},{"handle":"Franktradinglog","name":"Frank trading","type":"觀點帳號","style":"交易紀錄"},{"handle":"asklivermore","name":"AskLivermore","type":"觀點帳號","style":"市場觀點"},{"handle":"Balder13946731","name":"Balder","type":"觀點帳號","style":"市場觀點"},{"handle":"zephyr_z9","name":"Zephyr","type":"觀點帳號","style":"半導體與 AI 硬體產業分析"},{"handle":"unusual_whales","name":"Unusual Whales","type":"市場新聞","style":"異常選擇權流量、國會交易與市場快訊"}],"posts":[{"id":"2079947242455335379","author":"aleabitoreddit","date":"2026-07-22","zh":"AMD投資50億美元於Anthropic，後者將簽2GW晶片採購，仿效NVDA模式。","risk":"","s":{"AMD":"bull","NVDA":"neutral"},"text":"$AMD to invest $5B in Anthropic.\n\nAnthropic in turn will sign a 2 GW deal to buy AMD’s latest chips, worth tens of billions of dollars.\n\nLooks like they’re copying the $NVDA playbook with Anthropic last year. https://t.co/SXBUq65u6P","likes":1014},{"id":"2079953508904964575","author":"aleabitoreddit","date":"2026-07-22","zh":"將參加AMD活動，一定會詢問關於SIVE的事。","risk":"","s":{"AMD":"neutral","SIVE":"neutral"},"text":"@gaetan_po Yeah, I’m testing some things right now for bot prevention.\n\nAlso going to $AMD event tomorrow rather than full 2 days, will definitely be asking about $SIVE!","likes":318},{"id":"2080027058063958323","author":"aleabitoreddit","date":"2026-07-22","zh":"GOOGL財報雲端營收年增82%大幅超預期且利潤率擴張，對AI需求與LITE等光學族群是利多。","risk":"","s":{"GOOGL":"bull","LITE":"bull","SPCX":"neutral"},"text":"$GOOGL reported earnings today:\n\nEPS: $9.11 actual vs $2.91 expected - retail reactions to EPS blowout is kinda just accounting noise, since $SPCX, Anthropic, and others were likely large contributors.\n\nRevenue: $119.7B actual vs. $116.98B expected\n\nGoogle Cloud Revenue: $24.77B +82% Y/Y, vs. 63-65% expected ($22.2-$22.6B) - this is a very large beat and most material part so far.\n\nCloud Operating Income: ~$8.81B, implying 35.6% margin vs. 32.9% Q1.\n\nCapex: $44.92B vs ~$44.15B (basically in line).\n\nSo initial read through is Google Cloud accelerating growth with expanding margins is genuinely bullish for AI demand.\n\nTheir former $180-$190B capex guidance is already extremely large, and as long as we get around these numbers in the earnings call + forward projections...\n\nShould be good to go for $LITE and the other optics/networking trade. (eg. last earnings, they said DC and networking would be ~40% of capex spend).\n\nHyperscaler earnings transcripts are probably the most important thing to pay attention to with the AI capex trade.\n\nAnd that should be in 3 minutes.","likes":1447},{"id":"2080031508656746874","author":"aleabitoreddit","date":"2026-07-22","zh":"Gemini月活達9.5億，數月增2億，解釋為何算力不足並削減對Meta配額，AI資本支出難放緩。","risk":"","s":{"GOOGL":"bull","META":"neutral"},"text":"$GOOGL now has 950M monthly Gemini users and processes 22B API tokens/min.\n\nCompared to 750M back in February.\n\nAbsurd growth adding 200 million more users in a few months.  Kinda explains why they ran out of compute, then cut allocations to $META and others.\n\nVery unlikely AI capex will slow down given.","likes":1295},{"id":"2080032221638119603","author":"aleabitoreddit","date":"2026-07-22","zh":"調侃GOOGL股價僅下跌0.079%。","risk":"","s":{"GOOGL":"neutral"},"text":"@4intheflames $GOOGL stock down a solid -.079%. https://t.co/lN3g2KcJZy","likes":68},{"id":"2080035769062916479","author":"aleabitoreddit","date":"2026-07-22","zh":"GOOGL上調2026資本支出指引至1950-2050億美元，是對上游半導體最利多的訊號。","risk":"","s":{"GOOGL":"neutral"},"text":"$GOOGL updates FY 2026 capex guidance:\n\nTo $195B-$205B. Up from $180B-$190B.\n\nGoogle is also expected to significantly increase capex in 2027.\n\nThis is perhaps the most bullish read through on upstream semis from a hyperscaler. https://t.co/dXiI0Ien8X","likes":1652},{"id":"2080042335388500360","author":"aleabitoreddit","date":"2026-07-22","zh":"AI資本支出流向上游半導體是利多，GOOGL自身花錢市場未必喜歡。","risk":"","s":{"GOOGL":"neutral"},"text":"@haranguetan_ Having an iota of reading comphrension helps a bit before commenting.\n\nAI Capex -> goes to upstream semis from memory, photonics, foundries, and others. These players are happy.\n\n$GOOGL itself is spending the money, so markets might not like that for them in specific.\n\nBut it's positive to the players that receive that capital.","likes":185},{"id":"2080149813065396454","author":"aleabitoreddit","date":"2026-07-23","zh":"整理特斯拉財報：馬斯克稱Optimus將是史上最大產品，特斯拉為美國人形機器人領導者，並讚美光給予合理記憶體配額。","risk":"","s":{"MU":"bull","TSLA":"bull","TSM":"neutral"},"text":"Just some notes from $TSLA transcripts:\n\nElon Musk: \"I think Optimus will be the biggest product ever\" from Q2 earnings transcripts.\n\nEven from Q1, Elon Stated: \"I think Optimus will be our biggest product. Not just Tesla's biggest product ever, but probably the biggest product ever.\n\nAnd I remain convinced of that conclusion\".\n\nIt's very rare to see such high conviction reiterated from Elon regarding humanoids both directionally and TAM-wise.\n\nIn terms of upstream suppliers opportunities, Karn Budhiraj, VP of $TSLA supply chains stated:\n\n\"We’re seeing the same level of investment going to memory and also new specific items like metal injection molded parts, flexible printed circuits, and all sorts of nonlinear technologies...\"\n\nAnd that they had to build new supply chains from scratch. So would be interesting to look at for new supply chain supplier opportunities apart from the known ones.\n\nJust pulled older slides and it looks like capacity targets for Fremont are 1M and Giga Texas was 10M, so at scale, $TSLA seems to be the clear US leader. If you're looking at that S-Curve opportunity ramp.\n\nOn a side note, Elon also gave a shoutout to $MU with likely reasonably priced LTAs, gi","likes":1687},{"id":"2080153334888182065","author":"aleabitoreddit","date":"2026-07-23","zh":"INTC與AMD將與中國客戶簽CPU長約，記憶體與光通訊也陸續簽LTA，認為瓶頸投資者受惠、難以泡沫破裂。","risk":"","s":{"AMD":"bull","COHR":"bull","INTC":"bull","LITE":"bull","MU":"bull","SNDK":"bull"},"text":"$INTC and $AMD to sign CPU LTAs with Chinese customers for AI DCs (Reuters).\n\n- Prices of some CPU products have risen more than 40% in China since the start of the year from sources.\n\n- Month-on-month increases topping 10% for some products\n\nCPUs were already a bottleneck, following CPU ratios due to AI inference...\n\nBut the broader trend of LTAs seems to be appearing from:\n\n- Memory, with $MU, Samsung, $SNDK, and SK Hynix signing DRAM/NAND LTAs.\n\n- Photonics, with $LITE, $COHR signing EML LTAs. And recent Trendforce reports that $AMD and hyperscalers are now pursuing CW LTAs.\n\nAnd I'm sure there's many more from MLCCs to all the way to substrates.\n\n+1 for the bottleneck investors... hard to be a \"bubble that pops\" if you have take or pay demand spanning multiple years.","likes":1118},{"id":"2080334612807758136","author":"aleabitoreddit","date":"2026-07-23","zh":"對AMD執行長Lisa與AI開玩笑，並表示很高興在活動上見到粉絲。","risk":"","s":{"AMD":"neutral"},"text":"I have this feeling that Lisa from $AMD likes AI.\n\nIt’s cool getting to meet some of you at the event! https://t.co/AWdGS349xF","likes":1440},{"id":"2080379612736221325","author":"aleabitoreddit","date":"2026-07-23","zh":"AMD送來限量30條的特製頭巾，笑稱現在愛上AMD與Lisa Su。","risk":"","s":{"AMD":"neutral"},"text":"$AMD reached out directly to hand me some special swag!\n\nApparently they only made 30 of these bandanas?\n\nI love AMD and Lisa Su now. https://t.co/KgcYjBUcTv","likes":1543},{"id":"2080380170779898186","author":"aleabitoreddit","date":"2026-07-23","zh":"感謝AMD社群團隊，調侃Lisa的頭巾可能比晶片賣得更快。","risk":"","s":{"AMD":"neutral"},"text":"@beauty_oe Special shoutout to the super cool social media team at $AMD!\n\nLisa does make cool bandanas, probably would sell out faster than their CPUs/accelerators. https://t.co/tY7VRyOnC9","likes":137},{"id":"2080394259535221222","author":"aleabitoreddit","date":"2026-07-23","zh":"AMD活動通路調查：合作夥伴預期AMD未來Helios採CPO，業者未見CPO供應鏈延遲。","risk":"","s":{"AMD":"neutral"},"text":"From $AMD Advancing AI, channel checks:\n\nHelios networking partners told me they expect AMD to pursue CPO for future generations of Helios scale up networking.\n\nAnd expects other hyperscalers + industry to go down the CPO route.\n\nOne AI infra executive at a company involved in a hyperscaler CPO programs said they had seen no indication of CPO scale up supply chain delays.\n\nPushing back on recent 3rd party delay reports.\n\nThis was informal commentary, not official AMD or partner guidance.","likes":581},{"id":"2080411863448522994","author":"aleabitoreddit","date":"2026-07-23","zh":"活動通路調查對CPO族群非常正面，SIVE作為Ayar、GFS的雷射供應商受益，但無直接確認。","risk":"","s":{"AMD":"neutral","GFS":"neutral","SIVE":"bull"},"text":"@88magalhaes Main thing was executive commentary on CPO thematically. Regarding $AMD + hyperscaler adoption + timelines.\n\nChecks were very positive for the CPO segment that sold off on delay news.\n\nAnd very positive for $SIVE in that segment, since they're the laser supplier for Ayar, $GFS, that are both linked with possible $AMD CPO routes.\n\nBut couldn't get direct supplier confirmation since that's confidential.","likes":139},{"id":"2080445777395298454","author":"aleabitoreddit","date":"2026-07-24","zh":"SIVE執行長表示可插拔光模組將存在十年，CPO為長期方向，產能與原料是瓶頸，各合格雷射供應商皆有空間。","risk":"產能與原料供應瓶頸","s":{"AAOI":"neutral","JBL":"neutral","LITE":"neutral","SIVE":"bull"},"text":"Not exactly for $AAOI (they're working on CPO too, just a little further behind in commercialization).\n\nThere's a podcast that featured the $SIVE CEO recently called: \"Market Insights: Photonics & AI\".\n\nMost interesting take was:\n\n\"Pluggables will be around for the next 10 years\".\n\nThere's a lot of CPO + RNG/MRC optimization TAM cannablization arguments for pluggables recently, but looks like it's here to stay.\n\nAnd that there's going to be multiple architecture paths going forward (CEO also NPO alongside CPO as an major opportunity in the next 5 years).\n\nAs for challenges: Vickram stated manufacturing capacity + availability of raw material is the main bottleneck. Likely referencing the existing bottlenecks with upstream CW laser ramp.\n\nFrom the podcast, seems like a large focus was on pluggable markets due to larger near-term TAM (which is understandable with $JBL + other players), with CPO being the north star.\n\nSo it might be interesting if $SIVE M&A ambitions were to acquire more pluggable optical transceiver IP, like what $LITE did with Cloud Light.\n\nBut TLDR:\n\nLot of different paths moving forward, pluggable here to stay, CPO seems like North Star for where industry is headi","likes":270},{"id":"2080456465509454053","author":"aleabitoreddit","date":"2026-07-24","zh":"反駁AAOI在CPO落後說，Rosenblatt認為AMD可能是其首個CPO客戶；LITE、COHR、SIVE為CPO雷射能見度前三名。","risk":"","s":{"AAOI":"bull","COHR":"bull","LITE":"bull","SIVE":"bull"},"text":"@Thomus0x eh, Rosenblatt June 30 note identified AMD as the likely first $AAOI CPO customer. I wouldn't quite say they aren't remotely close.\n\n$LITE / $COHR / $SIVE just look like your top 3 right now in terms of CPO laser visibility per the recent Morgan Stanley note.","likes":6},{"id":"2080462582335619169","author":"aleabitoreddit","date":"2026-07-24","zh":"分享AMD貼紙，稱AMD衝衝衝。","risk":"","s":{"AMD":"bull"},"text":"@Frenchie_ @AMD These stickers were even better.\n\n$AMD go brrrr https://t.co/O3dvaUG83a","likes":188},{"id":"2080689966045348047","author":"aleabitoreddit","date":"2026-07-24","zh":"輝達黃仁勳首次加入X，分享其關於開放模型的公開信。","risk":"","s":{"NVDA":"neutral"},"text":"Jensen from $NVDA has joined X for the first time to share his letter on open models.","likes":1229},{"id":"2080750537121874206","author":"aleabitoreddit","date":"2026-07-24","zh":"FT報導Waymo考慮與Uber分手，作者早認為Uber合作是錯誤，Avride等中立方案較佳，Waymo成Uber最大威脅。","risk":"Waymo成為Uber競爭者","s":{"GOOGL":"bull","NBIS":"bull","UBER":"bear"},"text":"There you have it, $GOOGL Waymo to explore split with $UBER per FT.\n\nMy view last year was that Uber partnering with Waymo was a bad choice… since Uber would just serve as a distribution funnel that Google needed as they scale up.\n\nAnd that $NBIS Avride, other neutral players, or vertical integration would be the optimal path forward.\n\nNow their own partner Waymo looks to be the strongest disruptor to Uber.","likes":777},{"id":"2080754547757391897","author":"aleabitoreddit","date":"2026-07-24","zh":"認為Waymo短中期對UBER、LYFT影響小，但長期自駕車將壓縮叫車成本，UBER與LYFT在美國恐被淘汰。","risk":"自駕車顛覆叫車業務","s":{"LYFT":"bear","TSLA":"bull","UBER":"bear"},"text":"@OtsukimiOtsu Feels like every other car you see in SF is a Waymo.\n\nShort-medium term I see it as negligible impact to $UBER and $LYFT.\n\nLong term I see them cooked in US markets unless they act…\n\nSince autonomous vehicles can compress cost/margins of human ride shares by a lot. Then robotics can compress cost of delivery if Waymo launches a competitor to Uber Eats.\n\nJust like how people compare uber/lyft costs before rides, what people care about is lowest cost out of the bunch, and directionally Waymo/$TSLA would likely win there","likes":54},{"id":"2081472671129501729","author":"aleabitoreddit","date":"2026-07-26","zh":"彙整新聞：CXMT上市、三星與AVGO合作、SOI矽光子營收倍增、AMD Helios量產、玻璃基板延後影響LPK等。","risk":"玻璃基板延後影響LPK放量","s":{"AMD":"bull","AVGO":"neutral","CCXI":"neutral","CXMT":"neutral","INTC":"neutral","LPK":"neutral","META":"neutral","NVDA":"neutral","ORCL":"neutral","QCOM":"neutral","SOI":"bull"},"text":"Just some TLDR news:\n\n- $CXMT IPO tomorrow if you like Chinese memory.\n\n- Samsung Electronics reportedly struggling to secure large FC-BGA substrates. Ibiden (4062) reportedly requested LTA guarantees, Samsung Electro-Mechanics sought prepayments.\n\n- Samsung + $AVGO sign memory + foundry AI framework through 2030, expected to exceed $200b\n\n- $SOI expects FY2027 silicon photonics revenue to double compared to the previous year, surpassing Morgan Stanley's 60% growth projection. Photonics thesis go brrr.\n\n- SK Group + $NVDA sign $500B+ partnership to build out AI DCs and HBM4 memory.\n\n- SKC Absolics glass core delay to 2027 from reports. Targeting final reliability testing EOY, mass production next year. So if you're curious, this does push back some ramps from $LPK and others (hence drop on ER).\n\n- $QCOM price hikes by double digits for smartphone processors, due to upstream supplier hike pricing.\n\n- $META expected to issue $12B in project-level/SPV financing for El Paso, Texas AI DC expansion\n\n- Naver announced a $10 billion investment from $NVDA and Brookfield to construct a 1GW-scale AI Factory. Near term plan is 200MW by 2028. (Nvidia $1B investment, Brookfield nonbinding $9B)\n\n","likes":790},{"id":"2081548360818004299","author":"aleabitoreddit","date":"2026-07-27","zh":"輝達洽談為OpenAI資料中心擔保2500億美元融資，作者質疑循環融資的長期健康性，但認為資本支出受惠者將受益。","risk":"循環融資長期健康性存疑","s":{"NVDA":"neutral"},"text":"Nvidia in talks to backstop $250B worth of OpenAI DC financing.\n\n- Softbank’s SB energy develops 10 GW Ohio campus\n\n- OpenAI signs long term lease\n\n- $NVDA guarantees $250B in financing\n\n- OpenAI discussing separate agreement to buy up to $350B in Nvidia chips.\n\nNot quite sure if this circular financing is healthy long term, but given the massive size of AI infrastructure spending…\n\nFeels like capex beneficiaries will be extremely happy.","likes":1109},{"id":"2081579593815978273","author":"aleabitoreddit","date":"2026-07-27","zh":"CXMT上市首日大漲約470%，市值升至約4873億美元，詢問中國粉絲是否有申購。","risk":"","s":{"CMXT":"neutral"},"text":"Wow, $CMXT is up a very normal +469.98% after going public today.\n\nNow valuing it at ~$487.31 billion, up from $85.5 billion.\n\nDid any of my Chinese followers buy into the IPO? https://t.co/TlibjHe799","likes":2036},{"id":"2082175588555702410","author":"aleabitoreddit","date":"2026-07-28","zh":"FCC將禁止中國人形與四足機器人進口，Agility Robotics（CCXI）等美國業者將受惠。","risk":"","s":{"CCXI":"bull"},"text":"FCC set to ban Chinese imports of humanoid and quadruped robots per Reuters.\n\nTo protect American Humanoid/Robotics programs.\n\nAgility Robotics ( $CCXI ) and other US humanoid players should be happy to hear this. https://t.co/s2dFWTA4EX","likes":965},{"id":"2082176491216085377","author":"aleabitoreddit","date":"2026-07-28","zh":"作者兩次手術後休養中，對GOOGL上調資本支出後類股仍下跌感到意外，猜測是去槓桿。","risk":"","s":{"GOOGL":"neutral"},"text":"@wannabepanacea I've been out if it recently, just recovering from 2 rounds of surgery.\n\nDrop was been surprising to say the least given $GOOGL hiked capex guidance last week.\n\nWill need to check on rate hike odds, but my guess is just deleveraging.","likes":267},{"id":"2082230983487803755","author":"aleabitoreddit","date":"2026-07-28","zh":"認為近期下跌是過度去槓桿，AI需求與營收持續加速，對SIVE、AAOI等光通訊名單有完全信心，預期主題回升。","risk":"短期去槓桿波動","s":{"AAOI":"bull","AMKR":"neutral","BE":"bull","CXMT":"neutral","GOOGL":"bull","LITE":"bull","META":"bull","MU":"bull","NBIS":"bull","SIVE":"bull","SNDK":"bull","TER":"bull"},"text":"I personally see it as extreme short term deleveraging that overshot many individual names.\n\n- $BE to $TER reported blowout results, with Bloom reporting 166% Y/Y rev growth + expanding margins + raised 2026 guidance... Teradyne reported 104% Y/Y revenue growth with 300%+ EPS growth.\n\nYour leading optical players over in China reported amazing preliminary earnings + extremely strong read through for the Western photonics sector.\n\nThink earnings season tend to remind markets about continued AI acceleration. I'm expecting $LITE, $SNDK / SK Hynix, and sector leader ERs to continue that trend.\n\nBut it does feel like markets are rewarding existing acceleration more rather than future growth a year out over near-term revisions as seen with $AMKR.\n\nBut as a TLDR, looks very positive for the themes I'm tracking.\n\n- Then you have $GOOGL capex raised to $195-$205B, which is typically the biggest AI demand signal from hyperscalers.\n\n- 77% 0bps change est. next FOMC decision from prediction markets. Trump administration on Monday called for the Fed to lower interest rates.\n\nSo your 3x rate hikes fears this year seem kinda overblown.\n\n- Chinese fears from DUV to $CXMT overflooding are extremely","likes":1063},{"id":"2082513405219631384","author":"aleabitoreddit","date":"2026-07-29","zh":"美國政府將取得GFS 1%股權並提供3億美元CHIPS補助加速CPO，對SIVE、LITE為強力正面訊號。","risk":"","s":{"GFS":"bull","INTC":"neutral","LITE":"bull","SIVE":"bull"},"text":"US Gov to take 1% stake in $GFS, and award them $300m for the US CHIPS ACT.\n\nThis is actually a strong read through on $SIVE / $LITE, given this CHIPS ACT is specifically aimed at advancing CPO + Silicon Photonics.\n\n(For reference, Sivers and Lumentum were the only two public laser suppliers named in GFS presentation slides. Sivers laser arrays was named recently as a reference design in Globalfoundries SCALE for CPO).\n\nPer US Gov announcement: \"GlobalFoundries will receive up to $300 million to accelerate domestic CPO R&D by two to three years\" (NIST)\n\nNever thought we'd see the US Gov / $INTC foundry playbook for CPO in specific...","likes":1308},{"id":"2082514437014253995","author":"aleabitoreddit","date":"2026-07-29","zh":"作者未持有GFS，但對美國政府入股推動CPO後GFS股價仍下跌感到意外。","risk":"","s":{"GFS":"bull","INTC":"neutral"},"text":"@4intheflames I don't own $GFS, but I'm personally it's surprised it's still down on the news US Gov is taking a direct stake in them for advancing CPO.\n\nSurprising to say the least, given everyone remembers $INTC as the latest foundry the US Gov liked.","likes":111},{"id":"2082517392031375418","author":"aleabitoreddit","date":"2026-07-29","zh":"美國政府入股GFS推動CPO，顯示CPO成為供應鏈優先項目，利好LITE、SIVE等西方業者。","risk":"","s":{"GFS":"bull","LITE":"bull","SIVE":"bull"},"text":"@Yeshuaisking11 I kinda expected it for critical minerals since Western needs as much subsidies as possible to compete with China.\n\nUS Gov taking a stake in $GFS for CPO was not on my calendar. But it does go to show CPO becoming a compute supply chain priority and they made Globalfoundries a domestic champion.\n\nWhich my thoughts are that it's positive for all the Western players this US CPO supply chains like $LITE / $SIVE. Not so much for other parts of the world.","likes":98},{"id":"2082520341633732966","author":"aleabitoreddit","date":"2026-07-29","zh":"AAOI受AI去槓桿拖累，若2027年達56億美元年化營收仍僅63億市值會令人意外；對比LITE估值。","risk":"高貝塔股受去槓桿影響","s":{"AAOI":"bull","LITE":"neutral"},"text":"@nicomejia_ Global indiscriminate AI deleveraging right now, $AAOI is one of the high-beta names affected.\n\nI'd personally be surprised to say the least if they do $5.6B annualized revenue in 2027 (off of $471m/month projections), and remain a $6.3B company.\n\n$LITE annualized right now is ~$3.23B and they're a $48B company (but higher margins)","likes":146},{"id":"2082557648298516918","author":"aleabitoreddit","date":"2026-07-29","zh":"為聲援IREN持有者，作者表示現在持有1股IREN。","risk":"","s":{"IREN":"neutral"},"text":"To show solidarity with the $IREN holders:\n\nI now own 1 share of IREN.","likes":1842},{"id":"2082578803189268855","author":"aleabitoreddit","date":"2026-07-29","zh":"AXTI與LITE簽訂InP基板長約，Lumentum支付4350萬美元產能保證金。","risk":"","s":{"AXTI":"neutral","LITE":"neutral"},"text":"$AXTI enters long term agreement with $LITE for InP substrates.\n\nLumentum has agreed to pay a deposit of $43.5M as a reservation for capacity. https://t.co/5Dl3L9EYRa","likes":728},{"id":"2082582144359219284","author":"aleabitoreddit","date":"2026-07-29","zh":"AXTI先後與COHR及LITE簽長約並收取預付款，兩大光通訊廠皆簽約，看起來正面，但合約定價未知。","risk":"","s":{"AXTI":"bull","COHR":"neutral","LITE":"neutral"},"text":"@wz2013 $AXTI secured LTA with $COHR earlier, with a $22.3M reservation payment.\n\nAs well as a LTA with $LITE today, totaling $87M ($43.5M + $43.5M) again to reserve capacity.\n\nConsidering that these are both of the two leading optical players, seems positive.\n\nThe actual details such as pricing of the contracts aren't known, so we'll find out more.","likes":79},{"id":"2082605568699871284","author":"aleabitoreddit","date":"2026-07-29","zh":"整理META與MSFT財報：資本支出維持或上調，算力需求遠超供給，認為AI拋售過度，利好新雲端業者。","risk":"","s":{"AMD":"bull","GOOGL":"bull","IREN":"bull","META":"bull","MSFT":"bull","NBIS":"bull","NVDA":"bull"},"text":"Just some takeaways from $META | $MSFT earnings calls:\n\nMicrosoft:\n- Expected to be FCF positive in 2027, despite the increase in capex (extremely positive for AI buildout that it's funded by operating income)\n- \"Free cash flow was 3277","author":"aleabitoreddit","date":"2026-07-30","zh":"POET光學中介層更新將措辭從「量產就緒」升級為2026年底「量產」，對SIVE是實質時程進展。","risk":"","s":{"POET":"bull","SIVE":"bull"},"text":"@A22GEO The $POET optical interposer piece is actually a very interesting update and talks about $SIVE.\n\nSince it's a material timeline upgrade wording for \"production\" EOY 2026, for Sivers + Poet.\n\nBack when Sivers did their PR it was \"production readiness\" https://t.co/EHkOogR39K","likes":229},{"id":"2082740477795745942","author":"aleabitoreddit","date":"2026-07-30","zh":"為Leopold辯護，其認為拋售是2025年初以來最佳買點，作者認同並指出下跌是強制去槓桿過度所致。","risk":"","s":{"BE":"neutral","SHAZ":"neutral","SNDK":"neutral"},"text":"There's a lot of stupid commentary around Leopold raising funds. After names like $BE, $SNDK, $SHAZ, and others all had very sharp drawdowns in July.\n\nJust remember... here's a man in finance that's\n\n1.  6'5\n2. Blue Eyes\n3. Hedge Fund\n\nProbably better looking than you, and was up 439% through June YTD.\n\nRegarding the drawdown, Aschenbrenner acknowledged that the fund had \"not been immune\" to the market turmoil, particularly in Asia.  FT separately reported that leverage amplified both its extraordinary gains and recent losses.\n\nHe described the sell-off as potentially the best buying opportunity since early 2025\n\nI'd agree with him and hope he succeeds with the raise.\n\nSince a lot of the current selloff looks like it overshot its mark through forced deleveraging.","likes":2251},{"id":"2082896789880119590","author":"aleabitoreddit","date":"2026-07-30","zh":"質疑Citadel清算Situational Awareness後隔天市場大漲，列出NBIS、IREN等多檔大漲。","risk":"","s":{"BE":"neutral","INTC":"neutral","IREN":"neutral","NBIS":"neutral","SHAZ":"neutral","SKHY":"neutral","SNDK":"neutral"},"text":"Did Citadel really just liquidate Situational Awareness…\n\nThen brought up entire markets the next day?\n\n$NBIS +26.25%\n$IREN +25.96%\n$SHAZ +22.82%\n$SNDK + 23.98%\n$BE +23.67%\n$SKHY +16.98%\n$INTC +12.16%\n\nAmid many others. This has go
