AMD":"bull","ARM":"bull","CRWV":"bull","DRAM":"bull","EWY":"bull","INTC":"bull","IREN":"bull","MRVL":"bull","MU":"bull","NBIS":"bull","SIVE":"bull"},"text":"I'm not having a fun day since I got sick today. But the bottlenecks are having a good time: \n\n\n$AMD\n +9.13% | \n$INTC\n +14.16% | \n$ARM\n +14.33%\n\nCPUs go brrr\n\n$SIVE +10.32% | \n$AAOI\n +3.39% | AMS OSRAM +24.61%\n\nLasers go brrr\n\n\n$EWY\n +4.08% | \n$DRAM\n +2.83% | \n$MU\n +2.23%\n\nMemory go brrr\n\n\n$NBIS\n +4.7% | \n$CRWV\n +5.03% | \n$IREN\n +1.73%\n\nCompute go brrr\n\nProbably most material developments were CPU:GPU ratio expectations + CPU demand (from new AI releases).  \n\nAs well as optical developments from ECOC 2026 (as seen with \n$MRVL\n PR + others)\n\nStill a lot to catch up on.","likes":1698},{"id":"2102065409482727842","author":"aleabitoreddit","date":"2026-09-21","zh":"Soitec 實質壟斷矽光子用 SOI 晶圓，作者希望其利用地位提高售價，能否再創新高視長約規模而定。","risk":"長約與定價不如預期","s":{"SOI":"bull"},"text":"@gurkyboy $SOI is the perfect example of a complete monopoly over silicon photonics. (lot of folks float 95% figures like UBS or Shin Etsu that Soitec basically licenses), but practically speaking...\n\nIt's kinda 100% since it's used to manufacture all SOI Wafers, people just don't like to use the word monopoly in markets.\n\nDepends on all their LTAs that they're going to sign as well as pricing. I would appreciate it if they abused their position to secure higher pricing.\n\nWe'll see on the scale of their agreements if it deserves to be ATHs again","likes":75},{"id":"2102067535915123156","author":"aleabitoreddit","date":"2026-09-21","zh":"以 2027 年為期看好 SIVE 與 AAOI 的產能放量；NBIS 第四季受惠漲價；舊世代記憶體與 CPU 股近期可望強勢。","risk":"AAOI 6 億 ATM 短期壓力","s":{"AAOI":"bull","AMD":"bull","ARM":"bull","ESMT":"bull","INTC":"bull","NBIS":"bull","SIVE":"bull"},"text":"@wannabepanacea $SIVE and $AAOI, yes for a 2027 timeframe. That's the nuance.\n\nSivers you're coming on with 100M CW DFB laser capacity + 2 external foundries (maybe 300M in total), and all my supply chains mapping maps to larger hyperscaler suppliers.\n\nAAOI you're coming on with $471m transceiver revenue + 400K ELS units for 2028 timeframe. With hyperscalers + demand eating up all their capacity. There's just a $600m ATM which presents overhang near term.\n\n$NBIS already got re-rated but it's very positive upcoming for Q4 2026 (esp. with price hikes).\n\nLegacy memory like $ESMT + (some I haven't named yet) + regular memory names like Samsung, I do think will strongly outperform near term. And obviously CPUs names like $INTC $AMD $ARM as of recent.","likes":180},{"id":"2102068786493026492","author":"aleabitoreddit","date":"2026-09-21","zh":"AXTI 單日漲 12.4%，磷化銦基板是美國光通訊擴建的瓶頸，若定價權提升仍有大幅重估空間。","risk":"淪為中美談判籌碼","s":{"AXTI":"bull"},"text":"@TradingTh3Trend Glad $AXTI also went up +12.4% today. It's probably being used like a chess piece in terms of Xi + Trump discussions right now.\n\nSince InP substrates would bottleneck the optical buildout by the US for AI.\n\nBut if they have more control over pricing... I do think there's a lot of room for rerating.","likes":91},{"id":"2102070202779492802","author":"aleabitoreddit","date":"2026-09-21","zh":"反駁看空報告：Nebius 融資方式比 CoreWeave 等新雲端更可持續，且已調漲租價 17–21%，ClickHouse、Avride 等子公司價值常被忽略。","risk":"","s":{"CRWV":"neutral","NBIS":"bull"},"text":"@mengxiong715781 ridiculous report. The way $NBIS does financing is much more sustainable than $CRWV and other neoclouds.\n\nThere were also claims about falling GPU pricing but Nebius hiked rates by like 17-21% (oracle also hiked pricing for 4+ year equipment).\n\nSum of parts is also something many analysis miss, Clickhouse would likely drive a lot of value to nebius. As well as Avride (with Uber) + their other companies.","likes":85},{"id":"2102073980559692168","author":"michaelsikand","date":"2026-09-21","zh":"Michael Sikand認為Muse等消費級AI代理帶來的CPU需求遠超預期。","risk":"","s":{"AMD":"bull","ARM":"bull","INTC":"bull","QCOM":"bull"},"text":"Do you guys remember when CPU ripped when agentic AI demand saw the ratio go 6:1 per GPU?\n\nI really don't think consumer adoption was factored into those projections with the rise of Muse and Grokbot. \n\nCould be an order of magnitude higher. \n\n\n$ARM\n \n$INTC\n \n$QCOM\n \n$AMD","likes":135},{"id":"2102077552168993116","author":"Balder13946731","date":"2026-09-21","zh":"Balder：$SPCX行情應該結束了，納入QQQ權重翻倍後將迎來下一波解禁。","risk":"解禁賣壓","s":{"QQQ":"neutral","SPCX":"bear"},"text":"$SPCX\n 应该结束了，在 \n$QQQ\n 比重翻倍以后，后续会引来下一波解禁 所以小心一点哦。","likes":60},{"id":"2102091972131393869","author":"ren_stocks","date":"2026-09-21","zh":"Ren：年初就因代理式AI持有ARM、INTC、AMD等CPU股，並非跟風。","risk":"","s":{"AMD":"bull","ARM":"bull","INTC":"bull"},"text":"$INTC\n \n$AMD\n \n$ARM\n\n\nI see a lot of people piling into the CPU trade as if it were something new.\n\nDudes, I've been talking about agentic AI since the beginning of the year. I've owned CPU names like \n$ARM\n, \n$INTC\n and \n$AMD\n, not because they were popular, since memory and photonics were getting all the attention, but because from where I'm sitting, agentic AI is impossible to ignore.\n\nThis is the one that's coming for your jobs, so be ready to use it well rather than be replaced by it.\n\nMeta's Muse is just the latest and most obvious iteration of what has been brewing since the start of the year.\n\nThe lesson here is that you don't have to be in the hottest trend of the week. You just have to get the direction right for the next three years to come out ahead.\n\nBullish on the AI buildout!","likes":133},{"id":"2102095491538509883","author":"Franktradinglog","date":"2026-09-21","zh":"Frank trading買入$SHOP半天後，Shopify就與Muse達成合作。","risk":"","s":{"SHOP":"bull"},"text":"在我买入 \n$SHOP\n 后半个交易日，SHOP即和MUSE达成合作。","likes":36},{"id":"2102106853828387005","author":"michaelsikand","date":"2026-09-21","zh":"Michael Sikand：FinX散戶搶先布局$META，消費型交易散戶才有優勢。","risk":"","s":{"META":"bull"},"text":"FinX with a huge win today on \n$META\n after getting trounced last few months. So many accounts on here front ran the move.\n\nFor a consumer trade like this, it's retail who has edge as we're the ones actually using products like Muse. Wall St is trying to catch up to us now.","likes":109},{"id":"2102118068222820671","author":"michaelsikand","date":"2026-09-21","zh":"Michael Sikand：散戶要善用使用最新AI產品的優勢，在機構之前布局$META。","risk":"","s":{"META":"bull"},"text":"If you didn't hit a lick on \n$META\n today you're not exploiting your edge as a retail investor. \n\nThat means using the latest AI products, forming your POV, and positioning before the suits realize.","likes":157},{"id":"2102121306099724357","author":"Balder13946731","date":"2026-09-21","zh":"Balder：$META當日到期選擇權暴漲885倍。","risk":"","s":{"META":"neutral"},"text":"$META\n 0DTE 的期权暴涨885倍 这么癫吗？","likes":49},{"id":"2102133567446728968","author":"ren_stocks","date":"2026-09-21","zh":"Ren：Dreamforce結論是做好AI不必放慢，Muse就是最佳證明。","risk":"","s":{"META":"bull","NVDA":"bull"},"text":"$NVDA\n \n$META\n\n\nThe biggest takeaway from Salesforce's Dreamforce last week, where Jensen, Sam and Dario all spoke, was that doing AI right doesn't require slowing down.\n\nJensen said it best: \"Go as fast as we can, but not faster than we should.\"\n\nIn other words, you don't have to pace the frontier to get it right. You adjust as you go.\n\nZuckerber's Muse is the best proof of this, if you want to get something done, do it, don't talk about it.\n\nBullish","likes":16},{"id":"2102158130620837926","author":"Balder13946731","date":"2026-09-21","zh":"Balder：長短線機器人分別抓到今天最強的$META與$ARM。","risk":"","s":{"ARM":"bull","META":"bull"},"text":"长线机器人和短线机器人分别抓住了今天最强势的两个股票 \n$META\n \n$ARM","likes":33},{"id":"2102162571394740433","author":"michaelsikand","date":"2026-09-21","zh":"Michael Sikand：Muse不會侵蝕Meta廣告營收，反而是純增量；Google的搜尋廣告可能被顛覆。","risk":"Google廣告被顛覆","s":{"GOOGL":"bear","META":"bull"},"text":"I think the most bullish part of \n$META\n is that an AI product in no way cannibalizes ad revenue.\n\nPeople go to \n$META\n for entertainment, not information like \n$GOOG\n which could see ads disrupted. So it's pure upside on a brand new product that will complement the core business.","likes":396},{"id":"2102164656425160919","author":"ren_stocks","date":"2026-09-21","zh":"Ren稱讚自己Discord社群的選股能力。","risk":"","s":{"AAOI":"neutral","AMD":"neutral","LITE":"neutral","MU":"neutral","NBIS":"neutral","SNDK":"neutral"},"text":"$AMD\n \n$MU\n \n$SNDK\n \n$NBIS\n \n$LITE\n \n$AAOI\n\n\nYou think you're good, then you meet people who absolutely mog you.\n\nBrother, the people in my Discord are genuinely insane. So proud to have built one of the highest-alpha communities I've ever been part of.\n\nGet the direction right, the market does the rest.","likes":125},{"id":"2102200852744376655","author":"michaelsikand","date":"2026-09-22","zh":"Michael Sikand參加高通驍龍峰會，$QCOM大漲近10%，將挖掘其在AI、穿戴與機器人的機會。","risk":"","s":{"QCOM":"bull"},"text":"Just arrived in Maui for \n$QCOM\n Snapdragon Summit.\n\n\n$QCOM\n exploded nearly 10% today along with other CPU players!\n\nSo this week I'll be hunting for asymmetric upside around \n$QCOM\n's role in AI, wearables, robotics and more. \n\nEven interviewing the CFO for deeper insights.","likes":149},{"id":"2102202440653369660","author":"Balder13946731","date":"2026-09-22","zh":"Balder：$AMD市值破兆美元，$MRVL的大行情才剛開始。","risk":"","s":{"AMD":"bull","MRVL":"bull"},"text":"$AMD\n 已经达到1万亿美元，然而 \n$MRVL\n 的星辰大海才刚刚开始","likes":107},{"id":"2102204908414108068","author":"Balder13946731","date":"2026-09-22","zh":"Balder：新高靠輪動，週二QCOM、BABA有大會，週三META有發表，不用急著走。","risk":"","s":{"BABA":"bull","META":"bull","QCOM":"bull"},"text":"新高通常是轮动轮上去的，周二 \n$QCOM\n \n$BABA\n 有大会，周三 \n$META\n 有发布。\n\n所以大家不用急着走哦🫪","likes":51},{"id":"2102206142956839081","author":"ren_stocks","date":"2026-09-22","zh":"Ren：企業AI預算進入重視投資報酬的階段，早期採用者更懂如何讓AI有用。","risk":"","s":{"AMD":"bull","CRWV":"neutral","NBIS":"neutral","NVDA":"bull"},"text":"$NVDA\n \n$AMD\n \n$NBIS\n \n$CRWV\n \n\nIn corporate this budget season was different.\n\nWe're now tracking the right metrics so that every dollar spent on AI earns a proper return.\n\nThe MVP phase is over, and early adopters now have a much more robust understanding of what makes AI actually useful: the underlying data, the right architecture, the processes built around it, and the people who know how to use it.\n\nUse cases with proper ROI, become recurring spend lines.\n\nBullish","likes":35},{"id":"2102207465408671751","author":"ren_stocks","date":"2026-09-22","zh":"Ren：可能要加碼$META。","risk":"","s":{"META":"bull"},"text":"I might need to up my \n$META\n shares.\n\nThis guy has proper game.","likes":196},{"id":"2102221481736646965","author":"ren_stocks","date":"2026-09-22","zh":"Ren開玩笑說Muse代理可能讓INTC財報買權翻十倍或腰斬。","risk":"","s":{"INTC":"neutral","META":"neutral"},"text":"@bubbleboi\n x \n$META\n Muse \n\nIs the crossover we didn't know we needed.\n\nThis autonomous agent will either 10x your \n$INTC\n calls into earnings or cut them in half.\n\n\n@alexandr_wang\n, how long to make this happen?","likes":20},{"id":"2102247915251224980","author":"aleabitoreddit","date":"2026-09-22","zh":"Meta Muse 表現亮眼，長任務大量吃 CPU 與記憶體；Intel 稱 CPU 只能滿足五成需求，利多 AMD/Intel/Arm。","risk":"CPU 需求能否持續待驗證","s":{"AMD":"bull","AMZN":"neutral","ARM":"bull","INTC":"bull","META":"bull","NBIS":"neutral"},"text":"All right \n$META\n Muse is cooking. \n\nI can hear all the \n$AMD\n, \n$INTC\n, and \n$ARM\n CPUs vrrrring in the background.\n\nAlong with the memory + components (NICs, SSDs, DRAM) needed for all the browsers/VMs\n\nWhen I ask it to do a bunch of long form tasks… \n\nIntel CEO also said recently that CPU demand is so strong they can only support 50% of what customers need, so there’s some signals there.\n\nI’m also curious how much \n$AMZN\n or \n$NBIS\n is involved with running Muse, or if Meta hosts everything inhouse.\n\nKinda an ADHD post but Meta beat my expectations with this release.\n\nWill keep trying it out","likes":1460},{"id":"2102256045938852015","author":"aleabitoreddit","date":"2026-09-22","zh":"比特幣與以太幣強彈，Robinhood、Coinbase 回溫；加密幣常領先高 beta AI 股，市場風險胃口回來。","risk":"升息環境下反彈可能短暫","s":{"COIN":"bull","HOOD":"bull"},"text":"Wow Bitcoin + Ethereum pulled pretty extreme recoveries.  \n\nLooks like \n$HOOD\n / \n$COIN\n / Crypto is back? \n\nOn-chain equities trading + regulator exemptions probably put a lot of fuel into the fire for the sector.  \n\nThat aside... crypto is usually a great indicator for high-beta AI equities believe it or not (they tend to frontrun broader market drops or rallies). \n\nSo overall market risk appetite might be coming back despite the rate hikes.","likes":1092},{"id":"2102371692106695149","author":"aleabitoreddit","date":"2026-09-22","zh":"整理從微軟 Maia 到 Google TPU 的 ASIC 供應鏈。","risk":"無","s":{"MSFT":"neutral"},"text":"ASIC supply chain from $MSFT Maia to $GOOGl TPUs +…","likes":205},{"id":"2102391630515110126","author":"aleabitoreddit","date":"2026-09-22","zh":"傳統價值投資式微；ESMT 營收年增 605%、年化本益比僅 1.8 倍，爭點只在成長能延續多久。","risk":"高成長持續性存疑","s":{"ESMT":"bull","PYPL":"neutral","UPWK":"neutral"},"text":"I feel like traditional \"value investing\" went into hibernation.\n\nBefore it was finding a 10x -12x P/E company like \n$UPWK\n or \n$PYPL\n, Dominoes, Pepsi. Or even a cheap Japanese company below book value.\n\nThen just enjoying slow growth but buyback/dividend appreciation from their cashflow. \n\nNow you can find 1.8x runrate P/E company like $ESMT that grew revenue 605.24% Y/Y. \n\nAnd the main thing you need to argue about is duration. \n\nOr a 16.2x trailing P/E Sumitomo, despite having way too many hyperscaler LTAs in AI from fiber to lasers. \n\nAI created much bigger medium-term anomaly, where \"value investing\" went towards high growth, \"deep value\" companies.","likes":797},{"id":"2102414336065257596","author":"octopusycc","date":"2026-09-22","zh":"大老师認為油價、通膨與升息鏈條可能出現拐點，霍爾木茲海峽有望恢復通航。","risk":"","s":{"AAPL":"neutral"},"text":"我现在越来越觉得，这轮市场真正的拐点，可能已经开始出现了。\n\n过去几个月市场交易的是一条很简单的链条：\n\n霍尔木兹受阻 → 原油高位 → 通胀重新抬头 → 全球央行被迫加息 → 风险资产承压。\n\n但最近几天，这条链条开始出现了一股完全相反的力量。\n\n美联储加息已经落地，日本央行也继续加息。\n\n当高油价真的开始传导到通胀、利率和经济之后，美日韩对于原油问题的态度明显变得更紧迫。\n\n美国持续释放战略石油储备，日本已经动用库存保障供应，韩国甚至开始讨论参与霍尔木兹海峡的航运安全。\n\n更值得注意的是外交端。\n\n中国和伊朗谈，核心议题之一就是尽快恢复霍尔木兹海峡通航；\n\n美伊重新出现谈判窗口，伊朗甚至提出，如果美国缓和军事压力、解除港口封锁，可以在一周内重新开放霍尔木兹；\n\n接下来的中美会谈，伊朗和能源问题同样绕不开。\n\n所以我现在看这些事情，不会把它们拆开。\n\n真正的拐点，不是哪一场和谈。\n\n而是当高油价最终逼到通胀和加息这一步之后，各方第一次都有足够强的动力，让原油重新下来。\n\n今天市场其实已经开始交易这股“反向力量”：\n\n霍尔木兹缓和 → 原油回落 → 通胀预期降温 → 加息压力边际下降 → 风险资产重新获得支撑。\n\n如果这个逻辑继续兑现，我认为接下来最值得交易的，可能已经不是继续追高原油，而是寻找这轮宏观拐点之后的反向机会。\n\n————————————\n\n最近正好 MSX 在做「秋日淘金」活动，RWA 现货和合约交易都能参与，奖池 50,000 USDT，还有 iPhone DUO / iPhone 18 Pro、$APPL 和限定金钞等奖励。\n\n活动一、金秋现货礼｜瓜分10,000 USDT，最高领 300 USDT\n总奖池：10,000 USDT 合约体验金\n规则：活动期间，累计RWA现货交易量 ≥ 100 USDT，即可参与对应档位奖池瓜分，单人最高可得300 USDT合约体验金！\n\n活动二、金秋合约礼｜竞逐 40,000 USDT，赢 iPhone Duo 与限定金钞\n活动期间，累计合约交易量达到指定门槛，即有机会赢 iPhone DUO及MSX 限定金钞等豪礼，总奖池价值 40,000 USDT！\n\n活动三、金秋幸运礼｜惊喜加码，抽 MSX 限定周边\n活动期间，满足以下任一条件，即可自动获得抽奖资格，无需手动参与抽奖：\n• 累计RWA现货交易量 ≥ 100 USDT；\n• 累计合约交易量 ≥ 1,000 USDT。","likes":21},{"id":"2102427727987179692","author":"aleabitoreddit","date":"2026-09-22","zh":"戲稱 SanDisk 與 Lumentum 成了「超級智慧概念股」。","risk":"題材炒作退燒","s":{"LITE":"bull","SNDK":"bull"},"text":"I guess I need to start calling \n$SNDK\n or \n$LITE\n Super Intelligence stocks.\n\nThanks Trump.","likes":1004},{"id":"2102440858314281032","author":"KawzInvests","date":"2026-09-22","zh":"KawzInvests：市場恐慌AI放緩時，Anthropic正與$RUM簽算力合約。","risk":"","s":{"RUM":"bull"},"text":"I find it so funny that FinX spent all of last week panicking about Pacing the Frontier while Anthropic was signing a compute deal with \n$RUM\n \n\nLike bruh.","likes":41},{"id":"2102476258336747908","author":"michaelsikand","date":"2026-09-22","zh":"Michael Sikand：消費級AI代理是新戰場，CPU與支付股受惠，比價平台受威脅。","risk":"AI代理取代平台","s":{"APP":"neutral","ARM":"bull","BKNG":"bear","CART":"neutral","DASH":"neutral","EXPE":"bear","GOOGL":"neutral","INTC":"bull","MA":"bull","META":"bull","TTD":"neutral","UBER":"neutral","V":"bull"},"text":"The agentic supercycle of AI is here. \n\nSo what's going to happen next.\n\nConsumer agents are the new battleground in AI. Expect OAI and Anthropic to drop their Muse/Grokbot competitor in coming weeks. Let's not forget OAI bought OpenClaw.  \n\nWhat happens?\n\nHardware: Most direct beneficiaries are the CPU names, many far off ATH like \n$INTC\n, \n$ARM\n. \n\nPayments: I see \n$V\n  \n$MA\n  \n$Shop\n/Paypal/Stripe as winners of agentic commerce \n\nBooking Aggregators = Losers. Feels like travel sites are clear losers with margin compression and increased comparison shopping \n$BKNG\n \n$EXPE\n \n\nConsumer Intent Advertising: While ad platforms like \n$META\n and \n$APP\n will thrive with entertainment first ad consumption, there will be increased pressure on \n$GOOG\n search or aggregators that are increasingly margin dependent on ad revenue in app based on humans using their interfaces \n$TTD\n \n$CART\n \n$DASH\n \n$UBER","likes":115},{"id":"2102478316179689589","author":"Balder13946731","date":"2026-09-22","zh":"Balder：$QQQ盤中創歷史新高。","risk":"","s":{"QQQ":"bull"},"text":"$QQQ\n 盘中刷新历史新高。","likes":25},{"id":"2102487275875811574","author":"Balder13946731","date":"2026-09-22","zh":"Balder：$AMD本週看700，年內看1000。","risk":"","s":{"AMD":"bull"},"text":"$AMD\n 我们这周看700，年内看1000","likes":90},{"id":"2102493972115677608","author":"DJTRadar","date":"2026-09-22","zh":"DJT Radar：川普7月多次買入$MSTR，自7/24以來上漲83%。","risk":"","s":{"MSTR":"neutral"},"text":"Trump bought \n$MSTR\n multiple times in July.\n\nIt's up 83% since the July 24 purchase.","likes":861},{"id":"2102495694087164323","author":"Balder13946731","date":"2026-09-22","zh":"Balder演算法日誌：$SOXS停損5.32%，持有BAC。","risk":"","s":{"SOXS":"bear"},"text":"平仓亏损 1 \n$SOXS\n 34.93→33.07 -5.32%\n\n 持仓 BAC 57.73→56.2 -2.7%\n\n balder-algo-logs · 龙气 · 09-22 · algo log · not advice","likes":7},{"id":"2102497017536893234","author":"Balder13946731","date":"2026-09-22","zh":"Balder：Muse等應用都指向CPU需求，$INTC、$AMD可能走出奇蹟行情。","risk":"應用熱潮曇花一現","s":{"AMD":"bull","INTC":"bull"},"text":"其实我们需要非常关注类似于Muse和Jev这一类应用，虽然我们知道目前的爆火，极有可能是昙花一下。\n\n但是大家还记得Sora吗？他虽然死了，但是他引爆的内存和光的行情却硕果累累。\n\nJev和Muse都不约而同地指向CPU，这极有可能意味着类似于 \n$INTC\n \n$AMD\n 也会走出奇迹般的行情。\n\n6个月后再来回顾这个帖子，谢谢。","likes":103},{"id":"2102524074790658321","author":"Balder13946731","date":"2026-09-22","zh":"Balder：本週有$COST財報。","risk":"","s":{"COST":"neutral"},"text":"这周有 \n$COST\n 的财报。","likes":7},{"id":"2102538320253444325","author":"Balder13946731","date":"2026-09-22","zh":"Balder：四大科技股已無明顯估值差，但META可能開始享有AI溢價。","risk":"","s":{"AMZN":"neutral","GOOGL":"neutral","META":"bull","MSFT":"neutral"},"text":"好吧，我回头分析了一下，其实 \n$GOOG\n \n$AMZN\n \n$MSFT\n \n$META\n 现在已经没有明显的估值差距了。由于持续的反弹和上涨， \n$GOOG\n 原来包含的大模型溢价几乎被挤掉了。目前：\n\nMETA < MSFT ≈ GOOG < AMZN\n\n但是 \n$META\n 可能会开始有AI溢价，否则的话，买他们的之中任意一个应该差不多。","likes":83},{"id":"2102569588433334309","author":"aleabitoreddit","date":"2026-09-23","zh":"記憶體長約延至 2031 年，博通、Nvidia 都預期受產能限制的高成長，Sivers 執行長稱雷射供需失衡至少 3–5 年。","risk":"需逐年重新評估","s":{"AVGO":"bull","NVDA":"bull","SIVE":"bull"},"text":"@ardninja Memory LTAs span until 2031. $AVGO expects 100% supply constrained growth Y/Y for next 2 years.\n\n$NVDA expects 70% supply constrained growth next year (implying year after that demand keeps up).\n\n$SIVE CEO said there's a massive demand supply imbalance for lasers for at least the next 3-5 years.\n\nI think semi supply chain growth needs to be re-accessed year by year, but at least for the next year and half I see unprecedented growth.","likes":186},{"id":"2102625462069637371","author":"aleabitoreddit","date":"2026-09-23","zh":"探討 Meta Muse 可能帶動的 CPU 設計商交易機會。","risk":"無","s":{"META":"neutral"},"text":"As for a potential Muse trade, $META CPU designer …","likes":281},{"id":"2102643241187414272","author":"DJTRadar","date":"2026-09-23","zh":"DJT Radar：川普投資Intel當天投入10萬美元，現值48.7萬美元。","risk":"","s":{"INTC":"bull"},"text":"If you invested $100K the day Trump invested in Intel \n$INTC\n you would have $487,000 right now.\n\nThis is why we say tracking his moves is one of the most profitable ways to invest, and it's exactly why we're here.\n\nFollow along!","likes":8103},{"id":"2102726669115281419","author":"asklivermore","date":"2026-09-23","zh":"AskLivermore列出台灣出生CEO領導的公司，如NVDA、AMD、SMCI等。","risk":"","s":{"AAOI":"neutral","AMD":"bull","ASX":"neutral","DIOD":"neutral","GRMN":"neutral","NVDA":"bull","SMCI":"neutral","TSM":"neutral"},"text":"If you have a Taiwanese CEO, you're going to be a millionaire. \n\n1. \n$NVDA\n (NVIDIA) - led by co-founder and CEO Jensen Huang (born in Taipei).\n\n2. \n$AMD\n (Advanced Micro Devices) - led by CEO and Chair Dr. Lisa Su (born in Tainan).\n\n3. \n$SMCI\n (SuperMicro Computer) - led by co-founder, CEO, and Chair Charles Liang (born in Chiayi).\n\n4. \n$GRMN\n (Garmin) - co-founded by Executive Chairman Dr. Min Kao (born in Jhushan).\n\n5. \n$DIOD\n (Diodes) - long led by Dr. Keh-Shew Lu, with current CEO Gary Yu continuing its Taiwanese leadership heritage.\n\n6. \n$AAOI\n (Applied Optoelectronics) - led by founder and CEO Dr. Chih-Hsiang (Thompson) Lin.\n\n7. \n$TSM\n (Taiwan Semiconductor Manufacturing) - founded by Morris Chang and currently led by CEO Dr. C.C. Wei.\n\n8. \n$ASX\n (ASE Technology) - world's largest chip packaging firm, founded by brothers Jason and Richard Chang.\n\nI hope they make a Taiwanese CEO ETF one day.","likes":1003},{"id":"2102763548715753927","author":"aleabitoreddit","date":"2026-09-23","zh":"ECOC 更新：Nvidia Spectrum-6 CPO 對 UHP 雷射需求大增、雷射供不應求漲價；穩懋擴產，利多 Sivers 多波長雷射。","risk":"產能擴充後供需反轉","s":{"ASML":"neutral","LITE":"bull","NVDA":"bull","SIVE":"bull"},"text":"So update from \n$LITE\n + Win Semi ( $SIVE ) foundry:  \n\nLumentum in a meeting with Stifel at ECOC 2026 stated:\n\n- \n$NVDA\n Spectrum-6 CPO UHP demands increased materially. \n- NPO as larger than CPO, with multi-wavelength external lasers lifting ASPs (Sivers offers multi wave length DFB arrays, read through on higher valued products)\n- Demand for UHP lasers continues to exceed supply\n\nJust a status update in terms of how the optical bottleneck is going (laser prices going up, demand exceeds supply).  \n\nDigitimes also reported today Win Semi ( $SIVE foundry ) was expanding capacity for CW lasers.\n\n- \"CW products... are expected to gradually emerge in the second half of 2026\", with meaningful revenue contribution likely coming in 2027 and 2028.\n- Win has strengthened inventory management for InP substrates while moving toward 6-in InP wafers for ongoing process testing. Currently relies on Tier-1 International suppliers.  \n- Many of this was spent on DUV tools from \n$ASML\n but (Win Semi's orders spanned machinery, equipment, and fab engineering work)\n\nSo that answers a lot of questions about Sivers' partner \"how is this company securing InP substrates\", \"4in vs 6in\", \"production timing","likes":891},{"id":"2102766392336580670","author":"aleabitoreddit","date":"2026-09-23","zh":"看到 LPK 新聞，會再研究對手是誰。","risk":"無","s":{"LPK":"neutral"},"text":"Yep, just saw the news on $LPK! I'll do some digging to see if I can find out who it is","likes":114},{"id":"2102790422007550083","author":"aleabitoreddit","date":"2026-09-23","zh":"近期布局多檔韓國小型供應商（供應美光、海力士、三星），因 AI 而拐點向上，但不公開名單。","risk":"小型股波動與風險極大","s":{"MU":"bull","SKHY":"bull","SMTC":"bull"},"text":"I’ve actually entered positions in many tiny Korean companies recently…\n\nThat actively supply memory, test, machines, etc. to \n$MU\n, \n$SKHY\n, Samsung, and others like \n$SMTC\n + US companies.\n\nIt’s pretty interesting what you find in the $30-$250m range for optical components, CPUs, memory, and others that are inflecting due to AI.\n\nI don’t share these names publicly since risks/volatility is enormous. \n\nBut one or two going from $40M -> $400m makes the risk/reward worth it for me personally.","likes":1080},{"id":"2102793298561970218","author":"aleabitoreddit","date":"2026-09-23","zh":"作者已進入論點追蹤期，上半年已提出主要標的；近期新增的只有 ESMT（舊世代記憶體）與 CCXI（人形機器人）。","risk":"","s":{"AAOI":"neutral","ARM":"neutral","AXTI":"neutral","CCXI":"bull","ESMT":"bull","INTC":"neutral","MU":"neutral","NBIS":"neutral","SIVE":"neutral"},"text":"@degenlurker_ It’s mainly thesis tracking mode now since I layed out most of my ideas H1 from $INTC, $ARM to $MU. Or $SIVE to $AAOI or $AXTI or $NBIS\n\nOnly two recent ones were $ESMT for legacy memory trade and $CCXI for humanoids but aside from that it’s just seeing if they get validated over time\n\nStuff like large body substrates or CXL or MLCC with newer discovery, I’ve already published earlier on","likes":159},{"id":"2102848921274138649","author":"michaelsikand","date":"2026-09-23","zh":"Michael Sikand：AI穿戴裝置將大爆發，全都採用$QCOM晶片。","risk":"","s":{"QCOM":"bull"},"text":"The next iPhone moment is coming.\n\nThe amount of new AI wearables we're about to see in the next year will be WILD and all will be \n$QCOM\n powered. \n\nAt \n$QCOM\n Snapdragon Summit, a Google exec just teased upcoming AI glasses running Snapdragon AR1.","likes":305},{"id":"2102860366585987581","author":"Balder13946731","date":"2026-09-23","zh":"Balder演算法日誌：持有BAC、CRCL、CRWV、LMT、ORCL，小幅虧損。","risk":"","s":{"BAC":"neutral"},"text":"今日无平仓\n\n 持仓 \n$BAC\n 57.73→56 -3.0% · CRCL  92.26→91.72 -0.6% · CRWV  87.53→86.9 -0.7% · LMT  531.71→524.68 -1.3% · ORCL  145.7→144.56 -0.8%\n\n balder-algo-logs · 龙气 · 09-23 · algo log · not advice","likes":9},{"id":"2102887916955656541","author":"michaelsikand","date":"2026-09-23","zh":"Michael Sikand問大家偏好$ALAB還是$CRDO銅纜股。","risk":"","s":{"ALAB":"neutral","CRDO":"neutral"},"text":"$ALAB\n vs. \n$CRDO\n\n\nWhich is your favorite copper pick?","likes":177},{"id":"2103117708305014884","author":"Balder13946731","date":"2026-09-24","zh":"Balder：做$MCD、$BAC超跌反彈最好等開盤明顯反彈，RSI加反彈策略10日勝率高。","risk":"低IV易被洗出場","s":{"BAC":"bull","MCD":"bull"},"text":"如果要做 \n$MCD\n \n$BAC\n 的超跌反弹，最好是能看到开盘明显的反弹迹象；因为他们的IV很低，如果时机不把握好，很容易把你洗掉。这个RSI+反弹放到10个交易日，胜率其实很高，edge为3.5%。","likes":17},{"id":"2103119051589558668","author":"Balder13946731","date":"2026-09-24","zh":"Balder：$AMD空頭的快樂只有一兩天，多頭的快樂是永遠的。","risk":"","s":{"AMD":"bull"},"text":"$AMD\n 空头快乐的日子通常只有一两天，而我们快乐的日子是永远的🫪","likes":46},{"id":"2103126833244102923","author":"KawzInvests","date":"2026-09-24","zh":"KawzInvests：年初大家恐慌Meta算力過剩，如今又全都愛$META，市場記憶很短。","risk":"","s":{"META":"neutral"},"text":"Remember earlier this year when everyone was panicking that Meta had built too much compute and was trying to sell the excess?\n\nNow everyone loves \n$META\n again lol.\n\nFinX has a very short memory.","likes":63},{"id":"2103135209767981198","author":"KawzInvests","date":"2026-09-24","zh":"KawzInvests：AMD對2030年伺服器CPU市場預估一路從600億上調到逾2200億美元，且都在Muse推出前。","risk":"","s":{"AMD":"bull","META":"neutral"},"text":"Kind of crazy how quickly the CPU story has changed.\n\nLast August, Lisa Su said “each token generated by a GPU triggers multiple CPU-intensive tasks.”\n\nThree months later, \n$AMD\n put the 2030 server CPU market at $60B.\n\nBy May, it was $120B.\n\nBy August, more than $220B.\n\nAnd all of that happened before \n$META\n launched Muse.\n\nIf consumer agents that run browsers, use tools, and complete tasks actually reach scale, it is hard to believe $220B will be the last revision.","likes":112},{"id":"2103139052363133062","author":"aleabitoreddit","date":"2026-09-24","zh":"Nebius 相對強勢驚人，類股下跌時仍漲 6%；作者早已把新雲端論點集中到 Nebius。","risk":"甲骨文等大案延宕衝擊類股","s":{"CRWV":"neutral","IREN":"neutral","NBIS":"bull"},"text":"Wow \n$NBIS\n relative outperformance is wild. \n\nBack in 2025 I wrote my Neocloud thesis on \n$IREN\n to \n$CRWV\n. But I made the decision months later to consolidate it all into Nebius...\n\nDespite the the hate from FinX back then.\n\nVery interesting to see Nebius up 6% even during sector drop…\n\nAfter Oracle was reportedly seeking payment protection if Project Jupiter misses its 2028 opening.\n\nWith Oracle:\n\n\"seeking to protect itself from potential cost increases related to a large DC ​project in New Mexico by sending a force majeure notice\" per Reuters. \n\nLot of new people like to piggyback after it’s up a lot, but there was a lot less people bullish back in 2025. \n\nEspecially during the period with a ton of institutional short sellers back in December. \n\nI still think markets might be underestimating sum of parts growth, even if its core business grows like crazy 2027+ onwards.","likes":1147},{"id":"2103142262729556021","author":"aleabitoreddit","date":"2026-09-24","zh":"表示已與 IREN 和解。","risk":"無","s":{"IREN":"neutral"},"text":"Good times, I've made amends with \n$IREN\n though","likes":56},{"id":"2103142451020267583","author":"aleabitoreddit","date":"2026-09-24","zh":"仍持有 CCXI，掛牌前的波動不具意義。","risk":"掛牌前波動大","s":{"CCXI":"bull"},"text":"I still have \n$CCXI\n, they haven't even had the listing event yet, so volatility up until then is kinda meaningless to me.","likes":77},{"id":"2103144796110061704","author":"aleabitoreddit","date":"2026-09-24","zh":"IREN 完成 60 億 ATM 後股價表現可望轉佳，收購 Mirantis 補上軟體護城河是最大利多。","risk":"ATM 仍完成約四成","s":{"CRWV":"neutral","IREN":"bull","NBIS":"neutral"},"text":"@fichgarciapinto I would have a much more favorable view on $IREN after they finish their $6B ATM in terms of stock performance (I think they're like 41.5% through).\n\nI think Mirantis acqusition would materially shift a lot of perception of how they rank relative to $CRWV, $NBIS, Lambda, Tensorwave, and others in terms of cluster performance once they finish integration.\n\nI've always started software side of things is actually a moat (backing up what Coreweave CEO was saying), which was what $IREN lacked before.\n\nBut M&A to get that gap fixed is probably the most bullish part of what they've done.","likes":83},{"id":"2103151990146801812","author":"aleabitoreddit","date":"2026-09-24","zh":"批評 AAOI 一再 ATM 增資形成賣壓、股價難突破；讚賞 AXTI 以長約預付款籌資擴產。","risk":"AAOI 持續稀釋股權","s":{"AAOI":"bear","AXTI":"bull","IREN":"bear","NVDA":"neutral","SNDK":"bull"},"text":"$AAOI\n has finished a $500m ATM In April.. $600m ATM in June. Then filed another $600m in August. \n\nIt's out of my control if management wants to abuse this trash repeated ATM structure. Instead following \n$AXTI\n like LTA prepayments and using that to fund buildout.\n\nOr taking private placements like \n$NVDA\n + Nebius for $2B and using that to fund buildout.\n\nOr convertible notes at 40% premiums.\n\nIt's really hard for the stock to break out of $100 or $150 or $200 if there's $600M of selling pressure at those levels (and maybe expectations of future ATMs). \n\nI had the same criticism with \n$IREN\n with their $6B ATM, which is why it's been rangebound for half a year. And I'll say the same thing with my own thesis names too.  \n\nI see \n$AAOI\n operationally very bullish for 2027, with $471m/month transceiver revenue. 400k ELSFP units/month entering 2028. \n\nThe revenue ramp is absurd and can compress to single digit forward P/E. \n\nBut I find it hard to get excited over funding infinite ATMs during the buildout, when you're sacrificing opportunity cost with names currently profitable like \n$SNDK\n or Samsung. \n\nI think a lot of retail investors conflate stock performance with how a company ","likes":1682},{"id":"2103156967053394241","author":"aleabitoreddit","date":"2026-09-24","zh":"Lumentum 主要靠營運現金流擴產，預期 AAOI 在 2027 上半年放量後也會跟進；先前批評的是融資方式。","risk":"2026 高資本支出期","s":{"AAOI":"neutral","COHR":"neutral","LITE":"neutral","NVDA":"neutral"},"text":"@ANoelGC I mean $LITE / $COHR did have $NVDA funding $2B for their buildout.\n\nBut Lumentum seems primarily self-funded from operating cash flow. So I'd expect $AAOI to follow suit once they start ramp up around H1 2027.\n\n2026 is just that high capex buildout period. My criticism was over visibility and financing methods during this timeframe.","likes":105},{"id":"2103161145934963178","author":"aleabitoreddit","date":"2026-09-24","zh":"美伊傳討論分階段協議重開荷莫茲海峽，解釋大盤突然拉升；川普期中選舉前希望股市強勢。","risk":"地緣協議破局","s":{"QQQ":"neutral","SPY":"neutral"},"text":"If you're curious about the random $SPY / $QQQ candle:\n\nJust now, “US and Iran discuss phased deal to reopen Hormuz and end US blockade\" - Reuters\n\n- \"A deal before the midterms could benefit Trump, as reopening Hormuz could ease tensions in the Gulf, contain ​oil prices and help bring down politically sensitive US gasoline prices.\"\n\n- \"Trump has said he thinks the US and Iran could reach a deal after midterm elections to Congress on November.”\n\nWould make sense for Trump to want markets as strong as possible during Midterms elections…","likes":620},{"id":"2103202078491570280","author":"michaelsikand","date":"2026-09-24","zh":"Michael Sikand：喊出Meta Muse重新評價後讓永續合約部位續抱，$META持續上漲。","risk":"","s":{"META":"bull"},"text":"One reason I think perpetual futures grow around stocks?\n\nNo time decay. After I called the \n$META\n Muse re-rate, I decided to let my position ride. \n\nNo expiry date to sweat over like with options. With perps if I see continued upside I don't have to sell.\n\n\n$META\n just won't stop.","likes":68},{"id":"2103227934983274820","author":"michaelsikand","date":"2026-09-24","zh":"Michael Sikand問大家無人機超級週期選$AVAV還是$KTOS。","risk":"","s":{"AVAV":"neutral","KTOS":"neutral"},"text":"$AVAV\n vs. \n$KTOS\n \n\nWhat's your pick to own the drone supercycle?","likes":68},{"id":"2103232350348001701","author":"aleabitoreddit","date":"2026-09-24","zh":"Akamai 與 Anthropic 簽 116 億美元 7 年運算合約，需約 55 億美元資本支出預購記憶體等元件，利多 AMD 與美光。","risk":"","s":{"AKAM":"neutral","AMD":"bull","MU":"bull"},"text":"$AKAM signs $11.6B compute deal with Anthropic for accelerated CPU workloads demands over 7 years.\n\n$AMD to $MU should be happy to hear this…\n\nAkamai ests. ~$5.5B of capex to service the $11.6B commitment. Including +$1.7B of 2026 capex specifically to pre-purchase supply chain components like memory.\n\nSo much for Anthropic/OpenAI calling for an AI slowdown?","likes":816},{"id":"2103233602721132744","author":"aleabitoreddit","date":"2026-09-24","zh":"Akamai 合約最大受惠者是 CPU（AMD 彈性最大）與記憶體（美光等），元件採購經 Jabil。","risk":"","s":{"AKAM":"neutral","AMD":"bull","ARM":"bull","INTC":"bull","JBL":"bull","MU":"bull"},"text":"@blkslymn Nope for $AKAM. But if you look at what’s needed probably CPUs/Memory #1.\n\nSo your $ARM / $INTC / $AMD thematically (AMD probably higher beta to this company in specific). Then your Samsung / $MU / SK Hynix are your obvious memory beneficiaries.\n\nComponent procurement is done through $JBL, which potentially benefits their own supply chain if they’re doing networking too.","likes":68},{"id":"2103237386054570314","author":"aleabitoreddit","date":"2026-09-24","zh":"Akamai 拿下 7 年大單，但真正受惠的可能是上游 CPU 與記憶體供應鏈。","risk":"","s":{"AKAM":"neutral"},"text":"@KhalidIshaq85 Okay thing about it for a second:\n\n$AKAM gets a big deal over 7 years. But in order to actually execute on the deal:\n\nThey gotta buy a ton of CPUs and memory… So these upstream component supply chains are probably the larger beneficiaries over the ones in the headline.\n\nBut can’t give advice in terms of buying something","likes":94},{"id":"2103250877150814578","author":"michaelsikand","date":"2026-09-24","zh":"Michael Sikand：不論下一個iPhone是什麼形態，$QCOM都會是供應商，XR是免費的上檔空間。","risk":"","s":{"QCOM":"bull"},"text":"My biggest takeaway from studying  \n$QCOM\n at their summit is that it   doesn't matter what form factor the \"next iPhone\" is. \n\nThey are going to be powering almost every company's attempt to build it. \n\nInvestors give XR no credit on the stock, but it feels like free upside.","likes":112},{"id":"2103261984318005410","author":"asklivermore","date":"2026-09-24","zh":"AskLivermore：太空股處於合理價位，可慢慢建倉；自己持有$SPCX並打算長抱。","risk":"","s":{"ASTS":"neutral","LUNR":"neutral","PL":"neutral","RKLB":"neutral","SPCX":"bull"},"text":"Space stocks are now at fairly-priced areas. Not too expensive, not too cheap.\n\nCan start building positions slowly for the future if you like this sector. I do have \n$SPCX\n in our portfolio right now, still holding since last month and plan to keep for a long-time. \n\n\n$RKLB\n, \n$PL\n, \n$LUNR\n, \n$ASTS","likes":478},{"id":"2103263113676251490","author":"asklivermore","date":"2026-09-24","zh":"AskLivermore回覆網友祝$SPCX好運。","risk":"","s":{"SPCX":"neutral"},"text":"Haha love you bro!!! Good luck on \n$SPCX\n!","likes":2},{"id":"2103263680930664472","author":"asklivermore","date":"2026-09-24","zh":"AskLivermore：買入$SPCX是基於投資組合配置考量。","risk":"","s":{"SPCX":"bull"},"text":"True. I bought \n$SPCX\n because of its stratification weightings to my portfolio (portfolio theory).","likes":0},{"id":"2103277471579709556","author":"ren_stocks","date":"2026-09-25","zh":"Ren引摩根大通模型：GPU對CPU比例將從4倍降到1.9倍，CPU需求翻倍，這還是保守估計。","risk":"","s":{"AMD":"bull","ARM":"bull","INTC":"bull"},"text":"$INTC\n  \n$AMD\n  \n$ARM\n \n\nJ.P. Morgan's model has the GPU-to-CPU ratio falling from 4.0x in 2024 to 1.9x by 2028.\n\nThe number of CPUs attached to every GPU roughly doubles in four years, from one CPU for every four GPUs to about one for every two, and that's on top of GPU shipments that are still growing every year.\n\nBelieve it or not, this is the conservative take. TrendForce expects agentic deployments to move toward one or two GPUs per CPU, and Lip-Bu Tan said at JPM's own conference that some frontier labs are telling him it's four CPUs to one GPU.\n\nEvery orchestration step and every sandbox an agent spins up runs on a CPU, and Meta just gave every Muse user their own always-on VM. The GPU does the thinking while the CPU handles everything around it, and everything around it is growing faster.\n\nBullish","likes":89},{"id":"2103472742624338339","author":"ren_stocks","date":"2026-09-25","zh":"Ren：$META本月漲35%，是2013年以來最佳月份，看好自主代理普及。","risk":"","s":{"META":"bull"},"text":"$META\n is up +35% just this month, making it the best month since July 2013.\n\nWith everyone, including my mom, talking about Meta Muse, I set out to answer what exactly it's about and how it will affect the AI trade.\n\nI'm a strong believer that autonomous agents will spread through the mainstream like wildfire.\n\nCheck out the post and find out what it means for the AI trade.\n\nCheck out my latest post on Substack to be up to date.\n\nLink in the comments","likes":45},{"id":"2103475838452969681","author":"ren_stocks","date":"2026-09-25","zh":"Ren：這人對$NBIS的看法可能是對的。","risk":"","s":{"NBIS":"bull"},"text":"$NBIS\n \n\nThis guy might be on to something...","likes":315},{"id":"2103490181525631382","author":"aleabitoreddit","date":"2026-09-25","zh":"5% 債息追不上真實通膨（三明治年漲 12%），對抗通膨最好的方式是持有股票如 SPY。","risk":"股市回檔","s":{"SPY":"bull","SUBWAY":"neutral"},"text":"People really need to stop thinking about 5% yields over 10 years or 30 years.\n\nEven the inflation of my $SUBWAY sandwich has gone up like 12% a year.\n\nToday it was like $20 after tax, when it used to be like $5… 12 years ago.\n\nThe best way to keep up with inflation of the things that matter, like Sandwiches, is equities like \n$SPY\n.","likes":1446},{"id":"2103532805112377557","author":"Balder13946731","date":"2026-09-25","zh":"Balder：下週$MU財報，這週做完CPU，下週轉戰記憶體。","risk":"","s":{"MU":"bull"},"text":"下星期有 \n$MU\n 的财报哦\n\n这星期做完CPU，下星期可以转战存储发财了","likes":107},{"id":"2103533616080855494","author":"KawzInvests","date":"2026-09-25","zh":"KawzInvests：$CRDO重回200美元，大家又喜歡這家公司了。","risk":"","s":{"CRDO":"bull"},"text":"$CRDO\n back over $200. Suddenly everyone likes the business again","likes":141},{"id":"2103557697425825960","author":"michaelsikand","date":"2026-09-25","zh":"Michael Sikand：恐慌時買進的$CRDO十天漲逾40%。","risk":"","s":{"CRDO":"bull"},"text":"Congrats to everyone who followed me into the \n$CRDO\n fear buy on my AB fund on \n@joinautopilot\n.\n\nThe stock is up over 40% in the last 10 days.","likes":183},{"id":"2103572476064305646","author":"michaelsikand","date":"2026-09-25","zh":"Michael Sikand：即將上市的Nscale幾乎沒有產能，積壓訂單卻比CRWV大。","risk":"","s":{"CRWV":"neutral"},"text":"This upcoming Neocloud IPO Nscale has almost no capacity today.\n\nBut it has a bigger backlog than \n$CRWV\n?\n\nFull research deep dive into their S-1 drops tommorow on \n@AsymmetricBets_\n.","likes":106},{"id":"2103582889770434808","author":"Balder13946731","date":"2026-09-25","zh":"Balder演算法日誌：今日無平倉，持有BAC、CRCL、CRWV、LMT、SNOW、AAOI。","risk":"","s":{"BAC":"neutral"},"text":"今日无平仓\n\n 持仓 \n$BAC\n 57.73→56.7 -1.8% · CRCL 92.26→89 -3.5% · CRWV 87.53→87.59 +0.1% · LMT 531.71→519.56 -2.3% · SNOW 329.51→335.94 +2.0% · AAOI  101.07→101.4 +0.3%\n\n balder-algo-logs · 龙气 · 09-25 · algo log · not advice","likes":5},{"id":"2103669090577784834","author":"jukan05","date":"2026-09-26","zh":"Jukan貼出$AVGO。","risk":"","s":{"AVGO":"neutral"},"text":"$AVGO","likes":301},{"id":"2103869705509388694","author":"michaelsikand","date":"2026-09-26","zh":"Michael Sikand：等$AAOI的增資賣壓消化完就會上漲。","risk":"增資稀釋","s":{"AAOI":"bull"},"text":"$AAOI\n once these bullshit ATMs get absorbed.","likes":506},{"id":"2103941380246757662","author":"michaelsikand","date":"2026-09-26","zh":"Michael Sikand：Nscale以300億估值申請上市、合約1030億美元，EV/積壓訂單僅0.28倍，遠低於CRWV、NBIS。","risk":"目前產能極少","s":{"CRWV":"neutral","IREN":"neutral","MSFT":"neutral","NBIS":"neutral","NSCL":"bull","NVDA":"neutral"},"text":"$CRWV\n is targeting 8 GW across its whole portfolio by 2030. $NSCL aims to do that from one data center.\n\nNscale filed its S-1 last week at a rumored $30B valuation with $103B in signed contracts. $88B of that is just Anthropic and \n$MSFT\n.\n\nThat's 0.28x EV to backlog. \n$CRWV\n trades at 0.92x, \n$IREN\n at 1.54x and \n$NBIS\n at 1.72x. It's extremely early though as Nscale has just 55 MW live today, a fraction of its peers. \n\nThe entire story here hinges on Monarch, a monstrous West Virginia data center running on a natural gas microgrid that accounts for 80% of the company's pipeline.\n\n\n@AsymmetricBets_\n just did a deep dive into Nscale's S-1, and several things stood out to us.\n\n\n$NVDA\n is a supplier, customer, shareholder, lease guarantor and warrant holder. Nvidia even guarantees the $860M lease on Nscale's Texas site.\n\nSheryl Sandberg and Fidji Simo joined the board this year.\n\nThe software side is interesting too. In July it bought Anyscale for $1.65B in an all stock deal. Those are the creators of Ray, the open source framework with 740M+ downloads running AI workloads across thousands of GPUs.\n\nRisks are massive too and active capacity compared to peers leaves much to be desire","likes":130},{"id":"2103957392056786984","author":"michaelsikand","date":"2026-09-26","zh":"Michael Sikand：高油價與升息下指數仍強，市場似在說不持股就只能看現金被通膨侵蝕。","risk":"","s":{"GOOGL":"neutral"},"text":"Something crazy is happening... \n\nWith how indexes have performed amid $100 oil and rate hikes the market is maybe saying something it never has before.\n\nFeels like investors are saying you're either in these stocks or just destined to watch your cash and bonds lose out to inflation.\n\nIf the 10-year is projecting inflation to rip, why would you want bonds that hardly outperform it? The Fed's hawkishness has done nothing to assuage these concerns because it's clear higher rates are not going to slow an economy this hot or solve a supply shock in energy. This is of course because higher rates don't end wars but also because the ROI on this technology investment is just that asymmetrical for the companies investing (a point Ackman made well).\n\nMeanwhile this whole historical \"risk-free\" thing with bonds feels like it's falling apart. The U.S. Government is the least credible it's ever been. And higher borrowing costs from the Fed will make it harder to finance the growing debt due to reckless spending leading to money printing and then more inflation. \n\nAt the same time large technology companies are the most credit worthy they've ever been. Even from a fixed income POV, I'd rather ow","likes":180},{"id":"2103996265105440868","author":"michaelsikand","date":"2026-09-26","zh":"Michael Sikand仍看多$META，但個人覺得Grokbot介面比Muse好用。","risk":"","s":{"META":"bull"},"text":"I'm a \n$META\n bull but I got integrated with Grokbot weeks before Muse dropped and find the UI better. I like creating dedicated AI employees running defined tasks and responsibilities versus Muse having just one agent and having these side chats. Curious if others agree.","likes":135},{"id":"2104003331656204795","author":"jukan05","date":"2026-09-27","zh":"Jukan轉述：高通正評估三星2奈米製程。","risk":"","s":{"QCOM":"neutral"},"text":"Chris Patrick, Senior Vice President and General Manager of Mobile Handsets at Qualcomm, said in an interview with the press that \"Qualcomm maintains close partnerships not only with TSMC but also with Samsung Foundry, and we are doing quite a lot of in depth work related to Samsung's 2nm process technology.\"\n\nHe added, \"We are currently at the stage of understanding and evaluating how Samsung's 2nm technology could be applied to our future products,\" and said that \"Samsung Foundry has long been a key partner for Qualcomm and will remain an important partner going forward.\"\n\n\n$QCOM","likes":226},{"id":"2104023359390638507","author":"Balder13946731","date":"2026-09-27","zh":"Balder：$SPCX、$RKLB大漲，$ASTS卻不漲很奇怪。","risk":"","s":{"ASTS":"neutral","RKLB":"bull","SPCX":"bull"},"text":"$SPCX\n \n$RKLB\n 都涨得挺厉害的， \n$ASTS\n 一点不涨大家不觉得奇怪吗🫪","likes":15},{"id":"2104309776129970184","author":"michaelsikand","date":"2026-09-27","zh":"Michael Sikand問$ASTS與$RKLB哪個造就更多百萬富翁。","risk":"","s":{"ASTS":"neutral","RKLB":"neutral"},"text":"Which of these stocks makes more millionaires? \n\n\n$ASTS\n \n$RKLB","likes":288},{"id":"2104346402495279300","author":"michaelsikand","date":"2026-09-27","zh":"Michael Sikand：高通驍龍峰會收穫很多。","risk":"","s":{"QCOM":"bull"},"text":"Incredible time at the \n$QCOM\n Snapdragon Summit.","likes":71},{"id":"2104371915385393436","author":"Balder13946731","date":"2026-09-28","zh":"Balder：中國消息通常能讓$NVDA單日漲4%以上，這次還沒反應，可能明天開盤拉。","risk":"","s":{"NVDA":"bull"},"text":"过去的历史表明中国的消息面对 \n$NVDA\n 是超级有效的，经常单日能涨4%以上，不过目前没有任何反应🫪 是明天早上开盘直接开始拉还是怎样？","likes":18},{"id":"2104404535267696859","author":"jukan05","date":"2026-09-28","zh":"Jukan：SK海力士日本廠開始動工。","risk":"","s":{"SKHY":"neutral"},"text":"KOREAN MEDIA: SK HYNIX HAS BEGUN FOUNDATION WORK FOR ITS FAB IN JAPAN.\n\n\n$SKHY","likes":389},{"id":"2104442430875472363","author":"ren_stocks","date":"2026-09-28","zh":"Ren：Jefferies報告顯示機櫃成本從GPU轉向記憶體與互連，網通占比將從8.6%升到22.4%。","risk":"","s":{"AAOI":"bull","COHR":"bull","GLW":"bull","LITE":"bull","MRVL":"bull","SIVE":"bull"},"text":"$LITE\n \n$COHR\n \n$GLW\n \n$MRVL\n \n$AAOI\n $SIVE\n\nYou're not bullish enough on interconnect. \n\nJefferies latest report is just the latest example of how the BOM is shifting massively from the GPU toward memory and then interconnect.\n\nIn today's GB300 NVL72, the GPU is 62.5% of the rack and networking just 8.6%. By the Rubin Ultra NVL576 pod, the GPU falls to 46% and networking climbs to 22.4%, because once you link eight racks into a single 576-GPU domain, the interconnect between them becomes part of the computer itself. \n\nTo put that in perspective, networking goes from roughly $5K per GPU in GB300 to about $21K in NVL576, more than 4x.\n\nBut getting the timeline right is the most important part if you want to ride each wave, and right now that wave is memory. \n\nJust look at Vera Rubin: it ramps from the second half of this year, and in Fubon's model it's the memory peak, with memory at a third of the rack thanks to HBM4, Vera's system memory and NAND. \n\nRubin Ultra NVL576 lands in the second half of 2027, and that's where networking takes over: CPO debuts in H2 2027 and scales from there. But remember, the market looks 6 to 12 months ahead, so the interconnect trade starts well before","likes":275},{"id":"2104449426710249796","author":"ren_stocks","date":"2026-09-28","zh":"Ren引Truist：AI雲端營收2030年將達2.1兆美元，推論已成主要工作負載。","risk":"","s":{"BE":"neutral","NBIS":"bull"},"text":"$NBIS\n \n$BE\n\n\nTruist estimates AI cloud revenue goes from $310B of annual run-rate in 2025 to over $2.1T by 2030, roughly 7x in five years, and they believe inference already became the bigger AI workload this year.\n\nThat lines up with what I keep saying about frontier training being a small slice of global compute: the real demand is everyone using these models every single day, and that demand doesn't stop.\n\nThe light slice in those bars is the AI clouds, names like Nebius and CoreWeave, and by my read of the chart, it grows from a sliver in 2025 to roughly 30% of the market by 2030.\n\nThe numbers imply about $21B of AI cloud revenue per gigawatt in 2030, up from about $13B today, and \n$NBIS\n raising prices on some GPU instances by 17 to 21% and on some CPU services by 25% is one sign of that pricing power.\n\nAI data center capacity goes from 24 GW to 100 GW, so we need to add more than three times what exists today in five years. Just remember that those gigawatts need power first, and where the grid can't deliver fast enough, a name like \n$BE\n comes into play.\n\nThere is no stopping this train.\n\nBullish","likes":128},{"id":"2104465156017455523","author":"asklivermore","date":"2026-09-28","zh":"AskLivermore：留意醫療保健股$XLV，正在醞釀上漲。","risk":"","s":{"ABBV":"neutral","ABT":"neutral","AMGN":"neutral","GILD":"neutral","JNJ":"neutral","LLY":"neutral","MRK":"neutral","PFE":"neutral","TMO":"neutral","UNH":"neutral","XLV":"bull"},"text":"Watch \n$XLV\n, aka healthcare stocks. \n\nTrying to set up once again at potentially more upside in the future.\n\nTop healthcare stocks include \n$LLY\n, \n$JNJ\n, \n$ABBV\n, \n$MRK\n, \n$UNH\n, \n$TMO\n, \n$AMGN\n, \n$GILD\n, \n$ABT\n, and \n$PFE\n.","likes":250},{"id":"2104466306015854659","author":"Balder13946731","date":"2026-09-28","zh":"Balder：ASML上季在歐洲賣出0台光刻機，歐洲缺席半導體黃金時代。","risk":"","s":{"ASML":"neutral"},"text":"$ASML\n 最新一个季度在欧洲售出了0台光刻机。\n\n也就是欧洲完全没有新建芯片产能，完全缺席了2020年代的半导体黄金时代。","likes":150},{"id":"2104526784528330852","author":"asklivermore","date":"2026-09-28","zh":"AskLivermore：$AXTI是未來突破候選，光通訊與半導體開始轉強。","risk":"","s":{"AXTI":"bull"},"text":"$AXTI\n potential breakout candidate in the future. \n\nOptics / semi-companies starting to coil and show signs of strength. \n\nLet's see over the next few months if AI can continue to stay strong.","likes":155},{"id":"2104538766559822222","author":"KawzInvests","date":"2026-09-28","zh":"KawzInvests：Credo FY27指引成長逾85%，長期成長不只靠AEC。","risk":"","s":{"AAOI":"neutral","COHR":"neutral","CRDO":"bull","LITE":"neutral","NVDA":"neutral","SMTC":"neutral"},"text":"Why the \n$CRDO\n long-term growth story is much bigger than AECs.\n\nCredo generated roughly $1.34B in FY26 and guided to more than 85% growth in FY27, with analysts targeting around $3.9B in FY28. Where does that growth come from as AEC growth naturally moderates?\n\nFirst, AECs still have room to grow. Credo has deep relationships with five hyperscalers and is preparing for the 1.6T bandwidth transition.\n\nAt 1.6T, AEC reach extends to roughly 6.5 meters, keeping copper highly competitive on power and cost over short distances. 1.6T AECs start contributing in the second half of FY27 and ramp significantly in FY28.\n\nSecond, optics is growing faster than AECs and is expected to contribute more than $600M in FY27.\n\nCredo has three optical businesses, each expected to exceed $100M in FY27:\n\n> Optical DSPs, with record engagement across 800G and 1.6T\n> Silicon photonics, through the DustPhotonics acquisition\n> ZeroFlap optical transceivers\n\nThird, a key part of ZeroFlap’s moat is the Pilot software layer.\n\nSilent optical network failures can drain 10%–20% of GPU cluster utilization. Pilot gives hyperscalers an early warning before links fail and helps cut cluster bring-up times from weeks t","likes":150},{"id":"2104539239681802547","author":"octopusycc","date":"2026-09-28","zh":"大老师：星艦首次進入軌道並部署Starlink V3衛星，傾向看好$SPCX。","risk":"發射失敗","s":{"SPCX":"bull"},"text":"SPCX 今日盘前的大波机会 \n\n20:15有发射任务 \n\n我倾向于走好\n\n——————————\n\n本次核心目标：星舰首次真正进入地球轨道，并部署26颗可投入运营的 Starlink V3卫星。\n\n此前13次飞行都采用亚轨道轨迹，因此这次的商业化验证意义更强。\n\n\n$SPCX","likes":7},{"id":"2104550361117901116","author":"octopusycc","date":"2026-09-28","zh":"大老师預告直播星艦首次Starlink商業任務。","risk":"","s":{"SPCX":"neutral"},"text":"要不然直接提前开播得了 \n\n\n$SPCX\n 星舰首次Starlink商业任务（区别于第十三次测试","likes":6},{"id":"2104557991433314479","author":"asklivermore","date":"2026-09-28","zh":"AskLivermore：$ARM是自己賺最多的股票，可能已找到本輪低點，正在醞釀。","risk":"","s":{"ARM":"bull"},"text":"You all know \n$ARM\n made the most money in my life.\n\nIt's trying to setup once again and may have found a low for its current cycle already.\n\nRemember this, they design 99% of the entire world’s smartphones and gets paid a royalty from companies like Apple, Samsung, Qualcomm, and many others.","likes":627},{"id":"2104559268427108358","author":"KawzInvests","date":"2026-09-28","zh":"KawzInvests：Meta推企業平台，軟體ETF $IGV跌2.48%，SaaS末日第二部？","risk":"AI取代SaaS","s":{"IGV":"bear"},"text":"SaaS apocalypse, part 2? This time the villain is Meta.\n\n\n$IGV\n down over 2.48% as Zuck announces an enterprise platform.","likes":37},{"id":"2104562166292525353","author":"KawzInvests","date":"2026-09-28","zh":"KawzInvests：Muse證明消費者要AI代理，伺服器CPU交期拉長到25–30週，OpenAI DevDay是下一催化劑。","risk":"","s":{"ARM":"bull","INTC":"bull","META":"bull","QCOM":"bull"},"text":"$META\n’s Muse proved ordinary consumers want AI agents (2.8M downloads in 12 days). \n\nNow comes the next catalyst: OpenAI DevDay on Tuesday.\n\n> Server CPU lead times have stretched out to 25–30 weeks (vs. normal 16–20). \n\n> Intel’s CEO admitted they can currently only fill ~50% of customer CPU requests. \n\n> AMD EPYC data center revenue has more than doubled YoY.\n\n> Trend Force CPU status as Tight Supply\n\nWhen OpenAI, Meta, and Google compete to give hundreds of millions of users free, always-on digital workers, they are slamming a consumer agent workload onto a server CPU market that is already sold out with 25–30 week lead times. \n$META\n \n$INTC\n \n$ARM\n \n$QCOM","likes":72},{"id":"2104565272476856549","author":"Balder13946731","date":"2026-09-28","zh":"Balder：$NVDA回購金額提高到1500億美元，創美股史上最大。","risk":"","s":{"AAPL":"neutral","NVDA":"bull"},"text":"$NVDA\n 提高回购金额至1500亿美元，成为美股历史上之最，超过 \n$AAPL\n\n\n不过他明年可能会比不过三星和海力士的回购规模🫪","likes":70},{"id":"2104662946357940358","author":"ren_stocks","date":"2026-09-28","zh":"Ren：Truist給Nebius買進、目標價355美元，依其指引每GW約90億美元營收。","risk":"","s":{"NBIS":"bull"},"text":"$NBIS\n YOU ARE NOT BULLISH ENOUGH\n\nTruist sizes the AI cloud layer at $2.1T of annual revenue by 2030, and in their map of the AI stack, Nebius is the name they highlight, with a Buy rating and a $355 target.\n\nNow take Nebius's own guidance: $7 to $9B of ARR exiting 2026 with 800 MW to 1 GW of connected power, which works out to roughly $9B of run-rate revenue for every gigawatt they bring online.\n\nThey've raised their contracted power target three times this year, from 3 GW to 4 GW to 5 GW, and expect almost all of it online within three to three and a half years.\n\nFive gigawatts at today's revenue per gigawatt is roughly $40 to $45B of ARR, before the 17 to 21% price increases that kick in on October 1. That's about 2% of Truist's cloud layer, and getting there only requires filling power they've already contracted.\n\nThe demand is there to fill it: management says they could already sell all of their 2027 capacity on current terms, and customer prepayments reportedly cover 50 to 60% of the related capex.\n\nThe real risk is money.\n\nVolozh said 5 GW by 2030 needs about $250B of financing, with only 20% secured so far, so expect more dilution along the way.\n\nTwo percent of the layer,","likes":313},{"id":"2104665642733654357","author":"ren_stocks","date":"2026-09-28","zh":"Ren整理從電網到晶片的七層AI電力供應鏈公司。","risk":"","s":{"ABBNY":"neutral","ADI":"neutral","AEIS":"neutral","ETN":"neutral","FLEX":"neutral","GEV":"neutral","IFNNY":"neutral","MPWR":"neutral","MRAAY":"neutral","NJDCY":"neutral","NXPI":"neutral","ON":"neutral","PCRFY":"neutral","RNECY":"neutral","SBGSY":"neutral","STM":"neutral","TTDKY":"neutral","TXN":"neutral","VICR":"neutral","VRT":"neutral"},"text":"Per Truist, AI data center capacity goes from 24 GW to 100 GW by 2030, and every one of those watts has to be converted, stored, smoothed and cooled before a single GPU turns on.\n\nSo I mapped every business that gets paid between the grid and the chip, seven layers from the grid to the GPU, and marked the one I'd watch most closely.\n\nInfrastructure // getting megawatts into the building:\n\n$ETN\n Eaton, \n$VRT\n Vertiv, \n$GEV\n GE Vernova, $SBGSY Schneider, $ABBNY ABB\n\nPower supply // AC in, DC out:\nDelta (\nhttp://\n2308.TW), the cleanest pure play on the whole map Lite-On (\nhttp://\n2301.TW), co-designed the GB300 power shelf \n$FLEX\n Flex, \n$AEIS\n Advanced Energy\n\nDC-DC conversion // the last step before the silicon, and THE LAYER I'D WATCH:\n\n$MPWR\n Monolithic Power, \n$VICR\n Vicor, $IFNNY Infineon, \n$TXN\n Texas Instruments, \n$ADI\n Analog Devices, $RNECY Renesas, \n$ON\n onsemi\nAs density rises, every point of efficiency here is worth more, and that's where pricing power can show up.\n\nBattery backup // seconds to minutes when power drops:\n$PCRFY Panasonic, Samsung SDI (006400.KS), LG Energy Solution (373220.KS) \n\nCapacitors // fractions of a second when GPU demand spikes:\nNippon Chemi-Con (","likes":51},{"id":"2104666148763787583","author":"michaelsikand","date":"2026-09-28","zh":"Michael Sikand：$OURA本週上市，永續合約已比發行價區間高約7%。","risk":"","s":{"OURA":"neutral"},"text":"$OURA IPOs this week.\n\nTraders already have it at a ~7% premium to the high end of its expected range on \n@liquidtrading\n.\n\nAre perps a new signal to predict the true market value of private companies?\n\nThe platform also shows OpenAI at $1.6T and Anthropic at $2T.","likes":23},{"id":"2104670059096674408","author":"Balder13946731","date":"2026-09-28","zh":"Balder演算法日誌：BAC、AAOI、CRCL停損出場。","risk":"","s":{"BAC":"bear"},"text":"平仓亏损 3 \n$BAC\n 57.73→56.44 -2.23% · AAOI 101.07→94.68 -6.32% · CRCL 92.26→85.85 -6.95%\n\n 持仓 CRWV 87.53→85.07 -2.8% · LMT 531.71→518.1 -2.6% · SNOW 329.51→328.12 -0.4% · HD  290.57→289.89 -0.2% · NVO  38.43→38.71 +0.7%\n\n balder-algo-logs · 龙气 · 09-28 · algo log · not advice","likes":0},{"id":"2104670676774986130","author":"ren_stocks","date":"2026-09-28","zh":"Ren：美國陸軍選中Navitas開發10kV碳化矽功率半導體。","risk":"","s":{"NVTS":"bull"},"text":"$NVTS\n \n\nThe US Army just picked Navitas for ALATTIS, a program to develop 10 kV silicon carbide power semiconductors, sponsored by the Army Research Laboratory.\n\nThe goal is to build a domestic manufacturing process for ultra-high-voltage SiC IGBTs that doesn't exist today, which says a lot about where Navitas' engineering sits, and it fits the same roadmap the company is pointing at solid-state transformers for AI data centers and grid storage.\n\nThat's the bridge to the AI trade: as racks move toward 800 V DC and megawatt scale, the conversion from the grid keeps moving to higher voltages, which is exactly where ultra-high-voltage SiC comes in. Navitas already works with Nvidia on the 800 V architecture for the Kyber racks behind Rubin Ultra.\n\nThis is a prototype development program with no dollar value disclosed, and 10 kV devices are still years away from real volume revenue. \n\nThat timeline is the reason I sold \n$NVTS\n earlier this month, and this news doesn't change it.\n\nGreat validation for the tech, but for me it's still a wait-and-see name, so I'll keep watching from the sidelines.\n\nGood news are always bullish","likes":65},{"id":"2104671781416239124","author":"Balder13946731","date":"2026-09-28","zh":"Balder：Meta挖角MDB CEO使其大跌27%，認為是買進$MDB好機會；預期OpenAI DevDay續挺CPU。","risk":"","s":{"MDB":"bull","META":"neutral"},"text":"$META\n 挖走了 \n$MDB\n 的CEO以后一度引起27%的大跌，不过我认为这是买入 \n$MDB\n 的好机会。\n\n今天CPU 半导体和 \n$META\n 都遭到了严重的血洗。但我认为明天的OpenAI Dev应该还会继续给CPU打鸡血。","likes":31},{"id":"2104698369591706069","author":"aleabitoreddit","date":"2026-09-28","zh":"ECOC 傳 Nvidia 包下 Lumentum 五成 UHP 雷射產能，商用雷射供應商更具價值；AMD 82 億美元收購 World Labs。","risk":"傳聞未經證實","s":{"AAPL":"neutral","AMD":"bull","LITE":"bull","MRVL":"neutral","NVDA":"bull","TSM":"neutral"},"text":"Everyone is asking \"Where is Serenity\" or \"Who is Serenity\". But nobody is asking...\n\n\"How is Serenity\"?  \n\nI do read things from \n$AMD\n $8.2B acquisition of World Labs... but feeling pretty sick right now, so taking a little break. \n\nI remember saying physical AI + world models would major shift way back when, so maybe I should have invested in private companies at the time... \n\nApart from that... other interesting news:\n\n- Some channel checks from ECOC was that \n$NVDA\n apparently secured 50% of \n$LITE\n Greensboro UHP laser capacity? And possibly contracts that allow them to secure the remaining capacity per Barclays. \n\nThat's $5B in lasers (annual capacity)... so it's hilarious to see Nvidia go out and bottleneck the rest of the industry by doing this. But this just puts more strategic value on other merchant laser suppliers + more visibility for Lumentum.\n\nIt's kinda game theory over allocation, since if you secure all the HBM, lasers, and others it inadvertently makes it much harder for competitors to scale their programs. \n\n- Then there's your massive $150B Nvidia authorized buybacks (just look at \n$AAPL\n when they did buybacks..) They're printing too much. \n\n- What's also int","likes":1692},{"id":"2104709202891735244","author":"aleabitoreddit","date":"2026-09-28","zh":"作者近況：頭痛不適；閒聊遇到自稱 SPCX 的 Cursor 執行長，並與業界主管討論波束成形技術。","risk":"","s":{"SPCX":"neutral"},"text":"@Itachidata I've had better days, having constant headaches which is a bit rough. I did have some fun channel checks though recently.\n\nSome guy I met by the bathroom yesterday claimed to be $SPCX Cursor CEO. I'm not good with faces so idk if he was lying or not.\n\nAlso had some discussions about beamformer technology with an industry executive, it's apparently more important than I gave it credit for.","likes":145},{"id":"2104720730290077979","author":"KawzInvests","date":"2026-09-28","zh":"KawzInvests：Burry回補MU、NBIS、NVDA等空單，質疑還有人看空。","risk":"","s":{"CAT":"bull","CRWV":"bull" \n•Crypto Fundamentals by Token Terminal: Track and analyze blockchains and crypto like companies, with data from 100+ chains & 1,200+ apps. ($10/mo) \n\n•Weather Trader by Visual Crossing: Use near-term forecasting models to analyze structural supply chain risks and price disruptions. ($5/mo)\n\n•Satellite Intelligence by SkyFi: Coming soon, see and a","likes":1043},{"id":"2105080061087170737","author":"ren_stocks","date":"2026-09-29","zh":"Ren：TrendForce追蹤的AI伺服器零件中只有GPU供需平衡，其餘都偏緊，關鍵是誰最緊。","risk":"","s":{"AMD":"bull","ARM":"bull","INTC":"bull","MRAAY":"neutral","MU":"bull","SKHY":"neutral","SNDK":"bull","STX":"neutral","TTDKY":"neutral","WDC":"neutral"},"text":"$INTC\n \n$ARM\n \n$AMD\n \n$MU\n \n$SNDK\n\n\nSo now that pretty much every bottleneck has been discovered, from GPUs, CPUs and DRAM to NAND, HDDs, ABF substrates and MLCCs, what really matters is which one is the tightest.\n\nTrendForce tracks seven parts of the AI server every week, and only one of them is balanced right now: the GPU. \n\nEverything that has to ship around it is tight or very tight, which means owning GPUs no longer guarantees you can build a server.\n\nHere's the list ranked by how stretched lead times are versus a balanced market, with the timeline and the names for each:\n\nABF substrates // 48 to 56 weeks vs 12, about 4x normal. Bigger AI chips need more substrate layers, and while the glass fiber cloth shortage should ease gradually in 2027, yields on high-layer substrates keep supply tight beyond that. Ibiden (4062.T), Unimicron (\nhttp://\n3037.TW), Kinsus (\nhttp://\n3189.TW), Nan Ya PCB (\nhttp://\n8046.TW), AT&S (\nhttp://\nATS.VI), and Nittobo (3110.T) for the glass cloth.\n\nHDD // 50 weeks vs 16, about 3x. All that AI data has to live somewhere cheap, and vendors are adding capacity through HAMR, but the deficit is expected to last until at least 2027. \n$STX\n Seagate, \n$WDC\n We","likes":396},{"id":"2105087897074540983","author":"StockMKTNewz","date":"2026-09-30","zh":"Evan：Cathie Wood的Ark今天買進35.7萬股輝達。","risk":"","s":{"NVDA":"bull"},"text":"Cathie Wood and Ark Invest bought 356,681 shares of Nvidia \n$NVDA\n today","likes":669},{"id":"2105092190179647659","author":"StockMKTNewz","date":"2026-09-30","zh":"Evan調侃這是特斯拉要展示飛行車的證據。","risk":"","s":{"TSLA":"neutral"},"text":"I am taking this as confirmation that Tesla \n$TSLA\n is about to do a flying car demo","likes":654},{"id":"2105104768767234342","author":"michaelsikand","date":"2026-09-30","zh":"Michael Sikand：以預估本益比看$CRDO是AI網通最划算的，AEC市場年複合成長49%。","risk":"","s":{"ALAB":"neutral","COHR":"neutral","CRDO":"bull","LITE":"neutral","MRVL":"neutral"},"text":"$CRDO\n is the best deal in AI networking by forward P/E.\n\n\n$CRDO\n - 26.4x \n\n$COHR\n - 31x\n\n$LITE\n - 44.7x\n\n$MRVL\n - 48.2x\n\n$ALAB\n - 63.8x\n\nThe AEC market \n$CRDO\n owns is expected to grow at 49% CAGR thru 2030, while their new optics business could be 1/3 of total sales by 2028.","likes":308},{"id":"2105128873121714549","author":"ren_stocks","date":"2026-09-30","zh":"Ren：OpenAI超快速方案改用輝達GPU而非Cerebras，強化NVDA護城河。","risk":"Cerebras失去客戶","s":{"CBRS":"bear","NVDA":"bull"},"text":"$NVDA\n \n$CBRS\n\n\nThe implications of this are REALLY interesting for fast inference.\n\nOpenAI's new GPT-6.1 Sol Ultrafast tier is reportedly running on Nvidia GPUs at low batch size, while the previous version ran on Cerebras at up to 750 tokens per second.\n\nFor Nvidia, the win is less about volume and more about the moat. \n\nUltrafast is a small premium tier for now, but GPUs just showed they can serve the speed tier too, which weakens the case that you need wafer-scale chips or custom ASICs for fast inference. And low batch means more GPUs for every token, so if speed tiers grow, so does the GPU bill.\n\nFor Cerebras, it's lost its exclusivity on OpenAI's speed tier, but not its speed lead. Nvidia runs the new model at about 300 tokens per second, while Cerebras ran the previous one at 750, and OpenAI still has up to 750 MW of Cerebras systems staged through 2028. \n\nI'm watching closely now which hardware powers Ultrafast for GPT-6 Astra, OpenAI's flagship. If it's Cerebras, this is a capacity story. If it's Nvidia, it's a real problem for CBRS. Nvidia really isn’t leaving scraps for anyone.","likes":78},{"id":"2105151002760679706","author":"aleabitoreddit","date":"2026-09-30","zh":"亞馬遜在供應鏈持股/認股權愈來愈多（AAOI、Marvell、Jabil 等），新入股金像電，其半導體組合可能比 Nvidia 的還吸引人。","risk":"認股權不代表長期採購","s":{"AAOI":"neutral","ALAB":"neutral","AMZN":"bull","CBRS":"neutral","CRDO":"neutral","FLEX":"neutral","FN":"neutral","GNRC":"neutral","JBL":"neutral","MRVL":"neutral","NVDA":"neutral","QCOM":"neutral","STM":"neutral"},"text":"Bro, \n$AMZN\n semi ETF portfolio is probably going to end up more compelling than what \n$NVDA\n owns... \n\nToday Amazon signed a $49.8M private placement into PCB maker Gold Circuit Electronics (2368). So now Amazon has ownership/warrants in:\n\n- \n$AAOI\n \n- Alchip\n- \n$MRVL\n (Celestial)\n- \n$ALAB\n\n- \n$CRDO\n \n- \n$JBL\n \n- \n$FLEX\n \n- \n$STM\n \n- \n$CBRS\n \n- \n$GNRC\n\n- \n$FN\n \n- TD SYNNEX\n- \n$QCOM\n \n- Gold Circuit Electronics\n\nAnd others..\n\nIf we look at the private placement amount for GCE in speciifc, it's like .36% of the company... Kinda small financially, meaningful strategically. Esp. since there were claims that GCE supplies ASIC-server PCBs to the four major hyperscaler CSPs...\n\nRegardless it's pretty funny to see Amazon to Nvidia start to own all the worlds leading companies. \n\nSince Amazon has exposure to the entire supply chain like PCBs now, optical fabric with Celestial, lasers with \n$AAOI\n, assembly from \n$FN\n to \n$JBL\n, ASIC partners like \n$QCOM\n / ALchip.","likes":1671},{"id":"2105281995693834544","author":"StockMKTNewz","date":"2026-09-30","zh":"Evan：CoreWeave宣布上線輝達Vera Rubin NVL72，Cognition為首位正式客戶。","risk":"","s":{"CRWV":"bull","NVDA":"neutral"},"text":"CoreWeave \n$CRWV\n just announced the availability of NVIDIA \n$NVDA\n Vera Rubin NVL72 on CoreWeave, with Cognition as the first customer anywhere running production workloads on the system","likes":375},{"id":"2105282523953533242","author":"StockMKTNewz","date":"2026-09-30","zh":"Evan：DoorDash發表自家自主飛行器與無人機外送系統。","risk":"","s":{"DASH":"neutral"},"text":"DoorDash \n$DASH\n just unveiled its purpose-built autonomous aircraft powered by DoorDash Air\n\nDoordash \"outlined plans for an end-to-end drone delivery system with infrastructure and delivery orchestration designed to scale for all local businesses\"","likes":96},{"id":"2105283470909907098","author":"StockMKTNewz","date":"2026-09-30","zh":"Evan：DoorDash推出可在Apple訊息內點餐的AI代理。","risk":"","s":{"DASH":"neutral"},"text":"Doordash \n$DASH\n just unveiled a new AI Agent for ordering food that lets you order food from inside Apple's Messaging app - Bloomberg","likes":178},{"id":"2105292227916292184","author":"KawzInvests","date":"2026-09-30","zh":"KawzInvests：Alexandr Wang轉推自己，視為$META持股的祝福。","risk":"","s":{"META":"bull"},"text":"Just realized \n@alexandr_wang\n quote tweeted me yesterday. Taking that as a blessing for my \n$META\n bags","likes":79},{"id":"2105292447635104205","author":"Balder13946731","date":"2026-09-30","zh":"Balder：太間接了，應該直接做$HPE。","risk":"","s":{"HPE":"bull"},"text":"还是太间接了，应该直接做 \n$HPE","likes":11},{"id":"2105300501214720355","author":"ren_stocks","date":"2026-09-30","zh":"Ren：喜歡Cerebras，但這次交易新聞操作做空成功。","risk":"","s":{"CBRS":"neutral"},"text":"$CBRS\n\n\nI did a thing, don’t go bear hunting me here.\n\nI love what Cerebra’s is doing.\n\nBut trading the news, is always fun when you are right.","likes":54},{"id":"2105301142900969716","author":"StockMKTNewz","date":"2026-09-30","zh":"Evan：Airbnb新增送餐、生鮮與洗衣等服務。","risk":"","s":{"ABNB":"neutral"},"text":"Airbnb \n$ABNB\n just announced multiple new services you can get through its app\n\n- Meal delivery: Order from local restaurants right to your Airbnb listing when you'd rather stay in. Available in select cities across Europe.\n\n- Expanded grocery delivery: We launched grocery delivery early this year in the U.S. Now, we’re bringing it to Europe.\n\n- Laundry: Schedule pickup and delivery so you can pack less, especially on longer trips. Airbnb guests get free pickup, delivery and next-day rush service. Available in select U.S. cities, in partnership with Rinse.\n\n- Baby gear: Rent cribs, strollers, high chairs, toys, and more, delivered and set up at your Airbnb listing. Airbnb guests get 10% off. Available starting in November in over 60 U.S. cities, in partnership with BabyQuip.\n\n- New local services in the French Alps and South Florida: Rent ski and snowboard gear in the French Alps, boats in South Florida, and more through local partners, making it easier to pack light and spend your time enjoying the destination.","likes":244},{"id":"2105324335980491098","author":"michaelsikand","date":"2026-09-30","zh":"Michael Sikand：$MU自3月以來營收成長204%、EPS成長425%，是難得一見的行情。","risk":"","s":{"MU":"bull"},"text":"$MU\n has grown revenue 204% and EPS 425% since this photo was taken in March.\n\nYou are living through a run we may never see again in public markets.","likes":213},{"id":"2105333255117689052","author":"asklivermore","date":"2026-09-30","zh":"AskLivermore：GOOGL正在收斂整理，觀察能否守住314美元支撐，本人持有。","risk":"跌破314支撐","s":{"GOOGL":"bull"},"text":"$GOOGL\n trying to coil here. Getting tight.\n\nLet's see if it can continue to hold its support and stay above $314.\n\nDisclaimer: I do have Google in my portfolio.","likes":272},{"id":"2105340872846180534","author":"Balder13946731","date":"2026-09-30","zh":"Balder：PCE低於預期後雲端大廠大漲，認為資金現在在半導體、未來會轉向雲端廠商。","risk":"","s":{"AMZN":"bull","GOOGL":"bull","MSFT":"bull"},"text":"上次美联储加息鹰派半导体大涨，这次PCE低于预期（鸽派信号），云大厂（$GOOG \n$MSFT\n \n$AMZN\n ) 纷纷大涨，可见目前资金在半导体，未来资金在云厂商，这件事情在形成市场共识。","likes":45},{"id":"2105343052638478416","author":"michaelsikand","date":"2026-09-30","zh":"Michael Sikand：市場低估Credo的光學產品，26.4倍本益比被當成銅纜公司定價。","risk":"","s":{"CRDO":"bull"},"text":"Give credence to Credo.\n\nThe market is improperly discounting \n$CRDO\n's optical stack alongside a \"decelerating\" AEC market growing at 49% CAGR.\n\nAttractive deals are hard to come by in AI infrastructure, and today on \n@AsymmetricBets_\n we laid out why we think \n$CRDO\n's emergent optical products are underestimated at 26.4x fwd.\n\nIt's priced like a copper company while optics went from ~6% of revenue in FY26 to ~24% this year, and we see it hitting 31% by FY28 with ZeroFlap alone approaching a $900M business.\n\nIn the report we break down every growth driver beyond AECs.\n\n- Optical DSPs and DustPhotonics PICs (one laser doing the job of eight)\n\n- PILOT, the \"check engine light\" software that locks in hyperscalers\n\n- ZeroFlap, which Brennan calls the only vertically integrated pluggable\n\n- OmniConnect, a memory play workaround against HBM with Positron as its first customer\n\n- Active LED Cables, retimers, and NPO\n\nCheck out the article here: \nhttps://\nasymmetricalbets.substack.com/p/the-misprice\nd-upside-on-crdo\n…","likes":138},{"id":"2105347306421916129","author":"ren_stocks","date":"2026-09-30","zh":"Ren：六年前的A100仍保有約25%價值，反駁GPU兩三年就沒價值的空頭論點。","risk":"","s":{"NBIS":"bull","NVDA":"bull"},"text":"$NVDA\n \n$NBIS\n\n\nThe biggest bear case on AI infrastructure has been that GPUs lose their value in two or three years, so everyone building data centers is overstating their earnings. This chart puts real prices on that argument.\n\nUsing Silicon Data's pricing, a six-year-old A100 still holds about 25% of its purchase price, which is where an accelerated depreciation schedule expects it to be at year two. An H100, four years after mass availability, is still worth 58%. And a B200 is trading at 158% of what it cost, a sign of how far demand is running ahead of supply.\n\nThat changes the math for everyone who owns compute. If a GPU is still worth more than half its price after four years, a five or six-year depreciation schedule starts to look conservative.\n\nThe neoclouds benefit the most, because GPUs are their collateral, their balance sheet and their product all at once, so every point of residual value makes financing cheaper and returns higher.\n\nThe honest caveat: it's Nvidia's own chart, the purchase prices are third-party estimates, and a B200 above 100% is a shortage price that won't last forever. But even the oldest chip on the chart is beating the bear case by four years.\n\nOld","likes":54},{"id":"2105348695969427508","author":"ren_stocks","date":"2026-09-30","zh":"Ren：退休帳戶最大持倉是Google，擁有最多AI層，卻仍被當成會被AI取代的搜尋公司定價。","risk":"","s":{"GOOGL":"bull"},"text":"$GOOGL\n \n\nMost people don't know this, but in my retirement account, my biggest position by far is Google.\n\nAlphabet owns more layers of the AI stack than any other company, and it's still priced like the search business everyone thought AI would kill.\n\nSearch grew 17% last quarter to $63.3B, so the \"AI kills Google\" story still hasn't shown up in the numbers. Below that sit Gemini and DeepMind at the model layer, then Google Cloud, which grew 82% to $24.8B while its operating margin jumped from 20.7% to 35.6% in a year. And at the bottom, Google designs its own chips, and it's now signing deals to supply multiple gigawatts of TPUs to other companies.\n\nCloud backlog reached $514B, up more than $50B in a single quarter, with just over half expected to turn into revenue within two years. That's roughly $257B already signed for the next 24 months, against a Cloud business running at about $99B a year today.\n\nThe price for all of it is about 22x forward earnings, below Microsoft at 25x, while growing faster. Ignore the 17x you'll see quoted everywhere, because it's inflated by a $98B gain on Alphabet's investment portfolio.\n\nCapex guidance is now $195 to $205B for this year and set to ","likes":147},{"id":"2105348931840561376","author":"michaelsikand","date":"2026-09-30","zh":"Michael Sikand：NBA球員Tristan Thompson在Autopilot分享持股，前幾大為AMD、ARM、MRVL。","risk":"","s":{"AMD":"neutral","ARM":"neutral","MRVL":"neutral"},"text":"We really got Tristan Thompson sharing his stock picks on \n@joinautopilot\n before GTA 6. \n\nTop holdings: \n$AMD\n, \n$ARM\n, \n$MRVL\n \n\nWelcome to the arena champ.","likes":167},{"id":"2105350676515786885","author":"KawzInvests","date":"2026-09-30","zh":"KawzInvests：銅纜成長空間比市場想像大，目前估值低估Credo銅纜以外的機會。","risk":"","s":{"CRDO":"bull"},"text":"Does \n$CRDO\n have enough growth beyond AECs to keep this going?\n\nThat’s the question we set out to answer in our latest article.\n\nWe think copper has more runway than the market gives it credit for. At today’s valuation, we think investors are giving too little credit to Credo’s growth opportunities beyond copper\n\nOur full deep dive on \n@AsymmetricBets_\n ↓\n\n\nhttps://\nasymmetricalbets.substack.com/p/the-misprice\nd-upside-on-crdo?r=7mqn0f&utm_campaign=post-expanded-share&utm_medium=web\n…","likes":75},{"id":"2105353864106877015","author":"ren_stocks","date":"2026-09-30","zh":"Ren認為10月不會升息，核心通膨降溫，大選前10月從未升息，看多。","risk":"","s":{"AAOI":"bull","AMD":"bull","GOOGL":"bull","LITE":"bull","NVDA":"bull","SNDK":"bull"},"text":"$GOOGL\n \n$NVDA\n \n$SNDK\n \n$AMD\n \n$LITE\n \n$AAOI\n\n\nIMO - We won't hike in October.\n\nCore inflation is cooling from its early-2026 peaks but is still running around 3%.\n\nCooler August lowers the case for another hike in October.\n\nJust as a data point: going back to 1990, the Fed has never raised rates at an October meeting ahead of a November election.\n\nBullish","likes":27},{"id":"2105356298145685716","author":"StockMKTNewz","date":"2026-09-30","zh":"Evan：Intel在AI代理工具包加入輝達OpenShell政策層。","risk":"","s":{"INTC":"neutral","NVDA":"neutral"},"text":"INTEL \n$INTC\n ADDS NVIDIA’S \n$NVDA\n OPENSHELL POLICY LAYER TO ITS AI AGENT TOOLKIT","likes":103},{"id":"2105364780995473890","author":"KawzInvests","date":"2026-09-30","zh":"KawzInvests：若Gemini 4 Pro如傳聞強大，是否會改變對Google的看法？認為Google熱度已降。","risk":"話題熱度下滑","s":{"GOOGL":"neutral"},"text":"If
