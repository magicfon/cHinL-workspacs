umble 50.3% 的绝对控股权。\n\n之前传并购也就是听个八卦，不过过了 50.3% 这个比例感觉就不太一样了。现在 10 年期美债在 4.8%，Tether 拿着一千多亿美债，一年光无风险利息也能收上百亿美元。这基本就是台美联储管不到的印钞机，现在人家直接拿这些利息的钱下场，买了个自带独立数据中心（Rumble Cloud）的平台。\n\n平时大家都在算 AWS 和微软的份额。离岸资本现在已经跑去买物理机房了。这两种东西搭在一起以后具体是个什么玩法，我其实也还没太想明白。 \n$RUM","likes":23},{"id":"2096352304790425965","author":"Balder13946731","date":"2026-09-05","zh":"Balder評論韓國資金跨海到那斯達克買$SKHY ADR的現象。","risk":"","s":{"SKHY":"neutral"},"text":"韩国资金跑去纳斯达克扎堆买 \n$SKHY\n ，这画面确实魔幻。\n\n明明在首尔就能直接买正股，非要把手里的韩元换成美元，跨个太平洋去美股接盘自己国家的公司。宁愿多给华尔街交一道过路费，也要把仓位搬出本土市场。","likes":139},{"id":"2096390804940132473","author":"Balder13946731","date":"2026-09-06","zh":"Balder：標普100新增PANW、ANET、SNDK、DELL，剔除NKE、CL、HONA；BE、ILMN、P納入標普500。","risk":"","s":{"ANET":"neutral","BE":"neutral","CL":"neutral","DELL":"neutral","HONA":"neutral","ILMN":"neutral","NKE":"neutral","P":"neutral","PANW":"neutral","SNDK":"neutral"},"text":"周末指数成份股发生调整：\n\n标普100指数新增Palo Alto Networks \n$PANW\n 、Arista Networks \n$ANET\n、闪迪 (\n$SNDK\n) 和戴尔科技 \n$DELL\n\n\n耐克 \n$NKE\n、高露洁 \n$CL\n 以及Honeywell Aerospace \n$HONA\n将被剔除。\n\n标普500指数方面，Bloom Energy \n$BE\n、Illumina \n$ILMN\n 和Everpure \n$P\n 将纳入指数","likes":33},{"id":"2096393648380448912","author":"Balder13946731","date":"2026-09-06","zh":"Balder預期$DELL、$SNDK、$ANET納入標普100後會有一波上漲。","risk":"","s":{"ANET":"bull","DELL":"bull","SNDK":"bull"},"text":"周六才宣布S&P 100的变化，预计 \n$DELL\n \n$SNDK\n \n$ANET\n 会有一波上涨","likes":2},{"id":"2096395274998763650","author":"Balder13946731","date":"2026-09-06","zh":"Balder：SK海力士美國ADR市值比韓股高45.7%，反映美股制度溢價。","risk":"","s":{"SKHY":"neutral"},"text":"SK海力士 \n$SKHY\n 在美国的ADR市值比在韩国的市值高45.7%！\n\n相同的资产在美国和其他国家价格完全不同，这是一种系统性的制度溢价和投资价值的降维打击。\n\n这里和中国人溢价购买Nasdaq不同，韩国人可以同时买韩股和美股，却宁愿跨国都不买折价的本国股市SK海力士；根源在于美股市场巨大的杠杆和流动性，对投资和投机提供了更大的红利。","likes":16},{"id":"2096667046117343741","author":"KawzInvests","date":"2026-09-06","zh":"KawzInvests指出GPT-6 Astra與遊戲引擎是合作而非取代，與年初Genie引發的恐慌不同。","risk":"","s":{"RBLX":"neutral","TTWO":"neutral","U":"neutral"},"text":"My timeline is flooded with GPT-6 Astra generations. \n\nWe saw something similar earlier this year when Google shipped Project Genie on Jan 30 and the engine names got taken apart, with \n$U\n down more than 20% in a single day and \n$RBLX\n and \n$TTWO\n going with it. The fear was that if a model can generate a playable world, nobody needs an engine.\n\nThe difference now is that the models are working with the engines. OpenAI published a Playco case study on Sept 3 where an agentic IDE plugs directly into Unity and Godot, and they got three playable prototypes off one grey box with 50% fewer manual fixes than the previous model.\n\nI don't think AI replaces game engines, at least not yet, because generating a world and running one are separate problems\n\n> state that persists across sessions\n\n> physics that behave the same way twice\n\n> bugs you can actually reproduce\n\n> players staying in sync across devices\n\nSo while these names keep getting lumped in with the software stocks getting commoditized, I think there could be an opportunity here.","likes":89},{"id":"2096671639786356916","author":"michaelsikand","date":"2026-09-06","zh":"Michael Sikand認為$ORCL對OpenAI的3000億美元積壓訂單價值遠高於19倍預估本益比。","risk":"","s":{"ORCL":"bull"},"text":"Using GPT 6 Astra and all I can think is \n$ORCL\n's $300B OAI backlog worth more than 19x fwd.","likes":723},{"id":"2096703262368137306","author":"michaelsikand","date":"2026-09-06","zh":"Michael Sikand：黃仁勳稱AGI已實現，靠的是$ORCL在Stargate提供的十萬顆GPU算力。","risk":"","s":{"ORCL":"bull"},"text":"OH MY GOD. Jensen just declared AGI is here.\n\nHe notes that OpenAI's AGI was achieved using the 100K+ GPUs from the compute \n$ORCL\n provided at Stargate.","likes":1763},{"id":"2096844666780221607","author":"jukan05","date":"2026-09-07","zh":"Jukan轉述：iPhone Fold因良率問題可能先在北美上市。","risk":"摺疊機良率問題","s":{"AAPL":"neutral"},"text":"Korean media reports that Apple is expected to launch the iPhone Fold in North America first, as difficulties improving hinge and foldable panel yields will likely prevent a global rollout—including in South Korea—immediately after the device is unveiled.\n\n\n$AAPL","likes":239},{"id":"2096936312016142776","author":"DJTRadar","date":"2026-09-07","zh":"DJT Radar：川普帳戶上半年以約532美元買入Lennox，現約390美元，跌27%。","risk":"","s":{"LII":"neutral"},"text":"Trump’s accounts bought $980k–$2m of Lennox \n$LII\n, Jan–Jun, at ~$532 a share.\n\nHVAC equipment. $13 billion company.\n\nStock is ~$390 now. Down 27%.​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​\n\nYou’re welcome.","likes":848},{"id":"2096994367344976100","author":"DJTRadar","date":"2026-09-07","zh":"DJT Radar：Hunter Biden將推LAPTOP迷因幣，空投給TRUMP幣虧損者。","risk":"","s":{"TRUMP":"neutral"},"text":"JUST IN: Hunter Biden is launching a memecoin called LAPTOP on Tuesday. Named after the laptop.\n\nFounders keep 30%.\n\n20% gets airdropped to people who lost money on \n$TRUMP\n\n\nAnd up to 30% of supply gets burned if Democrats win in 2028 lol.\n\nA token that destroys its own supply based on an election result, funded by the losers of another president's memecoin.\n\nPublic Citizen has investors down $4.7 billion across 5 Trump-linked crypto products.\n\nAbsolutely fucking insane.","likes":264},{"id":"2097007843799171358","author":"michaelsikand","date":"2026-09-07","zh":"Michael Sikand分享各種成功交易類型的例子，如BE、MU、SONY、AAOI。","risk":"","s":{"AAOI":"neutral","BE":"neutral","KRKNF":"neutral","MU":"neutral","SOI.PA":"neutral","SONY":"neutral"},"text":"So many ways to make killer trades on the stock market. \n\nSome examples for me.\n\n- Fundamentals out the window but you understand  technology/IP better than the consensus: \n$BE\n in January\n\n- Momentum top blast chad hits halfway through a re-pricing cycle \n$MU\n in Feb\n\n- The non obvious, second order winner from a huge trend \n$SONY\n options in June\n\n- Look at a hot sector's leaders, then find the distant third place ready to ride its coat tails \n$AAOI\n in February\n\n- International market inefficiency on a performant theme - $KRKNF, $SOI.PA, $M7U befor },{"id":"2097756968962462036","author":"michaelsikand","date":"2026-09-09","zh":"Michael Sikand：$META是旗艦基金最大持倉，訴訟落幕、Muse代理與充足算力，不能看空祖克柏。","risk":"","s":{"META":"bull"},"text":"$META\n is the largest position in my Flagship Fund up over 18% since I added after diversifying after it being all in memory.\n\nWith this lawsuit done, Muse personal agents, and a boatload of compute to use or sell externally...\n\nCan you bet against Zuck?","likes":115},{"id":"2097778067695706249","author":"Balder13946731","date":"2026-09-09","zh":"Balder：二線晶片股$AMD、$MRVL在波動行情中穩健猛漲。","risk":"","s":{"AMD":"bull","MRVL":"bull"},"text":"我发现二把手 \n$AMD\n \n$MRVL\n 这种波动行情都很稳健 就咔咔猛涨","likes":41},{"id":"2097779182591995996","author":"michaelsikand","date":"2026-09-09","zh":"Michael Sikand：SPCX上市最大獲利在代理股如RKLB，並準備Anthropic S-1的交易點子。","risk":"","s":{"RKLB":"neutral","SPCX":"neutral"},"text":"The biggest gains on the \n$SPCX\n IPO weren't on \n$SPCX\n.\n\nIt was trading the proxies like \n$RKLB\n that rallied in the weeks leading up to the big day, and selling them into the hype.\n\nSo me and the team \n@AsymmetricBets_\n just came up with our best trade ideas around the Anthropic S-1.","likes":59},{"id":"2097815176838017066","author":"aleabitoreddit","date":"2026-09-09","zh":"解讀Anthropic經濟情境報告：2026-27為建設期、2028-30經濟加速，資本收益大增，AI股受惠。","risk":"","s":{"AMZN":"neutral","GOOGL":"neutral","META":"neutral"},"text":"Anthropic's Economic Scenario publication was a pretty interesting read: 1. Anthropic's \"extreme\" scenario has GDP growth reaching 15.4% in 2030 So around 7.3x current rates (~2.1% Y/Y), which is consistent with what Elon Musk is saying about outgrowing the national debt with AI. 2. Almost all of the divergence happens after 2027. Their model shows relatively little separation in 2026-2027, then the curves bend sharply into 2028-2030. So my read is that it points to 2026-2027 as buildout years and 2028-2030 as economic acceleration. Kinda gets mapped as well when you look at $AMZN / $META / $GOOGL capex, and short term FCF headwinds (but massive projected profitability post 2028) 3. In an extreme scenario, unemployment of knowledge workers goes to 17.9%. With 11.9% economy-wide unemployment \"At the individual level, it means coders and call service center agents may have to switch to jobs like electrician and nurse, which are less exposed to AI.\" GG computer science majors. 4. Non-cognitive wages: +33.6% vs. baseline in an extreme scenario. So your electricians/construction-type labor becomes extremely valuable? (but this isn't factoring in humanoids yet...) Whereas -11.5% for know","likes":0},{"id":"2097921040144093335","author":"jukan05","date":"2026-09-10","zh":"Jukan：台積電8月營收年增53.3%、月增10.1%。","risk":"","s":{"TSM":"bull"},"text":"TSMC August revenue: NT$514,806mn\n(+10.1% MoM, +53.3% YoY)\n\n\n$TSM","likes":410},{"id":"2097922773612204445","author":"Balder13946731","date":"2026-09-10","zh":"Balder：台積電營收年增53.3%股價卻不動，以後不做月報交易。","risk":"","s":{"TSM":"neutral"},"text":"$TSM\n 收入同比飙升53.3%，股价一点不动，以后月报不做了。今天苹果发布会，侧击也做得差。还是要讲求edge。","likes":46},{"id":"2098043318513102985","author":"Balder13946731","date":"2026-09-10","zh":"Balder：自家交易代理的對沖失敗，低估了大盤跌幅，正是考驗的時候。","risk":"","s":{"SPX":"neutral"},"text":"神也陨落了 因为他这个对冲失败了， $SPX 估计太低了。所以现在这个时候恰恰是最考验Trading agent的时候，我们继续观察吧，看看能不能度过难关。","likes":35},{"id":"2098066275691794531","author":"KawzInvests","date":"2026-09-10","zh":"KawzInvests自嘲：油輪ETF $BWET今年漲3349%，讓AXTI、SIVE都相形失色。","risk":"","s":{"AXTI":"neutral","BWET":"neutral","SIVE":"neutral"},"text":"$BWET\n is up 3,349% YTD. \n\nA tanker shipping ETF is making \n$AXTI\n and $SIVE look like a bond fund. We picked the wrong supply chain guys.","likes":786},{"id":"2098082291369332986","author":"Balder13946731","date":"2026-09-10","zh":"Balder：$UVXY若漲超5%就不交易。","risk":"","s":{"UVXY":"neutral"},"text":"理论上这个 \n$UVXY\n 我会不交易，如果在上升到+5%以上。\n\n因为绝对没好处！","likes":13},{"id":"2098107953048080389","author":"Balder13946731","date":"2026-09-10","zh":"Balder：$CRWV用來側擊ORCL財報，兩者同步性高，若模型判斷沒方向就不做。","risk":"","s":{"CRWV":"neutral","ORCL":"neutral"},"text":"$CRWV\n 是用来侧击 \n$ORCL\n 的财报的，而且他们的同步性很强，如果Fable认为没有方向或者差，那就没必要做。","likes":25},{"id":"2098114790048583928","author":"KawzInvests","date":"2026-09-10","zh":"KawzInvests：光通訊大漲後，下一輪成長取決於高速模組；高盛上調2028年光模組預估至1485億美元。","risk":"舊世代產品降價","s":{"AAOI":"neutral","CIEN":"neutral","COHR":"neutral","GLW":"neutral","LITE":"neutral","VIAV":"neutral"},"text":"Optical stocks have had a huge run. For \n$LITE\n \n$COHR\n \n$AAOI\n, I think the more useful question now is what the next round of growth depends on.\n\nGoldman more than doubled its 2028 optical transceiver forecast to $148.5B.\n\nA big part of that comes from customers moving to faster, more expensive modules. But transceivers still have product cycles, newer generations command a premium, while older ones typically get cheaper as production scales and competition increases.\n\nSuppliers need to keep moving up the speed curve to offset that price erosion. Long-term agreements can help cushion the cycle through purchase commitments, but pricing protection depends on the terms.\n\nThe opportunity also extends across the buildout, from fiber at \n$GLW\n and networking at \n$CIEN\n to testing at \n$VIAV\n as higher speeds make qualification more demanding.\n\nOur latest article breaks down what drove the TAM revisions, which suppliers could capture the growth, and whether their planned capacity can meet demand.\n\n$LITE\n \n$COHR\n \n$AAOI\n \n$CIEN\n \n$GLW\n \n$VIAV","likes":94},{"id":"2098121475190559054","author":"michaelsikand","date":"2026-09-10","zh":"Michael Sikand：華爾街低估光通訊市場6.5倍，NVDA投資LITE與COHR後成為AI情緒領頭羊。","risk":"","s":{"COHR":"bull","LITE":"bull","NVDA":"neutral"},"text":"Wall Street was wrong by 6.5x on the optics TAM.\n\nWe were right.\n\nIn early February, \n@AsymmetricBets_\n began writing about a mispricing in the supply chain of optical equipment for data centers.\n\nA few weeks later, \n$NVDA\n invested billions in \n$LITE\n and \n$COHR\n, and the sector became the AI trade's new sentiment leader.\n\nI even launched a public photonics fund on \n@joinautopilot\n months before any ETF issuer, that despite extreme volatility has returned roughly 57% since February, more than 5x the S&P 500. Over $18M follows the strategy currently.\n\nEveryone always asks me if it's too late. Was the optical sector just a \"trade\"?\n\nGoldman just doubled their 2028 optical interconnect TAM from $69B to $148.5B. Citi, Morgan Stanley and Nomura also all published bullish optics reports the same week.\n\nThe reason is price. Unit shipments only went up 31% but the average transceiver got 64% more expensive as demand shifts to 1.6T ($750) and 3.2T ($1,200). 3.2T alone is $59.7B of the $79.4B revision.\n\nCiti's model 16 months ago had 5M 1.6T units for 2026. Goldman now has 32.8M. Wall Street was literally off by 6.5X!\n\nThe winners are whoever can actually ship the fastest modules. \n\nToday \n","likes":76},{"id":"2098132328107380924","author":"octopusycc","date":"2026-09-10","zh":"大老师預告直播看ORCL與ADBE財報。","risk":"","s":{"ADBE":"neutral","ORCL":"neutral"},"text":"再播！看ORCL和ADBE财报了\n\n\n$ORCL\n \n$ADBE\n \n\n\n@heyibinance\n \n@binancezh\n \n@yingbinance\n \n@Yuki27__\n \n\nhttps://\napp.binance.com/uni-qr/cspa/45\n658800464266?l=zh-CN&r=MJ6LI1UJ&source=host_share&uc=web_square_share_link&us=copylink\n…","likes":4},{"id":"2098134303276401019","author":"KawzInvests","date":"2026-09-10","zh":"KawzInvests：油價、殖利率與升息機率都更高，$SMH卻比7月底高11%，似有脫節。","risk":"總經壓力與股價脫節","s":{"SMH":"neutral"},"text":"What do you guys make of this? There seems to be a disconnect.\n\nWhen \n$SMH\n was bottoming on July 29:\n> SMH: ~$504\n> 10Y yield: 4.67%\n> WTI: ~$85\n> September hike odds: 58.4%\n\nNow:\n> \n$SMH\n: ~$562\n> 10Y yield: ~4.95%\n> WTI: ~$102\n> September hike odds: 64%\n\nSMH is roughly 11% higher despite higher oil, yields and hike odds.\n\nAre stronger earnings expectations enough to explain the resilience? Could institutions be staying long and hedging elsewhere, or are equities underpricing the macro risk?\n\nWith CPI tomorrow and FOMC next week, could we see another setup like July?","likes":67},{"id":"2098137811874648179","author":"octopusycc","date":"2026-09-10","zh":"大老师判斷ORCL中性偏空、ADBE明顯偏空，期權結構顯示上漲預期被壓低。","risk":"賭財報風險高","s":{"ADBE":"bear","ORCL":"bear"},"text":"今晚两个财报，我的判断都偏空，但逻辑不太一样。（赌财报风险极高，必须合理的控制仓位，切勿梭哈）\n\nORCL：中性偏空\n现价174，日内-4.6%，IV预期波动约10%。\n170上方出现大量Sell Call / Call平仓，尤其170C尾盘撤退明显，说明市场在主动压低上涨预期，同时卖波动率赚钱。\n\n但下方140反而没有明显Put Wall，所以目前并不是“市场重仓赌暴跌”，更像是在赌：\n\n财报即使Beat，也很难大涨。\n\n——————————\n\nADBE：明显偏空\n现价日内-2.2%，IV预期波动约7%。\nADBE的期权结构比ORCL更差：\n\n尾盘股价反弹，但Call完全没有跟涨；\n大量买Call仓位在平仓，同时Put还在持续加码。\n\n这说明市场不是单纯卖IV，而是在主动增加下行方向仓位。\n\nADBE现在的问题已经不是“能不能Beat”，而是能不能证明AI真的开始重新加速增长。\n\n所以目前我的排序是：\nADBE偏空程度 > ORCL\nORCL更像“涨不动”，\nADBE更像“市场在主动押下跌”。\n\n\n$ADBE\n \n$ORCL\n \n\n——————————","likes":15},{"id":"2098146489017192853","author":"michaelsikand","date":"2026-09-10","zh":"Michael Sikand：$AVAV財報後大漲，處於無人機與反無人機超級週期。","risk":"","s":{"AVAV":"bull"},"text":"$AVAV\n is surging today after earnings.\n\nLet's talk about why it's so well positioned to win the drone and counter drone supercycle.","likes":50},{"id":"2098147041075675416","author":"Balder13946731","date":"2026-09-10","zh":"Balder演算法日誌：$IONQ與ORCL各停損約5%。","risk":"","s":{"IONQ":"bear"},"text":"平仓亏损 2 \n$IONQ\n 39.1→37.14 -5.01% · ORCL 162.22→154.08 -5.02%\n\n 持仓 none\n\n balder-algo-logs · 龙气 · 09-10 · algo log · not advice","likes":4},{"id":"2098147806125138060","author":"Balder13946731","date":"2026-09-10","zh":"Balder：若CPI無事且開盤不高可撿$NVDA，ORCL財報也利多NVDA。","risk":"","s":{"NVDA":"bull","ORCL":"bull"},"text":"$NVDA\n 明天的max pain是225\n如果明天CPI没事，开盘不高的话，可以捞一手。主要是 \n$ORCL\n 财报对于 \n$NVDA\n 也利好。","likes":29},{"id":"2098162252801269968","author":"Balder13946731","date":"2026-09-10","zh":"Balder美股復盤：油價與美債殖利率攀升，半導體與硬體股領跌。","risk":"","s":{"SPY":"neutral"},"text":"【美股复盘 · 9月10日】\n\n大市：原油大涨及美债息抽升引发宏观避险情绪，拖累美股三大指数全线走低，纳指表现最劣。标普( \n$SPY\n )收报757.55，跌0.64%；纳指(QQQ)沽压沉重，收报708.84，跌1.04%；道指(DIA)收报520.09，跌0.76%；反映中小型股的罗素小型股(IWM)失守阵地，收报287.23，重挫1.17%。全日市宽反复偏软，102只观察股中仅18只上升，84只下跌。\n\n板块：资金成本攀升令高估值资产承压，算力硬件及半导体板块沦为重灾区，领跌大市。对冲资金积极入市，带动做空半导体的 SOXS 暴涨7.40%，做空纳指的 SQQQ 亦升3.17%。相比之下，部分消费电子、软件及传统汽车工业股展现韧性，于跌市中靠稳造好。\n\n焦点：半导体及硬件股全线急泻，VRT 暴跌6.00%领跌，HPE 重挫5.89%，INTC 挫5.02%，MU 及 SKHY 亦分别急跌4.64%及4.40%。另一边厢，AAPL 表现一枝独秀，逆市造好升3.29%；软件股 MDB 及 APP 见资金追捧，分别升4.17%及3.57%；传统车企 F 及 GM 亦分别升3.27%及2.35%。此外，ORCL 将于今日盘后公布财报，资金提早避险，该股绩前遇沽压，全日收跌4.19%。\n\n小结：分析指，近期的极端AI交易已引起宏观层面的关注与警惕，叠加通胀反抽预期及高企的无风险利率，机构抛售硬件股的意愿显著升温。在宏观绞肉机效应下，市场策略趋于保守，短期内大市料持续受制于债息及油价走势，后市需密切注视重磅软件股的最新业绩指引能否重新稳住科技板块的阵脚。","likes":6},{"id":"2098170540242698249","author":"michaelsikand","date":"2026-09-10","zh":"Michael Sikand：Muse可能讓數十億人首次體驗代理式AI，對$META非常利多。","risk":"","s":{"META":"bull"},"text":"With the launch of \n$META\n's new Muse app, billions of people could have their first useful, agentic AI experience. Think about how bullish that is.","likes":98},{"id":"2098191770576417148","author":"michaelsikand","date":"2026-09-10","zh":"Michael Sikand週回顧：ORCL交易成功、加碼CRDO、看好SONY、AVAV與AMZN。","risk":"","s":{"AMZN":"bull","AVAV":"bull","CRDO":"bull","ORCL":"bull","QCOM":"bull","SONY":"bull"},"text":"This week's market + trading recap with \n@ariaradnia\n \n\n0:32 Nailed the \n$ORCL\n trade on GPT 6 Astra\n4:28 Michael's degen 0 day win on iPhone duo\n7:42 \n$QCOM\n's AI deal with Amazon\n11:40 Trading around the Anthropic IPO\n16:43 Mispriced \n$SONY\n GTA Trade\n23:17 Adding \n$CRDO\n On Selloff\n32:06 \n$AVAV\n ER and the drone cycle\n41:08 \n$AMZN\n is an asymmetrical bet","likes":60},{"id":"2098226430408831362","author":"asklivermore","date":"2026-09-11","zh":"AskLivermore：科技股關鍵在$SMH，等它找到轉折低點AI才會再有大行情，目前需耐心。","risk":"半導體尚未落底","s":{"SMH":"neutral"},"text":"The only thing that matters for tech stocks right now is \n$SMH\n, the semiconductor ETF.\n\nOnce SMH can find a pivot low, this is when the 300%+ cycles for AI will come again. \n\nThe current area is \"okay\" - not the best, not the worst chance. The best area is "author":"aleabitoreddit","date":"2026-09-14","zh":"NOR快閃記憶體嚴重短缺、價格續漲，作者持有ESMT認為其相對規模最受惠；中低容量因中國新產能漲幅趨緩。","risk":"中國新產能使中低容量漲幅趨緩","s":{"ESMT":"bull"},"text":"NOR flash “Severe Supply Shortage” with high density continued increases of 90-110% for H2.\n\nI wonder who sells both high density NOR and SLC NAND? *cough cough, $ESMT*\n\nFor H1 hikes:\nNOR: +100–120%\nSLC NAND: +130–150%\n\nFor H2 hikes:\nHigh-density NOR: 90-110% in H2\nSLC NAND: ~70–75%.\n\nObviously there’s others from Winbond / Macronix / Gigadevice, but my idea and position with ESMT is that it’s the largest beneficiary of the shortage relative to size. (they sell NOR: >256Mb)\n\nThe moderate bearish part is:\n\n“For mid- and low-capacity products of 128Mb and below, additional capacity from Chinese suppliers is gradually coming online.\n\nPrice increases for consumer-grade products are therefore expected to moderate”\n\nHowever, this update is overwhelmingly bullish for earnings of legacy memory players.\n\nLet the ASP hike games continue.","likes":407},{"id":"2099427753758232868","author":"jukan05","date":"2026-09-14","zh":"Jukan轉述：三星電機與高通合作開發繞過Intel EMIB的有機橋接封裝。","risk":"技術替代","s":{"INTC":"bear","QCOM":"bull"},"text":"Samsung Electro-Mechanics and Qualcomm Form 2.1D Packaging Alliance, Jointly Developing an \"Organic Bridge\" That Bypasses Intel's EMIB\n\nSamsung Electro-Mechanics is teaming up with Qualcomm to develop \"organic bridge\" technology for advanced packaging of artificial intelligence (AI) chips. Beyond Qualcomm, Samsung Electro-Mechanics is also co-developing organic bridge technology with several other customers in parallel.\n\nAn organic bridge is similar to the silicon bridge used in Intel's EMIB (Embedded Multi-die Interconnect Bridge) packaging, but it uses organic materials, the kind commonly found in printed circuit boards (PCBs), instead of silicon.\n\nAccording to industry sources on the 14th, Samsung Electro-Mechanics is jointly developing organic bridge technology with Qualcomm for use in 2.1D packaging. Development and validation work has been under way for more than a year. The evaluation involves embedding an organic bridge into a flip-chip ball grid array (FC-BGA) substrate that connects Qualcomm chips, and then assessing the substrate's performance and reliability.\n\nQualcomm is understood to be considering the organic bridge for large multi-die chips for data centers, among o","likes":181},{"id":"2099456993736183888","author":"asklivermore","date":"2026-09-14","zh":"AskLivermore：長期看好$GOOGL，回檔都是建立部位的機會。","risk":"","s":{"GOOGL":"bull"},"text":"$GOOGL\n is a buy for the long-term on my end. \n\nAll dips will be an opportunity to make Google a strong position in your portfolio moving forward. \n\nYouTube, Google Maps, Gmail, Google Workspace, Search (w/ Gemini now), Android, etc.","likes":513},{"id":"2099458250240618861","author":"aleabitoreddit","date":"2026-09-14","zh":"同意IREN執行長：即使模型不再進步，推廣現有能力所需算力也多年難以滿足，放緩恐慌終將無關緊要。","risk":"","s":{"GOOGL":"neutral","IREN":"bull","NVDA":"bull"},"text":"$IREN CEO on Anthropic call for frontier slowdown:\n\n“Even if models never improved from here…\n\njust rolling out what they can already do would take more compute than the world can build for years”\n\nI agree, and current narrative is reminiscent of the $NVDA DeepSeek selloff or the $GOOGL TurboQuant scare.\n\nGuess what happened?\n\nThese scares once or twice a year all turn out to be immaterial to the overall AI buildout.\n\nEspecially when we have contracted demand all the way into the 2030’s now from advanced packaging to memory procurement.","likes":1670},{"id":"2099506727037329818","author":"Balder13946731","date":"2026-09-14","zh":"Balder：$CRWD、$PANW爆發起飛。","risk":"","s":{"CRWD":"bull","PANW":"bull"},"text":"$CRWD\n \n$PANW\n 爆炸起飞 希望大家都做到这笔交易了，虽然我没有","likes":39},{"id":"2099518539938091347","author":"michaelsikand","date":"2026-09-14","zh":"Michael Sikand認為這波賣壓不合理，將5%現金投入CRDO、LITE、NBIS、DRAM，逢低是禮物。","risk":"","s":{"CRDO":"bull","DRAM":"bull","LITE":"bull","NBIS":"bull","SGOV":"neutral"},"text":"This sell off is bullshit.\n\nBut days like this are exactly why I keep a big \n$SGOV\n cash equivalent on my Asymmetrical Bets fund on \n@joinautopilot\n followed by $17M+.\n\n5% cash into \n$CRDO\n, \n$LITE\n, \n$NBIS\n, and \n$DRAM\n.\n\nAI is going to change everything and each dip is a gift.","likes":141},{"id":"2099609161738916000","author":"michaelsikand","date":"2026-09-14","zh":"Michael Sikand：永續合約將是股票交易下一個大趨勢，週末AI股代幣已先反映消息。","risk":"","s":{"MU":"neutral","NBIS":"neutral"},"text":"I'm calling it now. \n\nPerps are the next big thing in stock trading and this last weekend confirmed it.\n\nJust think about what just happened. Three of the world's biggest CEOs told the world we needed to slow the AI race.\n\nBut with markets closed, there was no way to trade that information.\n\nThen you saw screenshots from traders that stock tokens on \n@liquidtrading\n mirroring AI names like \n$NBIS\n and \n$MU\n were trading down 3-5%, and traders began posting 50% profits going 5-10x leveraged short on the perps.\n\nCompare that to options. You're stuck with something you can't sell until markets open and decimate your position at the bell.\n\nOn top of this, there's no theta decay with perps, so your position isn't going to lose value simply because the clock is ticking to expiry.\n\nFor these reasons, I'm excited to starting share some high conviction stock trades using \n@liquidtrading\n with a fresh trading portfolio.\n\nCurrently almost every major retail favorite stock has a perps product available on the platform in addition to private companies like Unitree and Anthropic. I'm literally about to sell an options position I took today in favor of opening a perp on this stock.\n\nI'm not a cry","likes":213},{"id":"2099611940020773293","author":"Balder13946731","date":"2026-09-14","zh":"Balder美股復盤：殖利率逼近5%、油價高，AI放緩疑慮重挫半導體，資安股逆勢領漲。","risk":"","s":{"SPY":"neutral"},"text":"【美股复盘 · 9月14日】\n\n**大市**\n环球宏观阴霾密布，美债息高企及油价攀升重燃通胀忧虑，拖累美股四大指数全线反复偏软。受10年期美债息上探5.0%关口及WTI原油高见104.7美元的宏观高压冲击，大市整体沽压显著。标普( \n$SPY\n )全日收报761.87，跌0.32%；科网股表现疲弱拖累纳指(QQQ)领跌，收报711.15，跌0.52%；道指(DIA)及罗素小型股(IWM)跌势相对温和，分别收报525.08及288.52，分别微挫0.14%及0.13%。市宽表现疲软，102只观察股中，仅44只上升，58只下跌。\n\n**板块**\n板块走势荣辱互见，资金流向呈现剧烈两极分化。受市场对人工智能(AI)发展放缓的忧虑情绪发酵影响，半导体及光模块等算力硬件板块沦为重灾区，半导体三倍做空ETF(SOXS)单日急拉14.90%，反映相关股份遭连环抛售。惟另一边厢，软件及网络安全板块则逆市造好，表现一枝独秀。网络安全概念股强势领涨，带动扩大软件板块ETF(IGV)全日升4.86%，资金由硬体向软体换马的避险迹象明显。\n\n**焦点**\n个股方面，算力硬件相关股份遭遇洗仓式急泻。康宁(GLW)暴跌13.28%领跌，诺基亚(NOK)及相干(COHR)分别重挫12.44%及11.19%；升特(SMTC)、Lumentum(LITE)及慧与科技(HPE)跌幅均逾9%；安谋(ARM)、Ciena(CIEN)、SK海力士(SKHY)及应用光电(AAOI)均挫逾7%。与此形成强烈对比，受微软宣布接入能接管整台电脑的GPT-6 Astra消息提振，软件应用端炒风炽热。CrowdStrike(CRWD)及派拓网络(PANW)分别暴涨14.34%及13.41%；Cloudflare(NET)、Clear Secure(CRCL)、MongoDB(MDB)、赛富时(CRM)及奥多比(ADBE)录得4%至8%不等升幅。此外，加密货币平台Coinbase(COIN)亦逆市急升8.87%。\n\n**小结**\n分析指，目前市场正对高达87%的加息概率进行定价，无风险利率飙升对大市估值构成直接压力。在「AI见顶警告」的催化下，前期累积庞大升幅的半导体硬件股顺势涌现获利沽盘，触发显著的技术性调整。然而，软件股的集体走强及微软的技术发布，显示AI商业化进程依旧具备催化剂，并非全面看淡。后市需密切留意10年期债息会否实质企稳5.0%大关，以及云服务巨头(Hyperscaler)的资本开支(Capex)指引，料大市短期内仍维持板块轮动的震荡格局。","likes":6},{"id":"2099639446950101023","author":"michaelsikand","date":"2026-09-14","zh":"Michael Sikand建議以Meta Muse用例做短影音經營社群。","risk":"","s":{"META":"bull"},"text":"I've generated billions of views as a content creator.\n\nThis is how I'd get 100K IG followers from 0 right now.\n\nI'd pump 2-3 reels a day on use cases and prompts for \n$META\n muse. Content ideas would be infinite and the algo would push it.","likes":91},{"id":"2099659874892386678","author":"aleabitoreddit","date":"2026-09-15","zh":"反駁Cramer：CRWD本益比145倍卻稱必買，而SKHY、SNDK等記憶體基本面強勁；僅不認同CRWV因債務利息。","risk":"CRWV債務利息侵蝕現金流","s":{"AMD":"bull","BE":"bull","CRWD":"bear","CRWV":"bear","DRAM":"bull","INTC":"bull","SKHY":"bull","SNDK":"bull"},"text":"I've seen comments from Jim Cramer today supporting hedge funds that short Leopold's \"nonsense\" $SNDK / $DRAM / SK Hynix type calls.\n\nAs well Cramer calling $CRWD a \"Must Buy\".\n\nI'm not sure if Jim Cramer sees a $241B company  labelled \"Cybersecurity\" and thinks of it as safe... while ignoring all their fundamentals.\n\nBut with Crowdstrike, you have a ~145x FY2028 fwd P/E company, growing revenue 26% Y/Y. That Cramer thinks is a \"must buy\".\n\nAnd then you turn your eyes to the AI capex beneficiary theme that Leopold is long on.\n\nWith names like $SKHY / Samsung in $DRAM... Both FY2027 ~2.8-3x fwd P/E off analyst projections.\n\n-> Samsung LTAs to 2031 (70% capacity) for durability...  -> Minimum price floor + no price ceiling type contracts from SK Hynix.\n-> Memory shortage much tigher for the next year.\n-> DRAM/NAND % of hyperscaler capex goes higher (est. 68% per Trendforce)\n-> 2027 hyperscaler capex projections all hiked.\n\nThen with $SNDK, 50% FCF margins, 80% gross margin projections into 2030.\n\nOnly Situational Awareness position I'm in disagreement with is $CRWV due to debt interest eating FCF, but I can make a similar bullish argument with $BE, $INTC, $AMD, and others.\n\nNot quite","likes":202},{"id":"2099813306555154501","author":"octopusycc","date":"2026-09-15","zh":"大老师分析Falcon Finance代幣$FF，業務延伸至融資與支付，表示看多。","risk":"","s":{"FF":"bull"},"text":"看 \n$FF\n 这张日线，从0.057美元附近走到0.1718美元，阶段高点已经是底部的约3倍。 \n\n最近虽然有回调，但我更想知道：\n这一段上涨之后，还有什么值得继续交易？\n\n平时看 AI 股，绕不开 GPU 订单和 CapEx。设备还没开始赚钱，采购的钱谁先出？这次看 Falcon，恰好看到了它正在筹备的 GPU 远期融资产品，NEAR AI 提供未来算力购买需求支持。再加上已经上线的 Falcon Card，业务已经从链上收益往融资和支付延伸了。\n\n但站在交易角度，最关键的问题还是：\n这些业务，怎么给 \n$FF\n 带来需求？\n\n按官方代币设计，$FF 的用途覆盖治理、质押奖励、USDf/sUSDf 收益加成和新产品优先参与权。Prime 质押进一步把180天锁仓和10倍治理投票权绑定起来。也就是说，持有和质押 ethereum:0xfa1c09fc8b491b6a4d3ff53a10cad29381b3f949，已经有对应的生态权益。\n\n我看多的逻辑也在这里：如果生态真正吸引更多用户，这些权益就更有机会转化成持续的持币和锁仓需求。 这条传导需要真实使用来验证，不能直接把业务增长当成代币分红。\n\n眼前还有一个催化：CLARITY Act 的程序投票，安排在美东9月15日下午2:15，也就是北京时间9月16日凌晨2:15。 这是推进法案的程序关口，还不等于最终立法通过。\n\nFalcon 的机构数字美元 fUSD，已经由 Anchorage Digital Bank 发行，并接入 Ceffu，官方定位是面向 GENIUS 框架的“GENIUS-ready”产品。\n\n如果 CLARITY 顺利推进、市场重新关注合规加密金融基础设施，Falcon 这条产品线就有机会获得更多关注，成为 \n$FF\n 的Catalyst。\n\n所以，我对 \n$FF\n 后续偏多。产品还在往前走，代币有对应权益，接下来又有政策事件值得盯。比起盯着“已经涨了多少”，我更关注投票后的量价反应，以及回调有没有资金接。 投票若受阻，短线预期也要及时调整。\n\n\n@falconfinance","likes":12},{"id":"2099830591663513642","author":"aleabitoreddit","date":"2026-09-15","zh":"CCXI發布新一代人形機器人Digit 5，徵詢看法。","risk":"","s":{"CCXI":"neutral"},"text":"$CCXI releases their Digit 5 next-generation humanoid.\n\nThoughts? https://t.co/r0Gb05cnd5","likes":691},{"id":"2099839844612780380","author":"asklivermore","date":"2026-09-15","zh":"AskLivermore：$AVGO是全球最佳公司之一，回到合理價位，適合長期布局。","risk":"短線仍偏弱","s":{"AVGO":"bull"},"text":"$AVGO\n (Broadcom) is one of the best companies in the world.\n\nNow coming down to better fair-value levels. Still weak short-term, but these are price levels where you'd be okay with adding to a long-term portfolio. \n\nNot too expensive, not too cheap. Just right for building an initial if you wanted a strong historical compounder.","likes":676},{"id":"2099841420328845337","author":"asklivermore","date":"2026-09-15","zh":"AskLivermore：短線仍偏弱，觀察$SMH與AI股能否守住。","risk":"短線偏弱","s":{"SMH":"neutral"},"text":"Still a bit weak overall short-term, let's see if \n$SMH\n and the rest of AI can hold up","likes":2},{"id":"2099872529141919849","author":"michaelsikand","date":"2026-09-15","zh":"Michael Sikand非常看好$META，認為Muse會比Threads更成功。","risk":"","s":{"META":"bull"},"text":"One reason I'm so bullish \n$META\n right now.\n\nThe last time they launched an app it became the fastest product in history to hit 100M users.\n\nAnd that was just an X clone.\n\nWhat do you think happens now with a fantastic product like Muse, that many will pay for too?","likes":117},{"id":"2099932540849000958","author":"ren_stocks","date":"2026-09-15","zh":"Ren引述黃仁勳：不必放慢腳步也能做對事。","risk":"","s":{"NVDA":"bull"},"text":"$NVDA\n\n\n“YOU DON'T HAVE TO SLOW DOWN TO BUILD THINGS THE RIGHT WAY”\n\nYou tell them boss…","likes":88},{"id":"2099937363891790227","author":"ren_stocks","date":"2026-09-15","zh":"Ren和黃仁勳合照。","risk":"","s":{"NVDA":"neutral"},"text":"$NVDA\n \n\nI GOT A SELFIE WITH JENSEN\n\nLOL","likes":134},{"id":"2099958989119463756","author":"Balder13946731","date":"2026-09-15","zh":"Balder演算法日誌：$CRCL停損5.14%。","risk":"","s":{"CRCL":"bear"},"text":"平仓亏损 1 \n$CRCL\n 92.72→87.95 -5.14%\n\n 持仓 none\n\n balder-algo-logs · 龙气 · 09-15 · algo log · not advice","likes":7},{"id":"2099974354130067734","author":"Balder13946731","date":"2026-09-15","zh":"Balder美股復盤：殖利率急升、避險情緒升溫，加密與雲端儲存股領跌。","risk":"","s":{"SPY":"neutral"},"text":"【美股复盘 · 9月15日】\n\n受累于美国国债收益率急升以及市场避险情绪升温的宏观冲击，美股四大指数全线受压，表现反复偏软。大盘表面跌幅虽未算剧烈，但期权市场反映恐慌情绪已在暗中发酵。标普( \n$SPY\n )收报757.21点，跌0.48%；纳指(QQQ)收报704.47点，跌0.66%；道指(DIA)收报521.07点，跌0.65%；反映中小盘股走势的罗素小型股(IWM)沽压最重，收报285.14点，挫0.96%。大市交投气氛转趋谨慎，市宽表现疲弱，本报观察名单内的102只个股中，仅41只录得上升，下跌股份达61只，反映整体市底偏弱。\n\n板块轮动明显，加密货币概念及云存储板块遭遇猛烈抛售，双双领跌大市；另一方面，部分通信网络及半导体股发挥防守力，逆市造好；传统能源板块亦见资金追捧，走势靠稳。科技板块内部表现分化，尽管市场传出大型云厂商加速自研AI芯片以图打破现有算力垄断，但部分底层网络通信及算力设备提供商依然录得稳健升幅，显示资金在科技股内正进行结构性的防守调仓。\n\n焦点个股方面，受美国参议院加密货币相关法案未获通过拖累，加密货币平台 COIN 惨遭洗仓，股价急泻8.63%，为表现最差观察股；同属该板块的 IREN 及 HOOD 亦分别下挫3.31%及2.99%。存储芯片双雄 STX 与 WDC 同样面临庞大沽压，分别重挫4.31%及3.73%，反映市场对相关硬件需求及GPU抵押贷款潜在风险的忧虑。此外，CRCL 急跌9.38%，SPCX 与 SNOW 亦挫逾3%。然而，网络通信及芯片股 CIEN 与 QCOM 表现一枝独秀，分别逆市抽升4.58%及4.42%，双双领涨；ANET、ON、NOK、DELL 及 AMD 等亦录得逾2%的升幅。能源股 OXY 及 CVX 分别走高2.53%及2.16%，发挥避险作用。\n\n分析指，随着跨资产定价逻辑生变，环球主权债券面临抛售压力，华尔街正将信任票投向少数具备算力护城河优势的科技寡头。后市方面，大市短期内料继续受制于宏观利率环境及政策面不明朗因素，资金或将进一步向龙头及防守性板块收缩，投资者需密切留意债市动荡对大盘估值带来的后续冲击。","likes":12},{"id":"2099999510898577543","author":"aleabitoreddit","date":"2026-09-15","zh":"聯準會決議前的打氣：據報一半NVDA員工身家逾2500萬美元，靠的是不在總經恐慌時賣股。","risk":"","s":{"NVDA":"bull"},"text":"Just as a pep-talk statistic ahead of Fed decisions tomorrow.\n\n50% of $NVDA employees are reportedly now worth over $25 Million.\n\nThey didn’t get to that number paperhanding shares ahead of every macro scare or rate hike. https://t.co/saulhxBF3g","likes":510},{"id":"2100008575229976995","author":"aleabitoreddit","date":"2026-09-15","zh":"SIVE獲Digitimes報導，其1億顆以上CW雷射產能使其有望躋身一線，作者為其成長感到驕傲。","risk":"需執行產能擴張","s":{"AVGO":"neutral","COHR":"neutral","JBL":"neutral","LITE":"neutral","SIVE":"bull"},"text":"$SIVE has its own piece in Digitimes btw, which is appreciated industry recognition outside of Sweden.\n\nI think Sivers 100M+ CW DFB laser capacity buildout forced the industry to revisit its models and generated considerably more coverage.\n\nBC it puts Sivers into T1 laser capacity convo w/ $COHR, Sumitomo, Furukawa, $AVGO, Landmark, and $LITE if it executes on its ramp.\n\nBut outside of that, CIOE 2026 channel checks were really meaningful since the community found Sivers is working with Chinese pluggable players + setting up an office locally.\n\nI'm getting dejavu to the time I pointed out $SIVE + $JBL at OFC for their 1.6T LRO, but nobody believed the link until there was an actual press release.\n\nAnyway, proud to see this little company growing up","likes":193},{"id":"2100060877131219092","author":"ren_stocks","date":"2026-09-16","zh":"Ren：在Dreamforce聽完各家CEO發言，認為應該追隨黃仁勳的信心。","risk":"","s":{"NVDA":"bull"},"text":"$NVDA\n\n\nAfter hearing Marc Benioff, Sam Altman, Dario Amodei and Jensen Huang at Dreamforce today, you can feel the difference in how confident they are about the future of AI and humanity.\n\nSome people would be better off following Jensen. \n\nJust saying…","likes":32},{"id":"2100081646276112672","author":"ren_stocks","date":"2026-09-16","zh":"Ren分享圖片，認為NVDA與META的方向再清楚不過。","risk":"","s":{"META":"bull","NVDA":"bull"},"text":"$NVDA\n \n$META\n\n\nDoesn't get clearer than that.\n\nKudos to \n@cuttroatcapital\n for the pic.","likes":95},{"id":"2100085905717616950","author":"ren_stocks","date":"2026-09-16","zh":"Ren：先前說升息是最好的結果被罵空頭，如今摩根大通也這麼說。","risk":"","s":{"AAOI":"neutral","AMD":"neutral","INTC":"neutral","LITE":"neutral","MU":"neutral","NBIS":"neutral","NVDA":"neutral","SNDK":"neutral"},"text":"$NVDA\n \n$NBIS\n \n$SNDK\n \n$MU\n \n$LITE\n \n$AAOI\n \n$AMD\n \n$INTC\n\n\nSo when I said the best thing that could happen is a rate hike, everyone turned against me, calling me a bear, saying I don't understand how rates work. \n\nBut when JP Morgan says the same thing, you listen.\n\nI said this last week, but you don't like free alpha.\n\nSuit yourself.","likes":147},{"id":"2100167498532573554","author":"asklivermore","date":"2026-09-16","zh":"AskLivermore：$CRDO等AI股大跌後接近合理價，但SMH仍弱，宜慢慢建倉。","risk":"AI股尚未落底","s":{"CRDO":"neutral"},"text":"$CRDO\n (Credo) and a lot of other AI names have fallen massively. \n\nHowever, they are coming down to better fair-value levels soon. \n\nStill too early to call a low for AI since SMH ETF is still struggling. But, it is SLOWLY time to start getting interested again in high momentum names.\n\nTake your time. Build slowly. Get ready for a bounce once markets have better clarity.","likes":364},{"id":"2100187117418901655","author":"Balder13946731","date":"2026-09-16","zh":"Balder認為Gemini營收是包裝出來的，主張做空Google、做多Meta，估值差距將收斂。","risk":"","s":{"GOOGL":"bear","META":"bull"},"text":"Google已经宣布为所有员工提供Cluade用于编程和工程。\n\n所以连他们自己都认为Gemini不好用，还有谁会用Gemini。\n\nGemini的营收和用户数量都是Google虚拟出来的，本质上是其他服务的客户强行划分为Gemini用户，原本的云或者搜索不得不额外提供AI服务。\n\n\n$GOOG\n \n$META\n 的处境其实极其类似，但估值截然不同，这是一种很明显的市场错误定价。做空Google而做多Meta，几乎形成一种套利交易，所以他们的估值差距会很快弥合。","likes":50},{"id":"2100290486569505223","author":"aleabitoreddit","date":"2026-09-16","zh":"鴻海考慮共同投資以避免上游材料短缺，稱CW雷射與光纖為光子最大瓶頸，類似NVDA投資LITE與COHR。","risk":"","s":{"COHR":"neutral","LITE":"neutral","NVDA":"neutral"},"text":"Reminiscent of $NVDA w/ $LITE + $COHR:\n\nFoxconn is now considering joint investments to avoid upstream material shortages.\n\nFoxconn Interconnect Chairman identifies CW lasers and fiber as the biggest bottleneck in photonics.\n\nVery interesting to see these two themes reiterated across industry commentary.\n\nAlmost like a certain Anime character on X was right about CW laser bottlenecks.","likes":461},{"id":"2100305295071392002","author":"ren_stocks","date":"2026-09-16","zh":"Ren提醒要追隨能看清大局的人，衡量能力看結果不看產出。","risk":"","s":{"INTC":"neutral","IREN":"neutral","LITE":"neutral","MU":"neutral","NBIS":"neutral","NVDA":"neutral","SKHY":"neutral"},"text":"$NVDA\n \n$MU\n \n$INTC\n \n$NBIS\n \n$LITE\n \n$SKHY\n \n$IREN\n\n\nWhen choosing where to invest, it's of the upmost importance that you follow people that can actually see the bigger picture, not just the weeds.\n\nThe amount of people that have absolutely no idea how the economy works is OUTSTANDING ON FinX, please do not confuse output for intelligence, the only real measure of intelligence is outcome, I do as little work possible to get to the results I want.\n\nI've seen THESIS about why we are not going to hike this week, a lot of people claiming how the no hike bet was free money on platforms like Kalshi. \n\nFor me it just became evident last week that there was no possible outcome other than hiking, even if the only person that knew the outcome was the FED, when you see all the points pointing in the same direction is safe to assume we will be going there.\n\nI've seen A FEW people change their minds along the way, strong believes loosely held is another sign of intellgence, being able to change their mind when new information is presented.\n\nPlease do your own research and be wary of other peoples opinions, dont follow them blindly, cuestion them, including my own.\n\nBullish on the AI Buildout ","likes":53},{"id":"2100345903689449896","author":"ren_stocks","date":"2026-09-16","zh":"Ren對$NBIS表現叫好。","risk":"","s":{"NBIS":"bull"},"text":"$NBIS\n \n\nNoiiiiiiiiicee","likes":164},{"id":"2100366175746334878","author":"michaelsikand","date":"2026-09-16","zh":"Michael Sikand：聯準會升息1碼，$NBIS卻把GPU租價調升20%。","risk":"","s":{"NBIS":"bull"},"text":"Warsh raised rates by 25 bps and \n$NBIS\n raised GPU rentals by 2000 bps. Enjoy your bonds though.","likes":940},{"id":"2100371565796090195","author":"Balder13946731","date":"2026-09-16","zh":"Balder：排行榜高度相信$SPY會大反彈。","risk":"","s":{"SPY":"neutral"},"text":"排行榜居然高度相信 \n$SPY\n 会大反弹","likes":47},{"id":"2100372861492015162","author":"asklivermore","date":"2026-09-16","zh":"AskLivermore：今年撐過SMH -20%、QQQ -10%的回檔。","risk":"","s":{"QQQ":"neutral","SMH":"neutral"},"text":"We did survive a -20% drawdown on \n$SMH\n this year, and a -10% drawdown on \n$QQQ\n's, so thats something haha :D","likes":23},{"id":"2100379332372025572","author":"michaelsikand","date":"2026-09-17","zh":"Michael Sikand貼出ADBE CEO今日的梗圖。","risk":"","s":{"ADBE":"neutral"},"text":"$ADBE\n CEO today","likes":742},{"id":"2100530507549425704","author":"aleabitoreddit","date":"2026-09-17","zh":"解釋看好舊型記憶體：H2漲價幅度遠超NBIS GPU租金或MLCC漲幅，高於PSMC晶圓成本上漲，Q3財報可期。","risk":"","s":{"NBIS":"neutral","PSMC":"neutral"},"text":"Just in case you're wondering why I'm so bullish on legacy memory...\n\nTheir hikes seem a lot extreme than $NBIS reported +17-21% GPU rentals today or Taiyo-Murata type MLCC hikes.\n\nPrice hikes projections expected for H2:\n\n- SLC NAND: +120-170% in H2 vs H1\n- High-capacity NOR: +90-110% in H2 vs H1\n- ~DDR3/DDR4: +50% Q3\n- DDR2: +35-40% in Q3\n- LPDDR: +20% or more in Q3\n- DDR1, older LPDDR and PSRAM: also rising\n\nAs a consolidated view...\n\nLot of these are stacked off existing hikes H1, (eg. 130-150% for H1 SLC NAND), so you get +406%-575% cumulative throughout 2026.\n\nWhich impacts blended net income overall more than upstream wafer COGS hikes (eg. +45% DRAM wafers from $PSMC)\n\nSo I'd expect Q3 earnings for a lot of the legacy memory fabless companies to cook","likes":1190},{"id":"2100577579883544863","author":"ren_stocks","date":"2026-09-17","zh":"Ren：$QQQ準備好了嗎？","risk":"","s":{"QQQ":"neutral"},"text":"$QQQ\n\n\nAre you ready?","likes":31},{"id":"2100578382786469905","author":"ren_stocks","date":"2026-09-17","zh":"Ren對$NBIS走勢驚呼。","risk":"","s":{"NBIS":"neutral"},"text":"$NBIS\n\n\nMy god","likes":178},{"id":"2100584504662659177","author":"ren_stocks","date":"2026-09-17","zh":"Ren抱怨$CRWV拖累$NBIS。","risk":"","s":{"CRWV":"bear","NBIS":"neutral"},"text":"$CRWV\n \n$NBIS\n \n\nTalk about bad influences dragging us down…","likes":80},{"id":"2100594486355304892","author":"Balder13946731","date": 合約比短期買權更簡單，無時間價值耗損。","risk":"高槓桿風險","s":{"META":"neutral"},"text":"Everyone will say perps are gambling. \n\nAnd if you're running 20-40x leverage they certainly can be. But as a trader seeking to amplify returns on my ideas, I see it as a cleaner product than options contracts in many cases.\n\nIf you were to take out a 5x perp on a stock for example, you’re getting a simpler, leveraged bet than a short-dated call that can run as long as you want with no time decay and 24/7 trading.\n\nIf it were to go up 10%, you make about 50%. If it goes down about 15–20%, liquidation is forced.\n\nFor example, I recently took a trade on a 5x \n$META\n perp to express my conviction around their new agentic AI strategy. Currently up roughly 13%.","likes":78},{"id":"2100702266751893518","author":"asklivermore","date":"2026-09-17","zh":"AskLivermore：$MU正在整理，若守住低點是未來突破候選。","risk":"跌破支撐","s":{"MU":"bull"},"text":"$MU\n \n\nThere's a chance for AI. \n\nTrying to coil and a breakout candidate for the future if it can hold the lows (blue area).","likes":345},{"id":"2100704362024820857","author":"michaelsikand","date":"2026-09-17","zh":"Michael Sikand：做多$META、做空比價平台是AI代理時代的好配對交易。","risk":"","s":{"META":"bull"},"text":"Long \n$META\n, Short aggregators is a nifty pair trade when the perseverance of agents creates massive consumer surplus.","likes":70},{"id":"2100735673561174047","author":"aleabitoreddit","date":"2026-09-17","zh":"本週摘要：INTC稱記憶體價漲5-7倍、GFS與MRVL產能協議、CIEN成長展望、NBIS調漲雲端價格、AMZN與GNRC協議等。","risk":"","s":{"AAOI":"neutral","AMD":"neutral","AMZN":"neutral","ARM":"neutral","CIEN":"bull","CRWV":"bull","GFS":"neutral","GNRC":"bull","INTC":"neutral","IREN":"bull","MRVL":"neutral","MU":"bull","NBIS":"bull","NVDA":"neutral","QCOM":"neutral","SIVE":"neutral","SNDK":"bull","TSEM":"neutral"},"text":"TLDRs of things I found interesting this week:\n\n- $INTC CEO says some memory prices have risen 5-7× and warns the shortage will worsen in 2027.\n\n$SNDK / $MU / Samsung bros will be happy to hear this... (from the AI Infra Summit 2026 in Santa Clara)\n\n- $GFS + $MRVL sign extended SiGe capacity agreement for pluggable/NPO/CPO. \"Expected to add significant capacity to support Marvell’s growing requirements.\"\n\nI like to keep an eye out on Globalfoundries related updates given $SIVE is their reference laser for SCALE.\n\n-  $CIEN expects roughly 30% annual revenue growth, 50% adj. gross margin, 20% FCF margin, through FY2029.\n\nThe company says component availability, not demand, is limiting growth... Seems common across $NVDA to upstream suppliers that supply is the limiting factor for revenue growth.\n\n- Winbond acquires Infineon's NOR Flash and F-RAM business for $1.12 billion.\n\nVery surprised Infineon sold considering NOR Flash ASP + importance just keep going up and up and up, but good for Winbond consolidation.\n\n- Samsung reportedly expands outsourcing of DDR5-module and SSD assembly.\n\nI think some local Taiwan reports flag Transcend and Apacer as possible beneficiaries. The report spe","likes":374},{"id":"2100817562892456138","author":"michaelsikand","date":"2026-09-18","zh":"Michael Sikand：Meta Muse登上全球第一，超越ChatGPT。","risk":"","s":{"META":"bull"},"text":"$META\n MUSE IS NOW #1 IN THE WORLD BEATING CHATGPT","likes":352},{"id":"2100818055702196628","author":"jukan05","date":"2026-09-18","zh":"Jukan：SK海力士子公司Solidigm計畫在美國建NAND廠。","risk":"","s":{"SKHY":"bull"},"text":"SK HYNIX SUBSIDIARY SOLIDIGM IS PURSUING PLANS TO BUILD A NAND FLASH FAB IN THE U.S. — SOUTH KOREAN MEDIA REPORTS\n\n\n$SKHY","likes":381},{"id":"2100818559735931321","author":"jukan05","date":"2026-09-18","zh":"Jukan轉述：Solidigm評估首座美國NAND量產線，因AI帶動NAND需求激增。","risk":"","s":{"SKHY":"bull"},"text":"SK hynix Subsidiary Solidigm Pursues Its First U.S. NAND Fab\n\nSolidigm, the NAND subsidiary of SK hynix, is reviewing the construction of its first NAND mass production line in the United States, it was learned on the 19th. The company is currently working through details such as the fab site and the timing of the investment.\n\nWith NAND demand surging on the expansion of AI infrastructure buildouts, the move is being read as a strategy to strengthen cooperation with customers in the U.S. It also lines up with the push to expand U.S. AI investment that SK Chairman Chey Tae won has been leading at the group level.\n\nSolidigm is the U.S. entity SK hynix established when it acquired Intel's NAND flash business at the end of 2021. The total deal size was $9 billion (about 10 trillion won at the exchange rate of the time). Solidigm operates Fab 1 in Dalian, China, and began capital spending on Dalian Fab 2 in the third quarter of this year. In the U.S. it has only its headquarters and an R&D center, with no production base.\n\nThe region Solidigm is considering for its first U.S. production base is the East Coast. The company is understood to be discussing the details, including site select","likes":208},{"id":"2100938001077674262","author":"aleabitoreddit","date":"2026-09-18","zh":"記憶體已進入超級循環：HBM 2027 年報價預估漲 80–100%、雲端資本支出續增；光通訊 2027 年也看好。","risk":"報價漲勢若放緩，循環股回檔","s":{"AAOI":"bull","MU":"bull","NVDA":"bull","SIVE":"bull","SKHY":"bull","SMTC":"bull"},"text":"So on optical vs. photonics... Memory like \n$MU\n / \n$SKHY\n is in it's current supercycle.  \n\n-> RBC channel checks for example projects 80-100% HBM ASP hikes for 2027.\n\n-> Per \n$NVDA\n ER, Hyperscaler capex goes up in 2027. Then you have 68% of hyperscaler capex per Trendforce going to DRAM/NAND. \n\n-> 50-70% for next 3-5 years already allocated toward LTAs. \n\nSo supercycle is here... demand visibility is high and the price hikes are still ongoing. \n\nAs photonics like \n$SMTC\n to \n$AAOI\n, I expect to cook heavily in 2027 since we're already seeing widespread optical shortages in 2026. \n\nPlus, you're going from $67.7B in 2026 (per GS) to $131.4B TAM in 2027 for optical modules...\n\nWhich impacts the DSPs/TIAs/lasers/fiber suppliers  before CPO scale up really takes off in 2028. \n\nI don't think we'll ever see the same scale of memory price hikes, but I do think there's a lot room for more for  MC growth in optical supply chains (given smaller starting point eg. $1B CW laser supplier vs $1T memory maker).\n\nBut still there's room for price hikes on laser content (eg. $15–$20 for 4 70 mW lasers per GS note) since starting point is really cheap... and one component, like cheap InP substrates","likes":1154},{"id":"2100992586559467669","author":"michaelsikand","date":"2026-09-18","zh":"Michael Sikand：不懂為何有人不看多$META。","risk":"","s":{"META":"bull"},"text":"IF YOU'RE NOT BULLISH \n$META\n I DON'T GET IT.","likes":83},{"id":"2101047005384679683","author":"Balder13946731","date":"2026-09-18","zh":"Balder：$BAC的RSI低於30，財報前是不錯的機會。","risk":"","s":{"BAC":"bull"},"text":"$BAC\n 的RSI低于30了🫪 看起来是个不错的机会，拿到财报前恐怕美滋滋。","likes":27},{"id":"2101057160537084356","author":"KawzInvests","date":"2026-09-18","zh":"KawzInvests：GPU閒置多因等待資料傳輸，因此更看好網路傳輸而非純算力。","risk":"","s":{"AAOI":"bull","COHR":"bull","CRDO":"bull","LITE":"bull"},"text":"Why am I so focused on networking over raw compute?\n\nLook at GPU utilization 53% of surveyed data center operators report running at only 50–70% capacity during peak demand.\n\nGPUs aren't sitting idle because they lack compute power, they're sitting idle because they're waiting for data. They wait on storage, they wait on CPUs, and above all, they wait on other GPUs to send results back across the network.\n\nIf you add more compute to a cluster without upgrading the pipes, you just get diminishing returns on your capex. \n\n\n$LITE\n \n$COHR\n \n$AAOI\n \n$CRDO","likes":133},{"id":"2101090931441312001","author":"Balder13946731","date":"2026-09-18","zh":"Balder：$BA也不錯，習近平來訪應會繼續買飛機。","risk":"","s":{"BA":"bull"},"text":"$BA\n 其实也不错，习近平来了应该会继续买飞机的。","likes":29},{"id":"2101153194621714585","author":"Balder13946731","date":"2026-09-19","zh":"Balder：$QCOM今日下跌似與ARM訴訟有關。","risk":"專利訴訟","s":{"ARM":"neutral","QCOM":"bear"},"text":"$QCOM\n 今日的抛售似乎与 \n$ARM\n 的诉讼有关。","likes":24},{"id":"2101381875126370639","author":"michaelsikand","date":"2026-09-19","zh":"Michael Sikand：Muse是Meta史上第一個替用戶省時省錢的產品，看多很簡單。","risk":"","s":{"META":"bull"},"text":"Going bullish \n$META\n is simple. Muse is the first product in company history that saves its users time and money. They're already worth $1T from products that do the opposite.","likes":465},{"id":"2101402656845808007","author":"aleabitoreddit","date":"2026-09-19","zh":"提議博通鎖住 Sivers 未來幾年雷射產能，可同時卡住 Marvell 等 ASIC 對手，凸顯商用雷射供給稀缺。","risk":"純屬構想，未必成真","s":{"AVGO":"neutral","MRVL":"neutral","NVDA":"neutral","SIVE":"bull"},"text":"Just floating out an idea to \n$AVGO\n:\n\nIf you lock up $SIVE laser supply for next few years since you need “more laser capacity”.\n\nYou could unintentionally cause bottlenecks across your main ASIC competitors:\n\nLike \n$MRVL\n (Celestial), AlChip, Mediatek, GUC (Ayar CPO), first gen deployments.  \n\nWhere many also seem to be aligned with your best friend \n$NVDA\n…\n\nMaybe it’s worth discussing spending spare change to lock up the remaining merchant laser supply?","likes":1232},{"id":"2101529067044634694","author":"asklivermore","date":"2026-09-20","zh":"AskLivermore：$MU等AI股是未來突破候選，正嘗試守住支撐，期待年底行情。","risk":"跌破支撐","s":{"MU":"bull"},"text":"$MU\n and a lot of AI names are breakout candidates for the future.\n\nTrying to hold its support (blue area). \n\nLet's see if we can get an end-of-year rally.","likes":450},{"id":"2101700403520036939","author":"asklivermore","date":"2026-09-20","zh":"AskLivermore：季度再平衡將在10X組合中全數出清$PANW，換成硬體股。","risk":"","s":{"PANW":"bear"},"text":"My dear followers. Tomorrow is the time for my quarterly rebalance for my portfolio.\n\nI will be adding two NEW names in the Core portfolio - one healthcare, and one industrials. \n\nFor the 10X portfolio, I will full exit \n$PANW\n tomorrow and replace it with a hardware name that got big enough to earn its slot on my books. \n\nAlso micro-adjusting some weight adjustments on my holdings to make sure it's aligned perfectly. The tech side outran the defensive side last quarter so I'm bringing the two halves back into line, trimming what ran and adding to what lagged. \n\nIt's time to have a great end-of-year.","likes":665},{"id":"2101730902615486643","author":"aleabitoreddit","date":"2026-09-20","zh":"閒聊：大家關注中美會談與 ECOC 光通訊展，作者感嘆中文貼文留言遠多於英文。","risk":"無","s":{"LITE":"neutral","MRVL":"neutral","SIVE":"neutral"},"text":"While everyone is focused on Bessent/He Lifeng talks today. Or \n$LITE\n / \n$MRVL\n / $SIVE at ECOC optical conference...\n\nI'm just curious why my followers can leave 2K+ comments if I post in Chinese... \n\nBut if I share something in English: I only get 50 comments. \n\nFeels bad anon","likes":1062},{"id":"2101737329270665523","author":"aleabitoreddit","date":"2026-09-20","zh":"感謝追蹤者突破百萬，回顧從 Reddit 一路到 Intel、Nebius 的歷程。","risk":"無","s":{"INTC":"neutral","NBIS":"neutral","RDDT":"neutral"},"text":"Thanks for following all this time! Entire training arc from \n$RDDT\n to 1M followers on X has been quite a rollercoaster.\n\nGuess like I need to start drawing anime and league characters on top of the \n$INTC\n or \n$NBIS\n charts again.","likes":65},{"id":"2101816616929648954","author":"michaelsikand","date":"2026-09-20","zh":"Michael Sikand：下一波AI重新定價在於人人都有AI員工，$META的上檔仍被嚴重低估。","risk":"","s":{"META":"bull"},"text":"The market has spent 3 years pricing the AI trade on enterprise adoption.\n\nWhile little credence has been given to its role in the consumer's life. To us, it's clear the next leg of disruption and repricing will revolve around everybody having their own AI employees.\n\nThe asymmetric upside for \n$META\n is profound and still heavily discounted by the market. How the product works is worth understanding and it's easy to imagine how \n$META\n profits, from a new subscription offering to advertising data to actually owning the transaction layer of commerce.\n\nAt the same time, it also puts pressure on other businesses that don't have the moat to withstand the rise of consumer agents. Some will continue to thrive while others are highly exposed.\n\nSo what is the right long/short viewpoint when billions of consumers have their own team of personal assistants?\n\nThis is exactly what we write about in \n@AsymmetricBets_\n this week. Read the piece here: \nhttps://\nasymmetricalbets.substack.com/p/the-age-of-a\ngentic-consumers\n…","likes":151},{"id":"2101818303216013812","author":"aleabitoreddit","date":"2026-09-20","zh":"AI 代理可低成本大量操作帳號，Reddit 與 X 等社群恐被機器人操縱輿論，平台風險升高。","risk":"監管與信任危機","s":{"RDDT":"bear","SIVE":"neutral"},"text":"The internet is now cooked soon?\n\nWith \n$RDDT\n to other social media like X more at risk due to AI.\n\nYou can have new decision models like Jev making autonomous computer interaction at near $0 cost. (With actions becoming more human-like/adapative)\n\nThen LLMs outputs influencing behavior or leading conversations. \n\nSo at scale, a malicious actor can spawn 50,000,000 bots just roaming the internet, with LLM prompts convincing people + manufacturing public opinion.\n\nThe main bottleneck would be phone number, IP, account age, maybe hardware for compute + device identifiers (which is extremely cheap still)… rather than LLM cost.\n\nI’ve already anecdotally seen short sellers use AI bots to spread negative misinformation about companies like $SIVE.\n\nOr bots market ____ account as the best one to follow in the comments.\n\nOr as seen with X uncovering 200+ bots manipulating debate about datacenter public opinion.\n\nBut the scale might be exponentially worse soon.\n\nScary to think about.","likes":890},{"id":"2101820530139759017","author":"aleabitoreddit","date":"2026-09-20","zh":"各平台都需要真人驗證；Reddit 門檻低，最先被操縱。","risk":"平台內容可信度下降","s":{"RDDT":"bear"},"text":"I mean Sam Altman was working on iris scan with his World project, so he probably saw it coming.\n\nBut human verification is probably needed across the board now for each account.\n\n\n$RDDT\n doesn’t require much so platforms like that are first to be manipulated.","likes":61},{"id":"2101821769443422492","author":"aleabitoreddit","date":"2026-09-20","zh":"Reddit 可能因 AI 機器人帶來帳號與營收成長而財報優於預期，但長期傷害平台健康。","risk":"短多長空，平台健康受損","s":{"RDDT":"neutral"},"text":"$RDDT\n will probably get more accounts + revenue from AI bots that act like human so I’d guess earnings beat.\n\nChanging public opinion with AI is really bad for democracy and long term platform health though.","likes":79},{"id":"2101824867775483913","author":"KawzInvests","date":"2026-09-21","zh":"KawzInvests研究若購物從AI代理開始，Booking、Expedia、Uber等平台還剩哪些角色。","risk":"","s":{"META":"neutral"},"text":"$META\n's Muse can search, compare, and help complete purchases for a user.\n\nThat raises a simple question: what happens when a purchase begins with an AI agent instead of a platform like Booking com, Expedia, or Uber?\n\nThe answer is more complicated than “agents replace aggregators.”\n\nSo we followed the process from the initial prompt through checkout to understand which companies remain involved, who gets paid, and why agent adoption  creates additional CPU demand.\n\n\n$META\n has spent years facing questions about what its enormous AI investment will ultimately become beyond better ads and recommendations. Muse may be the first glimpse of a broader consumer AI business.\n\nThe Age of Agentic Consumers. Link below","likes":236},{"id":"2101906175046635887","author":"aleabitoreddit","date":"2026-09-21","zh":"仍做多記憶體（EWY/DRAM），產能協議延至 3–5 年、估值吸引；舊世代記憶體因報價上漲潛力更值得交易。","risk":"小型記憶體股波動大","s":{"DRAM":"bull","EWY":"bull","MU":"bull","PSMC":"bull","SKHY":"bull"},"text":"The main duo \n$SKHY\n and Samsung are having a fun day. \n\nI'm still long memory (eg. \n$EWY\n / \n$DRAM\n ) since if capacity agreements extend 3-5 years... and your analysts model 2.8-3.3x 2027E. Risk/reward is attractive over time. \n\nBut I think legacy memory a very interesting trade currently due to ASP hike potential.. \n\nIt also just so happens these same companies procure memory from even smaller memory companies (that might have higher sensitivity)...\n\nSo if you want to, you can track $PSMC wafer allocations, and find some interesting companies that likely replace \n$MU\n discontinued legacy memory through Alliance or supply directly to Samsung. \n\nWon't mention them on X, but just throwing out some research ideas.","likes":1041},{"id":"2102029164341850355","author":"Balder13946731","date":"2026-09-21","zh":"Balder：$META 700。","risk":"","s":{"META":"bull"},"text":"$META\n 700","likes":13},{"id":"2102031462006419507","author":"KawzInvests","date":"2026-09-21","zh":"KawzInvests：CPU交易大爆發，感謝Muse。","risk":"","s":{"AMD":"bull","ARM":"bull","INTC":"bull"},"text":"Wow. Big day for the CPU trade\n\n\n$INTC\n \n$ARM\n \n$AMD\n\n\nThank you, Muse.","likes":143},{"id":"2102031950139572284","author":"KawzInvests","date":"2026-09-21","zh":"KawzInvests：$LITE要上1000。","risk":"","s":{"LITE":"bull"},"text":"$LITE\n wants 1000","likes":34},{"id":"2102032074400223386","author":"Balder13946731","date":"2026-09-21","zh":"Balder：META爆發後CPU股也跟著爆發。","risk":"","s":{"AMD":"bull","ARM":"bull","INTC":"bull","META":"bull","QCOM":"bull"},"text":"$META\n 大爆发以后，CPU也大爆发了 \n$ARM\n \n$AMD\n \n$QCOM\n \n$INTC","likes":30},{"id":"2102032241224478956","author":"michaelsikand","date":"2026-09-21","zh":"Michael Sikand：$META是史上最簡單的交易。","risk":"","s":{"META":"bull"},"text":"EASIEST TRADE EVER \n$META","likes":228},{"id":"2102033701928599982","author":"Balder13946731","date":"2026-09-21","zh":"Balder：$AMD觸及600。","risk":"","s":{"AMD":"bull"},"text":"$AMD hit 600","likes":20},{"id":"2102037400931439101","author":"Balder13946731","date":"2026-09-21","zh":"Balder：MSFT、META、MRVL、AMD都是自己一直強推的個股。","risk":"","s":{"AMD":"bull","META":"bull","MRVL":"bull","MSFT":"bull"},"text":"$MSFT\n \n$META\n \n$MRVL\n \n$AMD\n 这些都是我一直在强推的个股，时间不会亏待各位谢谢","likes":94},{"id":"2102037834789966286","author":"KawzInvests","date":"2026-09-21","zh":"KawzInvests：$META漲7%，Muse席捲社群。","risk":"","s":{"META":"bull"},"text":"$META\n up 7%.\n\nMuse has the entire timeline in a chokehold.","likes":179},{"id":"2102043166631456896","author":"octopusycc","date":"2026-09-21","zh":"大老师：Coinbase推出美股IPO申購，給用戶更多打開App的理由，持續關注。","risk":"","s":{"COIN":"bull"},"text":"Coinbase 连美股打新也接进来了，Coinbase这次真的不一样。在加密豁免之后，市场对Coinbase的预期也在彻底变化\n\n今天 \n$COIN\n 推出 IPO 申购服务，首个项目是 Oura。符合条件的美国用户，可以在正式上市交易前，按发行价申请配售，实际能拿到多少股份取决于分配结果，不保证获配。\n\n我觉得这个动作挺值得关注。买币之外，再给用户一个打开 Coinbase 的理由。 对平台来说，后续能不能持续拿到项目、把用户留下来，比单次打新的热度更重要。\n\n这也是我愿意继续关注 Coinbase 的原因。\n\n社区合作入口：\n \nhttp://\ncoinbase.com/aff/bugsbunny?\ns=x\n…\n\n\n@coinbase","likes":7},{"id":"2102056117560086888","author":"michaelsikand","date":"2026-09-21","zh":"Michael Sikand用5倍永續合約做多$META，預期Muse大紅。","risk":"","s":{"META":"bull"},"text":"$META\n was the first information arbitrage trade I've made using a perpetual future on \n@liquidtrading\n. \n\nNo 40x BTC bullshit. I used 5x here knowing Muse would be a big hit.","likes":70},{"id":"2102062423499047004","author":"aleabitoreddit","date":"2026-09-21","zh":"瓶頸股全面大漲：CPU、雷射、記憶體、算力齊揚，主因 CPU:GPU 比例預期提高與光通訊進展。","risk":"單日漲幅大，易震盪","s":{"AAOI":"bull","AMD":"bull","ARM":"bull","CRWV":"bull","DRAM":"bull","EWY":"bull","INTC":"bull","IREN":"bull","MRVL":"bull","MU":"bull","NBIS":"bull","SIVE":"bull"},"text":"I'm not having a fun day since I got sick today. But the bottlenecks are having a good time: \n\n\n$AMD\n +9.13% | \n$INTC\n +14.16% | \n$ARM\n +14.33%\n\nCPUs go brrr\n\n$SIVE +10.32% | \n$AAOI\n +3.39% | AMS OSRAM +24.61%\n\nLasers go brrr\n\n\n$EWY\n +4.08% | \n$DRAM\n +2.83% | \n$MU\n +2.23%\n\nMemory go brrr\n\n\n$NBIS\n +4.7% | \n$CRWV\n +5.03% | \n$IREN\n +1.73%\n\nCompute go brrr\n\nProbably most material developments were CPU:GPU ratio expectations + CPU demand (from new AI releases).  \n\nAs well as optical developments from ECOC 2026 (as seen with \n$MRVL\n PR + others)\n\nStill a lot to catch up on.","likes":1699},{"id":"2102073980559692168","author":"michaelsikand","date":"2026-09-21","zh":"Michael Sikand認為Muse等消費級AI代理帶來的CPU需求遠超預期。","risk":"","s":{"AMD":"bull","ARM":"bull","INTC":"bull","QCOM":"bull"},"text":"Do you guys remember when CPU ripped when agentic AI demand saw the ratio go 6:1 per GPU?\n\nI really don't think consumer adoption was factored into those projections with the rise of Muse and Grokbot. \n\nCould be an order of magnitude higher. \n\n\n$ARM\n \n$INTC\n \n$QCOM\n \n$AMD","likes":135},{"id":"2102077552168993116","author":"Balder13946731","date":"2026-09-21","zh":"Balder：$SPCX行情應該結束了，納入QQQ權重翻倍後將迎來下一波解禁。","risk":"解禁賣壓","s":{"QQQ":"neutral","SPCX":"bear"},"text":"$SPCX\n 应该结束了，在 \n$QQQ\n 比重翻倍以后，后续会引来下一波解禁 所以小心一点哦。","likes":60},{"id":"2102091972131393869","author":"ren_stocks","date":"2026-09-21","zh":"Ren：年初就因代理式AI持有ARM、INTC、AMD等CPU股，並非跟風。","risk":"","s":{"AMD":"bull","ARM":"bull","INTC":"bull"},"text":"$INTC\n \n$AMD\n \n$ARM\n\n\nI see a lot of people piling into the CPU trade as if it were something new.\n\nDudes, I've been talking about agentic AI since the beginning of the year. I've owned CPU names like \n$ARM\n, \n$INTC\n and \n$AMD\n, not because they were popular, since memory and photonics were getting all the attention, but because from where I'm sitting, agentic AI is impossible to ignore.\n\nThis is the one that's coming for your jobs, so be ready to use it well rather than be replaced by it.\n\nMeta's Muse is just the latest and most obvious iteration of what has been brewing since the start of the year.\n\nThe lesson here is that you don't have to be in the hottest trend of the week. You just have to get the direction right for the next three years to come out ahead.\n\nBullish on the AI buildout!","likes":133},{"id":"2102095491538509883","author":"Franktradinglog","date":"2026-09-21","zh":"Frank trading買入$SHOP半天後，Shopify就與Muse達成合作。","risk":"","s":{"SHOP":"bull"},"text":"在我买入 \n$SHOP\n 后半个交易日，SHOP即和MUSE达成合作。","likes":36},{"id":"2102106853828387005","author":"michaelsikand","date":"2026-09-21","zh":"Michael Sikand：FinX散戶搶先布局$META，消費型交易散戶才有優勢。","risk":"","s":{"META":"bull"},"text":"FinX with a huge win today on \n$META\n after getting trounced last few months. So many accounts on here front ran the move.\n\nFor a consumer trade like this, it's retail who has edge as we're the ones actually using products like Muse. Wall St is trying to catch up to us now.","likes":109},{"id":"2102118068222820671","author":"michaelsikand","date":"2026-09-21","zh":"Michael Sikand：散戶要善用使用最新AI產品的優勢，在機構之前布局$META。","risk":"","s":{"META":"bull"},"text":"If you didn't hit a lick on \n$META\n today you're not exploiting your edge as a retail investor. \n\nThat means using the latest AI products, forming your POV, and positioning before the suits realize.","likes":157},{"id":"2102121306099724357","author":"Balder13946731","date":"2026-09-21","zh":"Balder：$META當日到期選擇權暴漲885倍。","risk":"","s":{"META":"neutral"},"text":"$META\n 0DTE 的期权暴涨885倍 这么癫吗？","likes":49},{"id":"2102133567446728968","author":"ren_stocks","date":"2026-09-21","zh":"Ren：Dreamforce結論是做好AI不必放慢，Muse就是最佳證明。","risk":"","s":{"META":"bull","NVDA":"bull"},"text":"$NVDA\n \n$META\n\n\nThe biggest takeaway from Salesforce's Dreamforce last week, where Jensen, Sam and Dario all spoke, was that doing AI right doesn't require slowing down.\n\nJensen said it best: \"Go as fast as we can, but not faster than we should.\"\n\nIn other words, you don't have to pace the frontier to get it right. You adjust as you go.\n\nZuckerber's Muse is the best proof of this, if you want to get something done, do it, don't talk about it.\n\nBullish","likes":16},{"id":"2102158130620837926","author":"Balder13946731","date":"2026-09-21","zh":"Balder：長短線機器人分別抓到今天最強的$META與$ARM。","risk":"","s":{"ARM":"bull","META":"bull"},"text":"长线机器人和短线机器人分别抓住了今天最强势的两个股票 \n$META\n \n$ARM","likes":33},{"id":"2102162571394740433","author":"michaelsikand","date":"2026-09-21","zh":"Michael Sikand：Muse不會侵蝕Meta廣告營收，反而是純增量；Google的搜尋廣告可能被顛覆。","risk":"Google廣告被顛覆","s":{"GOOGL":"bear","META":"bull"},"text":"I think the most bullish part of \n$META\n is that an AI product in no way cannibalizes ad revenue.\n\nPeople go to \n$META\n for entertainment, not information like \n$GOOG\n which could see ads disrupted. So it's pure upside on a brand new product that will complement the core business.","likes":396},{"id":"2102164656425160919","author":"ren_stocks","date":"2026-09-21","zh":"Ren稱讚自己Discord社群的選股能力。","risk":"","s":{"AAOI":"neutral","AMD":"neutral","LITE":"neutral","MU":"neutral","NBIS":"neutral","SNDK":"neutral"},"text":"$AMD\n \n$MU\n \n$SNDK\n \n$NBIS\n \n$LITE\n \n$AAOI\n\n\nYou think you're good, then you meet people who absolutely mog you.\n\nBrother, the people in my Discord are genuinely insane. So proud to have built one of the highest-alpha communities I've ever been part of.\n\nGet the direction right, the market does the rest.","likes":125},{"id":"2102200852744376655","author":"michaelsikand","date":"2026-09-22","zh":"Michael Sikand參加高通驍龍峰會，$QCOM大漲近10%，將挖掘其在AI、穿戴與機器人的機會。","risk":"","s":{"QCOM":"bull"},"text":"Just arrived in Maui for \n$QCOM\n Snapdragon Summit.\n\n\n$QCOM\n exploded nearly 10% today along with other CPU players!\n\nSo this week I'll be hunting for asymmetric upside around \n$QCOM\n's role in AI, wearables, robotics and more. \n\nEven interviewing the CFO for deeper insights.","likes":149},{"id":"2102202440653369660","author":"Balder13946731","date":"2026-09-22","zh":"Balder：$AMD市值破兆美元，$MRVL的大行情才剛開始。","risk":"","s":{"AMD":"bull","MRVL":"bull"},"text":"$AMD\n 已经达到1万亿美元，然而 \n$MRVL\n 的星辰大海才刚刚开始","likes":107},{"id":"2102204908414108068","author":"Balder13946731","date":"2026-09-22","zh":"Balder：新高靠輪動，週二QCOM、BABA有大會，週三META有發表，不用急著走。","risk":"","s":{"BABA":"bull","META":"bull","QCOM":"bull"},"text":"新高通常是轮动轮上去的，周二 \n$QCOM\n \n$BABA\n 有大会，周三 \n$META\n 有发布。\n\n所以大家不用急着走哦🫪","likes":51},{"id":"2102206142956839081","author":"ren_stocks","date":"2026-09-22","zh":"Ren：企業AI預算進入重視投資報酬的階段，早期採用者更懂如何讓AI有用。","risk":"","s":{"AMD":"bull","CRWV":"neutral","NBIS":"neutral","NVDA":"bull"},"text":"$NVDA\n \n$AMD\n \n$NBIS\n \n$CRWV\n \n\nIn corporate this budget season was different.\n\nWe're now tracking the right metrics so that every dollar spent on AI earns a proper return.\n\nThe MVP phase is over, and early adopters now have a much more robust understanding of what makes AI actually useful: the underlying data, the right architecture, the processes built around it, and the people who know how to use it.\n\nUse cases with proper ROI, become recurring spend lines.\n\nBullish","likes":35},{"id":"2102207465408671751","author":"ren_stocks","date":"2026-09-22","zh":"Ren：可能要加碼$META。","risk":"","s":{"META":"bull"},"text":"I might need to up my \n$META\n shares.\n\nThis guy has proper game.","likes":196},{"id":"2102221481736646965","author":"ren_stocks","date":"2026-09-22","zh":"Ren開玩笑說Muse代理可能讓INTC財報買權翻十倍或腰斬。","risk":"","s":{"INTC":"neutral","META":"neutral"},"text":"@bubbleboi\n x \n$META\n Muse \n\nIs the crossover we didn't know we needed.\n\nThis autonomous agent will either 10x your \n$INTC\n calls into earnings or cut them in half.\n\n\n@alexandr_wang\n, how long to make this happen?","likes":20},{"id":"2102247915251224980","author":"aleabitoreddit","date":"2026-09-22","zh":"Meta Muse 表現亮眼，長任務大量吃 CPU 與記憶體；Intel 稱 CPU 只能滿足五成需求，利多 AMD/Intel/Arm。","risk":"CPU 需求能否持續待驗證","s":{"AMD":"bull","AMZN":"neutral","ARM":"bull","INTC":"bull","META":"bull","NBIS":"neutral"},"text":"All right \n$META\n Muse is cooking. \n\nI can hear all the \n$AMD\n, \n$INTC\n, and \n$ARM\n CPUs vrrrring in the background.\n\nAlong with the memory + components (NICs, SSDs, DRAM) needed for all the browsers/VMs\n\nWhen I ask it to do a bunch of long form tasks… \n\nIntel CEO also said recently that CPU demand is so strong they can only support 50% of what customers need, so there’s some signals there.\n\nI’m also curious how much \n$AMZN\n or \n$NBIS\n is involved with running Muse, or if Meta hosts everything inhouse.\n\nKinda an ADHD post but Meta beat my expectations with this release.\n\nWill keep trying it out","likes":1459},{"id":"2102256045938852015","author":"aleabitoreddit","date":"2026-09-22","zh":"比特幣與以太幣強彈，Robinhood、Coinbase 回溫；加密幣常領先高 beta AI 股，市場風險胃口回來。","risk":"升息環境下反彈可能短暫","s":{"COIN":"bull","HOOD":"bull"},"text":"Wow Bitcoin + Ethereum pulled pretty extreme recoveries.  \n\nLooks like \n$HOOD\n / \n$COIN\n / Crypto is back? \n\nOn-chain equities trading + regulator exemptions probably put a lot of fuel into the fire for the sector.  \n\nThat aside... crypto is usually a great indicator for high-beta AI equities believe it or not (they tend to frontrun broader market drops or rallies). \n\nSo overall market risk appetite might be coming back despite the rate hikes.","likes":1091},{"id":"2102371692106695149","author":"aleabitoreddit","date":"2026-09-22","zh":"整理從微軟 Maia 到 Google TPU 的 ASIC 供應鏈。","risk":"無","s":{"MSFT":"neutral"},"text":"ASIC supply chain from $MSFT Maia to $GOOGl TPUs +…","likes":205},{"id":"2102391630515110126","author":"aleabitoreddit","date":"2026-09-22","zh":"傳統價值投資式微；ESMT 營收年增 605%、年化本益比僅 1.8 倍，爭點只在成長能延續多久。","risk":"高成長持續性存疑","s":{"ESMT":"bull","PYPL":"neutral","UPWK":"neutral"},"text":"I feel like traditional \"value investing\" went into hibernation.\n\nBefore it was finding a 10x -12x P/E company like \n$UPWK\n or \n$PYPL\n, Dominoes, Pepsi. Or even a cheap Japanese company below book value.\n\nThen just enjoying slow growth but buyback/dividend appreciation from their cashflow. \n\nNow you can find 1.8x runrate P/E company like $ESMT that grew revenue 605.24% Y/Y. \n\nAnd the main thing you need to argue about is duration. \n\nOr a 16.2x trailing P/E Sumitomo, despite having way too many hyperscaler LTAs in AI from fiber to lasers. \n\nAI created much bigger medium-term anomaly, where \"value investing\" went towards high growth, \"deep value\" companies.","likes":796},{"id":"2102414336065257596","author":"octopusycc","date":"2026-09-22","zh":"大老师認為油價、通膨與升息鏈條可能出現拐點，霍爾木茲海峽有望恢復通航。","risk":"","s":{"AAPL":"neutral"},"text":"我现在越来越觉得，这轮市场真正的拐点，可能已经开始出现了。\n\n过去几个月市场交易的是一条很简单的链条：\n\n霍尔木兹受阻 → 原油高位 → 通胀重新抬头 → 全球央行被迫加息 → 风险资产承压。\n\n但最近几天，这条链条开始出现了一股完全相反的力量。\n\n美联储加息已经落地，日本央行也继续加息。\n\n当高油价真的开始传导到通胀、利率和经济之后，美日韩对于原油问题的态度明显变得更紧迫。\n\n美国持续释放战略石油储备，日本已经动用库存保障供应，韩国甚至开始讨论参与霍尔木兹海峡的航运安全。\n\n更值得注意的是外交端。\n\n中国和伊朗谈，核心议题之一就是尽快恢复霍尔木兹海峡通航；\n\n美伊重新出现谈判窗口，伊朗甚至提出，如果美国缓和军事压力、解除港口封锁，可以在一周内重新开放霍尔木兹；\n\n接下来的中美会谈，伊朗和能源问题同样绕不开。\n\n所以我现在看这些事情，不会把它们拆开。\n\n真正的拐点，不是哪一场和谈。\n\n而是当高油价最终逼到通胀和加息这一步之后，各方第一次都有足够强的动力，让原油重新下来。\n\n今天市场其实已经开始交易这股“反向力量”：\n\n霍尔木兹缓和 → 原油回落 → 通胀预期降温 → 加息压力边际下降 → 风险资产重新获得支撑。\n\n如果这个逻辑继续兑现，我认为接下来最值得交易的，可能已经不是继续追高原油，而是寻找这轮宏观拐点之后的反向机会。\n\n————————————\n\n最近正好 MSX 在做「秋日淘金」活动，RWA 现货和合约交易都能参与，奖池 50,000 USDT，还有 iPhone DUO / iPhone 18 Pro、$APPL 和限定金钞等奖励。\n\n活动一、金秋现货礼｜瓜分10,000 USDT，最高领 300 USDT\n总奖池：10,000 USDT 合约体验金\n规则：活动期间，累计RWA现货交易量 ≥ 100 USDT，即可参与对应档位奖池瓜分，单人最高可得300 USDT合约体验金！\n\n活动二、金秋合约礼｜竞逐 40,000 USDT，赢 iPhone Duo 与限定金钞\n活动期间，累计合约交易量达到指定门槛，即有机会赢 iPhone DUO及MSX 限定金钞等豪礼，总奖池价值 40,000 USDT！\n\n活动三、金秋幸运礼｜惊喜加码，抽 MSX 限定周边\n活动期间，满足以下任一条件，即可自动获得抽奖资格，无需手动参与抽奖：\n• 累计RWA现货交易量 ≥ 100 USDT；\n• 累计合约交易量 ≥ 1,000 USDT。","likes":21},{"id":"2102427727987179692","author":"aleabitoreddit","date":"2026-09-22","zh":"戲稱 SanDisk 與 Lumentum 成了「超級智慧概念股」。","risk":"題材炒作退燒","s":{"LITE":"bull","SNDK":"bull"},"text":"I guess I need to start calling \n$SNDK\n or \n$LITE\n Super Intelligence stocks.\n\nThanks Trump.","likes":1002},{"id":"2102440858314281032","author":"KawzInvests","date":"2026-09-22","zh":"KawzInvests：市場恐慌AI放緩時，Anthropic正與$RUM簽算力合約。","risk":"","s":{"RUM":"bull"},"text":"I find it so funny that FinX spent all of last week panicking about Pacing the Frontier while Anthropic was signing a compute deal with \n$RUM\n \n\nLike bruh.","likes":41},{"id":"2102476258336747908","author":"michaelsikand","date":"2026-09-22","zh":"Michael Sikand：消費級AI代理是新戰場，CPU與支付股受惠，比價平台受威脅。","risk":"AI代理取代平台","s":{"APP":"neutral","ARM":"bull","BKNG":"bear","CART":"neutral","DASH":"neutral","EXPE":"bear","GOOGL":"neutral","INTC":"bull","MA":"bull","META":"bull","TTD":"neutral","UBER":"neutral","V":"bull"},"text":"The agentic supercycle of AI is here. \n\nSo what's going to happen next.\n\nConsumer agents are the new battleground in AI. Expect OAI and Anthropic to drop their Muse/Grokbot competitor in coming weeks. Let's not forget OAI bought OpenClaw.  \n\nWhat happens?\n\nHardware: Most direct beneficiaries are the CPU names, many far off ATH like \n$INTC\n, \n$ARM\n. \n\nPayments: I see \n$V\n  \n$MA\n  \n$Shop\n/Paypal/Stripe as winners of agentic commerce \n\nBooking Aggregators = Losers. Feels like travel sites are clear losers with margin compression and increased comparison shopping \n$BKNG\n \n$EXPE\n \n\nConsumer Intent Advertising: While ad platforms like \n$META\n and \n$APP\n will thrive with entertainment first ad consumption, there will be increased pressure on \n$GOOG\n search or aggregators that are increasingly margin dependent on ad revenue in app based on humans using their interfaces \n$TTD\n \n$CART\n \n$DASH\n \n$UBER","likes":115},{"id":"2102478316179689589","author":"Balder13946731","date":"2026-09-22","zh":"Balder：$QQQ盤中創歷史新高。","risk":"","s":{"QQQ":"bull"},"text":"$QQQ\n 盘中刷新历史新高。","likes":25},{"id":"2102487275875811574","author":"Balder13946731","date":"2026-09-22","zh":"Balder：$AMD本週看700，年內看1000。","risk":"","s":{"AMD":"bull"},"text":"$AMD\n 我们这周看700，年内看1000","likes":90},{"id":"2102493972115677608","author":"DJTRadar","date":"2026-09-22","zh":"DJT Radar：川普7月多次買入$MSTR，自7/24以來上漲83%。","risk":"","s":{"MSTR":"neutral"},"text":"Trump bought \n$MSTR\n multiple times in July.\n\nIt's up 83% since the July 24 purchase.","likes":861},{"id":"2102495694087164323","author":"Balder13946731","date":"2026-09-22","zh":"Balder演算法日誌：$SOXS停損5.32%，持有BAC。","risk":"","s":{"SOXS":"bear"},"text":"平仓亏损 1 \n$SOXS\n 34.93→33.07 -5.32%\n\n 持仓 BAC 57.73→56.2 -2.7%\n\n balder-algo-logs · 龙气 · 09-22 · algo log · not advice","likes":7},{"id":"
