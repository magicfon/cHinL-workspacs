U\n just guided $61.5B revenue next quarter.\n\nOne year ago they did $11.3B in a quarter. Wow","likes":173},{"id":"2105397070681248021","author":"aleabitoreddit","date":"2026-09-30","zh":"Google Gemini 4 Argon基準測試公布，作者認為Google回來了；$MU、$JBL財報稍後再評論。","risk":"","s":{"GOOGL":"bull","JBL":"neutral","MU":"neutral"},"text":"$GOOGL\n Gemini 4 Argon benchmarks got released.\n\nAgainst GPT-6 Astra + Anthropic Fable 5.1 / Opus 5.5.\n\nStill coughing nonstop, so will comment on \n$MU\n / \n$JBL\n  earnings later. \n\nI've always thought Google's internal models were stellar, but anecdotally, they seem to get hard nerfed shortly after public release... Maybe because of compute constraints?\n\nBut yeah, looks like Google is back.","likes":1244},{"id":"2105397139627225130","author":"ren_stocks","date":"2026-09-30","zh":"Ren：美光下季指引615億美元遠超預期，史上最大擴產仍預期2027–28年供給更吃緊。","risk":"","s":{"MU":"bull"},"text":"$MU\n\n\nThe biggest memory buildout in Micron's history, and they still see supply getting tighter in 2027 and 2028.\n\nNext quarter Micron guided to $61.5B of revenue against $57B expected, and $38.15 of EPS against about $35. And they expect fiscal 2027 to be another record year, with revenue growing every single quarter.\n\nMicron expects memory and storage supply to get even tighter in 2027 and 2028. That's why they're spending $25B on capex in just the first half of the year, with more in the second half, which puts fiscal 2027 north of $50B by my math.\n\nThe biggest memory buildout Micron has ever done, and they still see the shortage getting worse, not better, for two more years.\n\nThey're also more than doubling the R&D increase they guided in June, from about $1B to $2.5B, because the product roadmap keeps getting bigger.\n\nThey expect a more moderate rate of price increases from here, so growth shifts more toward volume. That's the part the bears will focus on, and it's worth watching.\n\nMemory is very much alive and thriving! \n\nBullish","likes":109},{"id":"2105397854030422232","author":"Balder13946731","date":"2026-09-30","zh":"Balder：$MU期權隱含波動±11%，市場可能在等巨額回購宣布。","risk":"","s":{"MU":"bull"},"text":"由于 \n$MU\n 的期权波动预期值是+-11%，所以目前财报的所有结果还没展现出来\n\n我感觉有可能，市场是在等一笔巨额回购的宣布。","likes":33},{"id":"2105399528090157540","author":"ren_stocks","date":"2026-09-30","zh":"Ren：Vicor九天內二度上修，Q3營收季增逾30%，授權權利金模式發酵，正走世代行情。","risk":"","s":{"VICR":"bull"},"text":"$VICR\n IS ON A GENERATIONAL RUN\n\nSecond raise in nine days.\n\nVicor now expects Q3 revenue to grow more than 30% sequentially, up from more than 20% last week, which was itself up from about 10% before that. The reason: higher royalties from its first non-exclusive Vertical Power Delivery license.\n\nThis is the licensing model doing exactly what I said it would: every rack that ships with Vicor's vertical power delivery pays Vicor, whether Vicor builds the module or not.\n\nFor scale, Q2 revenue was $143.4M, so more than 30% growth puts Q3 above $186M by my math. And royalties carry far higher margins than products, so the earnings impact should be bigger than the revenue number suggests.\n\nIt also connects straight to my power supply chain piece. DC-DC conversion right next to the silicon is the layer I said I'd watch most closely, because as racks get denser, every point of efficiency there becomes worth more.\n\nThe stock is up about 12% after hours, to around $324.\n\nI became interesting in this stock at $180, just a few weeks ago, now I'm watching it fly. Damn.\n\nI won't chase but talk about FOMO.","likes":59},{"id":"2105400477504655376","author":"Balder13946731","date":"2026-09-30","zh":"Balder：Google推出Gemini 4，疑似擊敗Astra與Opus 5.5。","risk":"","s":{"GOOGL":"bull"},"text":"$GOOG\n 放出了 Gemini 4，看起来疑似击败了Astra和Opus 5.5","likes":9},{"id":"2105419963167277061","author":"michaelsikand","date":"2026-09-30","zh":"Michael Sikand覺得$HOOD代理展示很酷，但更想要能即時交易突發新聞的代理。","risk":"","s":{"HOOD":"neutral"},"text":"I thought the \n$HOOD\n agentic demo was cool. But all I care about is having agents that tra ents to 26 in a single quarter, with order visibility now reaching 2031. Prepayments climbed to $32B from $22B, the contracted backlog sits at $150B, and about 75% of 2027 output is already locked in.\n\nHBM is even tighter. 2027 supply is sold out with prices up 54% y/y, and bit demand is growing 63% against 37% for the rest of server memory.\n\nThis goes well beyond Micron. Samsung has 60 to 70% of its plant capacity under contract and SK Hynix is signing five-year terms.\n\nYou only prepay $32B years ahead when the bigger risk is ending up with no supply.\n\nCycles end when supply catches up, and right now nobody in this industry can tell you when that happens.\n\nBullish memory","likes":231},{"id":"2107305938432725004","author":"octopusycc","date":"2026-10-06","zh":"大老师：非農疲弱使升息預期降溫、油價回落，觀察航空與郵輪股成本面修復，但10年債殖利率仍是關鍵。","risk":"10年債殖利率仍高","s":{"AAL":"neutral","CCL":"neutral","DAL":"neutral","LUV":"neutral","NCLH":"neutral","RCL":"neutral","UAL":"neutral"},"text":"复盘一下 NFP 之后的市场。\n\n我觉得现在市场正在同时交易两条非常清晰的 Reverse 逻辑：\n\n1. NFP → 加息预期快速降温\n\n9月 NFP 只新增 2.9万人，失业率升至 4.2%，同时7、8月就业合计又被下修6万人。(Bureau of Labor Statistics)\n\n最直接的变化就是市场重新定价 FED。\n\n目前10月加息概率已经从一周前的约 64%降到24%左右，市场基本开始交易10月暂停。\n\n这里需要注意一个时间点：\n\n今年剩下的 FOMC 只有 10月27-28日和12月8-9日，11月没有议息会议。\n\n所以真正应该观察的是：\n\n10月暂停 → 12月是否还需要加 → 整个加息周期最终还剩几次。\n\n现在市场真正开始提前交易的，就是本轮加息周期可能缩短。\n\n这对成长股和高估值资产是直接的边际利好。\n\n但我暂时不会因此直接转向全面 Risk-on。\n\n因为另外一个风险还没有解决：\n\n长端美债收益率依然很高。\n\n10Y仍然在5%以上，而且长端收益率受到期限溢价、国债供给等因素影响，并没有随着加息预期下降同步大幅回落。\n\n所以目前更像：\n\n短端开始交易 FED 转鸽，长端依旧交易财政/通胀/供给压力。\n\n这两个逻辑目前同时存在。\n\n2. 第二条 Reverse：原油\n\n原油也开始出现事实上的回落。\n\n周一 Brent 下跌约 1.9%至100.32美元，WTI 下跌约 1.8%至89.43美元。\n\n原因包括中东原油出口恢复、G7释放供应，以及沙特下调亚洲OSP。\n\n这意味着此前市场交易的：\n\n油价上涨 → 通胀上升 → FED更鹰 → 航空/邮轮成本上升\n\n开始出现反向交易：\n\n油价回落 → 通胀压力下降 → FED加息压力下降 → 高燃油成本行业利润预期修复。\n\n这里我会重点观察两组：\n\n邮轮\n嘉年华 \n$CCL\n\n皇家加勒比 \n$RCL\n\n挪威邮轮 \n$NCLH\n\n\n航空\n达美航空 \n$DAL\n\n联合航空 \n$UAL\n\n美国航空 \n$AAL\n\n西南航空 \n$LUV\n\n\n这些公司的共同点很简单：燃油都是非常重要的成本项。\n\n之前油价下跌时，$AAL、$UAL、$DAL 曾经同时出现超过2%的上涨，$CCL、$NCLH、$RCL 也同步上涨，说明市场确实会交易这条成本端 Reverse。\n\n所以接下来我的观察框架很明确：\n\n① NFP Reverse\n就业降温 → 10月加息概率暴跌 → 市场开始交易加息周期缩短\n\n② Oil Reverse\n原油回落 → 通胀预期缓和 → 航空/邮轮成本预期改善\n\n如果后面油价继续向下，同时10Y也开始真正回落，那么这两条 Reverse 会从局部行业交易进一步扩散到整个风险资产。\n\n目前最大的确认信号，依然是 10Y。\n\n——————\n\n但是 最大框架不变，只是周期上出现了些许调整。","likes":9},{"id":"2107343712753996072","author":"Balder13946731","date":"2026-10-06","zh":"Balder：點名能源股CEG、BE。","risk":"","s":{"BE":"neutral","CEG":"neutral"},"text":"能源股 \n$CEG\n \n$BE","likes":7},{"id":"2107357674891550759","author":"octopusycc","date":"2026-10-06","zh":"大老师：本週催化劑：MRVL、ZS投資人日，微軟Windows/Surface活動，台積電9月營收。","risk":"","s":{"MRVL":"neutral","MSFT":"neutral","TSM":"neutral","ZS":"neutral"},"text":"本周 几个 Alpha 可以关注一下\n\n10/6 周二\n\nMRVL investor day \n$MRVL\n \n\nZS investor day \n$ZS\n\n\n10/7 周三\n\nMicrosoft Windows / Surface Event \n$MSFT\n \n\n10/8 周四\n\nTSMC 9月月度营收 \n$TSM","likes":24},{"id":"2107370111975739606","author":"octopusycc","date":"2026-10-06","zh":"大老师：MRVL需要新催化劑突破280美元買權牆；微軟AI PC活動可能重燃敘事，看550–580。","risk":"MRVL缺乏催化劑","s":{"MRVL":"neutral","MSFT":"bull"},"text":"尤其关注 MRVL 和MSFT 的Catalyst（催化剂）\n\n\n$MRVL\n 迫切的需要一个新的Catalyst 以突破近期的Call wall———短期280美金\n\n10月6日美东时间 9:00 开始，CEO Matt Murphy 和管理层会直接讲公司战略、增长机会，以及 MRVL 在下一代 AI/Data Center Infrastructure 中的位置。\n\n—————\n\n\n$MSFT\n的Windows/Surface活动依然非常重要\n\n10月7日 Microsoft 有 Windows / Surface 相关活动，目前披露的信息指向 Local AI + 下一阶段PC生态，同时涉及 NVIDIA CEO Jensen Huang，以及 RTX Spark / Surface / AI PC。\n\n因为它对应一条目前相对没有数据中心AI那么拥挤的链：\n\nMSFT → Windows AI → Local AI → AI PC → NVDA / QCOM / ARM\n\n如果出现新的硬件形态或者Windows端AI Agent能力，可能重新刺激 AI PC 叙事。\n\n也许这是一个短期550-580的Catalyst","likes":13},{"id":"2107399356068331969","author":"DJTRadar","date":"2026-10-06","zh":"DJT Radar：川普兩週前申報買進PTC最多100萬美元，施耐德隨即宣布226億美元收購、股價跳漲35%。","risk":"","s":{"PTC":"neutral"},"text":"BREAKING: Our data just caught something wild on Trump's trading.\n\n2 weeks ago, President Trump filed a purchase of up to $1 million of PTC Inc.\n\nYesterday Schneider Electric announced it's buying \n  smart home devices will include a doorbell, thermostat and other accessories developed through a partnership with LG Electronics\n\nThe products will be part of an ecosystem of devices that work with Apple’s new smart home products - Bloomberg","likes":1084},{"id":"2107582530115318056","author":"ren_stocks","date":"2026-10-06","zh":"Ren：B200已無空機可租、租價九個月漲約30%，算力極度吃緊。","risk":"","s":{"NBIS":"bull","NVDA":"bull"},"text":"$NBIS\n \n$NVDA\n\n\nThere are no B200s left to rent. Read that again.\n\nOn-demand availability for Nvidia's B200 started the year above 60%. By late March it was at zero, it got a small breather in June when about 5% of capacity opened up, and since mid-August it has been flat at 0.0%. \n\nEvery chip that comes online is taken before it reaches the on-demand pool.\n\nThe B200 rental index went from about $4.40 an hour in January to $5.78 now, a gain of roughly 30% in nine months on hardware that is supposed to get cheaper as it ages. \n\nOne-year contract pricing tells the same story and is pushing past $6.\n\nThe older chips are the part I find most bullish. \n\nAn H100 on a one-year contract was around $1.70 a year ago and is near $2.80 today. \n\nThat is a chip from 2022 renting for about 65% more than it did last October, and even the A100 is drifting higher. The whole bear case on neoclouds rested on GPUs losing value fast enough to wreck the returns on these buildouts, yet the opposite is happening.\n\nMega bullish","likes":167},{"id":"2107584539224948911","author":"Balder13946731","date":"2026-10-06","zh":"Balder：10/6美股復盤，三大指數收高，光通訊股大漲，記憶體與測試設備股重挫。","risk":"","s":{"SPY":"neutral"},"text":"【美股复盘 · 10月6日】\n\n**大市**\n美股三大指数靠稳造好，惟细价股表现反复偏软。标普( \n$SPY\n )全日收报779.09，升0.55%；纳指(QQQ)收报759.69，升0.46%；道指(DIA)收报514.56，升0.48%。相较之下，罗素小型股(IWM)遭遇沽压，收报281.37，跌0.71%，未能与大市同步。大市整体市宽偏强，104只观察股中，69只上升，35只下跌，反映资金仍倾斜于大型蓝筹及科技权重股。\n\n**板块**\n板块走势呈现两极分化。通讯网络设备及光纤概念股受资金追捧，表现一枝独秀。其中Ciena(CIEN)急升13.85%领跑大市，Nebius(NBIS)及Applied Optoelectronics(AAOI)分别升7.44%及7.07%，诺基亚(NOK)与康宁(GLW)分别造好7.55%及6.02%。此外，CoreWeave(CRWV)及Arista Networks(ANET)亦录得4.95%及4.09%升幅。另一边厢，环球存储芯片及半导体测试设备股暴跌，拖累相关板块急泻。Aehr Test Systems(AEHR)重挫11.74%领跌，希捷(STX)及西部数据(WDC)分别泻9.18%及6.93%，SK海力士(SKHY)及闪迪(SNDK)亦挫6.39%及2.56%；受韩国半导体权重股弱势拖累，MSCI韩国ETF(EWY)全日下挫2.64%。\n\n**焦点**\n个股焦点方面，网络基建巨头思科(CSCO)逆市造好，收升4.54%；回顾2000年科网泡沫时期，该股曾为全市场之网络基石，惟泡沫爆破后足足耗时24年方重新摸到当年高点，反映科技龙头若遭套牢，盲目死扛或需承担极大时间成本。此外，尽管市场对部分人工智能大模型之炒作渐生审美疲劳，惟真正具备深厚护城河之硬件设备仍受热议；如ASML之EUV光刻机，造价两亿美元起步，单次发货需拆解为逾四十个集装箱，其内部光学反射镜之平整度堪称极致，展现出残暴之行业壁垒。受底层基建逻辑带动，涉及通信网络之AST SpaceMobile(ASTS)及美满电子(MRVL)今日获买盘吸纳，分别收升8.00%及5.81%。反观半导体设备大厂应用材料(AMAT)及传统芯片巨头英特尔(INTC)表现疲弱，分别跌2.21%及3.19%。同日，赛富时(CRM)与莫德纳(MRNA)亦见沽压，分别下挫2.09%及7.75%。\n\n**小结**\n总括而言，美股大市呈现高位整固形态，网络通信股与存储芯片股形成强烈对比，板块轮动支撑指数靠稳。分析指，当前大市市宽尚算健康，惟存储芯片等硬件板块之持续弱势或成隐忧。后市走势料将受制于资金在各板块间的博弈，投资者宜留意标普(SPY)能否企稳现有水平，同时需警惕罗素小型股(IWM)失守关键位对大市整体气氛之拖累；操作上需审慎甄别科技股之实质护城河，切忌对部分弱势龙头抱有盲目死守","likes":5},{"id":"2107584541020037544","author":"ren_stocks","date":"2026-10-06","zh":"Ren：中國推論token用量預估到2030年成長近60倍，推升算力與記憶體需求。","risk":"","s":{"AAOI":"bull","LITE":"bull","MU":"bull","NBIS":"bull","SNDK":"bull"},"text":"$NBIS\n \n$MU\n \n$SNDK\n \n$LITE\n \n$AAOI\n\n\nChina is on track to use roughly 64,000 trillion inference tokens this year. The projection for 2030 is about 3.85 million trillion, which is close to 60x in four years, or nearly a tripling every single year until the end of the decade.\n\nConsumption more than triples in 2027, more than triples again in 2028, and then still doubles in each of the following two years off a base that is already enormous. The jump from 2029 to 2030 alone adds about 30 times what the whole country is consuming today.\n\nIt leaves out the US hyperscalers, the model labs, Europe, the Gulf buildouts and every sovereign program being announced right now.\n\nTokens are the unit that everything else follows. \n\nEach one needs a chip to compute it, memory to hold the model and its context, and optics to move the data, so a 60x increase in tokens pulls on every layer of the stack at once. \n\nPeople keep asking me when AI demand peaks, I rather they draw their own conclusion.\n\nLook at the bar for 2026, now look back at me.\n\nExactly","likes":129},{"id":"2107590835994804475","author":"StockMKTNewz","date":"2026-10-06","zh":"Evan：Dan Ives進入2027年的五大科技股為輝達、微軟、Palantir、蘋果、CrowdStrike。","risk":"","s":{"AAPL":"neutral","CRWD":"neutral","MSFT":"neutral","NVDA":"neutral","PLTR":"neutral"},"text":"Dan Ives just said his top 5 tech plays going into 2027 are\n\nNvidia \n$NVDA\n \nMicrosoft \n$MSFT\n \nPalantir \n$PLTR\n \nApple \n$AAPL\n \nCrowdStrike \n$CRWD","likes":621},{"id":"2107591226468008086","author":"unusual_whales","date":"2026-10-06","zh":"Unusual Whales：訂閱以取得GME動態。","risk":"","s":{"GME":"neutral"},"text":"To get \n$GME\n updates, subscribe to Unusual Whales.\n\nCheck all options info right on site.\n\nSee more:","likes":17},{"id":"2107597396876169252","author":"StockMKTNewz","date":"2026-10-06","zh":"Evan：據報微軟Xbox拿下GTA 6獨家串流權。","risk":"","s":{"MSFT":"bull"},"text":"Microsoft \n$MSFT\n owned Xbox reportedly managed to land a deal for the exclusive game streaming rights for Grand Theft Auto VI - The Verge","likes":210},{"id":"2107600658538914275","author":"StockMKTNewz","date":"2026-10-06","zh":"Evan：據報SpaceX擬發債400億美元購買輝達晶片。","risk":"","s":{"NVDA":"bull","SPCX":"neutral"},"text":"SpaceX \n$SPCX\n is reportedly looking to raise $40 Billion by selling debt to buy Nvidia \n$NVDA\n chips - Financial Times","likes":1346},{"id":"2107619702310879702","author":"unusual_whales","date":"2026-10-06","zh":"Unusual Whales：蘋果將於10/13推出與LG合作的門鈴、溫控器等智慧家庭產品。","risk":"","s":{"AAPL":"neutral"},"text":"Apple, \n$AAPL\n, is going to push into smart home devices will include a doorbell, thermostat and other accessories developed through partnership with LG Electronics, set to be introduced on October 13, per Bloomberg.","likes":903},{"id":"2107620509605409232","author":"jukan05","date":"2026-10-06","zh":"Jukan：Meritz預期部分手機DRAM價格2027年Q1季增50%以上，蘋果需吸收漲價。","risk":"蘋果成本上升","s":{"AAPL":"neutral","DRAM":"bull"},"text":"Meritz Securities: Some mobile DRAM prices are expected to surge +50% in 1Q27.\n\nFull comment: The race toward AGI is driving competitive, structural growth in server demand. Even so, B2C applications led by smartphones remain the last segment still resisting price increases. Our channel checks, however, indicate that mobile memory prices for a key customer (Apple) will rise by a staggering 50% or more QoQ starting in 1Q27, as memory makers keep shifting production from LPDDR to server DRAM and HBM. The key customer is building its 20th anniversary flagship smartphone next year, so it will have to absorb the price surge.\n\n\n$AAPL\n \n$DRAM","likes":173},{"id":"2107629730317074555","author":"unusual_whales","date":"2026-10-07","zh":"Unusual Whales：訂閱以取得Palantir動態。","risk":"","s":{"PLTR":"neutral"},"text":"To get \n$PLTR\n updates, subscribe to Unusual Whales.\n\nCheck all options info right on site.\n\nSee more:","likes":9},{"id":"2107643028521279860","author":"ren_stocks","date":"2026-10-07","zh":"Ren：做多SNDK。","risk":"","s":{"SNDK":"bull"},"text":"$SNDK\n Long","likes":75},{"id":"2107653638709489678","author":"ren_stocks","date":"2026-10-07","zh":"Ren：美銀預期每顆GPU記憶體容量持續增加，Rubin Ultra達1000GB，最吃緊的零件用量反而變多。","risk":"","s":{"MU":"bull","SKHY":"bull","SNDK":"bull"},"text":"$SKHY\n \n$MU\n \n$SNDK\n\n\nMemory per GPU is going up, and the math is getting silly.\n\nThe fear with memory at these prices has always been \"de-spec,\" the idea that chip designers respond to expensive memory by using less of it. \n\nBofA's memory team is assuming the opposite. \n\nRubin moves from 288GB to 384GB, a third more per chip, and Rubin Ultra goes to 1,000GB, which is about 3.5x what ships today.\n\nSo the most supply-constrained component in the stack is getting designed in at higher content, into more chips, every generation. \n\nThat is how you get to their new 2030 forecast of $2.0 trillion in DRAM and NAND sales, raised from $1.8 trillion. For scale, the 2018 cloud boom peaked at $170 billion, and last year did about $210 billion.\n\nThe industry is already running above a $1 trillion annual pace, based on $278 billion of sales in the third quarter alone. \n\nGetting to $2 trillion from here is a doubling in four years, with bit growth in the high teens and the mix shifting toward HBM and enterprise SSDs.\n\nBullish memory","likes":284},{"id":"2107669764395176397","author":"michaelsikand","date":"2026-10-07","zh":"Michael Sikand：PENG把AI基建重心轉向新雲端，新客戶6家中有4家是新雲端，是更大的機會。","risk":"","s":{"PENG":"bull"},"text":"$PENG\n just unlocked this brand new asymmetric lever and it's genius.\n\nPreviously the company was pushing sovereign AI as the main customer set for their AI infra division but per this ER they're now focused on neoclouds which is a WAY bigger opportunity. 4 of the 6 new AI infrastructure customers in Q4 were neoclouds.\n\nThese neoclouds are basically hiring \n$PENG\n as the AI factory in a box. Many of these neoclouds aren't full stack and instead just finance shops. They line up the multi-billion dollar compute deal with a hyperscaler or lab and hire \n$PENG\n to get them the hardware, set up the infra and maintain it for 5 years. One neocloud just hired them to build and run a 36,000 GPU factory in Norway backed by a $10B lab commit.\n\nThis is killer for \n$PENG\n because services made about a 49% gross margin last reported quarter, roughly double the 24% on hardware, and those contracts stick around for years. \n\nOnly about 10% of \n$PENG\n's revenue in Q4 came from services. But $1 of service revenue generates the same profit as $2 for hardware, meaning this is a strong EPS lever if it scales with these huge cluster deals from neoclouds.","likes":133},{"id":"2107674071366537708","author":"StockMKTNewz","date":"2026-10-07","zh":"Evan：AMD執行長將與三星半導體負責人會面。","risk":"","s":{"AMD":"neutral"},"text":"Advanced Micro Devices’ \n$AMD\n CEO plans to meet with the head of Samsung Electronics’s semic ral","TER":"neutral"},"text":"Correction: I think the \n$TER\n news is driving more of the \n$AEHR\n selloff than the earnings date confusion. Teradyne’s Titan HP introduces competition for Aehr’s Sonoma in burn-in testing after chips are packaged. But Aehr also offers wafer-level burn-in, which catches defective","likes":45},{"id":"2107895984730874204","author":"michaelsikand","date":"2026-10-07","zh":"Michael Sikand：調侃SpaceX與特斯拉合併後的社會。","risk":"","s":{"SPCX":"neutral","TSLA":"neutral"},"text":"Society after \n$SPCX\n and \n$TSLA\n merge","likes":66},{"id":"2107904468142768597","author":"ren_stocks","date":"2026-10-07","zh":"Ren：近幾天在SNDK與NBIS間輪動獲利豐厚，宣傳交易競賽。","risk":"","s":{"NBIS":"bull","SNDK":"bull"},"text":"Rotating between \n$SNDK\n and \n$NBIS\n has been really profitable these past few days.\n\nMy subs caught it too, and they're putting on a show in our  Liquid Tournament.\n\nThree days in and the top 3 are already up 48%, 45% and 36%. These dudes are incredible.\n\n$1,000 in prizes:\n $600\n $300\n $100\n\nIt runs until Sunday 11 and you can still get in. Sign up on \n@liquidtrading\n with code RENSTOCKS, or DM me your handle if you're already on it.\n\nCome trade with us. \n\nThe leaderboard is still up for grabs.\n\nBullish","likes":25},{"id":"2107911954786598978","author":"michaelsikand","date":"2026-10-07","zh":"Michael Sikand：Marvell首度給出到2030年的光通訊能見度，FY31營收目標700–900億美元，供應商同樣受惠，Lumentum明年只能供應三成需求。","risk":"","s":{"AAOI":"neutral","ALAB":"neutral","CIEN":"neutral","COHR":"bull","LITE":"bull","MRVL":"bull","TSEM":"neutral"},"text":"$MRVL\n is the first company that's given visibility into photonics through 2030.\n\nRevenue was $8.2B last year and the fiscal 2031 target is $70B to $90B. The TAM is 4x last investor day. Interconnect becomes the biggest segment at ~$37.5B\n\nNow think about what this means for the suppliers. Nobody else in the photonics supply chain has guided out to 2030, but they all ride the same curves.\n\n\n$LITE\n's CEO says they'll only be able to supply 30% of what customers want next year. Coherent's booked through the end of 2027.\n\nSo \n@AsymmetricBets_\n ran Marvell's model on the 6 biggest beneficiaries: \n$LITE\n \n$COHR\n \n$AAOI\n \n$CIEN\n \n$TSEM\n \n$ALAB\n\n\nEach one grows at its own market's rate, gets valued off historical multiples and has dilution baked in.\n\nBear, base and bull 2030 targets for all 7 are on my Substack below.","likes":76},{"id":"2107915991833563573","author":"KawzInvests","date":"2026-10-07","zh":"KawzInvests：Marvell投資人日給出光通訊五年路線圖、FY31 EPS目標逾30美元，整條供應鏈都受惠。","risk":"","s":{"AAOI":"bull","ALAB":"bull","CIEN":"bull","COHR":"bull","LITE":"bull","MRVL":"bull","TSEM":"bull"},"text":"$MRVL\n's investor day gave us a five-year roadmap for the photonics supply chain.\n\nManagement is targeting more than $30 in non-GAAP EPS by FY2031.\n\nAt yesterday’s Investor Day, Xi Wang described Marvell’s position in 1.6T optical connectivity:\n\n“Today, we are at 1.6T generation, shipping in high volume, leading our competitor by two years and counting.”\n\nThat buildout also needs lasers, transceivers and silicon photonics manufacturing. The opportunity extends across \n$LITE\n \n$COHR\n \n$AAOI\n \n$CIEN\n \n$TSEM\n and \n$ALAB\n.\n\nWe followed Marvell’s roadmap through the supply chain and modeled what these businesses could be worth by 2030, accounting for their different growth markets, valuations and dilution.\n\nFull breakdown below ↓","likes":87},{"id":"2107917250670002215","author":"StockMKTNewz","date":"2026-10-07","zh":"Evan：Lululemon再創52週新低。","risk":"","s":{"LULU":"bear"},"text":"Lululemon \n$LULU\n stock hit new 52 WEEK LOWS again today","likes":52},{"id":"2107920201581019613","author":"StockMKTNewz","date":"2026-10-07","zh":"Evan：納德拉宣布Windows Copilot加入混合智慧，可用本機情境與模型代為操作。","risk":"","s":{"MSFT":"neutral"},"text":"Microsoft \n$MSFT\n CEO Satya Nadella just posted this:\n\n“We’re supercharging Copilot on Windows with Hybrid Intelligence.\n\nWith your permission, Copilo (IREN)暴跌6.27%，Coinbase(COIN)下挫3.92%；Rocket Lab(RKLB)及AST SpaceMobile(ASTS)分别挫4.18%及3.91%。其他弱势股中，Nebius Group(NBIS)跌5.09%，网络安全股CrowdStrike(CRWD)表现疲弱，全日跌4.81%，安森美(ON)及IonQ(IONQ)亦分别跌4.40%及4.50%。\n\n小结\n总结全日市况，美股缺乏明确突破催化剂，资金于高位出现套现换马迹象。大厂开源顶级模型的商业博弈以及争夺电力资源等现象，反映人工智能赛道的竞争已进入深水区。分析指，当前大型科技股正面临资本开支及商业模式变现的严峻考验，而传统工业股走弱则反映市场对实体经济前景抱有疑虑。后市需密切关注企业盈利表现及债息走势，大市短期内料维持震荡格局，投资者宜留意标指在前期关键位能否建立有效支撑。","likes":6},{"id":"2107959672707907873","author":"unusual_whales","date":"2026-10-07","zh":"Unusual Whales：博通為與OpenAI合作的客製晶片安排逾500億美元融資。","risk":"","s":{"AVGO":"neutral"},"text":"Broadcom, \n$AVGO\n, is arranging more than $50 billion in financing for the custom artificial intelligence chip it's developing with OpenAI, per Bloomberg","likes":395},{"id":"2107960223331999818","author":"ren_stocks","date":"2026-10-07","zh":"Ren：靠波段操作NBIS賺錢。","risk":"","s":{"NBIS":"bull"},"text":"$NBIS\n\n\nPeople say \"free\" money doesn't exist.\n\nThey clearly don't know how to swing \n$NBIS\n \n\nNFA mfs!","likes":98},{"id":"2108004019327381611","author":"Balder13946731","date":"2026-10-08","zh":"Balder：Netflix似乎開始轉強，但不確定還能不能相信。","risk":"","s":{"NFLX":"neutral"},"text":"感觉 \n$NFLX\n 有开始转强的迹象，我还能相信他吗","likes":10},{"id":"2108010509652070904","author":"Balder13946731","date":"2026-10-08","zh":"Balder：微軟發表無人在意；HPQ短線買權已出場，流動性太差以後不做。","risk":"選擇權流動性差","s":{"HPQ":"neutral","MSFT":"neutral"},"text":"Nobody cares \n$MSFT\n posts.\n\n不过好在 \n$HPQ\n 还是上涨了一波，短线Call已经离场，不是很好的体验，主要是流动性太差了。\n\n以后不做这种流动性太差的期权。","likes":10},{"id":"2108011595448352919","author":"Balder13946731","date":"2026-10-08","zh":"Balder：博通拿500億美元融資支持OpenAI，認為OpenAI相關股（軟銀、甲骨文、博通）處境不佳。","risk":"OpenAI融資風險","s":{"AVGO":"bear","NVDA":"neutral","ORCL":"bear"},"text":"$AVGO\n 拨出500亿美元来融资支持OpenAI，前段时间 \n$NVDA\n 只出了200亿美元。\n\n说实话，现在OpenAI系的都有点惨。软银 \n$ORCL\n 和 \n$AVGO","likes":10},{"id":"2108013004101222592","author":"asklivermore","date":"2026-10-08","zh":"AskLivermore：殖利率與美元同步走高，私募信貸、車貸違約等是潛在崩盤導火線，建議逐步提高現金、買10年期公債，觀察NVDA、AAPL、MSFT是否破位。","risk":"市場崩跌風險","s itoreddit","date":"2026-10-08","zh":"真正的泡沫在創投私人公司估值，供應鏈股不是泡沫，AAOI 等相對未來成長仍明顯低估。","risk":"","s":{"AAOI":"bull","SNAP":"neutral"},"text":"@matttfoster Real bubble is in VC land with private companies like Instinct… $10B valuations off 100k users while $SNAP is worth less with close to 1 Billion MAU.\n\nSupply chain stocks aren’t a bubble though, if anything names like $AAOI and others are very undervalued relative to forward growth.\n\nAnd you have demand visibility from hyperscalers extending multiple years…","likes":228},{"id":"2108275775946576024","author":"StockMKTNewz","date":"2026-10-08","zh":"Evan：博通與AMD盤中各跌約5%。","risk":"","s":{"AMD":"neutral","AVGO":"neutral"},"text":"Broadcom \n$AVGO\n stock is now down by 5% so far today \n\n\n$AMD\n stock is now down by almost 5% so far today","likes":477},{"id":"2108277917205598655","author":"StockMKTNewz","date":"2026-10-08","zh":"Evan：據報星巴克曾洽談收購Chipotle。","risk":"","s":{"CMG":"neutral","SBUX":"neutral"},"text":"Starbucks \n$SBUX\n has reportedly explored talks about acquiring Chipotle \n$CMG\n - Financial Times","likes":58},{"id":"2108277973598232851","author":"aleabitoreddit","date":"2026-10-08","zh":"雲端巨頭是 AI 擴建的出資者，亞馬遜、Google 認為投報率極具吸引力，微軟稱擴建期仍有正自由現金流；OpenAI 募資 1680 億後交易對手風險降低。","risk":"","s":{"AMZN":"bull","GOOGL":"bull","MSFT":"bull"},"text":"@ps_georg Hyperscalers are the ones ultimately funding the AI buildout. As seen with $AMZN to $GOOGL earnings commentary, the ROI is seen as wildly attractive.\n\nEven $MSFT said they’d be FCF positive during the buildout period.\n\nI was more worried about counterparty risk until OpenAI went out and raised like $168B recently.","likes":120},{"id":"2108289323347087488","author":"StockMKTNewz","date":"2026-10-08","zh":"Evan：據報可口可樂計畫出售Costa Coffee。","risk":"","s":{"KO":"neutral"},"text":"Coca-Cola \n$KO\n is reportedly planning to sell its Costa Coffee brand - Semafor","likes":32},{"id":"2108289900735070387","author":"StockMKTNewz","date":"2026-10-08","zh":"Evan：蘋果月底約10/27將再推M6晶片MacBook Pro與iMac。","risk":"","s":{"AAPL":"neutral"},"text":"Apple \n$AAPL\n is planning a SECOND new product launch later this month on or around October 27th\n\n\"The end-of-month announcements will also include versions of the 14-inch MacBook Pro and iMac with M6 chips\" - Bloomberg","likes":16},{"id":"2108292071627100670","author":"StockMKTNewz","date":"2026-10-08","zh":"Evan：SpaceX 宣布收購全美低頻頻譜授權組合，為 Starlink 成為美國主要行動電信商鋪路。","risk":"","s":{"SPCX":"bull"},"text":"SpaceX \n$SPCX\n just posted this:\n\n\"We announced an agreement to acquire a nationwide low-band spectrum license portfolio that will pave the way for Starlink to become a major mobile carrier in the US\"","likes":1089},{"id":"2108295182126919899","author":"StockMKTNewz","date":"2026-10-08","zh":"Evan：受 SpaceX 頻譜消息影響，Verizon 盤後下跌 5%。","risk":"Starlink 進軍行動通訊","s":{"VZ":"bear"},"text":"Verizon \n$VZ\n stock is down 5% in after-hours on this news","likes":232},{"id":"2108303658526138403","author":"michaelsikand","date":"2026-10-08","zh":"Michael Sikand：MANGOS ETF一週募得6000萬美元，涵蓋OpenAI、Anthropic與Meta、輝達等。","risk":"","s":{"GOOGL":"neutral","META":"neutral","MN":"neutral","NVDA":"neutral","SPCX":"neutral"},"text":"It took me 6 months to build $60M AUM.\n\n\n@CorgiInvest\n just mogged that in under a week with their MANGOS ETF \n$MN\n \n\nThis concentrated ETF seeks to give investors OpenAI and Anthropic exposure alongside \n$META\n, \n$NVDA\n, \n$GOOG\n, \n$SPCX","likes":46},{"id":"2108309225906823208","author":"Balder13946731","date":"2026-10-08","zh":"Balder：10/8美股復盤，科技股重挫、半導體與光通訊領跌，能源與家居股逆勢上漲。","risk":"","s":{"DIA":"neutral"},"text":"【美股复盘 · 10月8日】\n\n大市：环球息口高企忧虑发酵，叠加能源价格攀升，美股周四走势分化。传统经济股表现靠稳，带动道指( \n$DIA\n )全日微升，收报511.65，升0.12%，于四大指数中表现一枝独秀。惟科网股沽压沉重，拖累纳指(QQQ)显著受压，全日收报747.58，急挫1.34%。标普(SPY)则反复偏软，收报773.97，跌0.42%；罗素小型股(IWM)微跌0.03%，收报277.63。大市交投气氛偏弱，市宽明显转差，104只观察股份中，仅33只上升，下跌股份多达71只。\n\n板块：资金避险情绪升温，防守类及能源板块逆市造好。受惠于油价走强预期，石油股成资金避风港，西方石油(OXY)升3.56%，雪佛龙(CVX)及埃克森美孚(XOM)分别升3.12%及2.71%。零售家装巨头亦见发力，劳氏(LOW)及家得宝(HD)分别涨4.03%及3.39%。另一边厢，半导体及光通讯板块沦为重灾区，做空半导体的ETF(SOXS)急飙10.24%，反映芯片股抛售尤为惨烈，领跌个股中安谋(ARM)重挫6.48%，光通讯设备商高意(COHR)及应用光电(AAOI)更分别急泻9.63%及13.58%。大市转弱亦令做空纳指的ETF(SQQQ)录得4.13%升幅。\n\n焦点：大行早前曾唱好科技股季绩将大面积超预期，惟宏观无风险利率高企令市场对高估值的容错率极低，导致资金趁高获利。新晋AI题材渐露疲态，有获巨头背书的AI初创IPO认购惨淡，反映机构资金对纯算力概念转趋审慎。政策层面，市场传出华府或收紧科技大厂外籍工程师的绿卡项目，引发外界对底层研发迭代受阻的忧虑。然而，部分软件及老牌科技股相对抗跌，奥多比(ADBE)及雪花(SNOW)分别逆市上扬3.56%及3.17%，国际商业机器(IBM)亦靠稳，全日收升2.77%。\n\n小结：分析指，近期云端巨头频频斥资锁定核电资源，由轻资产模式转向重基建，加上企业端AI降本增效的红利仍需高昂的云服务开支来支撑，相关成本正促使市场重新审视AI供应链的盈利模型。随着纳指受压且科网股沽压未止，大市风格或正经历新旧经济股的轮动切换。后市需密切留意无风险利率走势，以及龙头科技股接下来的业绩指引能否提供支撑，料短期内美股走势仍以反复震荡寻底为主。","likes":0},{"id":"2108329503428895094","author":"aleabitoreddit","date":"2026-10-08","zh":"正在和 Google TPU 設計師喝咖啡（貼文內容截斷）。","risk":"","s":{"GOOGL":"neutral"},"text":"Having coffee with a $GOOGL TPU designer rn\n\nA…","likes":99},{"id":"2108333646205669484","author":"StockMKTNewz","date":"2026-10-08","zh":"Evan：彭博報導 Meta 在美國等地禁止字節跳動與 TikTok 投放廣告。","risk":"","s":{"META":"neutral"},"text":"Meta Platforms \n$META\n banned advertisements from ByteDance and TikTok on its platform in the US and other countries - Bloomberg","likes":279},{"id":"2108360620173070726","author":"StockMKTNewz","date":"2026-10-09","zh":"Evan：過去十年表現最好的Vanguard ETF為VGT、MGK、VONG。","risk":"","s":{"MGK":"neutral","VGT":"neutral","VONG":"neutral","VOO":"neutral"},"text":"Here are the top 3 best performing Vanguard ETFs over the last decade\n\n \n$VGT\n \n \n$MGK\n \n \n$VONG\n \n\nVanguard only has 7 ETFs that beat its S&P 500 ETF \n$VOO\n over the last decade","likes":104},{"id":"2108381766599762167","author":"ren_stocks","date":"2026-10-09","zh":"Ren：市場因OpenAI年化營收傳聞恐慌拋售，但彭博稱OpenAI年底將達700億美元，需求並未消失。","risk":"","s":{"AAOI":"bull","BE":"bull","NBIS":"bull","SNDK":"bull"},"text":"$NBIS\n \n$SNDK\n \n$AAOI\n \n$BE\n\n\nFunny how fast the story changes.\n\nJust a few hours ago everyone was panicking and dumping AI stocks because OpenAI was \"only\" approaching $50B in annualized revenue instead of the $70B that got reported. \n\nToday Bloomberg says OpenAI expects to be at $70B by the end of the year.\n\nSo the number people panicked about them not having is the number they expect to hit in less than three months.\n\nThe FT story was really about how revenue gets counted, and the market still sold off like demand had disappeared. It hasn't. \n\nThe labs keep growing and they keep needing more compute, and I don't see that changing anytime soon.\n\nThis happens every single time, so know what you own and don’t sell into a FUD.\n\nYou are not bullish enough","likes":561},{"id":"2108407095301214252","author":"ren_stocks","date":"2026-10-09","zh":"Ren：Bloom為AOI台灣擴產供應燃料電池，顯示光模組需求強勁，對兩者都是利多。","risk":"","s":{"AAOI":"bull","BE":"bull"},"text":"THIS IS HUGE NEWS FOR BOTH \n$AAOI\n and \n$BE\n\n\nBloom is supplying fuel cells for an expansion project at AOI's Taiwan subsidiary, through its local partner Leadray Energy. \n\nSo AOI is bringing its own power on-site instead of just plugging into the grid.\n\nWhen a transceiver maker is sorting out its own electricity to get new capacity running sooner, it tells you how much optics demand is out there right now.\n\nAnd who their turn to? Of course to Bloom!\n\nBullish for both \n$BE\n and \n$AAOI","likes":142},{"id":"2108410241322819974","author":"ren_stocks","date":"2026-10-09","zh":"Ren：反駁 GPU 兩三年就淪為廢鐵的空方論點，H100、H200、B200 租價皆高於低點，neocloud 折舊算法站得住。","risk":"FT 報導質疑折舊假設","s":{"NBIS":"bull"},"text":"$NBIS\n\n\nThe bear case for the past year has been that GPUs turn into paperweights in 2 to 3 years, so the neocloud depreciation math is fake, just like the FT report today.\n\nHere's what the rental market actually did.\n\nAn H100 rents for about $2.63 an hour right now. That's roughly where it was in April 2025, and about 30% above the low near $2 late last year. This chip is about three years old and a generation behind Blackwell, and renting one costs more today than it did last winter.\n\nH200 went from about $2.70 in May to $3.29. B200 bottomed around $4.40 in January and it's back at $5.69.\n\nIf old GPUs were dying, you'd see rental prices falling off a cliff. Instead people are still paying up for whatever compute they can get. \n\nThat matters a lot for the neoclouds, because a GPU that keeps earning for years longer than the bears assume is a much better business than the one they've been modeling.\n\nYou are not bullish enough","likes":173},{"id":"2108412203514925165","author":"aleabitoreddit","date":"2026-10-09","zh":"Lumentum 執行長稱產能幾乎售罄到 2029 年、需求能見度至 2031 年，對 SIVE、AAOI 等有新產能的雷射供應商意義重大。","risk":"","s":{"AAOI":"bull","LITE":"bull","SIVE":"bull"},"text":"Woooow... $LITE CEO went out on Bloomberg today and stated:\n\nLumentum is \"effectively sold out through nearly 2029\".\n\nFrom our perspective, \"Completely Sold Out, there's no end in sight\".  With demand visibility from hyperscalers that carries them out into 2030, 2031.\n\nThe implications of these statements are enormous for photonics and remaining laser suppliers with capacity coming online like $SIVE, Sumitomo Electric, to $AAOI.\n\nWhat a crazy bottleneck that's unfolding.","likes":2113},{"id":"2108413263474225530","author":"michaelsikand","date":"2026-10-09","zh":"Michael Sikand：LITE因OpenAI營收傳聞下跌7%是雜音，看到2000美元。","risk":"","s":{"LITE":"bull"},"text":"Yeah and it sold off by 7% because of some whisper OAI revenue projections media FUD BS. \n$LITE\n to $2k.","likes":35},{"id":"2108416144428421459","author":"aleabitoreddit","date":"2026-10-09","zh":"Lumentum 被 Nvidia 包下產能而售罄，其他買家只能找有新產能的供應商；SIVE 新增產能約全球六分之一，AAOI 也大幅擴產，供應商數增至 5–7 家。","risk":"產品須通過驗證並量產","s":{"AAOI":"bull","AMD":"neutral","LITE":"bull","NVDA":"neutral","SIVE":"bull"},"text":"@wosa42 Markets often miss second order implications until it shows up in direct statements.\n\n- If $LITE is completely sold out... (largely due to $NVDA bottlenecking everyone else, eg. securing Greensboro capacity), where else do your other companies like $AMD / hyperscalers / etc. get their supply procurement?\n\n- $SIVE is coming online with like 1/6th of the world's current laser capacity by themselves. (100M+ cw dfb lasers vs. 608M EML/CW globally per Trendforce).\n\nNot even including their partner foundries that they're targeting 2:1 for.\n\n- $AAOI is coming online with a ton of capacity too next year enough to produce 400k ELSFP + $471m/month of transceivers.\n\nThen combine that with other supply chain statements like \"Having 2-3 suppliers used to be the norm, now it is 5-7\" from Lightcounting.\n\nSo as long as your products actually work + can scale, it's hard to see anyone else with capacity not get qualified into your supply chains.\n\nSince optical component shortages are a massive bottleneck now.","likes":336},{"id":"2108428874602217829","author":"ren_stocks","date":"2026-10-09","zh":"Ren：黃仁勳從 Denny's 洗碗工到獲頒國家科學獎章，回顧其創業歷程。","risk":"","s":{"NVDA":"neutral"},"text":"$NVDA\n\n\nWhat an incredible journey. Jensen Huang went from washing dishes at Denny's to receiving the National Medal of Science.\n\nHe was 9 when his parents sent him and his brother from Taiwan to the US. He ended up at a boarding school in rural Kentucky, where one of his chores was cleaning the bathrooms. In 1993, at 30, he was back in a Denny's booth, sketching out Nvidia with his two co-founders.\n\nHis parents were there to watch him get the medal. Imagine how proud they must be.\n\nThey sent their kid across the world with no idea how it would turn out, and decades later they got to stand next to him while he received the country's top science honor.\n\nJensen literally changed the course of history. People have been talking about AI since the 1950s, but using it at scale the way we can today is only possible thanks to a \"video game chip company\" that took a leap of faith, betting its chips could do science and then AI long before anyone took it seriously.\n\nNow most of the AI world runs on his hardware, and he's the closest thing this industry has to a president.\nI don't think there's a better founder story out there.\n\nI hope one day I can accomplish just a fraction of what he has.\n","likes":129},{"id":"2108439296730710505","author":"jukan05","date":"2026-10-09","zh":"Jukan：日經報導iPhone 18 Pro需求不如預期，本月零件訂單削減至少15%。","risk":"iPhone需求疲弱","s":{"AAPL":"bear"},"text":"NIKKEI: APPLE CUTS IPHONE 18 PRO ORDERS DUE TO SOFT DEMAND\n\n\"Component orders for this month have been cut by at least 15% from the volumes originally requested due to weaker-than-expected market demand for the iPhone 18 Pro series.\"\n\n\n$AAPL","likes":459},{"id":"2108501977852248393","author":"unusual_whales","date":"2026-10-09","zh":"Unusual Whales：Meta禁止TikTok在其平台投放廣告。","risk":"","s":{"META":"neutral"},"text":"Meta, \n$META\n, has banned TikTok from advertising on its apps.","likes":645},{"id":"2108516002883330209","author":"ren_stocks","date":"2026-10-09","zh":"Ren：宣傳 Liquid 交易成績，舉例趁 OpenAI 利空以 8 倍槓桿短線做多 NBIS。","risk":"高槓桿短線交易","s":{"NBIS":"neutral"},"text":"If you aren't following me on Liquid, I don't even know what you're doing.\n\n2 weeks in, +328% in returns, 87% win rate over 15 trades.\n\nSome people here talk about being great traders, yet they have a sub 40% win rate on Liquid \n\nLearn to trade the news and when not to trade, NFA.\n\nStep 1) find a news worth a trade: \nOpenAI FUD.\n\nStep 2) Open a levered position:\nLong \n$NBIS\n at 8x and close the position in mere minutes.\n\nStep 3)\n\n????\n\nStep 4)\n\nProfit\n\nThe results speak for themselves.\n\nFollow me there \n@renstocks\n to tag along.","likes":65},{"id":"2108521941640368163","author":"ren_stocks","date":"2026-10-09","zh":"Ren：Lumentum執行長稱產能已售罄到2029年初，盤後漲6.5%，雷射新產能需3–5年。","risk":"","s":{"AAOI":"bull","LITE":"bull"},"text":"$LITE\n is up 6.5% after hours.\n\nThe Lumentum CEO went on Bloomberg and said they're \"completely sold out\" through early 2029, with \"no end in sight.\" \n\nSix months ago he was talking about sold out through 2028, so the line keeps moving further out. \n\nThey've already grown their main Jap rs, and $LITE stating they already have demand visibility into 2031...\n\nAnd when suppliers have started to qualify many more (eg. 5-7 vendors vs. 2-3 earlier) due to bottlenecks.\n\nI'm sure a lot of how they achieve that staggering amount is due to their manufacturing process/yields (which is a moat).\n\n2. For qualifications, if you look at 70mW/100mW pluggable lines with Chinese players, I'd argue this is more generic and moreso reverting back to a capacity  argument and manufacturing process to achieve those numbers.\n\nCustom DFB arrays ","likes":137},{"id":"2108916977616179207","author":"aleabitoreddit","date":"2026-10-10","zh":"AXTI 2025 年的瓶頸論點已獲驗證：確認供應 Lumentum、Coherent，2027 年底 InP 產能年化約 5.2 億美元；接下來看能否大幅漲價。","risk":"漲價意願不足、地緣政治","s":{"AXTI":"bull","COHR":"neutral","IQE":"neutral","LITE":"neutral","SNDK":"neutral"},"text":"@StanleyShih8 I think almost everything about my $AXTI thesis from 2025 was validated?\n\nFrom AXT's position in the InP substrate bottleneck... Being able to threaten the hyperscaler buildout (per Reuters)...\n\n$IQE has been flagging this as a major risk, VPEC and Taiwan epiwafer foundries have been crying over InP substrate bottlenecks.\n\nAnd there's even AXT direct confirmation of partnerships with $LITE and $COHR as the InP substrate supplier. AXT also stated $130m/quarter InP revenue capacity exiting 2027 (~$520m annualized) so that's a massive revenue inflection compared to previously.\n\nNow... the biggest question is: How much can AXT price hike?\n\nThe substrates they make are just such a tiny part of the BOM... but can threaten hyperscaler buildouts with optics.\n\nSo if they manage to price hike to $SNDK NAND degrees (which they can), then I think AXT could get re-rated a ton from here. But if they end up like Japanese ABF suppliers that are less willing to abuse their position, that's a different story.\n\nWill need to do more channel checks to see how that's coming along.\n\nBut at the very least, I would argue there should tat from \n$CLS\n VP\n\n“70% of our engineering resources are dedicated towards doing validation.\"\n\nAs optics moves closer to expensive AI compute silicon, the cost of failure rises, making testing and qualification increasingly critical. \n\n\n$KEYS\n \n$AEHR\n \n$VIAV\n \n$FORM","likes":67},{"id":"2109756712026845269","author":"ren_stocks","date":"2026-10-12","zh":"Ren：OpenRouter 8 月處理 379 兆 token，一年成長 25 倍，算力、記憶體、網路需求才剛開始。","risk":"","s":{"AAOI":"bull","LITE":"bull","MU":"bull","NBIS":"bull","SNDK":"bull"},"text":"$NBIS\n \n$SNDK\n \n$MU\n \n$LITE\n \n$AAOI\n \n\nToken demand just keeps going vertical.\n\nOpenRouter routed 379 trillion tokens in August, up from 15T a year ago. \n\nThat’s 25x in twelve months.\n\nThe jump from July to August added 131T tokens in a single month, more than OpenRouter handled from January through October 2025 combined.\n\nEvery one of those tokens needs a GPU to run on, memory to sit in and a network to move across. This is the demand curve underneath the entire buildout, and it’s why the “AI is a bubble” crowd keeps getting run over.\n\nPeople are still arguing about how OpenAI counts its revenue while usage grew 53% in one month.\n\nThe buildout is just getting started","likes":173},{"id":"2109756823578562846","author":"KawzInvests","date":"2026-10-12","zh":"KawzInvests：OCP 數據證實測試與驗證是光模組放量的瓶頸，看好 VIAV、AEHR、COHU、FORM、TER。","risk":"驗證速度跟不上晶片節奏","s":{"AEHR":"bull","COHU":"bull","FORM":"bull","TER":"bull","VIAV":"bull"},"text":"Recent data at the OCP Summit confirms what has been clear for a while... qualification and testing remain the central gating factor for optical transceivers at scale.\n\nCelestica's numbers show how testing windows have continuously compressed with each generation: \n\n> 400G: 36 months \n> 800G: 24 months \n> 1.6T: 18 months\n\nWith GPU architectures refreshing every 12 months and 224G per lane leaving no margin for error, the core structural thesis hasn't changed.\n\nRamping laser fab capacity doesn't solve the problem on its own if transceivers can't be validated and qualified fast enough to match the silicon cadence.\n\n$VIAV\n \n$AEHR\n \n$COHU\n \n$FORM\n \n$TER","likes":55},{"id":"2109758830985052284","author":"Balder13946731","date":"2026-10-12","zh":"Balder：10/12 復盤，光通訊與半導體急跌拖累納指，LITE、CIEN、SMTC 跌近一成，防守股撐盤。","risk":"光通訊類股賣壓","s":{"SPY":"neutral"},"text":"【美股复盘 · 10月12日】\n\n**大市**\n环球AI硬件链沽压再现，美股三大指数表现分歧。标普500指数ETF \n$SPY\n 收报778.10，跌0.06%；以科网股为主的纳指ETF QQQ 失守750关，收报746.04，跌0.70%，为三大指数中最弱；道指ETF DIA 则逆市造好，收报517.91，升0.35%；罗素2000小型股ETF IWM 反复偏软，收报277.88，跌0.38%。指数跌幅虽浅，市宽却明显转弱——104只观察股中仅29只收升、75只下跌，跌者为升者逾两倍半，显示大市全日由少数权重股顶住，并非普涨。\n\n**板块**\n防守及旧经济板块逆市靠稳。能源股造好，XOM 升1.90%、OXY 升1.70%、CVX 升1.42%；必需消费 WMT 升1.55%、COST 升1.32%。大型科网股内部亦见分化，META 升3.38%为权重股之首，AAPL 升1.29%，软件股 CRM 升2.09%。另一边，半导体与光通讯一线全日急泻，是拖低纳指的主因；三倍反向半导体ETF SOXS 单日升8.14%，为全日升幅之冠，SQQQ 升2.06%，反映资金明显转向对冲科技仓位。\n\n**焦点**\n跌幅榜由光通讯及光学一线主导：SMTC 挫10.15%、CIEN 泻9.95%、LITE 跌9.78%、AAOI 跌8.17%、COHR 跌7.87%，半导体设备 AEHR 跌7.63%，互联芯片 CRDO 跌7.25%，玻璃及光纤 GLW 跌6.00%；此外燃料电池 BE 跌6.50%，量子计算概念 IONQ 泻9.07%，同列跌幅前段。值得注意的是，此一板块的走势与市场仍在热炒的AI数据中心、电力主题方向相反：整条AI供应链多数环节由美国、台湾、韩国掐住中国，光模块这一层却是少数反过来的，美国同业的估值溢价因此最先承压。产业消息方面，市场续传亚马逊正商讨以约70亿美元收购AI初创Decart，而Anthropic早前议价至60亿美元、完成尽调后放弃，差价背后是AWS自研Trainium芯片生态不足的补课成本。同属卡位讨论的还有EUV环节——真正无可替代的并非 ASML ，而是独家供应EUV反射镜的德国蔡司，其母体为不设股东、不上市的基金会，外界无从投资。\n\n**小结**\n全日格局为「指数窄幅、内部剧震」：资金自AI硬件最贵的一端撤出，转入能源、必需消费及少数大型科网，道指得以逆市收升，纳指则独自受压。分析指，QQQ 失守750关为短线首个警号，若市宽维持29升75跌的极端分化，指数层面的平稳未必持续；光通讯一线的沽压是否见底，仍需观察 CIEN 、LITE 等能否先行收复本日跌幅。","likes":4},{"id":"2109760093403463709","author":"unusual_whales","date":"2026-10-12","zh":"Unusual Whales：宣傳其早於 CNBC 揭露 SNAP 異常交易。","risk":"","s":{"SNAP":"neutral"},"text":"Look at this.\n\nWe called out these \n$SNAP\n trades BEFORE CNBC.  \n\nRather than wait for them, subscribe to Unusual Whales to see the unusual flow.","likes":128},{"id":"2109760577664938058","author":"StockMKTNewz","date":"2026-10-12","zh":"Evan：Visa 已連續 8 個交易日收高。","risk":"","s":{"V":"bull"},"text":"Visa \n$V\n stock has now closed higher for the lat 8 trading days in a row","likes":357},{"id":"2109762038280884589","author":"ren_stocks","date":"2026-10-12","zh":"Ren：彭博資訊預估 Nebius ROIC 從 2026 年 -6% 升至 2030 年 9%，是 neocloud 中最陡，約 2029 年超越 CoreWeave。","risk":"仍低於資金成本","s":{"NBIS":"bull"},"text":"$NBIS\n\n\nBloomberg Intelligence just modeled return on invested capital (ROIC) through 2030 for the clouds and neoclouds, and the \n$NBIS\n line is the one I keep staring at.\n\nNebius goes from roughly −6% in 2026 to about 9% by 2030. That’s the steepest climb of any neocloud in the model, and it passes CoreWeave around 2029. AWS goes the other way, sliding from ~24% to ~16% as AI depreciation piles up.\n\nYes, the neoclouds are still below their cost of capital in BI’s numbers. \n\nThat’s what a buildout looks like early on: you pour the concrete and buy the GPUs first, and the returns show up after.\n\nNebius writes its GPUs off over 4 years, faster than CoreWeave’s 6. Meanwhile the H100 is almost four years old and still rents near 2025 prices. As Nebius’s first H100s roll off that 4-year schedule, they can keep renting with almost nothing left to depreciate, and that drops straight into margin. \n\nFully written-off GPUs also shrink the capital base, so ROIC gets a lift from both sides.\n\nIf GPUs keep earning that long, the depreciation drag shrinks and that 9% moves up fast.\n\nBullish, but not all Neoclouds are created equal.","likes":244},{"id":"2109765553594495216","author":"unusual_whales","date":"2026-10-12","zh":"Unusual Whales：宣傳訂閱查看 MRNA 選擇權交易。","risk":"","s":{"MRNA":"neutral"},"text":"To see \n$MRNA\n plays and options, subscribe to Unusual Whales.\n\nYou can get updates right on site.\n\nSee more:","likes":11},{"id":"2109772220520354082","author":"michaelsikand","date":"2026-10-12","zh":"Michael Sikand：OCP 上 CRDO 執行長演講場面擠如 NFL 開賽，形容這波淘金熱前所未見。","risk":"","s":{"CRDO":"bull"},"text":"The fight to see the \n$CRDO\n CEO speak at OCP is like entering an NFL stadium before kickoff. \n\nThis gold rush is like no other.","likes":155},{"id":"2109772493347009007","author":"ren_stocks","date":"2026-10-12","zh":"Ren：Cerebras 是值得買進放三年的 AI 硬體股，UBS 預估 2030 年營收 226 億美元，現價約 2029 年 10 倍本益比。","risk":"股價已跌破 IPO 價","s":{"CBRS":"bull"},"text":"$CBRS\n might be the most interesting AI hardware stock to buy now and come back to in 3 years.\n\nUBS has Cerebras going from $890M in revenue this year to $3.3B in 2027 and ~$22.6B by 2030, with operating margins swinging from −18% to 46% along the way.\n\nAt $146, the stock trades at about 20x UBS’s 2028 earnings and 10x 2029, and UBS has EPS compounding from $7.21 to $24.36 over those two years.\n\nIt’s also ~26% below the $196.74 share price UBS built the model on just two weeks ago. Same numbers, cheaper stock.\n\nRemember I keep saying this:  The growth story is inference.\n\nCerebras keeps the memory on the wafer itself, which is exactly what you want when agents fire off dozens of model calls per task and every millisecond of latency adds up.\n\nExecution is everything here.  But if they get even halfway there, $146 won’t look expensive for long","likes":182},{"id":"2109781337733566934","author":"StockMKTNewz","date":"2026-10-12","zh":"Evan：財報季開跑，JPM、UNH、JNJ、GS、C、WFC、DPZ 明早盤前公布。","risk":"","s":{"C":"neutral","DPZ":"neutral","GS":"neutral","JNJ":"neutral","JPM":"neutral","UNH":"neutral","WFC":"neutral"},"text":"EARNINGS SEASON is back starting tomorrow morning\n\nAll of these companies will report earnings before the market opens tomorrow\n\nJPMorgan \n$JPM\n \nUnitedHealth \n$UNH\n \nJohnson & Johnson \n$JNJ\n \nGoldman Sachs \n$GS\n \nCiti \n$C\n\nWells Fargo \n$WFC\n \nDomino's Pizza \n$DPZ","likes":106},{"id":"2109784541921730630","author":"michaelsikand","date":"2026-10-12","zh":"Michael Sikand：諾基亞提出「Scale Beyond」，分散式 AI 可能帶動新一波電信基建，也是輝達投資原因之一。","risk":"","s":{"NOK":"bull","NVDA":"neutral"},"text":"$NOK\n just coined a new term for AI networking: \"Scale Beyond\" \n\nThe idea: extend AI networking beyond data centers. Ju y per year from 2027? He calls it realistic, between Finland, the rented sites in Europe and the two new builds in the US.\n\n+ Most neoclouds are 80%+ bare metal. Nebius is 70% or less, because it started life as a public cloud.\n\n+One gigawatt sold as bare metal brings in ~$17B a year at ~15% margin. Sold as public cloud, it’s ~$27B at 40–60% margin. Same power, roughly 5x the profit.\n\n+Nebius’s public cloud runs at ~90% utilization.\n\n+ The $20M of revenue per MW that came up on Nebius’s last call? He calls it conservative for GB200, and says $40M per MW makes sense for the newer capacity, most likely Vera Rubin.\n\nIn his words, the market is still undersupplied today.\n\nNebius is built more like a hyperscaler (a NeoScaler, if you will) than a GPU landlord, because that’s where the margin lives \n\nLong \n$NBIS","likes":139},{"id":"2109825280084779477","author":"StockMKTNewz","date":"2026-10-13","zh":"Evan：自嘲持有的 TE 股票虧損 56%。","risk":"","s":{"TE":"neutral"},"text":"I am now down 56% on my \n$TE\n shares \n\nShoutout to my sponsors at Vanquish for bringing up my mood on the post below","likes":298},{"id":"2109832911608500272","author":"StockMKTNewz","date":"2026-10-13","zh":"Evan：列出 QQQ、QTOP、VOO 的排序。","risk":"","s":{"QQQ":"neutral","QTOP":"neutral","VOO":"neutral"},"text":"$QQQ\n then \n$QTOP\n then \n$VOO","likes":4},{"id":"2109852646484201736","author":"aleabitoreddit","date":"2026-10-13","zh":"韓股海力士、三星重挫，博通執行長稱 AI 投資人像賭徒、企業 AI 投報不佳，火上加油。","risk":"情緒性賣壓","s":{"AVGO":"neutral","SKHY":"neutral"},"text":"Wow this is sad to see Korean markets with $SKHY / Samsung crash like this.\n\nSpecial thanks to $AVGO CEO adding fuel the fire…\n\nCalling AI investors gamblers and saying enterprise AI isn’t delivering ROI. https://t.co/fHzsD9Na4s","likes":1897},{"id":"2109881596467892424","author":"octopusycc","date":"2026-10-13","zh":"大老师：介紹 Bybit Stocks 上線美股交易，首批含 NVDA、TSLA、BABA、SNDK、MU。","risk":"","s":{"BABA":"neutral","MU":"neutral","NVDA":"neutral","SNDK":"neutral","TSLA":"neutral"},"text":"越来越多 Crypto 交易所开始把业务重心往传统金融市场延伸。\n\n其实对我这种同时交易美股和 Crypto 的人来说，需求一直很明确：能不能在同一个平台上完成更多资产的交易，减少账户和资金之间的切换成本？\n\n所以最近看到 \n@Bybit\n 上线 Bybit Stocks ，我觉得还挺值得聊聊。\n\n有几个地方值得关注：\n\n1. Crypto 和美股之间的交易门槛正在降低\n\n以前想配置美股，通常需要单独开通券商账户，资金也要在不同平台之间转来转去。\n现在符合条件的用户可以直接通过 Bybit App 访问真实美股市场。\n\n底层由 Infra Capital 提供券商服务，后台会为用户开设对应的券商账户，用户不需要额外管理一套独立的交易入口。\n\n对于同时持有美股和 Crypto 的投资者来说，确实方便了不少。\n\n注：Infra Capital Limited 是一家在毛里求斯注册、受当地金融监管机构监管的金融服务公司，也是 Bybit Stocks 的证券经纪合作方。\n它的定位更接近 Introducing Broker（介绍经纪商）\n\n2. 首批股票基本覆盖了目前市场的热门交易方向\n首批包括 \n$NVDA\n、 \n$TSLA\n、 \n$BABA\n、  \n$SNDK\n、 \n$MU\n 等热门标的。\n\n尤其是 \n$NVDA\n、 \n$MU\n、 \n$SNDK\n，本身就是我平时研究 AI CapEx、存储周期和期权流时经常关注的股票。\n\n我觉得这批标的选择也挺有针对性，基本都是市场关注度和交易活跃度比较高的公司。\n\n对于原本就在 Crypto 市场交易的用户，也多了一个接触传统美股的入口。\n\n3. TradFi 和 Crypto 的融合正在加速\n这也是我更关注的部分。\n\n从美债 RWA、代币化股票，到现在直接通过 Crypto 交易所接入真实美股，传统金融资产进入 Crypto 生态的方式越来越丰富。\n\n这里需要区分一下，Bybit Stocks 和平台上的 mStocks 是不同产品。\n\nBybit Stocks 接入的是传统证券市场，背后有实际的券商账户；mStocks 则属于独立的代币化产品。\n\n长期来看，我认为 Crypto 交易所之间的竞争会逐渐向多资产交易延伸。\n\n谁能提供更丰富的交易品种、更好的流动性和更低的跨市场使用门槛，谁就更有机会留住交易用户。\n\n尤其是对于我们这种同时关注美股、Crypto 和宏观市场的人来说，未来跨市场交易可能会变得越来越方便。\n\n————————\n\n本内容不构成投资建议，仅限 18 岁以上用户，具体可用性取决于所在国家/地区及身份认证状态。\n需要符合条件地区的KYC2才能进入/使用这个产品\nInvesting in stocks involves risk. The value of your investments can go d","likes":7},{"id":"2109900353349300590","author":"aleabitoreddit","date":"2026-10-13","zh":"DBS 會議上博通、Intel 都說 AI 晶片需求至少再高兩年、產能嚴重不足；博通執行長其實是替前沿實驗室估值辯護，媒體斷章取義。","risk":"全球利率走高限制資金","s":{"AVGO":"bull","INTC":"bull"},"text":"So spent some more time to look at more DBS conference material:\n\n- \"Two semiconductor giants, $AVGO and $INTC, both stated that breakthroughs in AI will keep demand for chip investment elevated for at least another 2 years. As current supply is insufficient to meet market demand.\"\n\n- \"Current chip production capacity is already far from sufficient to meet demand, and $AVGO CEO expects the shortage to become even more severe in the future.\" (HKEJ)\n\n- \"Regarding OpenAI, Hoc ral"},"text":"AI investors when \n$AVGO\n CEO calls them gamblers but there's only a 1/5 chance of a recession next year.","likes":52},{"id":"2110072180776284424","author":"Balder13946731","date":"2026-10-13","zh":"Balder：投資人大會這筆已了結，認為 ASML、TSM 需等確認反轉訊號，一般利多難刺激。","risk":"尚未確認反轉","s":{"ASML":"neutral","TSM":"neutral"},"text":"关于其投资者大会的这笔已经做完了，继续留就是要侧击 \n$ASML\n 和 \n$TSM\n 我个人认为不是特别大直接利好应该很难刺激到它，可能要等他进一步确定反转信号。","likes":0},{"id":"2110087774120317119","author":"ren_stocks","date":"2026-10-13","zh":"Ren：已做多 CBRS，股價較首日開盤低逾五成，UBS 預估 2030 年營收成長 25 倍，AI 成長故事在推論。","risk":"股價跌破 IPO 價","s":{"CBRS":"bull"},"text":"I'm long \n$CBRS\n\n\nCerebras is trading more than 50% below where it opened on its first day, and I just couldn’t pass up this opportunity.\n\nUBS sees revenue going ~25x by 2030 at 46% margins, and the stock trades at about 20x 2028 earnings. \n\nI keep saying this: the growth story for AI is inference.\n\nTraining a model is a big upfront project. Running it, every time someone asks a question or an agent takes a step, is a bill that never stops, and the agentic shift makes that bill much bigger. A single agent task can fire off dozens of model calls, and every one of them waits on the one before it. A few seconds of waiting per call turns into minutes per task.\n\nCerebras attacks that wait directly. \n\nA GPU keeps the model’s weights in HBM next to the chip and has to pull them across for every token it generates. Cerebras builds one chip out of an entire silicon wafer, about 46,000 mm² and 4 trillion transistors against roughly 1,600 mm² and 208 billion for NVIDIA’s two-die B200, and keeps 44GB of memory on the wafer itself. \n\nLess waiting on memory means more tokens per second for each user, which is exactly what an agent stuck in a loop of model calls needs.\n\nGPUs are the best general-","likes":152},{"id":"2110092376769200254","author":"ren_stocks","date":"2026-10-13","zh":"Ren：抱怨 CRWV 是拖累 neocloud 的「笨兄弟」，強調問題不會傳染給 NBIS。","risk":"CRWV 拖累類股情緒","s":{"CRWV" n\n balder-algo-logs · 龙气 · 10-13 · algo log · not advice","likes":3},{"id":"2110107445670621659","author":"ren_stocks","date":"2026-10-13","zh":"Ren：認為 CIFR 在此價位非常有吸引力。","risk":"","s":{"CIFR":"bull"},"text":"$CIFR\n is looking really, really interesting at these levels.\n\nAre you a buyer here?","likes":96},{"id":"2110121242057637975","author":"Balder13946731","date":"2026-10-13","zh":"Balder：10/13 復盤，軟體股撐盤、半導體設備與記憶體領跌，AMAT 重挫 6.7%、MU 跌 3.6%。","risk":"半導體設備與記憶體賣壓","s":{"SPY":"neutral"},"text":"【美股复盘 · 10月13日】\n\n**大市**：半导体设备及存储链周二（13日）再现沽压，惟大市未被拖落，四大指数仅录轻微调整，表现分歧。标普500 ETF（ \n$SPY\n ）收报778.01点，跌0.01%，几近平收；以科网股为主的纳指100 ETF（ QQQ ）收报743.57点，跌0.33%；道指 ETF（ DIA ）收报516.21点，同跌0.33%；罗素2000小型股 ETF（ IWM ）表现最差，收报276.71点，跌0.43%，小型股继续落后大型股。指数跌幅虽窄，市场内部却明显偏软——104只观察股中仅41只收升、63只收跌，升跌比不足七成，显示抛售集中而非全面。\n\n**板块**：全日呈典型的「软件靠稳、硬件挫」格局。软件及平台股造好，甲骨文（ ORCL ）急升4.23%，为观察股之首；Meta（ META ）升2.63%，Salesforce（ CRM ）升1.75%，IBM（ IBM ）升1.66%。支付股逆市走强，Visa（ V ）升1.74%，万事达（ MA ）升1.63%。消费及汽车亦有承接，通用汽车（ GM ）升1.98%，劳氏（ LOW ）升1.71%。另一边，半导体设备与存储股领跌，应用材料（ AMAT ）重挫6.69%，美光（ MU ）跌3.62%，SK海力士相关（ SKHY ）跌3.19%；网络设备股 Arista（ ANET ）跌3.02%，AI云服务商 CoreWeave（ CRWV ）跌3.05%。投机性板块失守，太空及卫星概念最弱，AST SpaceMobile（ ASTS ）暴跌8.54%，SPCX 跌4.21%；量子计算股同步急泻，IonQ（ IONQ ）跌4.25%，Rigetti（ RGTI ）跌3.55%。工业股亦见回吐，卡特彼勒（ CAT ）跌3.33%。\n\n**焦点**：市场对 AI 这条链的定价正在分化。 ORCL 、 META 、 CRM 升，而 AMAT 、 MU 、 ANET 、 CRWV 同日跌——资金买的是手握应用与现金流的一端，卖的是依赖资本开支落地的另一端。 AMD 逆势升1.90%，Semtech（ SMTC ）升2.67%，说明沽压并非笼罩整个半导体板块，而是直指存储与设备。消息面上，亚马逊将 META 的 AI 购物代理挡在站外，一端涉及广告位的存续，一端涉及电商闭环的缺口；此事与当日涨跌幅并无直接对应，仅作题材观察。此外，国际货币基金组织最新报告将「AI市场回调」与战争、债务并列为全球风险，与设备及存储链的持续沽压构成同一条叙事线。\n\n**小结**：全日属轻微调整市，但市宽与投机板块的伤势远重于指数。 SPY 守于778点一线，是大市未转弱的第一道证明； QQQ 743.57点与 DIA 516.21点同日跌0.33%，科网未能跑出；最值得跟的是 IWM 的276.71点——小型","likes":7},{"id":"2110142633716965836","author":"aleabitoreddit","date":"2026-10-13","zh":"Agility Robotics 透過 CCXI 合併上市已通過 SEC 審查，預計 11/2 股東表決、11 月掛牌，將是首檔純美國人形機器人股。","risk":"股東表決與交割條件","s":{"AGLT":"bull","CCXI":"bull"},"text":"$AGLT (Agility Robotics) has cleared SEC review for public listing through $CCXI\n\nIf you want an estimate timeline:\n\n~Oct 13 (today): SEC S-4 declared effective\n\n~Nov 2nd (shareholder vote): for merger approval\n\n~November: Merger closing and ticker goes live for trading.\n\nCompany’s official statement was:\n\n“The business combination remains subject to approval by Churchill XI shareholders and other customary closing conditions, and is expected to close in November 2026.”\n\nSo likely less than a month away for the first pure play US humanoid company to go live!","likes":286},{"id":"2110143992113537082","author":"unusual_whales","date":"2026-10-13","zh":"Unusual Whales：GameStop 執行長 Cohen 再買 2,260 萬美元股票，9/10 以來累計約 9,700 萬美元。","risk":"","s":{"GME":"bull"},"text":"BREAKING: GameStop CEO Ryan Cohen just bought another 844,130 shares of \n$GME\n.\n\nHe paid between $26.75 and $27 a share, about $22.6 million total.\n\nThat brings his buying since September 10 to roughly $97 million, across about 4.1 million shares.","likes":2101},{"id":"2110145100085150052","author":"aleabitoreddit","date":"2026-10-13","zh":"作者持有 Agility，偏好支持美國人形機器人；Nvidia 與亞馬遜都大力支持 Agility。","risk":"落後 Unitree 等對手","s":{"AMZN":"neutral","NVDA":"neutral"},"text":"@AllTheWayRay8 I have positions in Agility! I do want to see US humanoid programs succeed, even if they’re behind Unitree and others now.\n\nSo I have a personal preference in funding US players over foreign programs.\n\nBut $NVDA and $AMZN are heavily backing Agility so that’s always positive","likes":34},{"id":"2110146513766900019","author":"aleabitoreddit","date":"2026-10-13","zh":"推測馬斯克近期抨擊記憶體，是因海力士與三星漲價過頭。","risk":"大客戶反彈記憶體漲價","s":{"SKHY":"neutral"},"text":"Guess like we found out why Elon has been going on a crusade against memory in his recent posts.\n\n$SKHY and Samsung have been price hiking memory too much? https://t.co/r3sTYkd7TX","likes":653},{"id":"2110152161749594320","author":"KawzInvests","date":"2026-10-13","zh":"KawzInvests：近距離展示 AMD Helios 機櫃。","risk":"","s":{"AMD":"neutral"},"text":"$AMD\n Helios up close.","likes":564},{"id":"2110156480011804684","author":"ren_stocks","date":"2026-10-13","zh":"Ren：美光戰略客戶協議一季從 16 增至 26 家，涵蓋 2030 年前逾 35% 營收，馬斯克稱美光定價最合理。","risk":"","s":{"MU":"bull"},"text":"$MU\n went from 16 to 26 strategic customer agreements in a single quarter, and now \n@elonmusk\n is calling Micron the reasonable one on future memory prices while its peers have been “extortionate.”\n\nThose contracts now cover more than 35% of revenue through 2030, with about $150B in remaining performance obligations and $32B in customer commitments, mostly cash deposits. \n\nCustomers are paying upfront to lock in memory supply years ahead, memory has never had visibility like this.\n\nEvery HBM bit takes 3 to 4 times the wafer capacity of standard DRAM, node migrations are slower and new cleanrooms take years. That keeps DRAM bit growth around the low 20s% through 2028, while AI capex, HBM content per accelerator and agentic workloads keep pushing demand higher.\n\nThe biggest knock on memory has always been the cycle. Boom, bust, repeat. Contracts like these are how you kill that argument, and Micron is clearly playing the long game here.\n\nIn the short term price follows sentiment, and sentiment on memory is awful right now. But in the long run price follows earnings, and these contracts lock in years of them.\n\nBullish \n$MU","likes":233},{"id":"2110160107405505004","author":"KawzInvests","date":"2026-10-14","zh":"KawzInvests：LITE 展示近封裝光學（NPO）生態系，CIEN、COHR、MRVL 等參與，NPO 沿用可插拔供應鏈易於放量。","risk":"","s":{"AAOI":"neutral","ALAB":"neutral","APH":"neutral","CIEN":"neutral","COHR":"neutral","CRDO":"neutral","INTC":"neutral","KEYS":"neutral","LITE":"bull","MRVL":"neutral","MXL":"neutral","TEL":"neutral","VIAV":"neutral"},"text":"$LITE\n showing the ecosystem forming around near-package optics.\n\nOpen CPX founders include Ciena \n$CIEN\n, Coherent \n$COHR\n and Marvell \n$MRVL\n, alongside Molex, Samtec and TeraHop.\n\nPublicly traded contributors sho ：Cramer 在 CNBC 表示 Penguin Solutions 雖像迷因股但有真實業務，可以買。","risk":"","s":{"PENG":"bull"},"text":"Jim Cramer was just asked about Penguin Solutions \n$PENG\n stock\n\n“I kind of like Penguin Solutions. I know it’s kind of a meme stock, but I have to tell you, it’s got real business. I’m going to say you can buy it.”","likes":49},{"id":"2110195787569201252","author":"StockMKTNewz","date":"2026-10-14","zh":"Evan：Cramer 在 CNBC 被問 IREN 時表示 neocloud 他只信任 CoreWeave。","risk":"","s":{"CRWV":"neutral","IREN":"neutral"},"text":"Jim Cramer was just asked about Iren Limited \n$IREN\n stock on CNBC:\n\n“If you want to be in that business of the neocloud, the only one that I trust and want to be in is CoreWeave.” \n$CRWV","likes":232},{"id":"2110218620026396737","author":"ren_stocks","date":"2026-10-14","zh":"Ren：彭博資訊預估 HBM 出貨 2030 年成長近 4 倍、每 GB 價格翻倍，量價齊揚顯示需求超越產能。","risk":"","s":{"MU":"bull"},"text":"$MU\n\n\nThis might be the most bullish memory chart I've seen all year.\n\nBloomberg Intelligence has HBM bit shipments going from about 5,000M GB in 2026 to roughly 18,000M GB by 2030, almost 4x in four years.\n\nOver the same period, the average HBM price per GB more than doubles, from around $16 to about $35.\n\nIn memory, that almost never lasts for years. \n\nMore supply has always meant lower prices, and that's what made this a cyclical business. Here volume and price climb together, which tells you demand is running ahead of everything the industry can build.\n\nOnly three companies in the world make HBM at scale, and \n$MU\n is one of them, with 26 strategic customer agreements already locking in demand through 2030.\n\nMore bits, at higher prices, with customers signed up for years. \n\nMega bullish \n$MU\n.","likes":294},{"id":"2110238100769435962","author":"Balder13946731","date":"2026-10-14","zh":"Balder：不解 ASML 宣布大幅提高產量後股價仍下跌。","risk":"利多不漲","s":{"ASML":"neutral"},"text":"干什么干什么 \n$ASML\n 大幅提高产量又跌，究竟想怎样？","likes":42},{"id":"2110249356767195487","author":"KawzInvests","date":" above a $5 Trillion market cap for the first time - WSJ","likes":495},{"id":"2110498716079603949","author":"StockMKTNewz","date":"2026-10-14","zh":"Evan：業配介紹新上市的 Rex Peptide ETF（PEPT）前十大持股。","risk":"","s":{"ASND":"neutral","BANB":"neutral","DAR":"neutral","LLY":"neutral","NVO":"neutral","PEPT":"neutral","PODD":"neutral","PTGX":"neutral","RYTM":"neutral","SNY":"neutral","VKTX":"neutral"},"text":"NEW ETF LAUNCH ... the Peptide ETF is here\n\nMy sponsors at Rex Shares just launched the Rex Peptide ETF which trades under the ticker \n$PEPT\n \n\nHere are the top 10 largest holdings in the ETF as of 10/13\n\nEli Lilly \n$LLY\n\nNovo Nordisk \n$NVO\n\nAscendis Pharma \n$ASND\n\nInsulet \n$PODD\n\nProtagonist Therapeutics \n$PTGX\n\nSanofi \n$SNY\n\nDarling Ingredients \n$DAR\n\nRhythm Pharmaceuticals \n$RYTM\n\nViking Therapeutics \n$VKTX\n\nBachem $BANB \n\nRex Shares is a paid partner of the page. This post is for informational purposes only and should not be understood as investment advice. \n\nAn investor should carefully read and consider a Fund’s investment objective, risks, charges, and expenses before investing. \n\nA Fund’s prospectus and summary prospectus contain this and other information. Here is the link to the website\n\n\nhttps://\nrexshares.com/pept/","likes":66},{"id":"2110507656247193605","author":"michaelsikand","date":"2026-10-14","zh":"Michael Sikand：調侃自稱做多 MRVL 的人，要他們解釋近期走勢。","risk":"","s":{"MRVL":"neutral"},"text":"Dudes be like I'm long \n$MRVL\n\n\nOk explain this","likes":248},{"id":"2110511065238773897","author":"ren_stocks","date":"2026-10-14","zh":"Ren：同意 Gartner 預估 2030 年八成 neocloud 將無法獨立經營，認為這類業務整體不佳，多數會被併購或缺資金。","risk":"資本支出拖累","s":{"CRWV":"bear","NBIS":"neutral"},"text":"Gartner says 80% of neocloud providers will stop operating independently by 2030 and I agree.\n\nSorry but not all of them will be winners, most of them will disappear even if demand is sky high.\n\nIf you read my longer takes you know that I think that as a category, neoclouds aren't a great business.\n\nCapex drags on you every quarter, and the only way out is escape velocity: growing faster than your own spending. \n\nMeaning most will be acquired, merged or starved of capital.\n\nIn June Gartner forecasted neoclouds taking 20% of the AI cloud market by 2030. Fewer providers plus a bigger share means the survivors get much, much larger. \n\nConsolidation is how the winners get made.\n\nSo the real question is which one escapes, and here's why I think \n$NBIS\n is built differently:\n\n+Customers fund the build. Prepayments covered 50–60% of the capex on its Q2 deals. Most neoclouds borrow against their GPUs, while Nebius gets its customers to pay up front.\n\n+ The margins are already there: about 77% gross margin and a 41% adjusted EBITDA margin in Q2, on revenue up 454% year over year.\n\n+ Pricing keeps rising. GPU prices went up another 17–21% on October 1, and new contracts are signing at $20–25","likes":115},{"id":"2110520974940512259","author":"StockMKTNewz","date":"2026-10-14","zh":"Evan：列出貝萊德管理資產規模的成長。","risk":"","s":{"BLK":"neutral"},"text":"Blackrock \n$BLK\n now has $14.8 Billion of Assets Under Management up from $7.6B at the same time in 2020","likes":80},{"id":"2110542990360162355","author":"Balder13946731","date":"2026-10-15","zh":"Balder：韓國 ETF EWY 單日跌 6%，驚呼韓國像被核彈炸了。","risk":"","s":{"EWY":"bear"},"text":"$EWY\n -6% 韩国是被核弹炸了吗🫪","likes":19},{"id":"2110545559031574912","author":"michaelsikand","date":"2026-10-15","zh":"Michael Sikand：以梗圖形容 ASTS 與 RKLB 投資人本週的處境。","risk":"","s":{"ASTS":"neutral","RKLB":"neutral"},"text":"$ASTS\n and \n$RKLB\n investors this week.","likes":467},{"id":"2110557976792809822","author":"StockMKTNewz","date":"2026-10-15","zh":"Evan：每買 1 萬美元 QQQ 對應的前幾大持股金額，輝達 831 美元居首。","risk":"","s":{"AAPL":"neutral","GOOGL":"neutral","MSFT":"neutral","MU":"neutral","NVDA":"neutral","QQQ":"neutral"},"text":"When you buy $10,000 of the Nasdaq 100 \n$QQQ\n this is how much of each stock you're buying\n\n$831 o 876600922451","author":"aleabitoreddit","date":"2026-10-15","zh":"看行動不看言論：Google 要把供應鎖到 2035 年，其他雲端巨頭可能跟進，代表不認為兩年內中國會讓記憶體供過於求。","risk":"","s":{"GOOGL":"neutral"},"text":"@EscapeTheLab I mean it's probably more important to look at the actions over words... I'm sure $GOOGL trying to secure supply until 2035, would spark other hyperscalers to follow suit as well.\n\nThey probably wouldn't be going 9 years out if they thought there would be overflooding in supply from China in 2 years.","likes":36},{"id":"2110846028459208785","author":"Balder13946731","date":"2026-10-15","zh":"Balder：10/15 復盤，資金從 AI 硬體轉向軟體與投機成長股，CRM、ADBE 漲 4.6%，HPE、DELL、COHR 重挫。","risk":"AI 硬體鏈賣壓","s":{"CRM":"neutral"},"text":"【美股复盘 · 10月15日】\n\n**【大市】**\n美股周四(15日)表现分化,指数升跌不一,资金明显由AI基建硬件一端撤出,转入软件及投机性成长股。道指(DIA)收报521.18,升1.08%;罗素小型股(IWM)收报275.05,升1.36%,升幅居各主要指数之首;标普(SPY)收报771.79,升0.28%,全日靠稳;惟纳指(QQQ)反复偏软,收报728.00,跌0.13%,为唯一收低的主要指数。市宽呈拉锯格局,104只观察股中53只上升、51只下跌,升跌比近乎对半,显示大市升幅并非来自普涨,而是来自板块之间的位置转移。\n\n**【板块】**\n软件股造好, \n$CRM\n ADBE 同升4.57%, APP 升6.52%;加密货币相关股领先大市, CRCL 急升9.33%, COIN 升6.32%;量子计算概念全线走强, IONQ 升9.33%、 RGTI 升8.13%、 QBTS 升6.53%。沽压则高度集中在AI硬件链:服务器及企业硬件重挫, HPE 急泻7.10%, DELL 跌6.80%;网络设备 ANET 挫5.04%、 CSCO 跌3.34%;电源散热 VRT 跌3.63%;光通讯 COHR 跌4.83%;半导体设备 AMAT 跌3.72%、 AEHR 跌3.19%;模拟及混合信号芯片 SMTC 暴泻10.01%,为全日最弱。航天股分化, ASTS 升5.51%,惟 RKLB 跌6.64%。\n\n**【焦点】**\n全日最值得注意的一组背驰,是算力租赁与算力硬件的分道: CRWV 逆市升5.94%,而为其供货的服务器、网络与光模块一方几乎全线失守,反映沽压针对的是硬件供应端的订单与毛利预期,而非AI用量本身。题材方面,美光台湾厂劳资争议已升级至台当局公开介入、促劳资「真诚协商」,其DRAM主力产能位于台中而非美国,存储供应的扰动风险成为设备与存储链情绪的压制项;另一端,苹果智能在中国获批、月底上beta,惟仅15 Pro以后机型可运行,市场更倾向视之为换机周期而非即期软件收入;Meta与苹果将开源权重模型引入Mac本地运行,则将叙事重心由数据中心外设移向终端内存与软件层。\n\n**【小结】**\n市场的减磅并未外溢至整体风险偏好——小型股与道指同步造好,升跌家数接近对半,属典型的链内轮动而非系统性去风险。技术上,纳指(QQQ)全日收在728关附近,为四大指数中唯一未能收复失地的一只;标普(SPY)771至772区间与罗素(IWM)275关成为短线观察位。分析指,在AI硬件链的毛利疑虑消化完毕之前,指数层面的强弱将继续由软件与硬件之间的资金配置决定,而非由单一宏观变量主导。","likes":0},{"id":"2110848740559126575","author":"aleabitoreddit","date":"2026-10-15","zh":"黃仁勳在斯德哥爾摩稱 CoreWeave 體質日漸改善、資金成本下降，Nvidia 無需為其擔保；作者相對 NBIS 仍不看好 CRWV，但認為有助新雲端類股情緒。"," HS again today","likes":238},{"id":"2111140434894262469","author":"StockMKTNewz","date":"2026-10-16","zh":"Evan：川普表示為馬斯克與特斯拉的 Roadster 團隊感到高興。","risk":"","s":{"TSLA":"neutral"},"text":"PRESIDENT TRUMP JUST SAID:\n\n- VERY HAPPY FOR ELON MUSK AND TESLA \n$TSLA\n TEAM ON TESLA'S ROADSTER","likes":341},{"id":"2111142387942662539","author":"StockMKTNewz","date":"2026-10-16","zh":"Evan：那斯達克 100 當日跌 2%。","risk":"","s":{"QQQ":"bear"},"text":"The NASDAQ 100 \n$QQQ\n is now down by 2% so far today","likes":168},{"id":"2111143723249881093","author":"Balder13946731","date":"2026-10-16","zh":"Balder：UVXY 大漲 15%。","risk":"","s":{"UVXY":"neutral"},"text":"🫪 \n$UVXY\n 大涨了15%","likes":10},{"id":"2111158980114633110","author":"octopusycc","date":"2026-10-16","zh":"大老师：伊朗情勢波動會牽動科技巨頭，AMZN、MSFT、GOOGL、ORCL、NVDA 影響最大，META 最小。","risk":"伊朗地緣風險","s":{"AMZN":"neutral","GOOGL":"neutral","META":"neutral","MSFT":"neutral","NVDA":"neutral","ORCL":"neutral"},"text":"伊朗的任何波动都会牵连 科技巨头\n\n其中 \n$AMZN\n \n$MSFT\n \n$GOOGL\n \n$ORCL\n \n$NVDA\n 影响最大\n\n对 \n$META\n 影响最小","likes":7},{"id":"2111159826512523674","author":"octopusycc","date":"2026-10-16","zh":"大老师：Roadster 展示工程實力、或提升科技溢價，但短期貢獻小，重點是 10/21 財報，交付量年減 2.1%。","risk":"汽車業務成長放緩","s":{"TSLA":"neutral"},"text":"Roadster 飞起来了，$TSLA 的估值还能飞多高？\n\n看完昨天 Roadster 的演示，我觉得 Musk 这次确实又给市场带来了一点惊喜。\n\n利用 SpaceX 的推进技术，实现短暂腾空、空中翻转，甚至倒置行驶。虽然距离真正意义上的飞行汽车还有很长的路，但这种工程能力确实让我印象深刻。\n\n不过相比 Roadster 本身，我更关注它和即将到来的 \n$TSLA\n Q3 财报之间的关系。\n\n1. Roadster 的价值，可能远远超过它能卖多少钱。\nRoadster 预计要到 2028 年才能量产，对 Tesla 短期业绩的贡献几乎可以忽略。\n但 Musk 很清楚怎么让市场重新关注 Tesla 的技术能力。\n从 FSD、Robotaxi 到 Optimus，$TSLA 的估值一直包含大量对未来的预期。\nRoadster 这次展示的技术，或许能让市场重新审视 Tesla 的科技溢价，尤其是在汽车业务增长放缓的背景下。\n\n2. 10 月 21 日的财报，才是真正需要关注的地方。\n\n目前 Q3 已公布的数据：\n汽车交付量 486,532 辆，同比下降约 2.1%\n储能部署 13.7 GWh，同比增长约 9.6%\n市场预期 EPS 约 $0.44，低于去年同期\n交付数据已经出来了，但我更关心接下来的三个问题：\n— 汽车毛利率能不能改善？交付量超预期，最终能转化为多少利润？\n— Capex 持续增加，Robotaxi、Optimus 等业务什么时候能带来实质性的现金流贡献？\n—管理层能否给出更明确的 AI 商业化进度，让市场有理由继续提高估值？\n\n3. 从交易角度来看，我会警惕财报前的预期透支。\n\nRoadster 的确有可能成为短期情绪催化剂。\n但如果股价提前反弹，Call 端情绪升温、近端 IV 被明显推高，而财报最终没有提供足够的新增利好，那么市场很可能开始交易预期兑现，财报后的 IV Crush 也需要警惕。\n反过来，如果财报在毛利率、自由现金流以及 Robotaxi 商业化方面给出超预期的信息，这轮反弹才可能获得更扎实的支撑。\n\n我的观点是，Roadster 能够帮助 Tesla 重新建立市场对其技术能力的信心，但想让这种科技溢价持续下去，最终还是要靠商业化兑现。\n\nRoadster 已经飞起来了。\n\n接下来就看 Tesla 的利润和现金流，能不能跟上 Musk 的想象力。\n\n但我悲观的认为，应该是跟不上的\n\n下一个 Catalyst 是SpaceX和Tesla合并\n\n————————————\n\n依然可以在MSX参与交易Tesla的美股财报\n\n邀请码：\nhttp://\nmsx.com/?code=h5cc95","likes":3},{"id":"2111161897647034880","author":"ren_stocks","date":"2026-10-16","zh":"Ren：NBIS 接近 160 美元，可能尚未見底，但風險報酬佳，將在此下方淨買入，下一筆限價 140。","risk":"可能尚未見底","s":{"NBIS":"bull"},"text":"$NBIS\n $160 is not far away now.\n\nDon't buy if you think we have hit the bottom. We most likely haven't.\n\nBuy if you think the R/R of the stock at these levels is too hard to pass up.\n\nThis happens time and time again. I'll be a net buyer below this level.\n\nHolding long, even if we got lower.\n\nNext limit buy $140.","likes":110},{"id":"2111164521897476452","author":"unusual_whales","date":"2026-10-16","zh":"Unusual Whales：iPhone Duo 預購數分鐘售罄，交期延至 11 月中下旬，與月初砍單報導不同。","risk":"","s":{"AAPL":"bull"},"text":"Apple’s, \n$AAPL\n, new iPhone Duo sold out almost immediately, per Bloomberg.\n\nInitial pre-order inventory was gone within minutes, and estimated delivery dates have slipped from Oct. 23 to Nov. 16–23.\n\nThat’s a different picture from earlier this month, when Apple reportedly told some suppliers to cut production of parts for its new iPhone line over soft demand.","likes":809},{"id":"2111171439919505791","author":"michaelsikand","date":"2026-10-16","zh":"Michael Sikand：QCOM 在 AI 賣壓中表現強勢，顯示股價幾乎未反映 AI 上檔。","risk":"","s":{"QCOM":"bull"},"text":"Pretty interesting to see how strong \n$QCOM\n has been amid this AI selloff.\n\nIn my view this really goes to show how little AI upside is priced into the stock at these levels.","likes":53},{"id":"2111176123841179916","author":"StockMKTNewz","date":"2026-10-16","zh":"Evan：列出當日創 52 週新高的股票，以支付、能源、軟體股為主。","risk":"","s 遇沽压，美股主要指数全线收低，科技股领跌。纳指 \n$QQQ\n 收报709.88，跌2.49%，失守710关；标普 SPY 收报763.23，跌1.11%；道指 DIA 相对抗跌，收报519.10，仅跌0.40%；罗素小型股 IWM 收报270.44，跌1.69%。市宽明显向淡，104只观察股中仅23只上升、81只下跌。全日最显著的特征，是指数与个股之间的落差——大盘跌幅温和，波动几乎全数跑进单票里去。\n\n**板块**｜防守及旧经济类逆市造好。军工股走强， RTX 升3.73%， LMT 升3.65%；能源股同见买盘， OXY 升2.82%， CVX 升2.59%， XOM 升2.46%；金融及控股类靠稳， JPM 升1.25%， BRK-B 升1.21%。涨幅榜前列则由反向杠杆ETF占据， SOXS 急升12.81%， SQQQ 升7.55%， SPXU 升3.44%，反映对冲与沽空需求升温。\n\n**焦点**｜AI算力与新经济概念全线急泻。 AEHR 暴跌12.44%， NBIS 挫12.18%， CRWV 挫11.91%， IREN 泻11.19%， SMCI 跌9.86%， AAOI 跌9.75%；量子计算概念同遭重手， IONQ 跌8.94%， QBTS 跌8.08%；软件及数据股 SNOW 跌8.43%，卫星通信 ASTS 跌8.55%。值得注意的是，一台仍在实验室阶段的量子机器，与一排已签多年长约的GPU机柜，在今日的沽压下被市场视作同一样东西，并无区分。消息面上，彭博报道指台湾拟自行限制AI芯片对华出口，名义上与美国对齐——货没变、禁令没变，变的是盖章的地方由华盛顿移到台北，日后寻求豁免者须排两条队；市场另关注高带宽内存(HBM)在AI加速卡物料成本中占比最重的结构性议题。两项题材均属气氛层面，并非今日个别股份波动的直接成因。\n\n**小结**｜全日呈指数小跌、个股股灾的格局。分析指，科技股短线关键位在 QQQ 710关，全日收报709.88已告失守，能否迅速收复为后市主要观察点；标普 SPY 暂守763水平。在仅23只观察股上升的市宽背景下，防守类、能源与军工的相对强势，连同反向ETF齐齐领涨，显示资金短期已转取守势。","likes":4},{"id":"2111465028943819225","author":"StockMKTNewz","date":"2026-10-17","zh":"Evan：Rivian 週收創 52 週新低。","risk":"","s":{"RIVN":"bear"},"text":"Rivian \n$RIVN\n stock closed the week at 52 WEEK LOWS","likes":99},{"id":"2111483010809807217","author":"StockMKTNewz","date":"2026-10-17","zh":"Evan：列出 S&P 500 今年表現最佳的 20 檔，Moderna、Sandisk、Dell、美光居前。","risk":"","s":{"AMD":"neutral","APA":"neutral","BE":"neutral","CRWD":"neutral","DELL":"neutral","FTNT":"neutral","HPE":"neutral","ILMN":"neutral","INTC":"neutral","LITE":"neutral","MPC":"neutral","MRNA":"neutral","MRVL":"neutral","MU":"neutral","NTAP":"neutral","PSX":"neutral","SNDK":"neutral","STX":"neutral","VLO":"neutral","WDC":"neutral"},"text":"Here are the top 20 best performing stock in the S&P 500 so far in 2026\n\n Moderna \n$MRNA\n: +639.27% \n SanDisk \n$SNDK\n: +447.35% \n Dell \n$DELL\n: +258.84% \nMicron \n$MU\n: +207.92% \nMarathon Petroleum \n$MPC\n: +193.96% \nValero \n$VLO\n: +173.18% \nMarvell \n$MRVL\n: +168.10% \nBloom Energy \n$BE\n: +154.70% \nAMD \n$AMD\n: +146.89% \nInte er half that 2030 run rate.\n\nMea","likes":312},{"id":"2111502162605777143","author":"StockMKTNewz","date":"2026-10-17","zh":"Evan：列出 S&P 500 今年表現最差的 20 檔，AppLovin 跌 60.5% 居首。","risk":"","s":{"APP":"neutral","BSX":"neutral","CHTR":"neutral","CSGP":"neutral","FICO":"neutral","FIS":"neutral","FSLR":"neutral","HONA":"neutral","INTU":"neutral","LULU":"neutral","LVS":"neutral","NKE":"neutral","NRG":"neutral","ORCL":"neutral","PNR":"neutral","PODD":"neutral","ROL":"neutral","SKYD":"neutral","WYNN":"neutral","ZTS":"neutral"},"text":"Here are the top 20 worst performing stock in the S&P 500 so far in 2026\n\n AppLovin \n$APP\n: -60.50% \nFICO \n$FICO\n: -54.38% \nBoston Scientific \n$BSX\n: -53.45% \nLululemon \n$LULU\n: -53.27% \nCoStar \n$CSGP\n: -51.95% \nIntuit \n$INTU\n: -50.91% \nInsulet \n$PODD\n: -50.36% \nPentair \n$PNR\n: -48.68% \nParamount Skydance \n$SKYD\n: -48.43% \nCharter \n$CHTR\n: -47.25% \nFIS \n$FIS\n: -45.82% \nRollins \n$ROL\n: -44.27% \nHoneywell Aerospace \n$HONA\n: -43.50% \nNike \n$NKE\n: -41.72% \nLas Vegas Sands \n$LVS\n: -41.60% \nWynn Resorts \n$WYNN\n: -37.17% \nZoetis \n$ZTS\n: -36.91% \nNRG Energy \n$NRG\n: -34.85% \nOracle \n$ORCL\n: -34.21% \nFirst Solar \n$FSLR\n: -33.91%","likes":325},{"id":"2111507686848389305","author":"StockMKTNewz","date":"2026-10-17","zh":"Evan：SOXX 連跌 9 個交易日，為 2006 年 5 月以來最長連跌。","risk":"","s":{"SOXX":"bear"},"text":"The iShares Semiconductor ETF \n$SOXX\n closed the day lower on Friday for the 9th trading day in a row\n\nSOXX is now on its longest losing streak since May 2006","likes":141},{"id":"2111535017994416575","author":"StockMKTNewz","date":"2026-10-17","zh":"Evan：美光週收市值跌回 1 兆美元以下。","risk":"","s":{"MU":"bear"},"text":"Micron \n$MU\n stock closed the week back under a $1 Trillion market cap","likes":428},{"id":"2111583924451189100","author":"ren_stocks","date":"2026-10-17","zh":"Ren：MU、WDC 週末在 Liquid 突然閃崩 10%，已收復過半，預期週日晚間回到週五水準。","risk":"","s":{"MU":"bull","WDC":"bull"},"text":"$MU\n \n$WDC\n\n\nHad a 10% crash out of the blue on LIquid on the weekend market.\n\nMore than half is already back, I wouldn’t be surprised if they go back to the same level they were on Friday by Sunday night.","likes":92},{"id":"2111589486140227622","author":"ren_stocks","date":"2026-10-17","zh":"Ren：三星、SK 海力士較 6 月高點跌逾五成，僅 2027–28 年 2–3 倍本益比、股價淨值比近 1，低於歷次循環底部。","risk":"","s":{"MU":"bull","SKHY":"bull","SNDK":"bull"},"text":"$MU\n \n$SNDK\n \n$SKHY\n\n\nSamsung and SK Hynix are both down more than 50% from their June highs, and they now trade at 2–3x their 2027–28 earnings.\n\nIn every previous memory upcycle (2001, 2008, 2018, 2022), the low end for these two was 4–7x. Their price-to-book is now near 1x, a level that usually shows up only at the bottom of a real bust, with warehouses full of unsold chips, DRAM prices cut in half and quarterly losses.\n\nNone of that is happening this time. \n\nMemory inventories at both companies fell below 10 days in September, and KB Securities has their earnings staying near record highs through 2028, with only a single-digit dip that year.\n\nEvery new generation of GPUs and custom chips also needs new memory: HBM, SOCAMM, LPDDR5 and enterprise SSDs. As the installed base gets refreshed, each upgrade cycle turns into another round of orders.\n\nThe market is pricing in a bust but the demand is ever increasing.\n\nLong \n$MU\n and \n$SNDK\n, and not selling.","likes":989},{"id":"2111593503549436100","author":"StockMKTNewz","date":"2026-10-17","zh":"Evan：洛克希德馬丁發表可單趟攔截 50 架以上無人機的 MORFIUS X-Rotor。","risk":"","s":{"LMT":"neutral"},"text":"Lockheed Martin \n$LMT\n recently posted this\n\n“MORFIUS X-Rotor is built to take on the drone threat at scale.\n\nNeutralizes 50+ drones per flight”","likes":174},{"id":"2111633766158323921","author":"ren_stocks","date":"2026-10-18","zh":"Ren：DeepSeek 稱新模型每 token 記憶體少 4 倍，但 5,520 億參數仍需全部常駐記憶體，不代表記憶體需求下降。","risk":"DeepSeek 效率提升疑慮","s":{"MU":"bull","SNDK":"bull","WDC":"bull"},"text":"$MU\n \n$SNDK\n \n$WDC\n\n\nDeepSeek is function stances(w,end,onlyH){
  var r=rng(w,end),T={};
  P.forEach(function(p){if(p.date<r[0]||p.date>r[1])return;if(onlyH&&p.author!==onlyH)return;
    Object.keys(p.s).forEach(function(t){var s=p.s[t];
      var x=T[t]||(T[t]={t:t,posts:[],acc:{},b:0,r:0});x.posts.push(p);if(s==="bull")x.b++;if(s==="bear")x.r++;
      var a=x.acc[p.author]||(x.acc[p.author]={h:p.author,n:0,b:0,r:0,s:null,p:null,ps:[]});
      a.n++;a.ps.push(p);if(s==="bull")a.b++;if(s==="bear")a.r++;
      if(!a.s||s!=="neutral"||a.s==="neutral"){a.s=s;a.p=p;}});});
  Object.keys(T).forEach(function(t){var x=T[t];x.n=x.posts.length;x.bullA=[];x.bearA=[];x.neuA=[];
    Object.keys(x.acc).forEach(function(h){var a=x.acc[h];(a.s==="bull"?x.bullA:a.s==="bear"?x.bearA:x.neuA).push(a);});
    var lt=function(a,b){return a.p.date<b.p.date?1:-1;};x.bullA.sort(lt);x.bearA.sort(lt);x.neuA.sort(lt);
    x.opB=x.bullA.filter(function(a){return OP(a.h);}).length;x.opR=x.bearA.filter(function(a){return OP(a.h);}).length;});
  return T;
}
