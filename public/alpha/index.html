 testing players first.","likes":725},{"id":"2085217487864643658","author":"aleabitoreddit","date":"2026-08-06","zh":"AEVA簽CPO/NPO光源開發協議、盤後漲18%，SIVE可能為其CW雷射供應商，屬正面訊號。","risk":"","s":{"AEVA":"bull","SIVE":"bull"},"text":"The unexpected thing of the week... Was $AEVA becoming a CPO/NPO optical source player.\n\nFor background: $SIVE is viewed as the high confidence CW DFB laser supplier to Aeva (which is known for lidar).\n\nToday, Aeva reacted with +18.26% AH on news that they signed a JDA with an optical engine player for deployment at a major hyperscaler in H2 2027, production ramp 2028.\n\n\"Optical Connectivity will leverage that foundation along with Aeva’s EXISTING high-volume manufacturing and foundry supply chain\" for:\n\n- ELSFP (similar to O-Net/Enablence + $SIVE), with Sivers as the likely CW laser + potential amplifier supplier\n\n- On-chip integrated light source (likely $SIVE DFB + Aeva PIC on the architecture/integration side)\n\nTLDR: New TAM and a hyperscaler programs for Aeva for CPO/NPO, positive read through for upstream suppliers like $SIVE.","likes":1012},{"id":"2085219549981319349","author":"aleabitoreddit","date":"2026-08-06","zh":"AAOI為2027上半年放量標的；美國擬禁中國光收發器將提升西方業者份量與議價能力。","risk":"","s":{"AAOI":"bull","COHR":"bull","JBL":"bull","LITE":"bull","SIVE":"bull"},"text":"@Lseperlee $AAOI is an end of H1 2027 volume ramp player for me, since around then is when they hit inflection point of $471m/month revenue projections.\n\nRecent drafted ban on new optical transceivers coming from Innolight and others, increase weight on players like AAOI, $SIVE / $JBL, $LITE, $COHR for their 1.6T+ programs as well. Especially if finalized in 2026.\n\nSince there's likely going to be price hikes, and more demand concentration over capacity from the select few Western players.","likes":208},{"id":"2085304045099696547","author":"aleabitoreddit","date":"2026-08-06","zh":"開玩笑說沒人知道AAOI怎麼念，比TSM或AMD多一個字母。","risk":"","s":{"AAOI":"neutral","AMD":"neutral","TSM":"neutral"},"text":"I remain convinced nobody knows how to pronounce or talk about $AAOI in real life.\n\nIt’s one letter too long to say $TSM or $AMD.\n\nAnd nobody ever says to a friend“Wow, I like applied optoelectronics!”","likes":1554},{"id":"2085499853099208716","author":"aleabitoreddit","date":"2026-08-06","zh":"AAOI財報重點：1.6T即將認證、產能大幅擴張、需求超供給20–40%，對整個光通訊產業為正面訊號。","risk":"","s":{"AAOI":"bull","AVGO":"neutral","COHR":"bull","JBL":"bull","LITE":"bull","SIVE":"bull"},"text":"Just some TLDR notes on $AAOI earnings:\n\n- Expects full qualification of 1.6T products by their hyperscaler customer within next couple of weeks\n\n(helpful revenue ramp #2, timelines)\n\n-  Continues to believe that AOI will have the largest AI DC transceiver production capacity in the US\n\n(reiterating ambitions during a time when their competitors might get banned)\n\n- Expects facilities toward InP capacity to come online in early 2027\n\n(timeline FYI in terms of further ramp)\n\n- Total capacity is approaching 200,000/u per month, EOY 650,000/u per month of 800g/1.6t. EOY 2027, 930,000/u\n\n(this is the ramp i want to see)\n\n- \"increase our manufacturing capacity for our external light source or ELSFP. That's for co-packaged optics or CPO\". we anticipate ramping production later this year and into 2027, ultimately culminating in about 400,000 pieces per month in 2028\n\n(need some time to model this into revenue)\n\n- \"As we have mentioned before, we've been manufacturing lasers internally for many years. This has allowed us to avoid some of the shortages that  have affected others in the industry\"\n\n(vertical integration bull case during CW/EML laser shortages)\n\n- We believe that in the future","likes":736},{"id":"2085504525985816639","author":"aleabitoreddit","date":"2026-08-06","zh":"LITE與AAOI皆稱雷射供給遠低於需求，預期InP基板與雷射是2027最嚴重瓶頸，看重SIVE、AAOI獨立產能。","risk":"","s":{"AAOI":"bull","LITE":"bull","SIVE":"bull"},"text":"@_king142 $LITE CEO said even as their 5 InP laser fabs come online, shipments would be 30%+ below customer demand. (and worse than the current memory shortage)\n\n$AAOI said something similiar with a 20-40% figure.\n\nMy guess is that InP substrates and lasers both will be one of the most severe bottlenecks in 2027.\n\nWhich is why I place a lot of value on any independent capacity that comes online whether it's $SIVE with Win or $AAOI.","likes":110},{"id":"2085505415845208476","author":"aleabitoreddit","date":"2026-08-06","zh":"很高興人們把他去年的AXTI論點視為AI建設的真實威脅；Innolight向他人採購雷射才是瓶頸。","risk":"","s":{"AXTI":"bull"},"text":"@coolATCS It makes me happy that people are reiterating my $AXTI thesis from last year like it's a legitimate threat to the AI buildout now.\n\nAlso just some nuance Innolight, buys EML/CW lasers off other players, which is the bottleneck. Not so much downstream assembly/integration layers.","likes":45},{"id":"2085511646257332581","author":"aleabitoreddit","date":"2026-08-06","zh":"MTSI財報稱客戶因InP DFB雷射短缺急迫求貨，SIVE、LITE等CW DFB業者應樂見瓶頸獲驗證。","risk":"","s":{"LITE":"bull","MTSI":"neutral","SIVE":"bull"},"text":"$MTSI earnings transcript:\n\n\"Customers are coming to us with urgency due to the general supply shortage of indium phosphide DFB lasers\"\n\nEmphasis on \"Urgency\", CW \"DFB lasers\", \"coming to us\".\n\nCW DFB names, such as like $SIVE and $LITE should be happy to hear about this laser bottleneck getting validated.","likes":279},{"id":"2085603590903902621","author":"aleabitoreddit","date":"2026-08-07","zh":"AAOI因產能不足不參與首代CPO，獨立CW雷射產能更具價值，利好SIVE等；中國CPO雷射落後2–3年。","risk":"AAOI缺席首代CPO部署","s":{"AAOI":"neutral","AMD":"neutral","AVGO":"bull","COHR":"bull","LITE":"bull","MTSI":"neutral","NVDA":"neutral","SIVE":"bull"},"text":"Wow, there's gem after gem in $AAOI earnings for $SIVE + other laser player readthrough.\n\n1. AAOI not meaningfully participating in CPO first-gen deployments.\n\n\"We just can’t make enough of them [CPO lasers] to be involved in their current first-generation [CPO] deployments because there’s just not enough capacity.   We have to prioritize our ability to make lasers for our own  transceivers first\"\n\nSo first-gen CPO laser deployments, might even be narrowed down further for Western players like $SIVE, $LITE, $AVGO, and $COHR.\n\nAnd independent CPO CW laser capacity became more valuable if $AAOI had to turn away more customers...\n\nAlso remember Trendforce was talking about $AMD singing CW LTAs? $COHR / $LITE have capacity signed with $NVDA ...\n\nI thought it would be $AAOI, but they might be out of the equation. $MTSI also doesn't look meaningful with early CPO participation (eg. no mention in ER aside from NPO, and removal from Ayar website).\n\nSo I wonder who players like $AMD is going to go with for Helios (eg. Sivers + Ayar more likely candidate now)?\n\nBtw, this is not bearish AAOI because they have too much demand for optical transceiver business. Just more bullish on the existing ","likes":1509},{"id":"2085606635834388515","author":"aleabitoreddit","date":"2026-08-07","zh":"作者極看好AAOI且為主要持股，但其因產能不足不參與第一代CPO，意味其他CPO雷射業者更有價值。","risk":"AAOI缺席第一代CPO","s":{"AAOI":"bull","AMD":"neutral","COHR":"neutral","LITE":"neutral","NVDA":"neutral"},"text":"@00m00oo I'm extremely bullish on $AAOI, it's one of my top holdings?\n\nBut there's an unholy amount of things to unpack when AOI said they're not participating in first-gen CPO deployments because there's not enough capacity.\n\n1. Independent CW DFB capacity, even less than markets thought.\n\n2. Qualified CPO laser players, even less than markets thought.\n\n3. I remember Rosenblatt thought $AAOI would be $AMD's first CPO customer, but might not be the case anymore...\n\nAnd since $LITE and $COHR are in camp $NVDA and sold out for next 2 years...\n\nSome other CPO players might be more valuable than others think.","likes":167},{"id":"2085607377374675122","author":"aleabitoreddit","date":"2026-08-07","zh":"AAOI因光收發器需求超供給20–40%無法滿足，屬正面，也為小型CPO雷射業者帶來機會。","risk":"","s":{"AAOI":"bull"},"text":"@pjtesus It's because $AAOI already has a massive 20-40% demand imbalance for their 800G/1.6T optical transceivers...\n\nThey can't make enough to satisfy demand. That's a positive thing.\n\nBut not being able to fulfill all demand, means there's market opportunities for smaller CPO laser players.","likes":101},{"id":"2085608520293154900","author":"aleabitoreddit","date":"2026-08-07","zh":"作者持有並看好AXTI，認為InP基板供需失衡未來2–3年不會消失，論點已獲驗證。","risk":"","s":{"AXTI":"bull"},"text":"@KhalidIshaq85 @00m00oo I literally and legally can't give you advice.\n\nI'm personally long and still bullish on $AXTI since I don't think InP substrate demand imbalance will be going anywhere over the next 2-3 years.\n\nAnd my InP substrate bottleneck thesis + AI buildout disruption got validated midway through the year from Reuters to other epiwafer earnings calls.\n\nYou do you","likes":83},{"id":"2085628664528662818","author":"aleabitoreddit","date":"2026-08-07","zh":"Lumilens以55億美元估值出關並有數十億客戶協議，作者重新小量買入POET，對POET、SIVE為正面。","risk":"","s":{"POET":"bull","SIVE":"bull"},"text":"Earlier today, optical interconnect company Lumilens \"emerges from stealth\" at a $5.5B valuation, after raising $700m.\n\nJust as a recap from $POET / $SIVE Linkedin OSINT mapping I shared earlier, Lumilens was supplying a top 3 hyperscaler customer.\n\nSo we got confirmation of that a month later, along with the material figure that Lumilens has a \"multi-billion-dollar customer agreement\".\n\nAnd just for reference, $POET has existing contracts with Lumilens ($50m purchase order, up to $500m) + contracts with $SIVE (depending on product lines).\n\nI actually took tiny positions in POET again after reading this news, since it finally gives them visibility into extremely well funded hyperscaler suppliers (on top of Poet's really large balance sheet).\n\nBut TLDR:\n> Lumilens around similar (or even higher) valuations as Lightmatter/Ayar, bigger than markets thought with hyperscaler customers.\n> nice read through upstream on $POET (derisking) /  $SIVE.\n> Great for optical valuations in general, seeing a company go to $5.5B in 2 years.","likes":771},{"id":"2085633799824773480","author":"aleabitoreddit","date":"2026-08-07","zh":"Lumilens有直接雲端客戶，SIVE為上游雷射供應商，需往下游發展以擴大TAM。","risk":"需往下游擴展以擴大TAM","s":{"LITE":"neutral","SIVE":"neutral"},"text":"@homeboyrichie For now yes, because Lumilens has a direct hyperscaler customer and multi-billion dollar purchase agreements. While $SIVE is an upstream laser supplier.\n\nSivers needs to work its way downstream to capture more TAM with selling optical engines, ELS, or complete optical transceivers like $LITE did after M&A eg. Cloud Light.\n\nMy opinion is that it’s easier to move downstream than upstream as you seen with the limited amount of qualified laser suppliers out there.","likes":104},{"id":"2085639100519088220","author":"aleabitoreddit","date":"2026-08-07","zh":"不希望SIVE被收購，認為其雷射資產有潛力成為下一個LITE，預期Nasdaq上市後有所動作。","risk":"","s":{"LITE":"bull","SIVE":"bull"},"text":"@vas_203 Uhh I don’t want $SIVE to be acquired given how attractive their laser assets are. Since I see potential for them end up as the next $LITE.\n\nHonestly carving out OE solutions complete optical transceiver business or something similar that’s distressed from a private startup might be interesting.\n\nMy guess is it comes after Nasdaq listing within next few quarters or so. I think the CEO knows what to do, so I’m just tagging along for the ride.","likes":162},{"id":"2085640966526922894","author":"aleabitoreddit","date":"2026-08-07","zh":"Unitree本月上市預期約300億估值，作者觀察對CCXI/Agility影響，已提出人形機器人論點並等待兌現。","risk":"","s":{"CCXI":"bull"},"text":"@rektusd101 Unitree is being listed this month, and is expected to open around a $30B valuation (pre-IPO perps) from ~$5.6B -> $9B now.\n\nGiven Agility is valued at $2.5B premoney with $CCXI, I’m just watching what happens to the robotics sector and especially Agility, when Unitree goes public.\n\nI’ve already laid down my thesis with humanoids and I’m personally waiting for it to play out.","likes":84},{"id":"2085644051446108223","author":"aleabitoreddit","date":"2026-08-07","zh":"Unitree將以90億美元估值上市，衍生品隱含約360億；CCXI/Agility將於Q4上市，觀察中美估值差異。","risk":"","s":{"CCXI":"neutral"},"text":"Unitree, China's humanoid leader, is set to IPO this month at a $9B valuation! (~$6.2B originally per March filing).\n\nDerivative markets are pricing open at an implied $36.04B MC, roughly ~4X listing price.\n\n$CCXI / Agility Robotics, the first US publicly listed pure play humanoid leader, is also going public later in Q4, at a ~$2.5B pre-money valuation.\n\nIt will be interesting to see how markets price in America vs. Chinese Humanoid leaders.","likes":872},{"id":"2085649654059016387","author":"aleabitoreddit","date":"2026-08-07","zh":"稱讚Rosenblatt光通訊渠道查核，雷射類股如預期時間回升，但其AMD為AAOI首個CPO客戶判斷可能有誤。","risk":"","s":{"AAOI":"bull","AMD":"neutral","LITE":"bull","SIVE":"bull"},"text":"I usually make fun of sellside, but Rosenblatt has pretty goated channel checks on optical names, and their reports are one of the few I like talking about.\n\n$AAOI, $LITE, $SIVE, and the laser party has started to recover around the est. timing windows.\n\neg. last month: \"Multiple short sellers told them they will likely close their positions... late July and early August\".\n\nThey might have missed that they believed $AMD would be $AAOI's first CPO customer... since AAOI said they would be missing from first-gen CPO (maybe future gen?)\n\nBut lot of their talking points about China CPO laser positioning (eg. 2-3 years behind) got corroborated word-for-word from AAOI earnings today.","likes":1444},{"id":"2085711500875116887","author":"aleabitoreddit","date":"2026-08-07","zh":"AAOI指出DSP與TIA瓶頸，利好MXL、SMTC、MTSI；AAOI預計第四季營收超5億美元。","risk":"","s":{"AAOI":"bull","MTSI":"bull","MXL":"bull","SMTC":"bull"},"text":"Some more TLDR takeaways from $AAOI ER:\n\n- They also flagged DSP and TIA bottlenecks, which is a positive industry read through for names like $MXL, then $SMTC and $MTSI.\n\n- For revenue growth, they're expecting more than $500 million revenue Q4, which is absurd growth.\n\nFor reference:\nQ2: $191.9M\nQ3: ~$255M-$290M\nQ4: $500M+\nBy mid-2027: ~$1.41B quarterly revenue run-rate\n\nAlways impressed by the revenue ramp from some of these optical players.","likes":849},{"id":"2085718303998455999","author":"aleabitoreddit","date":"2026-08-07","zh":"雷射未來2–3年將極度短缺；InP基板看法不一，預期AXTI營收拐點並調漲ASP。","risk":"","s":{"AAOI":"neutral","AXTI":"bull","MTSI":"neutral"},"text":"@SL2056 @Sofigoodboy Good question! This something year-by-year, can't really predict shortages into 2030 from 2026, but it's definitely a structural multi-year demand cycle.\n\nSomething that I want to flag is that it looks like lasers in specific would likely have extreme shortages for the next 2-3 years, especially during CPO scale up at the very least.\n\neg. CPO laser market would require capacity \"8 to 10x bigger compared to  today,\" and added, \"I think… no effect at all because the demand is much  bigger than the worldwide capacity.\"\n\nAs for InP substrates, $AAOI said they were fine for 2027 calendar year but wanted to form JVs because of likely how critical they are since.\n\n$AXTI looked like they were just multiplying capacity year after year and depends on who you ask..\n\nSome of the Taiwan epiwafer players say it's extreme shortages for InP substrates, when they feed into your laser players.\n\nYour laser players like $AAOI and $MTSI say they're fine.\n\nRegardless, we see that convert into revenue inflection points with AXTI anyway (~$130m/quarter in 2027), but I'm expecting ASP to be hiked along the way given their positioning.","likes":67},{"id":"2085823672569467005","author":"aleabitoreddit","date":"2026-08-07","zh":"白宮投資WWR、SRL、FEAM、HREE等關鍵礦物公司，作者未持有但支持此政策。","risk":"","s":{"FEAM":"neutral","HREE":"neutral","SRL":"neutral","WWR":"neutral"},"text":"There we go, White House finally invests in more breath in critical minerals/materials. Amazing policy move, as a TLDR:\n\n- $WWR receives $25M (graphite)\n- $SRL (ASX) receives $400M (Scandium)\n- $FEAM receives $8M (Boron)\n- $HREE receives $4.8M (magnet rare earths)\n\nout of the public companies.\n\nWith more private investments from $150 million into Niron Magnetics or $85 million into Standard Bauxite.\n\nIt's literally spare change to the US gov, for ENORMOUS amount of downstream applications.\n\nMore should be done with funding amounts to accelerate development and derisk supply chains (don't own any of the above, just support the policy move), but great announcement.","likes":642},{"id":"2086148557187461412","author":"aleabitoreddit","date":"2026-08-08","zh":"仍看好MU等記憶體；七月崩跌基本面未變，只有股價與敘事改變，市場在瓶頸間輪動。","risk":"","s":{"AAOI":"bull","AXTI":"bull","COHR":"bull","LITE":"bull","MU":"bull","SPCX":"neutral"},"text":"Yes, I'm still bullish on memory like $MU / Samsung.\n\nAs I said earlier, markets tend to rotate from bottleneck to bottleneck.\n\nThis week it looks $AXTI to $LITE in the photonics sector is the focus again.\n\nThe thing is... the primary thing that changed are the stock prices, followed by some narratives + updates sprinkled in here and there.\n\nFor photonics:\n\n> We already knew $COHR / $LITE lasers were completely sold out for the next 2 years during July's drop.\n\n> We knew about demand imbalance from $AAOI from last quarter's earnings calls.\n\nNothing deteriorated fundamentally during July's crash, other than listed price after liquidations.\n\nYet tons of people called $AAOI a \"scam\" when it dropped to $75, or $AXTI a \"scam\" on its drop to $35...\n\nBut are bullish again at $140 or $80, when the transciver/InP substrate bottleneck hasn't changed at all, but maybe even got worse... (eg. draft for US ban on new china optical transceivers, scale up demand projections)\n\nFor Memory:\n\nI'm witnessing a lot of retail capitulation, but the same people I'm seeing were mega bullish after $MU signed 16 SCAs and gave exceptional projections a month ago.\n\nOr were celebrating Samsung having the highest","likes":1654},{"id":"2086157318065168490","author":"aleabitoreddit","date":"2026-08-08","zh":"以諷刺方式寫放空NBIS指南：雲端業者需求創新高、NBIS高速成長，卻結論放空NBIS做多LULU。","risk":"","s":{"AMZN":"bull","GOOGL":"bull","LULU":"neutral","META":"bull","NBIS":"bull","NIKE":"neutral"},"text":"Today I'm writing a weekend guide on how to do DD when shorting $NBIS:\n\nFirst, you look at hyperscaler earnings for AI cloud read through:\n\n> $GOOGL: reports record AI cloud demand + backlog + margin increases from earnings\n\n> $AMZN: reports record AI Cloud demand + backlog + margin increases from earnings\n\n> $META: reports higher than expected prices for available capacity from earnings.\n\nNow, time to look at Nebius:\n\n-> $NBIS: Growing hundreds of percent to $7-9B ARR by Q4. Growing margins, and guided 4GW+ contracted power.\n-> Sees Uber/Waymo splitting, putting more focus on Avride\n-> Sees Clickhouse growing rapidly every quarter.\n\nOkay looks bad! But next, you need a hedge?\n\n-> Wow! A $NIKE brand executive, after the stock dropped 75% over the past 5 years, went to $LULU to save that brand next? Lululemon seems good.\n\nConclusion: Short Nebius and go long on $LULU","likes":1761},{"id":"2086159536084361667","author":"aleabitoreddit","date":"2026-08-08","zh":"說明前文為諷刺Michael Burry做多LULU、放空NBIS的交易，勿當真。","risk":"","s":{"LULU":"neutral","NBIS":"neutral"},"text":"@MDjavanmard This is satire about Michael Burry's long $LULU short $NBIS trade if you didn't get the reference (don't actually take this post seriously).","likes":384},{"id":"2086247069900300393","author":"aleabitoreddit","date":"2026-08-09","zh":"基於AAOI、MTSI財報與美國擬禁中國光收發器，重新檢視SIVE約4.27億美元產能營收模型。","risk":"","s":{"AAOI":"neutral","MTSI":"neutral","SIVE":"bull"},"text":"I think it’s a good time to revisit $SIVE ~$427m/yr midpoint capacity revenue modeled projections.\n\nGiven recent industry earnings:\n\n> $AAOI cited +20-40% demand imbalance for transceivers (with lasers as the bottleneck).\n\n> $MTSI saying many \"Customers are coming to us with urgency due to the general supply shortage of indium phosphide DFB lasers\" (in other product lines)\n\n> US proposal ban on new Chinese optical transceivers (Innolight/Eoptolink)\n\n> AOI no meaningful participation in first-gen CPO deployments due to lasers being allocated toward transceivers.\n\nThe read through is that it’s possible to apply the same capacity-demand absorption modeling applying to $AAOI, but for other laser players like Sivers too.\n\nGiven the widespread shortage and demand imbalance for InP CW DFB capacity.","likes":240},{"id":"2086255168547652017","author":"aleabitoreddit","date":"2026-08-09","zh":"SIVE雷射陣列產能模型，多頭情境是自行收購擴大TAM，作者期望更高。","risk":"","s":{"SIVE":"bull"},"text":"@softmaxedx This is just laser array capacity modeling.\n\nThe bull case is $SIVE pulling their own Cloud Light acquisition and multiplying TAM starting from the laser chokepoint.\n\nI have much higher expectations personally, but people can make their own valuation estimates. https://t.co/sS372W0SYR","likes":13},{"id":"2086264361002348621","author":"aleabitoreddit","date":"2026-08-09","zh":"好奇SIVE能否取得更多代工產能，預期量產後售罄，營收拐點約在2027上半年。","risk":"","s":{"AAOI":"neutral","AEVA":"neutral","GFS":"neutral","JBL":"neutral","MTSI":"neutral","POET":"neutral","SIVE":"bull"},"text":"@wannabepanacea I’m actually kinda curious about $SIVE securing more foundry allocation given widespread CW DFB shortages now.\n\nSince I’m pretty confident it sells out once qualifications go into volume ramp.\n\nBut aside from that\n\n> reaffirm demand/supply imbalance from other earnings like $MTSI / $AAOI helps\n\n> new development/qualifications mentioned in previous earnings with pluggable players, probably most material\n\n> Progress with $JBL, ~ $AEVA, $POET, $GFS or other opportunities, maybe initial POs would be nice.\n\n> Nasdaq listing update reiterated (we already got updates it’s planned completion next few quarters). I still place that on priority personally since it unlocks more funding for their M&A efforts, hopefully down the pluggable stack.\n\nI think the revenue inflection starts around H1 2027, so current revenue/profit numbers are not very material.\n\nAn $AAOI statement like anything we make we expect to be sold in 2028 or something would be kinda goated.","likes":193},{"id":"2086634510935118161","author":"aleabitoreddit","date":"2026-08-10","zh":"本週事件：OCP APAC大會、ASTS、RKLB、LITE、NBIS財報及Unitree IPO，可能成為相關類股催化劑。","risk":"","s":{"AMD":"neutral","ASTS":"neutral","CCXI":"neutral","LITE":"neutral","NBIS":"neutral","NVDA":"neutral","RKLB":"neutral"},"text":"Just some near term events:\n\n- OCP APAC tomorrow (Ayar, Lightmatter, $AMD, $NVDA) and your CPO players are giving announcements/updates.\n\nThis should be a catalyst for certain optical players.\n\n- Earnings week: with $ASTS, $RKLB reporting today (space), $LITE on Tuesday (photonics), $NBIS in the middle of the week (Neocloud), and more.\n\n- Unitree IPO subscriptions opened up today and Listing is expected this month.\n\nShould be a potential catalyst for the humanoid + robotics sector if it opens up well eg. $CCXI.\n\nFun week ahead.","likes":1081},{"id":"2086638639052955732","author":"aleabitoreddit","date":"2026-08-10","zh":"AAOI與POET已暗示雷射供不應求，作者預期LITE財報非常強勁，作為其他雷射業者的參考。","risk":"","s":{"AAOI":"neutral","LITE":"bull","POET":"neutral"},"text":"@00m00oo I think we already got too many hints from $AAOI earnings about demand 20-40% imbalance for optical transivers with lasers as a bottleneck.\n\nAnd $POET stating big 3 are completely sold out of capacity next 2 years during their AGM.\n\nI don’t give earnings up or down predictions since it’s a coin flip most of the time. But I can say that a lot of pricing happens before earnings, unless there’s something very unexpected.\n\nRegardless I expect $LITE earnings to come out really strong, and I primary use it as a read through for your other laser players.","likes":140},{"id":"2086730782425727183","author":"aleabitoreddit","date":"2026-08-10","zh":"雷射類股回升之際，分享研究指出不頻繁交易者報酬較高，提醒散戶勿在下跌中過度交易。","risk":"","s":{"AAOI":"neutral","LITE":"neutral","SIVE":"neutral"},"text":"Now that markets are hosting a laser party again from $SIVE, OE Solutions, $LITE, Coherent, to $AAOI.\n\nThere’s a pretty interesting study:\n\nBoth from Fidelity and a UC Berkeley research paper, that the best investors are the ones who either…\n\n- Anecdotally forgot about their account (Fidelity)\n- Didn’t actively trade/overtrade (18.5% return from infrequent traders vs. 11.4%).\n\nNot any advice, but some of these anecdotes might be helpful to retail to read in general…\n\nSince I witnessed a lot capitulation off memory, photonics, or thematic volatility, just for retail not have positions on a sharp recovery.\n\nHaving conviction also usually people in that “not overtrading” camp, since it helps to not overtrade in drops or see opportunities to cost average.","likes":1280},{"id":"2086840511164514742","author":"aleabitoreddit","date":"2026-08-10","zh":"諷刺Barron's聘非技術背景記者撰寫AAOI等光通訊文章，看不懂就稱迷因股。","risk":"","s":{"AAOI":"neutral"},"text":"Be Barrons:\n\n- Wants to write about optical supply supply chains like $AAOI\n\n- Hiring DPT: who needs engineers to write about this something this simple?  Let’s find underpaid political philosophy backgrounds.\n\n- proceeds to find a new hire from nonprofit communication consulting\n\n- first day on job: gets paid to model revenue ramp/margins projections, CW laser bottlenecks, internal capacity\n\n- New hire: “I don’t understand this sht”, “looks like a memestock”\n\nBarrons: “Memestock? looks like our next article, I don’t understand either”.","likes":818},{"id":"2086988264448409739","author":"aleabitoreddit","date":"2026-08-11","zh":"RIOT與Anthropic簽91億美元合約，AMD擴大合作，前礦商轉型AI資料中心營收拐點約2027下半年。","risk":"","s":{"AMD":"neutral","IREN":"neutral","RIOT":"bull"},"text":"Woah, $RIOT announced a $9.1B deal with Anthropic, with a possible contract extending to $16.1B, over 20Y.\n\n$AMD also exercised its option to expand its existing deal with Riot. (And they still have another 1 GW campus they have LOI with for a tenant)\n\nIn terms of timelines, seem like most of the Colo basket have their revenue inflections hit H2 2027?\n\n(Eg. Riot Anthropic deal targets Dec 2027 for first 96 MW, AMD full 50 MW - May 2027)\n\nIt’s cute to see all the former miners like $IREN and co. grow up.","likes":787},{"id":"2086989780571832501","author":"aleabitoreddit","date":"2026-08-11","zh":"作者未持有RIOT也不給建議，指出其約4.55億年營收合約及2028比特幣減半可能為催化劑。","risk":"","s":{"RIOT":"neutral"},"text":"@lichunhong1204 I’m just posting about stuff I find interesting, and some signals thematically in terms of revenue inflection points.\n\nI don’t own $RIOT myself and can’t give buy recommendations, so in the end up to you.\n\nThey did contract roughly ~$455M annual revenue from that deal, and a second catalyst to think about might be the 2028 Bitcoin.\n\nSo some of these names with dual exposure might get a lot of attention H1 2028.","likes":67},{"id":"2087000954742927390","author":"aleabitoreddit","date":"2026-08-11","zh":"Unitree IPO超額認購逾8000倍，作者看好並參與Agility（CCXI），預期美國人形業者受關注。","risk":"","s":{"AMZN":"neutral","CCXI":"bull","NVDA":"neutral"},"text":"uhhh... the Unitree IPO is more than 8000 times oversubscribed by retail investors.\n\nThe demand for pure play humanoid companies is absolutely enormous?\n\nI'm personally in the US-based Agility Robotics club (Softbank, $NVDA, $AMZN, Foxconn, etc), at $2.5B premoney via $CCXI.\n\nAnd my take is that Unitree likely opening at $30B+ (from pre-ipo perps), might bring the leading US players some more attention in a week or two.\n\nRegardless that's just absurd demand.","likes":1196},{"id":"2087249406638862506","author":"aleabitoreddit","date":"2026-08-11","zh":"AAOI預計2028年ELSFP產能每月40萬件，可新增約19億美元營收，並非單一年度週期。","risk":"","s":{"AAOI":"bull"},"text":"Just putting it out there for people that think AAOI is a one year cycle...\n\n$AAOI projects their ELSFP capacity for CPO to be 400K/units a month in 2028.\n\n400k * ~$400 ELS ASP (GS assumptions) = + another ~$1.92B 2028 annualized revenue capacity added as a new distinct (>50% gross margin) product line.\n\nOn top of their existing 2027 projections (eg. ~$5.6B annualized transceiver revenue off $471m/month entering H2).\n\nTAM for 1.6T also goes brrr so I'd expect their end of H2 2027 projections to go up as more capacity comes online...\n\nFor certain optical names, it's one cycle (eg. 1.6T, CPO scale out/up, NPO etc. ), stacked on top of one another... stacked on top of another...  with TAM + margins stacking like minions after Anivia uses W in line.\n\nRather than one-and-done off of one year.\n\nThis is a stark contrast to some other sectors where growth is likely to decelerate after maybe 1 year of triple digit Y/Y revenue growth.","likes":953},{"id":"2087266070919012664","author":"aleabitoreddit","date":"2026-08-11","zh":"對ANET XPO MSA採用情況不熟，無法評論對POET等業者的影響。","risk":"","s":{"ANET":"neutral","MSFT":"neutral","POET":"neutral"},"text":"@NicolaRussoIT Not as familiar with adoption read through with $ANET XPO MSA (ik $MSFT has been the most openly supportive).. so can't really give a good answer to implications on other players like $POET. https://t.co/Xi6zrmo5ha","likes":27},{"id":"2087271842696593764","author":"aleabitoreddit","date":"2026-08-11","zh":"LITE財報強勁、指引超預期、CPO雷射需求增加，對SIVEF、COHR等CPO業者為正面。","risk":"","s":{"COHR":"bull","LITE":"bull","SIVEF":"bull"},"text":"$LITE earnings are out, very strong earnings:\n\nRevenue: $1.01B, +24.5% Q/Q, +109.3% Y/Y growth\nvs. ~$984.6M\nAdj. EPS: $3.23 vs. ~$2.95\nGross Margin (non-gaap): 50.4% / Operating margin (non-gaap) 36.6%\n\nQ1 FY2027 guidance is probably more important:\n\nRevenue: $1.225–1.275B vs. ~$1.16B\nAdj. EPS: $4.05–4.35 vs. ~$3.63\nOperating margin (non-gaap) of 39.5% - 40.5%\n\nIn terms of notes:\n\nSees: \"Increasing demand for ultra-high-power CPO lasers, an initial order for ELS modules\"\n\n- Great read through on other CPO players like $SIVEF, $COHR, and others. (maybe not AAOI since they're missing out on first-gen deployments)\n\n- \"Breath of NPO engagements are the first signs that optics are starting  to penetrate in-rack connectivity, significantly upping our optical TAM\"\n\n- Revenue projections \"reaching our target model more than a quarter ahead of schedule.\"\n\nExtremely strong earnings as expected, you have revenue going from:\n\n$808M -> $1.01B -> $1.25B while operating margin keeps increasing... Just my first impressions.\n\nMost important thing is the earnings call coming up soon.","likes":1145},{"id":"2087274150054576424","author":"aleabitoreddit","date":"2026-08-11","zh":"引述AAOI稱雷射產能不足，無法參與首代CPO部署，僅作CPO早期部署參考。","risk":"","s":{"AAOI":"neutral"},"text":"@Berlinergy $AAOI: \"We just can’t make enough of them [CPO lasers] to be involved in their current first-generation [CPO] deployments because there’s just not enough capacity.\n\nWe have to prioritize our ability to make lasers for our own transceivers first\"\n\nThis is just for early CPO related deployment read through.","likes":90},{"id":"2087280662802026931","author":"aleabitoreddit","date":"2026-08-11","zh":"SMCI 2027財年營收指引650–720億美元遠超預期，作者持有短線部位，認為有重新評價空間。","risk":"2027毛利率待確認","s":{"SMCI":"bull","SPCX":"neutral"},"text":"$SMCI 2027 guidance was actually unholy: $65-$72 billion FY 2027 revenue guidance...\n\nvs. ~$52.4B expected, a casual +$16.1B above consensus.\n\nSMCI logged a massive $60B+ in news order from this earnings.\n\nThat timeline is also interesting when they announced a plan to co-build $SPCX + xAI  DCs \"within a year\" back in June..\n\nBut if SMCI sustain 10-15% gross margins off that ~$70B revenue guidance... I think there's a lot of room for rerating given MC is ~$20B (NFA, I have short term positions in SMCI now from this ER).\n\nMost important thing is learning about 2027 margins from call today.","likes":453},{"id":"2087282789473521833","author":"aleabitoreddit","date":"2026-08-11","zh":"以SMCI淨利率約7.7%計算，若營收達700億美元約僅4.1倍前瞻本益比。","risk":"","s":{"SMCI":"bull"},"text":"@KHqmjz If you apply their net margin for 2026 so far, $SMCI is around ~7.7%.\n\nIf they do $70B revenue for H1 2026 with the same net margins, would be round ~4.1x forward earnings.","likes":38},{"id":"2087283272627998869","author":"aleabitoreddit","date":"2026-08-11","zh":"認為市場因SMCI過去合規問題給予折價是合理的，並非適合所有人。","risk":"過去合規失誤","s":{"SMCI":"bear"},"text":"@throw_away_9264 Yep, I still think markets are correct to apply discounts to $SMCI given history with compliance failures.\n\nDefinitely not for everyone","likes":44},{"id":"2087285356999958663","author":"aleabitoreddit","date":"2026-08-11","zh":"CRWV、SMCI、LITE財報亮眼：CRWV大量積壓訂單、SMCI指引驚人、LITE營收與利潤率持續成長。","risk":"","s":{"CRWV":"bull","LITE":"bull","SMCI":"bull"},"text":"Insane earnings today for the AI theme with $CRWV, $SMCI, and $LITE.\n\nCoreweave: Absurd ~$104B+ backlog, which doesn't include $25B+ of new customer agreements added in early Q3.\n\nCompute demand read through for Neoclouds is enormous (For Nebius, Iren and others)\n\nSupermicro:  Absurd $65-72B in revenue guidance, adding $60B+ in new orders...\n\nAI DC buildout read through is just enormous.\n\nLumentum: $808M -> $1.01B -> $1.25B revenue ramp, with operating margins growing quarter after quarter.\n\nPhotonics players just keeps printing.\n\nTLDR: Every layer of the AI buildout goes brrrrr, and it's showing up in earnings.","likes":1331},{"id":"2087329770879197549","author":"aleabitoreddit","date":"2026-08-12","zh":"整理LITE財報重點：CPO擴產2027下半年確認、UHP雷射供不應求、具漲價能力，中國對手落後，利多SIVE、AXTI。","risk":"","s":{"AAOI":"bull","AXTI":"bull","LITE":"bull","SIVE":"bull"},"text":"$LITE earnings transcript TLDRs:\n\n- \"Our visibility into the timing of CPO scale-up deployments has also sharpened. We remain confident in a demand ramp for our ultra-high-power  laser chips in the second half of calendar 2027\"\n\nH2 2027 start of CPO scale up ramp confirmed from Lumentum for their lead customer.\n\n- \"We were recently given our first external light source, or ELS, module purchase for delivery by the second half of calendar 2027\"\n\nELS industry ramp timelines\n\n- \"The NPO opportunity is completely additive for us, significantly increasing the optical TAM.\"\n\nMore TAM for laser chokepoint club\n\n- \"we expect the 1.6T transceiver uptake to intensify starting in fiscal Q1 and sustain through calendar 2027.\"\n\n- \"Even in CW, we’ve been surprised at our ability to price up\"\n\nPositive pricing power for $SIVE and the other CW laser players.\n\n- \"As a result, we are able to command a nice price premium that we expect  to sustain, as these Chinese if these Chinese guys come online.\n\nI caution people also, I think people are some of these Chinese laser suppliers are not delivering in the market today, so they have there is no recourse when they throw out these big numbers. We have not","likes":297},{"id":"2087345398130282801","author":"aleabitoreddit","date":"2026-08-12","zh":"調侃SMCI執行長在財報問答中迴避2027年毛利率等問題。","risk":"管理層迴避毛利率問題","s":{"SMCI":"neutral"},"text":"Bro Charles the $SMCI CEO needs to become a politician.\n\nI’ve never seen a guy dodge so many questions on a Q&A earnings transcript before.\n\n- “what’s your 2027 gross margins”\n\nA: “we look forward to growing them\n\n- “do you anticipate margins to improve September?”\n\nA: September. Which is September?","likes":1203},{"id":"2087352370212876390","author":"aleabitoreddit","date":"2026-08-12","zh":"SMCI給出2027年約700億美元營收指引，相對200億市值屬爆發性，仍認為應重新評價，但毛利率估計不明。","risk":"毛利率指引不明確","s":{"SMCI":"bull"},"text":"@PatientGS Nah, $SMCI gave blowout projections for 2027 with that ~$70B revenue guidance relative to their $20B MC.\n\nI still think it should get rerated. Just a bit annoying I couldn’t get clear answers for margin estimates.","likes":97},{"id":"2087426268841361497","author":"aleabitoreddit","date":"2026-08-12","zh":"若有Serenity意識基金，會各買入SIVE與AAOI約1/6。","risk":"","s":{"AAOI":"bull","SIVE":"bull"},"text":"@MaxChua16 The Serenity Awarness Fund would have bought 1/6th of $SIVE and $AAOI","likes":212},{"id":"2087447527595692180","author":"aleabitoreddit","date":"2026-08-12","zh":"綜合光通訊財報，CW雷射供需失衡、中國落後、首代CPO玩家少，SIVE以約15億市值為論點獲驗證。","risk":"","s":{"AAOI":"neutral","AVGO":"neutral","COHR":"neutral","LITE":"bull","MTSI":"neutral","SIVE":"bull","SMTC":"neutral"},"text":"So this is just what I'm seeing with $SIVE and the CW DFB laser chokepoint right now.\n\nFrom optical earnings:\n\n1. $LITE: unexpected demand and imbalance for UHP CW lasers.\n\n- Had ability to price up ASP for lasers.\n- Scale up CPO on track for H2 2027 shipments, called out any CPO scale up delay rumors as noise.\n\nLumentum confirmed timelines (that CPO players like Sivers sold off of misleading reports from), high margins, and extreme demand for qualified CW lasers.\n\n2. $AAOI: doesn’t have enough CW laser capacity because of too much optical transceiver demand.\n\n-  Not meaningfully participating in first-gen CPO deployments, with $MTSI not looking like they're in it either but focusing on NPO. Haven't seen much with $SMTC after their HieFo acqusition.\n- Called lasers as the bottleneck within a 20-40% demand imbalance for transceivers.\n- Says customers approaching them every week asking them for supply + to move faster.\n\nAOI confirmed demand imbalances  + bottlenecks for lasers. And we got an even smaller pool for first-gen CPO players.\n\n3. Both $AAOI and $LITE claimed Chinese players were years behind for CPO lasers and far behind stated claims in qualified capacity.\n\n- $AAOI said 2-","likes":1301},{"id":"2087450836616298968","author":"aleabitoreddit","date":"2026-08-12","zh":"LITE靠Cloud Light併購從30億成長至600億，SIVE有潛力複製，但需成功併購與Nasdaq上市。","risk":"需成功併購下游","s":{"AAOI":"neutral","LITE":"bull","SIVE":"bull"},"text":"@Berlinergy I said $LITE went from $3b to $60B+ over a 2-3 year timeframe, especially due from Cloud Light acquisition in late 2023, that multiplied TAM by 5x+.\n\nSince they started off in the EML laser / optical component chokepoint originally before M&A.\n\n$SIVE has the potential to do the same starting off in the CW laser chokepoint.\n\nBut it does require something like a successful M&A down pluggables or optical engines/ELS.\n\nTo capture more revenue off things like completed transceivers $AAOI, if they want to get to a similar scale. And my take was NASDAQ listing is necessary to unlock more funding to do so.","likes":208},{"id":"2087452367902159041","author":"aleabitoreddit","date":"2026-08-12","zh":"反駁SIVE無望說法：新架構尚未放量、團隊多博士、供應JBL、GFS、POET等，屬獨特標的。","risk":"","s":{"COHR":"neutral","FN":"neutral","GFS":"neutral","JBL":"neutral","POET":"neutral","SIVE":"bull"},"text":"@Malinrec - Because newer 1.6T optical transceivers and CPO volumes haven't ramped yet. $SIVE is targeting all the next generation optical shifts.\n\nThis comes from a misunderstanding of architectural shifts, you won't get 9 figure revenue in 2024 if customer CPO scale up deployments start in 2028.\n\n- $SIVE has 130+ employees and if I remember correctly, 1/4th to 1/3d were PHDs.\n\nLot of what they do is IP and they use Win Semi, external foundries for volume ramp. If they did assembly like $FN or $COHR, you would see employee count balloon.\n\nNot quite sure why you say a customer supplying to $JBL, $GFS, Ayar, $POET, and many other hyperscaler suppliers is a hopeless case.\n\nProbably one of the most unique ones I've seen.","likes":227},{"id":"2087453528692600936","author":"aleabitoreddit","date":"2026-08-12","zh":"AAOI稀缺雷射產能專供自家光收發器，需求過多無法拓展新產品線並非壞事。","risk":"","s":{"AAOI":"neutral"},"text":"@x4tsr No, because $AAOI said that their scarce capacity is dedicated internally toward making their own 800G/1.6T optical transceivers.\n\nWhich they said would be a 20-40% demand imbalance even if all their capacity come online.\n\nIt's not a bad thing to have too much demand, that you can't expand to new product lines.","likes":84},{"id":"2087457633175507424","author":"aleabitoreddit","date":"2026-08-12","zh":"SIVE早期客戶如Lightmatter、Ayar等皆成長為40億美元以上公司，相信其懂得併購。","risk":"","s":{"SIVE":"bull"},"text":"@tontonborland @Sofigoodboy Pretty sure $SIVE had Lightmatter, Celestial, Lightelligence, and Ayar as customers way early on before.\n\nAnd they all ended up ~4B+ companies after starting off small. So I'm sure they know what to do with promising private company acquisitions.\n\nThere's not really much distressed public companies that offer optical transceiver designs other than maybe OE Solutions I think around ~$200m, but not sure how their progress is going with 800g/1.6T pluggables.","likes":141},{"id":"2087505570941239683","author":"aleabitoreddit","date":"2026-08-12","zh":"AEHR再獲2200萬美元AI處理器晶圓級老化測試追加訂單，盤前漲5.39%。","risk":"","s":{"AEHR":"bull"},"text":"$AEHR receives another $22M follow on order for AI processor wafer level burn in systems.\n\nBy their lead AI processor company.\n\nIt’s cool to see this tiny company grow up so fast across so many verticals (memory, silicon photonics, etc).\n\nUp +5.39% premarket off the news. https://t.co/YkOtELzkmo","likes":674},{"id":"2087515371750490383","author":"aleabitoreddit","date":"2026-08-12","zh":"NBIS營收年增454%、上調電力合約至5GW、2027產能可全數售出，需求能見度極高。","risk":"資本支出大且GAAP虧損","s":{"CRWV":"neutral","IREN":"neutral","NBIS":"bull"},"text":"$NBIS outlook is pretty insane yet again.\n\n$582.3M revenue (+454% Y/Y, +46% Q/Q) off ~50% adjusted EBITDA margin (AI Cloud). $8.04B cash on hand.\n\nReiterates financial guide (2026 revenue: $3.0–$3.4B\n2026 EoY ARR: $7–$9B), I was hoping for a raise, but it's already massive growth.\n\nNot really about this quarter financials, but these signals:\n\n- \"We could sell our entire 2027 capacity on these terms today.\" massive visibility on demand\n- \"4 customer agreements averaging over $1B+ each in contract value\"\n- Around 70% of Q2 deals included customer prepayments\n- Contracted power guidance was raised again, from more ~4+ GW to 5 GW. (this used to be a concern vs. $IREN debate, but Nebius power guidance keeps going through the roof).\n- Expects $9B+ of prepayments in 2026 and says it has $40B+ of commitments.\n- annual contract value per MW keeps going brrr (>$40M/mw for Q3 short term capacity deals)\n\nSame bear story will always be there (eg. large $5.66B of capex with current GAAP net loss), but demand is extreme with massive visibility, with increasing AI Cloud adjusted EBITDA margins ( 24% -> 45% -> 50% progression)\n\nWe kinda got this read through from all your hyperscaler cloud earnings","likes":2191},{"id":"2087519803124969916","author":"aleabitoreddit","date":"2026-08-12","zh":"作者一直看空CRWV，雖需求與利潤率佳，但融資方式差，利息支出侵蝕現金流。","risk":"CRWV債務利息侵蝕現金流","s":{"CRWV":"bear","NBIS":"bull"},"text":"@R42t0r I've been pretty vocally bearish on $CRWV since last year compared to $NBIS and other neoclouds.\n\nDemand isn't really much of a problem with their $100B+ backlog, their revenue + 59% adjusted EBITDA margin looks good.\n\nBut underlying financing methods is really bad...\n\nCoreweave's debt interest (eg. Q2 interest expense reached $640m), which eats into FCF way too much...\nThat figure is like 42% of Coreweaves $1.51B adjusted EBITDA for reference.","likes":104},{"id":"2087655011253981410","author":"aleabitoreddit","date":"2026-08-12","zh":"看到NBIS到LITE等AI財報後，空頭又回去冬眠了。","risk":"","s":{"LITE":"bull","NBIS":"bull"},"text":"@mikealfred Bears are going back into hibernation after seeing all these AI earning reports from $NBIS to $LITE.","likes":121},{"id":"2087655812831519075","author":"aleabitoreddit","date":"2026-08-12","zh":"正在看COHR財報，對其影響感到興奮。","risk":"","s":{"COHR":"bull"},"text":"@LightLogix Yeah looking at $COHR earnings now, pretty excited about the implications, will post soon","likes":55},{"id":"2087675367595380783","author":"aleabitoreddit","date":"2026-08-12","zh":"COHR財報：InP雷射不外售、訂單排到2027年底、CPO需求未延後，凸顯商用CW雷射業者重要性。","risk":"COHR利潤率成長不如LITE","s":{"AAOI":"neutral","COHR":"bull","LITE":"bull","MTSI":"neutral","POET":"neutral"},"text":"My main takeaway was that your merchant CW laser suppliers seem to be EXTREMELY IMPORTANT now.\n\nBut TLDR of $COHR earnings:\n\n\"given the demand that we see in our DC business with transceivers, I don’t see any time in the near future where we would be selling indium phosphide lasers externally\"\n\n- Ton more value placed on companies that sell InP lasers externally if $AAOI can't doesn't enough capacity for first gen-CPO deployments, $COHR not selling externally...\n\nI guess that's why $MTSI said a ton of customers are approaching them with urgency for InP CW DFB lasers (and they dont even have meaningful capacity coming online until EOY 2027)\n\n$AAOI -> Internal\n$COHR -> Internal\nBuyers -> fewer places to look for capacity.\n\n \"Our backlog now extends out, fiscal 2027 is basically completely booked out. We are booked really through the end of calendar 2027\" [ Massive massive demand visibility]\n\n- Coherent also mentioned LTAs spanning end of decade. So this kinda reinforces what $POET CEO said at their AGM that the \"big 3\" are fully sold out next 2 years.\n\n\"we’re not constrained in the assembly and test capacity right now. We’re really just constrained by the ramp of the indium phosphide","likes":432},{"id":"2087677744280977660","author":"aleabitoreddit","date":"2026-08-12","zh":"認為SIVE等合格CW商用雷射供應商在不久將來會變得更重要。","risk":"","s":{"SIVE":"bull"},"text":"@stockprodigyman My takeaway was that $SIVE / Win, Sumitomo, Furukawa, and other qualified CW merchant laser suppliers...\n\nAre going to become a lot more important in the near future.","likes":100},{"id":"2087733927930929435","author":"aleabitoreddit","date":"2026-08-13","zh":"感嘆光通訊三字母術語太多，新追蹤者可能很困惑。","risk":"","s":{"IQE":"neutral","SOI":"neutral"},"text":"Is it just me, or is the list of 3 letter optical jargon never ending?\n\nWe have LPO, LRO, NPO, XPO, CPO, OBO, and others for approaches.\n\nThen InP, EML, ELS, OCS, SOI, and others to add to the random terms 3","zh":"IQE論點獲驗證：MTSI入股與長約、TSEM簽約，已無銀行債務且營收快速成長，仍持有IQE與AXTI。","risk":"","s":{"AXTI":"bull","IQE":"bull","LITE":"neutral","MTSI":"neutral","TSEM":"neutral"},"text":"Feels like my $IQE thesis Feb this year got validated alongside $AXTI and others. (I still long on both)\n\nSo I stopped covering them as much. But TLDR on  updates:\n\nEarly this year, IQE was a distressed but critical chokepoint in the optical supply chain with links to $LITE and others when I published my thesis on it.\n\nSince then:\n\n- $MTSI signed long term epiwafer supply agreements, took a stake in the company, now IQE is bank debt free (Macom has convertibles, but that's positive)\n- $TSEM signed agreements for InP epiwafers.\n- Management explicitly said its IQE agreement was signed to secure the \"strategic III-V epiwafer supply required for that roadmap\"\n- IQE signed another ~$14M mysterious AI DC contract.\n\nThe only part that's still playing out with my earlier thesis is IQE converting their latent/underutilized capacity toward AI DC segment, to match peers like Landmark in the space (which takes time, like slightly over a year if I remember correctly).\n\nThere's some national security implications that I'll avoid talking about that makes them more important.\n\nBut basically:\nFY2025 revenue: £97.3m\nFY2026 guidance: over £126.5m\n\nThey're rapidly growing again in the optical sector,","likes":475},{"id":"2087846074027295020","author":"aleabitoreddit","date":"2026-08-13","zh":"小量持有POET：現金充裕、EV低、產能擴張大，但需求不明且技術護城河不如SIVE，不像AAOI是明確做多標的。","risk":"POET需求不明、過度稀釋","s":{"AAOI":"bull","POET":"neutral","SIVE":"bull"},"text":"Okay here's my take on $POET, since apparently people are celebrating on the subreddit that I took small positions.\n\n- I have 0 idea. ZERO. How they convinced shareholders to allow them dilute SO MUCH to the point:\n\nThey have an absurd ~$830m cash on hand now.\n\nAnd my guess is that they're close to done, since I would be in disbelief if they needed more.\n\nSo now... they have ~$830m to grow their business like M&A, and EV actually dropped really low recently (eg. $1.25B MC vs. $830m cash on hand), that I thought it was compelling to take a risk.\n\n- Annualized production capacity target is 12M optical engines/year for 2027, which is pretty absurd ramp.\n\nNeed to do more research into ASP for Poet's products, but maybe $125-$200? So at ~$150 ASP, $1.8B revenue ceiling.\n\nBut they're like inverse AAOI right now: no visible demand to fill all that capacity. Aside from Lumilens, which is now a highly valued hyperscaler supplier (probably Amazon or Microsoft), with billions in customer agreements.\n\nThe interesting thing is if Poet signed prepayment EML agreements with players like Mitsubishi, or CW agreements with Sivers behind the scenes with that balance sheet.\n\nAnd given the current bott","likes":611},{"id":"2087849557829046296","author":"aleabitoreddit","date":"2026-08-13","zh":"分類：SIVE等待營收轉換、AAOI等待產能執行、POET等待客戶（現金多但需求能見度低）。","risk":"POET需求能見度低","s":{"AAOI":"neutral","POET":"neutral","SIVE":"neutral"},"text":"@SammmXBT If I had to categorize it:\n\n$SIVE = Waiting for Revenue Conversion\n\nTons of hyperscaler suppliers + demand visibility for the CW DFB. How do markets want to price in or assign a premium on the waiting game for 1.6T H1 2027 to CPO scale up for H2 2027?\n\n$AAOI = Waiting for Capacity Execution\n\nExtreme demand visibility for transceivers. Can they ramp up capacity to meet their $471m/month projections?\n\n$POET = Waiting for Customers\n\nToo much cash relative to MC + heavily funded supply chain capacity setup, little demand visbility.","likes":157},{"id":"2087852125334413822","author":"aleabitoreddit","date":"2026-08-13","zh":"通常隨新聞發布研究，若提早持有POET或SMCI等部位會揭露。","risk":"","s":{"POET":"neutral","SMCI":"neutral"},"text":"@dra99aso I usually just post research along the way as new news comes out (eg. Lumilens $5.5B valuation announcement + hyperscaler contracts).\n\nBut I'll drop it in disclosures if I have a rket\".\n\nApple once upon a time actually had extreme supplier leverage before the AI boom.","likes":1920},{"id":"2088505825912631604","author":"aleabitoreddit","date":"2026-08-15","zh":"分享績效統計：EWY多單高峰漲約450%，是主要已實現獲利，仍持有可觀部位。","risk":"","s":{"EWY":"bull"},"text":"@halldj00 Some fun statistics:\n\n- Round 69.2% is unrealized. ~2% of the unrealized options, 98% just pure shares.\n- Drawndown from peak was ~77.8%, not really any risk if liqudiation at the lows, but recovery was a lot slower\n- $EWY longs were up about 450% at the peak, those made up the largest portion of my earlier realized gains, but I still have a sizeable position in that.","likes":155},{"id":"2088509060060741932","author":"aleabitoreddit","date":"2026-08-15","zh":"不分享金額，百分比才能驗證論點，但透露AAOI部位比大家想的大。","risk":"","s":{"AAOI":"bull"},"text":"@alexgoumas I don’t share USD amounts because % is what matters when validating if a thesis is correct.\n\nIf someone made $1M off $AAOI going up 1% because they’re wealthy and had a $100M position, that doesn’t mean their long idea is correct.\n\nBut I will say it’s bigger than people think.","likes":482},{"id":"2088514723969159216","author":"aleabitoreddit","date":"2026-08-15","zh":"列出今年或去年建倉的SIVE、IQE、AXTI等多檔股票，請對方看年初至今漲幅。","risk":"","s":{"AAOI":"bull","AEHR":"bull","ARM":"bull","AXTI":"bull","EWY":"bull","INTC":"bull","IQE":"bull","LITE":"bull","MRVL":"bull","MU":"bull","RPI":"bull","SIVE":"bull","SOI":"bull","TSEM":"bull"},"text":"@Jimbo_Jones_Jr You can look at the YTDs for:\n\n- $SIVE, $IQE, $AXTI, $ARM, $MRVL, $INTC, $SOI, solana:NBiSF3UaVUFtRzHwAfxyHsBCAZWGEKnMpewAE4oh7BG, $AAOI, $LITE, $EWY, $TSEM, $AEHR, $RPI, $MU that I did took positions on earlier in the year or last year.\n\nThen let me know if you still think that way.","likes":297},{"id":"2088575798664110367","author":"aleabitoreddit","date":"2026-08-15","zh":"若AAOI完全執行產能計畫，2028上半年營收可能接近甚至超越LITE，估值差距大。","risk":"需執行產能擴張","s":{"AAOI":"bull","LITE":"neutral"},"text":"@logeonli16 It’s fully up to you. But I’m expecting $AAOI to get close or maybe a 20% chance to surpass $LITE in revenue early H1 2028 if AOI fully executes on capacity projections.\n\nWhich is pretty interesting when you look at the $12B vs ~$80B valuations (lot of it is better margins for Lumentum)","likes":125},{"id":"2088610457104109828","author":"aleabitoreddit","date":"2026-08-15","zh":"AAOI銷售ELSFP與1.6T光模組時綜合毛利率上升。","risk":"","s":{"AAOI":"bull"},"text":"@LcubedInvest @logeonli16 $AAOI blended gross margins goes up when they sell ELSFP and 1.6T optical transceivers.","likes":55},{"id":"2088850910529323315","author":"aleabitoreddit","date":"2026-08-16","zh":"重點整理：SNDK高毛利預測、CRWV簽舊GPU合約、輝達投資、微軟Maia利多MRVL、AMAT先進封裝成長。","risk":"","s":{"AAOI":"neutral","AMAT":"bull","AMZN":"neutral","CRWV":"bull","LITE":"neutral","MRVL":"bull","MSFT":"neutral","NVDA":"bull","SIVE":"neutral","SNDK":"bull","TSM":"neutral"},"text":"Just some TLDRs of stuff I found interesting:\n\n- $SNDK 80% adjusted gross margins projections through 2030, ~75% operating margins and ~50% adjusted FCF margins from investor day.\n\nLTAs already 2/3rd of 2028 output. Minimum contracted revenue reaches $93B (MC is currently ~$239B)... Hard to be a cyclical stock when your revenue/targets are expected to continue 4Y later into 2030.\n\n- $CRWV signs contracts for 6Y old $NVDA A100 GPUs through 2029.\n\nFor Neoclouds like Nebius/Iren, this is positive, since it's a counterargument for eg. Burry depreciation short thesis\n\n- conventional DRAM gross margins eg. Micron is estimated to reach an unprecedented 95% by 2027, surpassing HBM GMs per UBS\n\nread through for legacy/standard dram players like Nanya/Winbond should go brrrr if projections  are correct.\n\n- Anthropic reportedly achieved 14x+ YoY growth and roughly 2.4x sequential revenue growth q2 to >$11.5B,. estimating growth to $190–200B in 2028r evenue numbers.\n\nYour frontier labs keep growing at stupidly fast paces, it would be worrisome if they didnt.\n\n- $NVDA reportedly in talks to invest $3B in SB Energy (Softbank subsidiary), creates a >$500B compute financing push with Apollo, Black","likes":1420},{"id":"2088914739867115965","author":"aleabitoreddit","date":"2026-08-16","zh":"很喜歡CCXI，買入約0.25-0.75%流通股，認為宇樹等IPO將帶動。","risk":"","s":{"CCXI":"bull"},"text":"@_stockResearch I also like really like $CCXI. I bought somewhere between .25-.75% of the company's float around the time it got announced.\n\nI think the Unitree IPO and other Chinese IPOs should give it a boost, since Agility has been a relative laggard to their expected open prices... https://t.co/o0GUaQtbh4","likes":485},{"id":"2088947694886920409","author":"aleabitoreddit","date":"2026-08-16","zh":"輝達會預告趨勢但市場總是忽略；光通訊股一年大漲，押注輝達為領先指標。","risk":"","s":{"AAOI":"bull","AXTI":"bull","COHR":"bull","LITE":"bull","NVDA":"bull"},"text":"I feel like AI investing is simpler than what people expect.\n\nBecause $NVDA + Jensen literally tells everyone what's coming.\n\nBut somehow. Almost every. single. time. Markets dismiss it until it actually happens?\n\nBe Nvidia in 2025:  Buys up EML and laser capacity.\n\nMarkets dismissing it: \"Photonics is a bubble and like quantum! ____ company is a scam with shady management\"\n\n1 year later: $LITE +678%, $AAOI +475.12%, $COHR +260.7%, $AXTI +3,843.9%.\n\n_\n\nNvidia in 2026:\n\nBuys up CW/EML capacity with LTAs. 800V shift. Extraordinary explicit about CPO shift. States Physical AI as the next theme.\n\nMarkets now: \"CW players are meme stocks! 800v, CPO is not coming anytime soon, Humanoids are not profitable!\"\n\nYeah... We'll see what happens in 2027.\n\nI think I'm putting my money on Jensen/Nvidia as the leading indicator.","likes":5297},{"id":"2088950546879111534","author":"aleabitoreddit","date":"2026-08-16","zh":"列出輝達投資的公司，並說明推論：CPO將至、輝達鎖定CW產能，SIVE為最高Beta曝險故做多。","risk":"","s":{"AAOI":"neutral","AVGO":"neutral","CCXI":"bull","COHR":"neutral","LITE":"neutral","MRVL":"neutral","MTSI":"neutral","SIVE":"bull","SMTC":"neutral"},"text":"@KhalidIshaq85 As for names Jensen / Nvidia directly invested in:\n\n- $MRVL (Celestial), $LITE, $COHR for photonics...\n- $CCXI (Agility) for humanoids.\n\nI tend to do more complex investing, for my own thought process:\n\n-> I know CPO theme is coming next\n-> Nvidia secures all CW laser capacity.\n-> Maybe, $AAOI, $MTSI, $AVGO, $SIVE, $SMTC are remaining CW western players.\n-> $SIVE probably the highest-beta exposure. SO that was my personal long.\n\nCan probably do something similar for the other themes.","likes":755},{"id":"2089023480683757970","author":"aleabitoreddit","date":"2026-08-16","zh":"抱怨提不提SIVE都會被批評。","risk":"","s":{"SIVE":"neutral"},"text":"@ram_blings If I mention $SIVE, people say I talk about it too much\n\nIf I don't mention $SIVE, people ask why it isn't mentioned\n\nI can't win","likes":243},{"id":"2089057857652338993","author":"aleabitoreddit","date":"2026-08-16","zh":"引用馬斯克談機器人，預期特斯拉Optimus外型會收斂到正確形態。","risk":"","s":{"TSLA":"bull"},"text":"I think @elonmusk said it best:\n\n“Robots don’t all need to be humanoid.\n\nBut a general-purpose robot intended to replace human labor should fit the world humans already built.\n\nRoger, roger.”\n\nPersonally, I expect $TSLA Optimus form factor to converge to the right image. https://t.co/il7tND3n59","likes":812},{"id":"2089165155741622679","author":"aleabitoreddit","date":"2026-08-17","zh":"InP嚴重短缺引發史上最大漲價，AXTI、IQE受惠，他去年已預測。","risk":"","s":{"AXTI":"bull","IQE":"bull"},"text":"\"Severe InP Shortage Triggers Largest Price Hike Ever\" - $AXTI.\n\nSuppliers have bluntly stated that \"even if you have the money, you still may not be able to get the material\" (lol).\n\n- Industry sources revealed that InP substrate prices began rising in Q4 last year and was the fourth consecutive substrate price hike.\n\n- The latest Q4 hike is expected to be >10%,\n\n- Meanwhile, prices for epitaxial wafers made from those substrates have already been raised two times, and the market is moving toward a 3rd consecutive increase in Q4. (I also wrote a thesis on $IQE, which benefits here too).\n\nArticle states VPEC, Landmark, IET benefits (Taiwan centric reporting).\n\nI did predict this last year... The bottleneck is real, but I do have higher expectations for price hikes that comes next.\n\nGlad it's starting to play out.","likes":467},{"id":"2089169716292342096","author":"aleabitoreddit","date":"2026-08-17","zh":"去年大家說AXTI是詐騙公司，結果應驗後獲得更多關注。","risk":"","s":{"AXTI":"bull"},"text":"@rektusd101 Everyone was giving me crap over $AXTI being a scam company last year.\n\nSo I think it got a lot more attention when it played out.","likes":49},{"id":"2089183484556480536","author":"aleabitoreddit","date":"2026-08-17","zh":"AI伺服器MLCC需求排擠消費級產能，預期類似DRAM的漲價將在明年初出現，持有太陽誘電。","risk":"","s":{"MU":"neutral"},"text":"I think we're seeing AI server MLCC demand cause an interesting effect... with tightening capacity for consumer/general-purpose MLCCs.\n\nIf you get Vietnam flashbacks like I do to $MU / Samsung / SK Hynix -> Legacy DRAM:\n\nMy thesis is we'll see the same thing here maybe late H2, early 2027 with consumer/broad MLCCs.\n\nFrom July 6th:\n\n\"the crowding-out effect from AI-oriented high-end MLCC production has begun spilling over into both the automotive and consumer markets.\"\n\nJuly 28th:\n\n\"AI Demand Pushes Japanese and Korean MLCC Suppliers to Record Monthly Shipments; Consumer-Grade Order Spillovers Continue to Surge\"\n\nAug 12:\n\nAs [MLCC] capacity shifts from consumer grades to AI-oriented products... (Trendforce)\n\nAug 12:\n\nChina's electronics market channel checks found 22µF and 47µF MLCCs (used more broadly) out of stock. Then found and said certain manufacturers had stopped taking orders.\n\n(for reference: Walsin said high-volume smartphone/PC products such as... 22µF, so it's broader MLCCs)\n\nObviously Samsung Electro-Mechanics/Murata are main beneficiaries of AI server MLCC ramp.\n\nBut companies with large market share of overall MLCCs like Taiyo Yuden (6976, disclosure: I have positions","likes":1024},{"id":"2089189149563838878","author":"aleabitoreddit","date":"2026-08-17","zh":"美國上市MLCC可看VSH與KN，但市占低於亞洲同業。","risk":"","s":{"KN":"neutral","VSH":"neutral"},"text":"@wannabepanacea Yeah as the other comment said $VSH and $KN are the two to look at.\n\nThey have a lot less market share than their Asian counterparts, but... they're listed in the US","likes":72},{"id":"2089201061659886032","author":"aleabitoreddit","date":"2026-08-17","zh":"EWY主要是SK海力士與三星記憶體，MLCC曝險極小。","risk":"","s":{"EWY":"neutral"},"text":"@PumpCapitalLLC This is the equivalent of a silver 2 league of legends player telling a challenger player that ghost ignite Nunu support is OP.\n\nbtw $EWY is primarily memory with Sk Hynix + Samsung.\n\nThe exposure you’re getting to MLCC is the size of an ant","likes":69},{"id":"2089264987328151637","author":"aleabitoreddit","date":"2026-08-17","zh":"群聯執行長稱2027產能限制更嚴重，NAND短缺將持續多年，不認同記憶體行情結束。","risk":"","s":{"MU":"bull","SKHY":"bull","SNDK":"bull"},"text":"Just some more demand imbalance visibility for $SNDK, $SKHY, $MU, Kioxia, and your NAND players.\n\nPhison CEO: \"2027 capacity constraints will be even more severe than in 2026.\"\n\n\"Upstream suppliers need up to 4 years from plant construction and equipment investment to actual production.\n\nWith demand growing explosively and supply expansion limited, the NAND shortage is likely to last for years.\"\n\nDon't quite think I agree with the people claiming it's all over for memory, esp. NAND bottlenecks in 2026...","likes":1507},{"id":"2089291500391907661","author":"aleabitoreddit","date":"2026-08-17","zh":"主要增加MLCC部位而非NAND，MLCC漲價類似早期NAND，但不確定是否同樣極端。","risk":"","s":{"SNDK":"neutral"},"text":"@Berlinergy Uhh I mainly just increased MLCC positions rather than NAND exposure personally.\n\nSince MLCC prices/tightening resembles the early NAND hike cycle… if your passive component players want to tag along $SNDK path.\n\nJust saying it shows resemblance, but I’m not sure we’ll get something as
