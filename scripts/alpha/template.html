<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Consensus 交易員共識</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F0E8;--dot:#DCD6C8;--card:#FFFDF8;--ink:#1F1D1A;--mut:#6F6A60;--line:#E4DED1;--soft:#F7F3EA;
--bull:#1E8A4C;--bullbg:#EAF5EE;--bear:#C8372D;--bearbg:#FBEDEA;--mix:#7A4FB5;--mixbg:#F2ECFA;--neu:#8A8478;--neubg:#F0EDE6;--acc:#2B2A27;
--serif:"Noto Serif TC",Georgia,"Times New Roman",serif;--sans:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17160F;--dot:#2C2A22;--card:#211F19;--ink:#F1ECE0;--mut:#A39D90;--line:#36332A;--soft:#2A2820;
--bull:#4CC27E;--bullbg:#1B3325;--bear:#F0685C;--bearbg:#3A211D;--mix:#B48CEB;--mixbg:#2D2440;--neu:#A39D90;--neubg:#2C2A23;--acc:#F1ECE0}}
:root[data-theme="dark"]{--bg:#17160F;--dot:#2C2A22;--card:#211F19;--ink:#F1ECE0;--mut:#A39D90;--line:#36332A;--soft:#2A2820;
--bull:#4CC27E;--bullbg:#1B3325;--bear:#F0685C;--bearbg:#3A211D;--mix:#B48CEB;--mixbg:#2D2440;--neu:#A39D90;--neubg:#2C2A23;--acc:#F1ECE0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;color:var(--ink);font:15px/1.6 var(--sans)}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{padding-top:28px;padding-bottom:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
h1{font-family:var(--serif);font-size:34px;line-height:1.2;margin:4px 0 6px}
h2{font-family:var(--serif);font-size:24px;margin:0 0 4px}
h3{font-family:var(--serif);font-size:18px;margin:0 0 6px}
.muted{color:var(--mut)}
.small{font-size:13px}
.disc{font-size:12px;color:var(--mut);margin:6px 0 0}
nav.tabs{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:12px 14px;text-decoration:none;color:var(--mut);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs a.on{color:var(--ink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.sec{margin:22px 0}
.sechd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sechd p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.ai{display:flex;gap:8px;margin:16px 0 0}
.ai input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.btn{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--card);border-color:var(--acc)}
.aiout{margin-top:10px;white-space:pre-wrap;font-size:14px}
.sum{font-size:15px;line-height:1.75}
.sum .lbl{font-size:12px;color:var(--mut);margin-bottom:4px}
/* account cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ac{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s}
.ac:hover{border-color:var(--mut)}
.ac .hd{display:flex;align-items:center;gap:10px}
.ac .nm{font-weight:700}
.ac .hd .ch{margin-left:auto;color:var(--mut);font-size:20px}
.xl{font-size:12px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.type{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--mut)}
.av{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;flex:none;font-size:15px}
.av.s{width:24px;height:24px;font-size:12px}
.row2{display:flex;align-items:flex-start;gap:8px;font-size:13px}
.row2 .k{flex:none;width:44px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.tkc{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:1px 7px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none}
.tkc.bull{color:var(--bull);background:var(--bullbg);border-color:transparent}
.tkc.bear{color:var(--bear);background:var(--bearbg);border-color:transparent}
.tkc.mix{color:var(--mix);background:var(--mixbg);border-color:transparent}
.tkc.neutral{color:var(--mut);background:var(--neubg);border-color:transparent}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;line-height:18px;white-space:nowrap}
.pill.bull{color:var(--bull);background:var(--bullbg)}
.pill.bear{color:var(--bear);background:var(--bearbg)}
.pill.neutral{color:var(--mut);background:var(--neubg)}
.pill.mix{color:var(--mix);background:var(--mixbg)}
/* consensus cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:12px}
.cc{display:flex;padding:0;overflow:hidden}
.cc .lp{width:170px;flex:none;padding:16px;display:flex;flex-direction:column;gap:4px}
.cc.bull .lp{background:var(--bullbg)}.cc.bear .lp{background:var(--bearbg)}.cc.mix .lp{background:var(--mixbg)}
.big{font-family:var(--serif);font-weight:900;font-size:34px;line-height:1.1;letter-spacing:.01em;text-decoration:none}
.cc .co{font-size:12px;color:var(--mut)}
.cc .rl{margin-top:auto;font-size:11px;color:var(--mut)}
.cc .rv{font-size:20px;font-weight:700}
.cc .rp{flex:1;min-width:0;display:flex;flex-direction:column}
.cc .rh{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:700;font-size:14px;flex-wrap:wrap}
.cc .rows{max-height:250px;overflow-y:auto;padding:0 14px}
.pr{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.pr:first-child{border-top:0}
.pr .b{flex:1;min-width:0}
.pr .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700}
.pr .dt{font-weight:400;color:var(--mut);font-size:12px}
.pr .zh{margin-top:2px}
.ol{font-size:12px;color:var(--mut);text-decoration:none;white-space:nowrap}
.ol:hover{color:var(--ink)}
.cc .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);margin-top:auto}
.cc .ft a{color:var(--ink);font-weight:700;text-decoration:none}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--mut);font-size:14px;background:var(--card)}
.daynav{display:flex;align-items:center;gap:8px}
.daynav b{font-family:var(--serif);font-size:18px}
/* monthly */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tc{display:flex;flex-direction:column;gap:6px;cursor:pointer}
.tc .hd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.tc .big{font-size:28px;color:var(--bull)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--mut);text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th[data-sort]{cursor:pointer;user-select:none}
.tbl th[data-sort]:hover{color:var(--ink)}
.tbl th.on{color:var(--ink)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--soft)}
.tk{font-weight:700}
.split{display:flex;align-items:center;gap:6px;min-width:170px}
.split .bar{flex:1;height:8px;border-radius:4px;background:var(--neubg);display:flex;overflow:hidden}
.split .bar i{display:block;height:100%}
.split span{width:34px;font-size:12px}
.tscroll{overflow-x:auto}
/* stock view */
.back{border:0;background:none;color:var(--mut);cursor:pointer;padding:6px 0;font-size:14px}
.sh{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.sh .big{font-size:44px}
.qt{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--card)}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--neubg);margin:10px 0}
.sbar i{display:block;height:100%}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.grp .gl{font-size:12px;color:var(--mut);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.grp .gl i{width:9px;height:9px;border-radius:50%;display:inline-block}
.achip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px 1px 2px;font-size:12px;margin:0 4px 4px 0;background:var(--card);text-decoration:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--soft);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-family:var(--serif);font-size:26px;line-height:1.2}
.kpi span{font-size:12px;color:var(--mut)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.mixbar{display:flex;width:90px;height:8px;border-radius:4px;overflow:hidden;background:var(--neubg);margin-left:auto}
.mixbar i{display:block;height:100%}
.reason{white-space:normal;text-align:left!important;min-width:260px;max-width:440px}
.xrow td{background:var(--soft);text-align:left;white-space:normal}
.xrow .pr{border-color:var(--line)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px}
.cmp .bx{border-radius:10px;padding:10px 12px}
.cmp .bx.b{background:var(--bullbg)}.cmp .bx.r{background:var(--bearbg)}
.inst-row{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:4px 0}
.inst-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0}
.inst-bar i{display:block;height:100%}
.grades{list-style:none;padding:0;margin:4px 0 0;font-size:12px;color:var(--mut)}
.grades li{display:flex;gap:10px;flex-wrap:wrap;padding:3px 0;border-bottom:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
ul.plain{margin:0;padding-left:18px;font-size:14px}
.mx th,.mx td{text-align:center!important}
.mx th:first-child,.mx td:first-child{text-align:left!important;position:sticky;left:0;background:var(--card)}
.mx .dot{color:var(--line)}
.mxtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mxtools input{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;width:180px}
.more{width:100%;margin-top:8px}
footer{padding:30px 0 40px;font-size:12px;color:var(--mut)}
@media (max-width:640px){
 h1{font-size:26px}
 .cgrid{grid-template-columns:1fr}
 .cc{flex-direction:column}
 .cc .lp{width:auto;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
 .cc .rl{margin-top:0;margin-left:auto}
 .big{font-size:28px}
 .sh .big{font-size:36px}
 .grid{grid-template-columns:1fr}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .cmp,.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top wrap">
  <div class="eyebrow">Alpha Consensus</div>
  <h1>X 頂尖交易員共識</h1>
  <div class="muted small" id="stats"></div>
  <p class="disc">整理 X 上公開貼文，只呈現帳號觀點與共識，不是投資建議。綠色代表看多、紅色代表看空。</p>
  <form class="ai" id="aiForm"><input id="aiIn" placeholder="問 AI：例如「哪些人看多 MU？」「Ren 最近看好什麼？」" autocomplete="off"><button class="btn pri" type="submit">提問</button></form>
  <div class="aiout card" id="aiOut" hidden></div>
</header>
<nav class="tabs"><div class="wrap">
  <a href="#accounts" data-tab="accounts">追蹤帳號</a>
  <a href="#daily" data-tab="daily">每日</a>
  <a href="#weekly" data-tab="weekly">每週</a>
  <a href="#monthly" data-tab="monthly">每月</a>
  <a href="#matrix" data-tab="matrix">立場矩陣</a>
</div></nav>
<main class="wrap" id="main"></main>
<footer class="wrap">資料截至 <span id="footAsof"></span>。每天台北時間 09:17 更新。股價來自 Yahoo Finance，機構評等來自 Financial Modeling Prep。</footer>
<script>
(function(){
var DATA=/*DATA*/;
var ASOF=DATA.asOf,ACC=DATA.accounts,NM=DATA.names||{},AN=DATA.analysis||{};
var P=DATA.posts.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
var SL={bull:"看多",bear:"看空",neutral:"提及",mix:"多空皆有"};
var COLORS=["#4B4FD6","#D97706","#0E9F6E","#DB2777","#2563EB","#7C3AED","#0891B2","#65A30D","#B45309","#475569","#BE185D","#0F766E","#9333EA"];
var AH={};ACC.forEach(function(a,i){a.color=COLORS[i%COLORS.length];AH[a.handle]=a;});
var OP=function(h){return (AH[h]||{}).type==="觀點帳號";};
var NOP=ACC.filter(function(a){return OP(a.handle);}).length;
function dnum(d){return Math.round(Date.parse(d+"T00:00:00Z")/86400000);}
function dstr(n){return new Date(n*86400000).toISOString().slice(0,10);}
var ASN=dnum(ASOF);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function md(d){return d.slice(5).replace("-","/");}
function an(h){return (AH[h]||{name:h}).name;}
function av(h,small){var a=AH[h]||{color:"#888",name:h};return '<span class="av'+(small?' s':'')+'" style="background:'+a.color+'" aria-hidden="true">'+esc(a.name.charAt(0))+'</span>';}
function pill(s){return '<span class="pill '+s+'">'+SL[s]+'</span>';}
function xurl(p){return "https://x.com/"+p.author+"/status/"+p.id;}
function olink(p){return '<a class="ol" href="'+xurl(p)+'" target="_blank" rel="noopener">原文 ↗</a>';}
function tchip(t,cls){return '<a class="tkc '+(cls||"")+'" href="#stock/'+encodeURIComponent(t)+'">'+esc(t)+'</a>';}
function fmtPct(v){return v==null?'<span class="muted">—</span>':'<b style="color:var(--'+(v>=0?"bull":"bear")+')">'+(v>=0?"+":"")+(v*100).toFixed(1)+'%</b>';}
function rng(w,end){var e=dnum(end);return [dstr(e-w+1),end];}

/* 依期間統計：每檔股票的貼文與各帳號立場 */
function stances(w,end,onlyH){
  var r=rng(w,end),T={};
  P.forEach(function(p){if(p.date<r[0]||p.date>r[1])return;if(onlyH&&p.author!==onlyH)return;
    Object.keys(p.s).forEach(function(t){var s=p.s[t];
      var x=T[t]||(T[t]={t:t,posts:[],acc:{},b:0,r:0});x.posts.push(p);if(s==="bull")x.b++;if(s==="bear")x.r++;
      var a=x.acc[p.author]||(x.acc[p.author]={h:p.author,n:0,b:0,r:0,s:null,p:null,ps:[]});
      a.n++;a.ps.push(p);if(s==="bull")a.b++;if(s==="bear")a.r++;
      if(!a.s||s!=="neutral"||a.s==="neutral"){a.s=s;a.p=p;}});});
  Object.keys(T).forEach(function(t){var x=T[t];x.n=x.posts.length;x.bullA=[];x.bearA=[];x.neuA=[];
    Object.keys(x.acc).forEach(function(h){var a=x.acc[h];(a.s==="bull"?x.bullA:a.s==="bear"?x.bearA:x.neuA).push(a);});
    var lt=function(a,b){return a.p.date<b.p.date?1:-1;};x.bullA.sort(lt);x.bearA.sort(lt);x.neuA.sort(lt);
    x.opB=x.bullA.filter(function(a){return OP(a.h);}).length;x.opR=x.bearA.filter(function(a){return OP(a.h);}).length;});
  return T;
}
function vals(o){return Object.keys(o).map(function(k){return o[k];});}

/* 股價（/api/history 批次） */
var PX={},PEND={};
function loadPx(list,cb){
  var need=list.filter(function(t){return !(t in PX)&&!PEND[t];});
  if(!need.length)return;
  need.forEach(function(t){PEND[t]=1;});
  var chunks=[];for(var i=0;i<need.length;i+=40)chunks.push(need.slice(i,i+40));
  var left=chunks.length;
  chunks.forEach(function(c){
    fetch("/api/history?symbols="+c.map(encodeURIComponent).join(",")).then(function(r){return r.json();}).catch(function(){return {};})
    .then(function(d){var s=(d&&d.series)||{};c.forEach(function(t){PX[t]=s[t]||{error:"無資料"};delete PEND[t];});if(--left===0&&cb)cb();});
  });
}
function okPx(t){var d=PX[t];return d&&d.closes&&d.closes.length?d:null;}
function idxOn(d,date){var i=-1;for(var k=0;k<d.dates.length;k++){if(d.dates[k]<=date)i=k;else break;}return i;}
/* 區間報酬：區間開始前一個收盤 → 區間結束收盤 */
function winRet(t,w,end){var d=okPx(t);if(!d)return null;var r=rng(w,end);var a=-1;for(var k=0;k<d.dates.length;k++){if(d.dates[k]<r[0])a=k;}var b=idxOn(d,r[1]);if(a<0||b<0||b<=a)return null;return d.closes[b]/d.closes[a]-1;}
function ret1y(t){var d=okPx(t);if(!d)return null;return d.closes[d.closes.length-1]/d.closes[0]-1;}
function pxCell(v,t){return (t in PX)?fmtPct(v):'<span class="muted">…</span>';}

/* 狀態與路由 */
var st={day:ASOF,sw:7,aw:7,sort:"n",dir:-1,ex:{},mw:7,q:"",mn:40,tl:15};
function route(){var h=decodeURIComponent(location.hash.slice(1)||"accounts").split("/");return {v:h[0],a:h[1]||""};}
function rerender(){var y=window.scrollY;render();window.scrollTo(0,y);}
window.addEventListener("hashchange",function(){st.tl=15;render();window.scrollTo(0,0);});

function summary(k,label){var s=(AN.summary||{})[k];if(!s)return '';return '<div class="card sum sec"><div class="lbl">'+label+'・AI 摘要（'+esc((AN.summary||{}).asOf||ASOF)+'）</div>'+esc(s)+'</div>';}

/* ── 追蹤帳號 ── */
function viewAccounts(){
  var T=stances(1,ASOF),m={};ACC.forEach(function(a){m[a.handle]={bull:[],bear:[],neutral:[]};});
  vals(T).forEach(function(x){Object.keys(x.acc).forEach(function(h){if(m[h])m[h][x.acc[h].s].push(x.t);});});
  var h='<div class="sec"><div class="sechd"><div><h2>'+ACC.length+' 個帳號・今日狀態</h2><p>'+md(ASOF)+' 各帳號的明確看多、看空標的。點卡片看該帳號的完整觀點。</p></div></div>';
  h+=summary("1","今日市場觀點");
  h+='<div class="grid">'+ACC.map(function(a){var x=m[a.handle],any=x.bull.length||x.bear.length;
    var c='<div class="card ac" data-acc="'+a.handle+'" tabindex="0" role="link" aria-label="查看 '+esc(a.name)+' 的觀點"><div class="hd">'+av(a.handle)+'<div><div class="nm">'+esc(a.name)+' <a class="xl" href="https://x.com/'+a.handle+'" target="_blank" rel="noopener">X 個人頁 ↗</a></div><div class="muted small">@'+esc(a.handle)+' <span class="type">'+esc(a.type)+'</span></div></div><span class="ch">›</span></div>';

  /* 帳號明細表 */
  var rows=vals(X.acc).sort(function(a,b){return b.n-a.n||(a.p.date<b.p.date?1:-1);});
  h+='<div class="card sec"><div class="sechd" style="margin:0 0 6px"><div><h3>帳號明細・'+(w===1?'今日':'近 '+w+' 日')+'</h3><p>'+md(r[0])+' – '+md(r[1])+'・區間報酬 '+fmtPct(winRet(t,w,ASOF))+'</p></div>'+(rows.length?'<button class="btn" type="button" id="exAll">'+(rows.every(function(a){return st.ex[t+a.h];})?'全部收合':'全部展開')+'</button>':'')+'</div>';
  if(!rows.length)h+='<div class="empty">這段期間沒有帳號提到 '+esc(t)+'。可切換到更長的期間。</div>';
  else h+='<div class="tscroll"><table class="tbl"><thead><tr><th>帳號</th><th>提及</th><th>看多</th><th>立場組成</th><th>看空</th><th>立場一致度</th><th style="text-align:left">最新觀點與理由</th></tr></thead><tbody>'+rows.map(function(a){
      var nn=a.n-a.b-a.r,cons=(a.b+a.r)?Math.round(Math.max(a.b,a.r)/(a.b+a.r)*100)+'%':'—',open=st.ex[t+a.h];
      var tr='<tr class="clk" data-ex="'+a.h+'" aria-expanded="'+!!open+'"><td><span style="display:inline-flex;align-items:center;gap:6px">'+(open?'▾':'▸')+' '+av(a.h,true)+esc(an(a.h))+'</span></td><td>'+a.n+'</td><td style="color:var(--bull)">'+a.b+'</td><td><div class="mixbar"><i style="width:'+(a.b/a.n*100)+'%;background:var(--bull)"></i><i style="width:'+(nn/a.n*100)+'%;background:var(--neu);opacity:.5"></i><i style="width:'+(a.r/a.n*100)+'%;background:var(--bear)"></i></div></td><td style="color:var(--bear)">'+a.r+'</td><td>'+cons+'</td><td class="reason">'+pill(a.s)+' <span class="muted small">'+md(a.p.date)+'</span> '+esc(a.p.zh)+' '+olink(a.p)+'</td></tr>';
      if(open)tr+='<tr class="xrow"><td colspan="7">'+a.ps.slice().reverse().map(function(p){return '<div class="pr"><div class="b"><div class="who">'+pill(p.s[t])+'<span class="dt">'+p.date+'</span><span style="margin-left:auto">'+olink(p)+'</span></div><div class="zh">'+esc(p.zh)+'</div>'+(p.risk?'<div class="muted small">風險：'+esc(p.risk)+'</div>':'')+'</div></div>';}).join("")+'</td></tr>';
      return tr;}).join("")+'</tbody></table></div>';
  h+='</div>';
  var tl=P.filter(function(p){return p.s[t];}).reverse();
  if(tl.length)h+='<div class="card sec"><h3>完整時間軸（近 90 日，'+tl.length+' 則）</h3>'+tl.slice(0,st.tl).map(function(p){return '<div class="pr">'+av(p.author,true)+'<div class="b"><div class="who"><a href="#account/'+p.author+'" style="text-decoration:none">'+esc(an(p.author))+'</a>'+pill(p.s[t])+'<span class="dt">'+p.date+'</span><span style="margin-left:auto">'+olink(p)+'</span></div><div class="zh">'+esc(p.zh)+'</div></div></div>';}).join("")+(tl.length>st.tl?'<button type="button" class="btn more" id="tlMore">再顯示 '+Math.min(15,tl.length-st.tl)+' 則</button>':'')+'</div>';
  var risks=[];X.posts.forEach(function(p){if(p.risk&&risks.indexOf(p.risk)<0)risks.push(p.risk);});
  h+='<div class="two sec"><div class="card"><h3>華爾街機構觀點</h3><div id="inst">'+instHTML(INST[t])+'</div><div class="muted small" style="margin-top:6px">資料來源：Financial Modeling Prep。</div></div><div class="card"><h3>帳號提到的風險</h3>'+(risks.length?'<ul class="plain">'+risks.slice(-8).reverse().map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>':'<div class="muted small">這段期間沒有帳號提到風險。</div>')+'</div></div>';
  return h;
}

/* ── 立場矩陣（原本的帳號×股票表） ── */
function mxRows(){var L=vals(stances(st.mw,ASOF));L.forEach(function(x){x.net=x.bullA.length-x.bearA.length;});
  L.sort(function(a,b){return Object.keys(b.acc).length-Object.keys(a.acc).length||b.n-a.n;});
  var q=st.q.trim().toUpperCase().replace(/^\$/,"");return q?L.filter(function(x){return x.t.indexOf(q)>=0||(NM[x.t]||"").toUpperCase().indexOf(q)>=0;}):L;}
function mxTable(){var rows=mxRows();
  if(!rows.length)return '<div class="empty">這段期間沒有符合的股票。</div>';
  return '<div class="tscroll"><table class="tbl mx"><thead><tr><th>股票</th>'+ACC.map(function(a){return '<th title="@'+esc(a.handle)+'">'+esc(a.name)+'</th>';}).join("")+'<th>提及</th><th>淨分</th></tr></thead><tbody>'
   +rows.slice(0,st.mn).map(function(x){return '<tr class="clk" data-go="stock/'+encodeURIComponent(x.t)+'"><td><span class="tk">'+esc(x.t)+'</span> <span class="muted small">'+esc(NM[x.t]||"")+'</span></td>'
     +ACC.map(function(a){var c=x.acc[a.handle];return '<td>'+(c?'<span title="'+esc(c.p.zh)+'">'+pill(grpOf(c))+'</span>':'<span class="dot">·</span>')+'</td>';}).join("")
     +'<td>'+x.n+'</td><td style="font-weight:700;color:var(--'+(x.net>0?'bull':x.net<0?'bear':'mut')+')">'+(x.net>0?'+':'')+x.net+'</td></tr>';}).join("")+'</tbody></table></div>'
   +(rows.length>st.mn?'<button type="button" class="btn more" id="mxMore">再顯示 '+Math.min(40,rows.length-st.mn)+' 檔（共 '+rows.length+' 檔）</button>':'');}
function viewMatrix(){var r=rng(st.mw,ASOF);
  return '<div class="sec"><div class="sechd"><div><h2>帳號 × 股票立場矩陣</h2><p>'+md(r[0])+' – '+md(r[1])+'。每格是該帳號在期間內的立場，滑鼠移上去看理由；淨分 = 看多帳號數 − 看空帳號數。</p></div><div class="mxtools"><input id="mxQ" type="search" placeholder="搜尋代號或公司" value="'+esc(st.q)+'" aria-label="搜尋股票">'+seg("data-mw",st.mw,[[1,"今日"],[7,"7 日"],[28,"28 日"],[90,"90 日"]])+'</div></div><div class="card" style="padding:4px 8px" id="mxT">'+mxTable()+'</div></div>';}

/* ── 帳號視角 ── */
function viewAccount(hd){
  var a=AH[hd];if(!a)return '<div class="empty sec">找不到這個帳號。</div>';
  var w=st.aw,r=rng(w,ASOF),L=vals(stances(w,ASOF,hd)).map(function(x){var s=x.acc[hd];return {t:x.t,s:s};});
  var G={bull:[],bear:[],mix:[],neutral:[]};L.forEach(function(o){G[grpOf(o.s)].push(o.t);});
  var h='<div class="sec"><button class="back" type="button" id="back">← 回到上一頁</button><div class="sh">'+av(hd)+'<div><h2 style="margin:0">'+esc(a.name)+'</h2><div class="muted small">@'+esc(hd)+' <span class="type">'+esc(a.type)+'</span> <a class="xl" href="https://x.com/'+hd+'" target="_blank" rel="noopener">X 個人頁 ↗</a></div></div></div><p class="muted small">'+esc(a.style||"")+'</p></div>';
  h+='<div class="card sec"><div class="sechd" style="margin:0 0 8px"><div><h3>'+(w===1?'今日':'近 '+w+' 日')+'觀點</h3><p>'+md(r[0])+' – '+md(r[1])+'</p></div>'+seg("data-aw",w)+'</div>';
  h+=[["bull","看多"],["bear","看空"],["mix","多空皆有"],["neutral","提及"]].map(function(g){return '<div class="row2" style="margin:6px 0"><span class="k">'+g[1]+'</span><div class="chips">'+(G[g[0]].length?G[g[0]].map(function(t){return tchip(t,g[0]);}).join(""):'<span class="muted">—</span>')+'</div></div>';}).join("")+'</div>';
  /* 近 28 日立場翻轉 */
  var r28=rng(28,ASOF),last={},flips=[];P.forEach(function(p){if(p.author!==hd||p.date<r28[0])return;Object.keys(p.s).forEach(function(t){var s=p.s[t];if(s==="neutral")return;var pv=last[t];if(pv&&pv.s!==s)flips.push({t:t,from:pv.s,to:s,p:p});last[t]={s:s,p:p};});});
  if(flips.length)h+='<div class="card sec"><h3>近 28 日立場翻轉</h3>'+flips.reverse().map(function(f){return '<div class="pr"><div class="b"><div class="who">'+tchip(f.t)+pill(f.from)+' → '+pill(f.to)+'<span class="dt">'+md(f.p.date)+'</span><span style="margin-left:auto">'+olink(f.p)+'</span></div><div class="zh">'+esc(f.p.zh)+'</div></div></div>';}).join("")+'</div>';
  var ps=P.filter(function(p){return p.author===hd&&p.date>=r[0];}).reverse();
  h+='<div class="card sec"><h3>貼文（'+ps.length+'）</h3>'+(ps.length?ps.slice(0,60).map(function(p){return '<div class="pr"><div class="b"><div class="who">'+Object.keys(p.s).map(function(t){return tchip(t,p.s[t]);}).join("")+'<span class="dt">'+p.date+'</span><span style="margin-left:auto">'+olink(p)+'</span></div><div class="zh">'+esc(p.zh)+'</div></div></div>';}).join(""):'<div class="muted small">這段期間沒有含股票代號的貼文。</div>')+'</div>';
  return h;
}

/* ── 渲染與事件 ── */
function render(){
  var R=route(),v=R.v,h;
  document.querySelectorAll("nav.tabs a").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-tab")===v);});
  if(v==="daily")h=viewDaily();else if(v==="weekly")h=viewWeekly();else if(v==="monthly")h=viewMonthly();else if(v==="matrix")h=viewMatrix();
  else if(v==="stock"&&R.a)h=viewStock(R.a.toUpperCase());else if(v==="account"&&R.a)h=viewAccount(R.a);else h=viewAccounts();
  document.getElementById("main").innerHTML=h;
}
var main=document.getElementById("main");
main.addEventListener("click",function(e){var el;
  if(e.target.closest("a"))return;
  if((el=e.target.closest("[data-acc]"))){location.hash="account/"+el.getAttribute("data-acc");return;}
  if((el=e.target.closest("[data-go]"))){location.hash=el.getAttribute("data-go");return;}
  if((el=e.target.closest("[data-day]"))){var i=DAYS.indexOf(st.day)+(+el.getAttribute("data-day"));if(DAYS[i]){st.day=DAYS[i];rerender();}return;}
  if((el=e.target.closest("[data-sort]"))){var k=el.getAttribute("data-sort");if(st.sort===k)st.dir=-st.dir;else{st.sort=k;st.dir=-1;}rerender();return;}
  if((el=e.target.closest("[data-sw]"))){st.sw=+el.getAttribute("data-sw");rerender();return;}
  if((el=e.target.closest("[data-aw]"))){st.aw=+el.getAttribute("data-aw");rerender();return;}
  if((el=e.target.closest("[data-ex]"))){var t=route().a.toUpperCase(),key=t+el.getAttribute("data-ex");st.ex[key]=!st.ex[key];rerender();return;}
  if(e.target.closest("#exAll")){var t2=route().a.toUpperCase(),X=stances(st.sw,ASOF)[t2],hs=X?Object.keys(X.acc):[],all=hs.every(function(hh){return st.ex[t2+hh];});hs.forEach(function(hh){st.ex[t2+hh]=!all;});rerender();return;}
  if((el=e.target.closest("[data-mw]"))){st.mw=+el.getAttribute("data-mw");st.mn=40;rerender();return;}
  if(e.target.closest("#mxMore")){st.mn+=40;document.getElementById("mxT").innerHTML=mxTable();return;}
  if(e.target.closest("#tlMore")){st.tl+=15;rerender();return;}
  if(e.target.closest("#back")){if(history.length>1)history.back();else location.hash="accounts";}
});
main.addEventListener("input",function(e){if(e.target.id!=="mxQ")return;st.q=e.target.value;st.mn=40;document.getElementById("mxT").innerHTML=mxTable();});
main.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var el=e.target.closest("[data-acc],[data-go]");if(!el||e.target.closest("a"))return;e.preventDefault();el.click();});

/* AI 問答：挑相關貼文給 /api/ask */
var TKS={};P.forEach(function(p){Object.keys(p.s).forEach(function(t){TKS[t]=1;});});
function askContext(q){
  var up=q.toUpperCase(),tk=[],hs=[];
  (up.match(/\$?[A-Z][A-Z0-9.]{0,7}/g)||[]).forEach(function(w){w=w.replace(/^\$/,"");if(TKS[w]&&tk.indexOf(w)<0)tk.push(w);});
  ACC.forEach(function(a){if(up.indexOf(a.handle.toUpperCase())>=0||q.indexOf(a.name)>=0)hs.push(a.handle);});
  var R=route();if(!tk.length&&!hs.length&&R.v==="stock")tk.push(R.a.toUpperCase());
  var l=P.filter(function(p){var okT=!tk.length||tk.some(function(t){return p.s[t];});var okH=!hs.length||hs.indexOf(p.author)>=0;return okT&&okH;}).slice(-150);
  return {tk:tk,text:l.map(function(p){return '['+p.date+'] '+an(p.author)+'（@'+p.author+'）｜'+Object.keys(p.s).map(function(t){return t+':'+SL[p.s[t]];}).join("、")+'｜'+p.zh+(p.risk?'｜風險：'+p.risk:'');}).join("\n"),n:l.length};
}
document.getElementById("aiForm").addEventListener("submit",function(e){e.preventDefault();
  var q=document.getElementById("aiIn").value.trim(),out=document.getElementById("aiOut");if(!q)return;
  var c=askContext(q);out.hidden=false;out.textContent="AI 思考中…（依據 "+c.n+" 則貼文）";
  fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,context:c.text})})
    .then(function(r){return r.json();}).catch(function(){return {error:"連線失敗"};})
    .then(function(d){out.textContent=d.answer||("目前無法取得 AI 回答（"+(d.error||"未知錯誤")+"）。"+(c.tk[0]?"已改為打開 "+c.tk[0]+" 的個股頁。":""));if(!d.answer&&c.tk[0])location.hash="stock/"+c.tk[0];});
});

var nAcc={};P.forEach(function(p){nAcc[p.author]=1;});
document.getElementById("stats").textContent="追蹤 "+ACC.length+" 個帳號・"+Object.keys(nAcc).length+" 個有資料・"+P.length+" 則含股票代號的貼文・資料截至 "+ASOF;
document.getElementById("footAsof").textContent=ASOF;
render();
})();
</script>
